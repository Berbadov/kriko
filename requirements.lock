# The runtime dependency closure, pinned.
#
# B57. `pip install -e "."` resolves whatever PyPI holds the minute the
# installer job runs, which is the same unreproducibility that shipped v0.2.1
# opening and v0.2.4 — four hours later, from an identical tree — panicking on
# a config both builds carried. That one was a Rust crate; nothing made Python
# any safer, it just had not bitten yet.
#
# Runtime only, on purpose: this is the closure PyInstaller freezes into the
# sidecar a reader double-clicks. The pipeline and dev extras are an authoring
# machine's problem and pinning them here would make every research-tool bump
# a release-artifact change.
#
# Used as `pip install -r requirements.lock -e "."` rather than with
# `--no-deps`: three of the closure's members are platform-only and cannot be
# pinned from a Linux resolve — colorama on Windows via click, pywin32 on
# Windows via mcp, and **pywinpty**, which is the one that matters most here
# because `app/web/routers/terminal.py` imports it directly and the frozen
# sidecar carries it. All three are whatever pip holds on the day the Windows
# artifact is built, which is the unreproducibility this file exists to remove,
# admitted in the one place it cannot currently be removed. To close it, run
# `tools/relock.py` on a Windows host (or add the resolved `pywinpty==x.y.z`
# line here by hand, deliberately) — and note that `kriko-sidecar.spec` fails
# the freeze with a sentence if the resolved pywinpty stops shipping the agent
# file, so a silent shape change is not possible.
#
# Regenerate deliberately, never as a side effect — `python
# tools/relock.py` prints this file from the current environment, and
# `src/app/tests/test_dependencies_are_locked.py` fails if the two disagree.
# resolved-on: win32
