<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" role="img" aria-label="A product listing flows through the Kriko engine to its known risks, each with a quote">
  <!-- Colours are the desktop app's (kriko-gpui/src/theme.rs): GROUND,
       the bright sky gradient, SURFACE_1, BRAND, BRAND_BRIGHT, ICE, INK,
       MUTED, and the mark's arm for the one answer. No product, no
       category: the text is the shape of an answer, not an answer. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1130"/>
      <stop offset="1" stop-color="#2144BF"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#86A3FF"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .crumb { fill: #BFE4FF; font-size: 11px; letter-spacing: 1px; }
    .title { fill: #F2F5FF; font-size: 15px; font-weight: bold; }
    .sub { fill: #98A3C2; font-size: 12px; }
    .flow { stroke: #86A3FF; stroke-width: 2; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="760" height="240" rx="14" fill="#05070F"/>
  <rect x="0" y="0" width="760" height="240" rx="14" fill="url(#sky)" opacity="0.55"/>
  <text x="24" y="32" class="crumb">KRIKO / CHECK / ONE LISTING</text>

  <rect x="20" y="58" width="212" height="150" rx="10" fill="#090E1B" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="38" y="88" class="title">A listing</text>
  <text x="38" y="114" class="sub">the page you are on</text>
  <text x="38" y="134" class="sub">identity keys read by</text>
  <text x="38" y="154" class="sub">the site adapter</text>
  <rect x="38" y="172" width="54" height="20" rx="4" fill="#BFE4FF"/>
  <text x="46" y="186" font-size="11" fill="#05070F">Alt+K</text>

  <rect x="274" y="58" width="212" height="150" rx="10" fill="#1F4FFF" stroke="#86A3FF" stroke-width="2"/>
  <text x="292" y="88" class="title">The engine</text>
  <text x="292" y="114" font-size="12" fill="#F2F5FF">identity match</text>
  <text x="292" y="134" font-size="12" fill="#F2F5FF">risks ranked</text>
  <text x="292" y="154" font-size="12" fill="#F2F5FF">no quote, no risk</text>
  <text x="292" y="186" font-size="11" fill="#BFE4FF">local only: ~/.kriko</text>

  <rect x="528" y="58" width="212" height="150" rx="10" fill="#090E1B" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  <text x="546" y="88" class="title">Known risks</text>
  <rect x="546" y="102" width="44" height="18" rx="4" fill="#E8C04B"/>
  <text x="553" y="115" font-size="11" font-weight="bold" fill="#05070F">HIGH</text>
  <text x="598" y="115" class="sub">&lt;risk title&gt;</text>
  <text x="546" y="142" class="sub">"&lt;the quote it</text>
  <text x="546" y="160" class="sub"> came from&gt;"</text>
  <text x="546" y="186" font-size="11" fill="#86A3FF">check · sources · tier</text>

  <line x1="234" y1="133" x2="270" y2="133" class="flow"/>
  <line x1="488" y1="133" x2="524" y2="133" class="flow"/>
</svg>
