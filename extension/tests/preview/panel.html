<!doctype html>
<!--
  The panel in an ordinary browser tab, for looking at it: no extension
  install, no app running. chrome.* is stubbed the way tests/hover_lite_harness.js
  stubs it, and one stored answer is delivered the way background.js would.

    python -m http.server 8790 --directory extension
    open http://127.0.0.1:8790/tests/preview/panel.html

  ?state=error | idle | empty | several picks another state of the panel.
  ?research=failed | running | empty picks a state of the research card; "empty"
  is the no-issue card a quick look that kept nothing shows.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kriko panel preview</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #e9e6df; font: 15px/1.5 system-ui, sans-serif; color: #222; }
    .page { max-width: 760px; padding: 48px; }
    .page h1 { font-size: 26px; margin: 0 0 8px; }
    .page .price { font-size: 22px; color: #b34700; font-weight: 600; }
    .page .photo { height: 340px; background: #c9c3b8; border-radius: 6px; margin: 20px 0; }
    /* ?page=white | dark | busy: what the panel sits over. A panel that lets
       the page show through has to be looked at over the worst of them. */
    body[data-page="white"] { background: #fff; }
    body[data-page="dark"] { background: #0a0c10; color: #e8e8e8; }
    body[data-page="dark"] .page .photo { background: #1c2230; }
    body[data-page="busy"] { background: repeating-linear-gradient(135deg, #f1d68a 0 22px, #28407d 22px 44px); }
    body[data-page="busy"] .page { max-width: none; color: #111; }
    body[data-page="busy"] .page .photo { background: repeating-linear-gradient(0deg, #fff 0 14px, #111 14px 28px); }
  </style>
</head>
<body>
  <div class="page">
    <h1>Volkswagen Golf 1.6 TDI Highline, 2014</h1>
    <div class="price">645.000 TL</div>
    <div class="photo"></div>
    <p>190.000 km · Dizel · Manuel · Hatchback</p>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get("page")) document.body.dataset.page = params.get("page");
    const lookupId = params.get("lookup");
    const state = params.get("state") || "risks";
    const runtimeListeners = [];
    const storageListeners = [];
    const CLAIMS = [
      { claim_id: "c1", pack_id: "org.kriko.cars", subject_id: "s1", title: "Timing chain tensioner wear", severity: "high", strength: "reported", domain: "engine",
        body: "The tensioner on this engine family loosens with mileage; a rattle at cold start is the first sign.", sources: [{ url: "https://example.org/a", title: "Owner forum thread" }] },
      { claim_id: "c2", pack_id: "org.kriko.cars", subject_id: "s1", title: "EGR valve clogging on short trips", severity: "medium", strength: "documented", domain: "emissions",
        body: "Soot builds up in the EGR valve when the car rarely reaches temperature.", sources: [{ url: "https://example.org/b", title: "Service bulletin" }] },
      { claim_id: "c3", pack_id: "org.kriko.cars", subject_id: "s1", title: "Dual-mass flywheel judder", severity: "medium", strength: "reported", domain: "transmission",
        body: "A shudder when pulling away in first gear; the flywheel is due around 180,000 km.", sources: [] },
      { claim_id: "c4", pack_id: "org.kriko.cars", subject_id: "s1", title: "Window regulator clips", severity: "low", strength: "reported", domain: "body",
        body: "Plastic clips in the door regulators break; a cheap fix.", sources: [] },
    ];
    const ENTRY = {
      ok: true,
      listing: { damage_info: null, equipment: {} },
      result: {
        lookup_id: lookupId || "preview-check",
        claims: state === "empty" ? [] : CLAIMS,
        coverage: state === "empty" ? "MATCHED_NO_DATA" : "RISKS_FOUND",
        identity: { make: "volkswagen", model: "golf", fuel: "Dizel" },
        context: { build_year: 2014, usage_km: 190000 },
        context_units: { usage_km: "km" },
        packs: [{ pack_id: "org.kriko.cars", version: "1.4.0" }],
        app_route: "result/abc123",
      },
    };
    // ?state=empty: what the engine sends for a recognised product with
    // nothing known (app/matching.py), verdict and next step included.
    if (state === "empty") {
      ENTRY.result.verdict = "recognised";
      ENTRY.result.next_step = {
        action: "research",
        say: "This one is recognised, but the installed packs hold nothing about it yet. That is a gap, not a clean bill of health.",
      };
    }
    // ?state=several: the page fits three products, and only what they share shows.
    if (state === "several") {
      ENTRY.result.claims = CLAIMS.slice(3);
      ENTRY.result.verdict = "several";
      ENTRY.result.next_step = {
        action: "choose",
        say: "3 products fit this page, so only what all of them share is shown. Pick the one on the listing to see the rest.",
        choices: [
          { subject_id: "s1", label: "Golf 1.6 TDI 90 hp" },
          { subject_id: "s2", label: "Golf 1.6 TDI 105 hp" },
          { subject_id: "s3", label: "Golf 1.6 TDI 110 hp" },
        ],
      };
    }
    function previewJob() {
      const failed = params.get("research") === "failed";
      const empty = params.get("research") === "empty";
      if (empty) {
        return {
          job_id: "preview-research", kind: "quick_look", state: "succeeded", done: true,
          created_at: new Date(Date.now() - 45000).toISOString(),
          finished_at: new Date().toISOString(),
          message: "No sourced issues kept.",
          result: {
            risks: [], specs: [],
            diagnostic: { code: "no_issues_found", message: "No supported issues found in the pages checked." },
            coverage: { pages_read: 4, pages_relevant: 2, pages_extracted: 2,
              publishers_read: 2, sources_cited: 1, status: "no_supported_findings" },
            evidence_pages: [
              { url: "https://example.org/datasheet", domain: "example.org", excerpt: "Product data" },
              { url: "https://example.org/review-2", domain: "example.org", excerpt: "A review" },
            ],
          },
        };
      }
      return {
        job_id: "preview-research", kind: "quick_look", state: failed ? "failed" : "running", done: failed,
        created_at: new Date(Date.now() - 15000).toISOString(),
        finished_at: failed ? new Date().toISOString() : null,
        message: failed ? "The local model is not ready. No local model server is running." : "Searching the web",
        error: failed ? "The local model is not ready. No local model server is running." : "",
        log: failed
          ? "search: adidas grand court base 2.0 known problems\nfail: LocalInferenceError: http://127.0.0.1:11434 answered HTTP 500: error starting llama-server\nfail: giving up after 1 attempt"
          : "search: adidas grand court base 2.0 known problems\nread: example.org/forum/thread-1\nread: example.org/review-2",
        result: { agent: { label: "local", model: "Model not reported" } },
      };
    }
    window.chrome = {
      runtime: {
        onMessage: { addListener: (fn) => runtimeListeners.push(fn) },
        lastError: null,
        sendMessage(message, callback) {
          console.log("[panel ->]", message.type, message);
          if (typeof callback !== "function") return;
          // With ?lookup=<id>, the browser journey uses the real saved-job API
          // of the app serving /preview/. Only chrome.* is replaced here.
          if (lookupId && ["LOOKUP_ASK", "LOOKUP_QUESTIONS", "JOB_STATUS"].includes(message.type)) {
            const path = message.type === "JOB_STATUS"
              ? `/api/jobs/${encodeURIComponent(message.payload.job_id)}`
              : `/api/lookup/${encodeURIComponent(lookupId)}/questions`;
            const options = message.type === "LOOKUP_ASK"
              ? { method: "POST", headers: { "content-type": "application/json" },
                  body: JSON.stringify({ question: message.payload.question }) } : {};
            fetch(path, options).then(async res => {
              const body = await res.json();
              callback(res.ok ? { ok: true, ...(message.type === "JOB_STATUS" ? { job: body } : body) }
                : { ok: false, error: String(body.detail || res.status) });
            }).catch(error => callback({ ok: false, error: error.message }));
            return;
          }
          // ?research=failed | running | empty: the research form's plane and
          // one job, so the form, its task log and the no-issue card can be
          // looked at without an app.
          const research = params.get("research");
          if (research && message.type === "RESEARCH_PLANE") return callback({ ok: true, plane: { backend: "local" } });
          // The agent picker and "Learn this page". ?learn=none is a page that
          // taught nothing; otherwise the local model answers with a lesson.
          if (research && message.type === "AGENTS") return callback({ ok: true, chosen: "local", agents: [
            { id: "local", label: "Local agent", kind: "local" },
            { id: "claude", label: "Claude Code", kind: "cli" },
          ] });
          if (research && message.type === "LEARN_PAGE") {
            const none = params.get("learn") === "none";
            return setTimeout(() => callback({ ok: true, lesson: none
              ? { mode: "local", learned: false, reason: "This page prints no labelled facts to learn from.", grabs: [] }
              : { mode: "local", learned: true, host: "shop.example", name: "Volkswagen Golf 1.6 TDI Highline", grabs: [
                { as: "make", value: "Volkswagen", kind: "identity" }, { as: "model", value: "Golf", kind: "identity" },
                { as: "fuel", value: "Dizel", kind: "identity" }, { as: "usage_km", value: "190.000 km", kind: "context" },
              ] } }), 700);
          }
          if (research && message.type === "RESEARCH_PRODUCT") return callback({ ok: true, job: previewJob() });
          if (research && message.type === "JOB_STATUS" && message.payload.job_id === "preview-research") {
            return callback({ ok: true, job: previewJob() });
          }
          if (message.type === "LOOKUP_QUESTIONS") return callback({ ok: true, items: [] });
          if (message.type === "LOOKUP_ASK") return setTimeout(() => callback({ ok: true, job_id: "preview-question" }), 300);
          if (message.type === "JOB_STATUS") return callback({ ok: true, job: {
            job_id: "preview-question", state: "succeeded", done: true,
            result: { answer: "Ask the seller for the service records supporting the repairs, and check the cited sources for the risks you want to inspect.",
              agent: { id: "preview", label: "Preview agent", model: "Preview model" } },
          } });
          if (message.type === "ANALYZE") {
            if (state === "error") return callback({ ok: false, code: "APP_NOT_RUNNING", error: "Kriko is not running. Open the Kriko app, then try again." });
            if (state === "idle") return callback({ ok: false, code: "NO_ADAPTER", error: "No installed pack can read this page." });
            return callback({ ok: true, pending: true });
          }
          if (message.type === "QUEUE_ADD") return setTimeout(() => callback({ ok: true, added: true, count: 4, max: 8 }), 400);
          if (message.type === "SEARCH") return callback({ ok: true, items: [] });
          if (message.type === "OPERATIONS") return callback({ ok: true, feed: { items: [] } });
          callback({ ok: true });
        },
        getURL: (p) => "../../" + p,
      },
      storage: {
        onChanged: { addListener: (fn) => storageListeners.push(fn) },
        // The durable bag, kept for as long as the tab is open. `?seen` marks the
        // panel tour as already shown, to look at the panel without it.
        local: (() => {
          const q = new URLSearchParams(location.search);
          const bag = q.has("seen") ? { "kriko.panelTour": "done" } : {};
          // ?glass=solid and ?theme=light | dark: the two stored choices.
          if (q.get("glass")) bag["kriko.glass"] = q.get("glass");
          if (q.get("theme")) bag["kriko.theme"] = q.get("theme");
          if (q.get("sensitivity")) bag["kriko.sensitivity"] = q.get("sensitivity");
          return {
            get(keys, done) { const out = {}; for (const k of [].concat(keys)) if (k in bag) out[k] = bag[k]; done && done(out); },
            set(items, done) { Object.assign(bag, items); done && done(); },
            remove(keys, done) { for (const k of [].concat(keys)) delete bag[k]; done && done(); },
          };
        })(),
      },
    };
    function deliver(kind, value) {
      const key = "kriko_" + kind + "_" + location.href;
      for (const fn of storageListeners) fn({ [key]: { newValue: value } }, "session");
    }
    window.__preview = { deliver, ENTRY };
  </script>
  <script src="../../hover_lite/icons.js"></script>
  <script src="../../hover_lite/claim_card.js"></script>
  <script src="../../hover_lite/buyer_card.js"></script>
  <script src="../../hover_lite/hover_lite.js"></script>
  <script>
    for (const fn of runtimeListeners) fn({ type: "TOGGLE_HOVER_LITE" });
    if (state === "risks" || state === "empty" || state === "several") {
      setTimeout(() => deliver("stage", { name: "reading", detail: "", at: Date.now() }), 300);
      setTimeout(() => deliver("result", ENTRY), 1200);
    }
  </script>
</body>
</html>
