<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="Kriko">
<!-- The jack turned on its side: a perch, two raised arms, the screw between
     them with its nut on top and its handle below. Kriko is Turkish for a car
     jack, and the mark is the old K with its crank, turned a quarter.

     A near-black mark on a light grey plate, split like a lens that does not
     quite focus: a white copy up and to the left, a grey one down and to the
     right, the mark itself on top. It is 62% of the plate wide and sits by its
     weight rather than its outline, so it reads centred and clears the edges.
     The vocabulary is `rect` and `polygon` and nothing else, every polygon
     convex, painted in document order: `packaging/render_icon.py` rasterises
     exactly that. The plate's corners are arcs flattened to points. -->
