<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="Kriko">
<!-- The jack turned on its side: a perch, two raised arms, the screw between
     them with its nut on top and its handle below. Kriko is Turkish for a car
     jack, and the mark is the old K with its crank, turned a quarter.

     White mark on a navy plate. The vocabulary is `rect` and
     `polygon` and nothing else, every polygon convex: `packaging/render_icon.py`
     rasterises exactly that. The plate's corners are arcs flattened to points. -->
