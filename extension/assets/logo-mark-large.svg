<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="Kriko">
  <!-- The same mark, drawn for the sizes a 16-cell grid cannot serve.

       `logo-mark.svg` is pixel art and is right about its own size: a hairline
       K closes into a smudge at 16px, and mass does not. But it is upscaled
       nearest-neighbour, so at 1024px each of its cells becomes a 64px square
       and the installer icon is eight hard blocks. The reader's verdict was
       "pixelated and very ugly", and at that size they are right — the grid is
       a favicon technique being asked to be a product icon.

       So there are two marks and one design. Below 48px the grid renders,
       because that is where it wins. At 128px and above this one does, because
       it has room for a real diagonal. Same letter, same three colours, same
       idea: a slab stem, and the upper arm carrying the accent as it rises.

       **The accent is still the whole mark.** It is the panel's severity
       colour, and it climbs out of the letter the way a step chart does —
       the product in a glyph. The lower arm overpaints the upper where they
       cross at the spine, exactly as the grid version does, because the
       renderer paints in document order and a K's arms share that corner.

       The vocabulary here is `rect` and `polygon` and nothing else.
       `packaging/render_icon.py` rasterises it with a scanline routine written
       out in full, so every element it can draw is one somebody added on
       purpose. A `path` would mean a bezier flattener in a build script, which
       is the door that stays shut — the same trade `kriko/adapters.py` makes
       about what a pack may express.

       The three colours are the panel theme's n-2, n-9 and accent tokens, and
       test_the_mark_is_painted_in_the_panel_theme_s_own_colours fails if
       either side moves without the other. Written without the leading dashes
       because two hyphens cannot appear inside an XML comment, and an SVG that
       does not parse is a broken image no string-matching test would catch.
       That is how it shipped for one build. -->
  <rect x="0" y="0" width="64" height="64" fill="#15171C"></rect>
  <rect x="9" y="7" width="11" height="50" fill="#E7E9ED"></rect>
  <polygon points="20,24 55,6 55,18 20,36" fill="#E8C04B"></polygon>
  <polygon points="20,28 55,46 55,58 20,40" fill="#E7E9ED"></polygon>
</svg>
