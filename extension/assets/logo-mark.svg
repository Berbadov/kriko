<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-label="Kriko">
  <!-- The mark, on the 16x16 grid packaging/render_icon.py rasterises. Every
       icon the product shows is this one file — the browser toolbar tile, the
       taskbar tile, the rail at the top-left of the app, the favicon — so they
       are recognisably one product rather than four. Ground first, then the
       letter over it: the renderer paints in document order, and the lower arm
       deliberately overpaints the upper one where they meet at the spine.

       Slab, not line. A hairline K closes into a smudge at 16px; mass does
       not. The stem runs nearly the full height and each arm is three blocks
       stepping away from it, overlapping by two rows so the staircase reads as
       one stroke rather than three squares.

       **The upper arm is the whole accent, and that is the mark.** It is the
       panel's accent token, and it rises out of the letter as a step chart
       does: the thing that tells you what is going on with what you are looking
       at. An earlier draft put it on one terminal block and it read as a
       detached square at any size below 48px — a corner touch is not a join.

       The accent was the panel's gold severity colour until the rebuild
       retired gold for the blue system, so the arm is now the ice, which is
       what the accent token resolves to. The mark follows the panel; it does
       not keep a colour the panel no longer has. (Written without the token's
       leading dashes, for the reason in the last paragraph.)

       The three colours are the panel theme's n-2, n-9 and accent tokens,
       and test_the_mark_is_painted_in_the_panel_theme_s_own_colours fails if
       either side moves without the other. It reads the accent through its
       alias, because the panel answers it with a var rather than a literal.
       Their names are written without
       the leading dashes on purpose: two hyphens cannot appear inside an XML
       comment, and an SVG that does not parse is a broken image in the rail
       that no test reading this file for strings would ever notice. That is
       exactly how it shipped for one build, and exactly how this paragraph
       broke twice more while it was being edited today. -->
  <rect x="0" y="0" width="16" height="16" fill="#10131C"></rect>
  <rect x="2" y="1" width="3" height="14" fill="#E7EAF4"></rect>
  <rect x="5" y="5" width="3" height="4" fill="#A5C3FF"></rect>
  <rect x="8" y="3" width="3" height="4" fill="#A5C3FF"></rect>
  <rect x="11" y="1" width="3" height="4" fill="#A5C3FF"></rect>
  <rect x="5" y="7" width="3" height="4" fill="#E7EAF4"></rect>
  <rect x="8" y="9" width="3" height="4" fill="#E7EAF4"></rect>
  <rect x="11" y="11" width="3" height="4" fill="#E7EAF4"></rect>
</svg>
