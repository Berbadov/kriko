<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-label="Kriko">
<!-- The jack on a 16-cell grid: the same mark as logo-mark-large.svg, drawn as
     pixels for the sizes where antialiasing would close it into a smudge. The
     plate's four corner cells are left out, which is a 16px rounded corner. -->
<rect x="1" y="0" width="14" height="16" fill="#DCDCDA"/>
<rect x="0" y="1" width="1" height="14" fill="#DCDCDA"/>
<rect x="15" y="1" width="1" height="14" fill="#DCDCDA"/>
<rect x="2" y="4" width="2" height="1" fill="#16161A"/>
<rect x="6" y="4" width="4" height="1" fill="#16161A"/>
<rect x="12" y="4" width="2" height="1" fill="#16161A"/>
<rect x="3" y="5" width="2" height="1" fill="#16161A"/>
<rect x="7" y="5" width="2" height="1" fill="#16161A"/>
<rect x="11" y="5" width="2" height="1" fill="#16161A"/>
<rect x="4" y="6" width="2" height="1" fill="#16161A"/>
<rect x="7" y="6" width="2" height="1" fill="#16161A"/>
<rect x="10" y="6" width="2" height="1" fill="#16161A"/>
<rect x="3" y="7" width="10" height="1" fill="#16161A"/>
<rect x="3" y="8" width="10" height="1" fill="#16161A"/>
<rect x="7" y="9" width="2" height="1" fill="#16161A"/>
<rect x="7" y="10" width="2" height="1" fill="#16161A"/>
<rect x="5" y="11" width="6" height="1" fill="#16161A"/>
</svg>
