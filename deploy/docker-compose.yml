services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kriko
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Expose the DB to the host so DBeaver/psql can connect. 5433 is used
      # because another project (shopify-restaurant) already owns host 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kriko"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # Deploy-staleness stamp (B15): the args below become GIT_COMMIT /
      # GIT_BUILD_TIME in the image (see deploy/Dockerfile). Compose cannot run
      # git itself, so stamp a rebuild from the checkout with:
      #   GIT_COMMIT=$(git rev-parse --short HEAD) \
      #   GIT_BUILD_TIME=$(git log -1 --format=%cI) \
      #   docker compose -f deploy/docker-compose.yml up -d --build api
      # A build without them stamps "unknown" — visible in /health, /analyze,
      # and the extension footer as the tell that the image was never stamped.
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_BUILD_TIME: ${GIT_BUILD_TIME:-unknown}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/kriko
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ../backend/data:/app/backend/data:ro
      - ../logs:/app/logs

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api

volumes:
  pgdata: {}
  caddydata: {}
  caddyconfig: {}
