      advice: Battery life can collapse on one earbud and the cell is not user-replaceable — it is welded
        under the flex cable, so a dead cell means either a careful teardown/solder job or a warranty/service
        claim. Check battery health early, before the 1-year-ish warranty window closes.
    tr:
      title: Redmi Buds 6S sağ kulaklık pil hücresi ölü (1.89Ω iç direnç) — değiştirmek için söküm gerekiyor
      body: Çinli bir onarım forumundaki onarım sökümü, 6S pil hücresinin gövde içindeki esnek kablonun
        altına kaynaklandığını, bu nedenle değiştirmek için kulaklık gövdesinin açılması ve nikel sekmelerin
        lehiminin sökülmesi gerektiğini gösteriyor; sahibi sağ kulaklık hücresini 1.89Ω iç dirençte (ölü)
        ve solu 900mΩ olarak ölçmüş.
      advice: Pil ömrü bir kulaklıkta çökebilir ve hücre kullanıcı tarafından değiştirilemez — esnek kablonun
        altına kaynaklanmıştır, bu nedenle ölü bir hücre ya dikkatli bir söküm/lehim işi ya da garanti/servis
        talebi anlamına gelir. Pil sağlığını erken kontrol edin, yaklaşık 1 yıllık garanti süresi kapanmadan
        önce.
