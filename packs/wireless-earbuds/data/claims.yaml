      title: Right earbud of budget Redmi TWS drains faster than left (master-slave power draw)
      body: Explains that in budget Redmi TWS models the right earbud acts as the Bluetooth master and
        therefore drains faster than the left; a charge difference of 15-20% after a full case charge
        can indicate battery degradation rather than normal architecture. This is a general Redmi-family
        explanation, not a 5 Lite-specific owner report.
      advice: Expect the right earbud to run down a bit faster than the left; that is normal TWS master-slave
        behavior. If the gap exceeds roughly 15-20% after a full case charge, treat it as a possible battery
        fault worth a warranty check.
    tr:
      title: Bütçe Redmi TWS'nin sağ kulaklığı soldan daha hızlı tükeniyor (ana-köle güç çekişi)
      body: Bütçe Redmi TWS modellerinde sağ kulaklığın Bluetooth ana cihazı olarak işlev gördüğünü ve
        bu nedenle soldan daha hızlı tükendiğini açıklar; tam kutu şarjından sonra %15-20'lik bir şarj
        farkı normal mimari yerine pil bozulmasına işaret edebilir. Bu, 5 Lite'a özgü bir sahip raporu
        değil, Redmi ailesi genelinde bir açıklamadır.
      advice: Sağ kulaklığın soldan biraz daha hızlı tükenmesini bekleyin; bu normal TWS ana-köle davranışıdır.
        Tam kutu şarjından sonra fark yaklaşık %15-20'yi aşarsa, bunu garanti kontrolüne değer olası bir
        pil arızası olarak değerlendirin.
