      title: Redmi Buds 5 / 6 Lite lose A2DP connection and one earbud drops sound on Linux BlueZ 5.83+
      body: 'Primary source: a real owner''s GitHub issue report on the Redmi Buds 5 / 6 Lite family.
        It documents a concrete Bluetooth failure mode: the earbuds fail to auto-connect to the A2DP profile
        and one earbud intermittently loses sound until reconnected. Caveat: this is specific to Linux/BlueZ
        5.83+ on a PC, not a phone, so it is a connectivity quirk rather than a universal defect, and
        it names the 5 and 6 Lite siblings, not the exact 5 Lite.'
      advice: If you pair these earbuds with a Linux PC, expect the A2DP auto-connect to fail and one
        earbud to drop audio until you manually reconnect or downgrade BlueZ. On a phone this specific
        regression does not apply, so weigh it accordingly.
    tr:
      title: Redmi Buds 5 / 6 Lite, Linux BlueZ 5.83+ üzerinde A2DP bağlantısını kaybediyor ve bir kulaklık
        sesi kesiyor
      body: 'Birincil kaynak: Redmi Buds 5 / 6 Lite ailesi hakkında gerçek bir sahibin GitHub sorun bildirimi.
        Somut bir Bluetooth arıza modunu belgeliyor: kulaklıklar A2DP profiline otomatik bağlanamıyor
        ve bir kulaklık yeniden bağlanana kadar aralıklı olarak ses kaybediyor. Uyarı: bu, bir telefonda
        değil, bir PC''de Linux/BlueZ 5.83+ sürümüne özgüdür, dolayısıyla evrensel bir kusur değil, bir
        bağlantı tuhaflığıdır ve tam 5 Lite''ı değil, 5 ve 6 Lite kardeşlerini adlandırır.'
      advice: Bu kulaklıkları bir Linux PC ile eşleştirirseniz, A2DP otomatik bağlantısının başarısız
        olmasını ve manuel olarak yeniden bağlanana veya BlueZ'yi düşürünceye kadar bir kulaklığın sesi
        kesmesini bekleyin. Bir telefonda bu özel gerileme geçerli değildir, bu yüzden buna göre değerlendirin.
