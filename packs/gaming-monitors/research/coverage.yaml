note: Seventeen models had at least one well-sourced, model-specific problem. No recall or safety notice
  for a gaming monitor was found; the claims are measured review findings and owner reports, not regulatory
  actions. Models with only generic panel-type praise or complaint were left out rather than given a claim
  invented to fill a row.
out_of_scope:
- Televisions and projector screens - separate category, covered by the televisions pack
- Portable USB-C monitors - different power and connectivity constraints
- Professional colour-grading monitors - different calibration and warranty expectations
