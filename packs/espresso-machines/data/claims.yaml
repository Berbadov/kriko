        siyah pullar tükürdüğünü bildiriyor; yedek makinede aynı arıza vardı ve yalnızca hem kazanı hem
        de grup başlığını değiştirmek sorunu çözdü.
      advice: Arıza yedek bir ünitede bile tekrarlayabilir, bu nedenle tek bir değişim yeterli olmayabilir.
        Kazan ve grup başlığı değişimi gerekme olasılığı için bütçe ayırın ve değişimi kabul etmeden önce
        düzeltmeyi doğrulayın.
