  text:
    en:
      title: Brew-unit channel behind sieve blocked, stopping the Series 2200
      body: Owner of a Series 2200 (EP2220) on the iFixit German forum, found via the 'Philips EP2200
        arıza şikayet' and 'panne forum' searches. The machine aborted its cleaning cycle with a red error
        LED; after disassembly the owner found a blockage in the brew-unit channel behind the sieve, cleared
        it, and the machine worked again. The thread also notes the support valve can be completely calcified
        ('ich habe schon völlig zugekalkte gesehen').
      advice: If the machine aborts cleaning or brewing with an error, the brew-unit channel behind the
        sieve and the support valve are prime blockage points; regular cleaning and descaling prevent
        this.
    tr:
      title: Filtrenin arkasındaki demleme ünitesi kanalı tıkalı, Series 2200'ü durduruyor
      body: iFixit Almanca forumunda bir Series 2200 (EP2220) sahibi, 'Philips EP2200 arıza şikayet' ve
        'panne forum' aramalarıyla bulundu. Makine temizleme döngüsünü kırmızı hata LED'i ile iptal etti;
        söküm sonrasında sahibi filtrenin arkasındaki demleme ünitesi kanalında bir tıkanıklık buldu,
        temizledi ve makine yeniden çalıştı. Konu ayrıca destek valfinin tamamen kireçlenebileceğini belirtiyor
        ('ich habe schon völlig zugekalkte gesehen').
      advice: Makine bir hatayla temizlemeyi veya demlemeyi iptal ederse, filtrenin arkasındaki demleme
        ünitesi kanalı ve destek valfi başlıca tıkanıklık noktalarıdır; düzenli temizlik ve kireç çözme
        bunu önler.
