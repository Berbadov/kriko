  text:
    en:
      title: Pump runs constantly; suspected solenoid assembly or triac PCB fault
      body: A repair forum owner describes a Barista Express whose pump runs continuously and never stops;
        the likely causes identified are the solenoid assembly or the triac PCB, requiring board-level
        diagnosis.
      advice: A pump that runs constantly is a control-board/solenoid fault, not a user error; it typically
        needs board or solenoid replacement and is an expensive repair. A buyer should know this failure
        exists and that it is not covered by routine cleaning.
    tr:
      title: Pompa sürekli çalışıyor; solenoid düzeneğinde veya triyak PCB'sinde arıza olduğu düşünülüyor
      body: Bir onarım forumu sahibi, pompası sürekli çalışan ve hiç durmayan bir Barista Express'i anlatıyor;
        tespit edilen olası nedenler solenoid düzeneği veya triyak PCB'sidir ve kart düzeyinde teşhis
        gerektirir.
      advice: Sürekli çalışan bir pompa, kullanıcı hatası değil, kontrol kartı/solenoid arızasıdır; genellikle
        kart veya solenoid değişimi gerektirir ve pahalı bir onarımdır. Bir alıcı bu arızanın var olduğunu
        ve rutin temizlikle kapsanmadığını bilmelidir.
