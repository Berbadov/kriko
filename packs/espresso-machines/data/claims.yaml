      title: EVO spits black flakes from steam wand and group head; boiler/group-head swap needed
      body: A Whole Latte Love customer review reports the EVO spitting black flakes from the steam wand
        and group head within days; the replacement machine had the same fault, and only swapping both
        the boiler and group head resolved it.
      advice: The fault can recur even on a replacement unit, so a single exchange may not be enough.
        Budget for the possibility of needing a boiler and group-head replacement, and confirm the fix
        before accepting a swap.
    tr:
      title: EVO buhar çubuğundan ve grup başlığından siyah pullar tükürüyor; kazan/grup başlığı değişimi
        gerekiyor
