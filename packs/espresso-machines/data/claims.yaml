  text:
    en:
      title: Three-way solenoid valve clogs with scale, stalling flow through the group head
      body: The manufacturer's own service guide lists the three-way solenoid valve clogging as the leading
        cause of flow problems on the Classic Pro.
      advice: Expect the group head to lose flow over time as scale builds up; cleaning the solenoid valve
        requires opening the machine (roughly 30 minutes). Buyers should plan regular descaling (about
        every 90 days) or budget for a solenoid service.
    tr:
      title: Üç yollu solenoid valf kireçle tıkanıyor, grup başlığından akışı durduruyor
      body: Üreticinin kendi servis kılavuzu, Classic Pro'da akış sorunlarının önde gelen nedeni olarak
        üç yollu solenoid valfin tıkanmasını listeliyor.
      advice: Kireç biriktikçe grup başlığının zamanla akışını kaybetmesini bekleyin; solenoid valfi temizlemek
        makineyi açmayı gerektirir (yaklaşık 30 dakika). Alıcılar düzenli kireç çözme (yaklaşık her 90
        günde bir) planlamalı veya bir solenoid servisi için bütçe ayırmalıdır.
  evidence:
