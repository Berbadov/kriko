  text:
    en:
      title: Philips Series 3200 ceramic burrs are fragile; Error 1 signals blocked grinder
      body: A professional repair service states that Philips/Saeco Series 3200 machines use ceramic burrs,
        which are fragile (высокая хрупкость керамики). Error 1 on the display means the grinder is blocked
        and cannot rotate. This is a known failure mode requiring service.
      advice: The ceramic burrs are fragile. If Error 1 appears, the grinder is blocked — do not force
        it. Professional cleaning or burr replacement may be needed.
    tr:
      title: Philips Series 3200 seramik öğütücü dişleri kırılgandır; Hata 1 öğütücünün tıkandığını gösterir
      body: Profesyonel bir onarım servisi, Philips/Saeco Series 3200 makinelerinin seramik öğütücü dişleri
        kullandığını ve bunların kırılgan olduğunu (высокая хрупкость керамики) belirtiyor. Ekrandaki
        Hata 1, öğütücünün tıkandığını ve dönemediğini gösterir. Bu, servis gerektiren bilinen bir arıza
        modudur.
      advice: Seramik öğütücü dişleri kırılgandır. Hata 1 görünürse öğütücü tıkanmıştır — zorlamayın.
        Profesyonel temizlik veya öğütücü dişi değişimi gerekebilir.
  evidence:
  - url: https://cofferemont.ru/manuals/philips-error-1/
    quote: Кофемашины Philips и Saeco (Series 1200, 2200, 3200, 4300, 5400, Xelsis) оснащены уникальными
      керамическими жерновами. Это инженерное решение обеспечивает тихую работу и предотвращает перегрев
      зерна, что крайне важно для сохранения аромата. Однако обратная сторона медали — высокая хрупкость
      керамики.
