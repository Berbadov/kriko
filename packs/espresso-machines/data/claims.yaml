      body: A Turkish owner (Ankara, Enplus store) reports the grinder broke two months after buying a
        Sage SES876 Barista Express Impress; the service blamed user error, charged 3,000 TL, and the
        replacement part had to come from abroad, leaving the machine unrepaired for two months.
      advice: 'For a TR buyer this is the most market-relevant finding: the integrated grinder is the
        weak point and the Turkish spare-parts pipeline is slow. Check warranty terms before agreeing
        to a paid repair, and confirm parts availability before buying.'
    tr:
      title: Entegre öğütücü satın alımdan iki ay sonra arızalandı; yedek parça için Türk servis beklemesi
