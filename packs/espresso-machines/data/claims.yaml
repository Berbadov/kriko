        iki ay sonra öğütücünün bozulduğunu bildiriyor; servis kullanıcı hatası diyerek 3.000 TL ücret
        aldı ve yedek parçanın yurt dışından gelmesi gerektiği için makine iki ay boyunca onarılmadan
        kaldı.
      advice: 'Bir TR alıcısı için bu, pazar açısından en alakalı bulgudur: entegre öğütücü zayıf noktadır
        ve Türk yedek parça tedarik hattı yavaştır. Ücretli bir onarımı kabul etmeden önce garanti koşullarını
        kontrol edin ve satın almadan önce parça bulunabilirliğini teyit edin.'
