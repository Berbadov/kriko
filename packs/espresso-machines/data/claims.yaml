      body: Owner forum thread on the Darty SAV community, specific to the EP3246/70. Owners report the
        machine builds pressure then a loud 'clac' with no coffee coming out; one certified owner traced
        it to the small red injection seal (joint torique) that had crumbled, another to the brew group
        on the right side being clogged with agglomerated ground coffee. This is a recurring, owner-diagnosed
        failure of a small rubber seal rather than a full machine failure.
      advice: If the EP3246/70 stops delivering coffee but hot water and milk still work, check the red
        injection seal and the right-side brew group for crumbled rubber or packed grounds before assuming
        a pump failure. The seal is a small, cheap consumable, but it is the specific part that fails
        here.
