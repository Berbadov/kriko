      title: Himo C20 battery cells report unbalanced, dropping capacity after charge
      body: An owner reports voltage sag from 40V to 35V under load; the reply diagnoses unbalanced cells
        that withhold full capacity.
      advice: If a C20 battery reads well below ~40V right after a full charge, the pack is likely unbalanced
        and will not deliver rated range; expect reduced capacity and possible early replacement.
    tr:
      title: Himo C20 batarya hücreleri dengesiz rapor ediliyor, şarjdan sonra kapasite düşüyor
      body: Bir sahip yük altında voltajın 40V'tan 35V'a düştüğünü bildiriyor; yanıt, tam kapasiteyi tutmayan
        dengesiz hücreler teşhisi koyuyor.
      advice: Bir C20 bataryası tam şarjdan hemen sonra ~40V'un çok altında okunuyorsa, paket büyük olasılıkla
        dengesizdir ve nominal menzili sağlamayacaktır; azalmış kapasite ve olası erken değişim bekleyin.
