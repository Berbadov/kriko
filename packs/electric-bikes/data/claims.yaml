  text:
    en:
      title: 'EU Safety Gate recall SR/02322/26: Xiaomi e-bike battery charger (SLS-4202) carries electric-shock
        risk'
      body: 'Official EU Safety Gate alert SR/02322/26, notified by Denmark, published 21 Aug 2026, product
        of China. The charger marketed for Xiaomi e-scooter/e-bike fails Low Voltage Directive creepage-distance
        requirements, so a user could touch live parts and get an electric shock. Caveat: this is a third-party
        ''Power Charger'' (SLS-4202) sold for Xiaomi e-bikes, not confirmed as the OEM Mi Electric Bike
        charger, so a buyer should match the exact model/barcode before assuming their unit is affected.'
      advice: If you own a 36V/42V charger labelled SLS-4202 sold for a Xiaomi e-bike, stop using it and
        check the EU Safety Gate record; the risk is electric shock from inadequate internal insulation.
    tr:
      title: 'AB Safety Gate geri çağırma SR/02322/26: Xiaomi e-bike batarya şarj cihazı (SLS-4202) elektrik
        çarpması riski taşıyor'
      body: 'Danimarka tarafından bildirilen, 21 Ağu 2026 tarihinde yayımlanan resmi AB Safety Gate uyarısı
        SR/02322/26, ürün menşei Çin. Xiaomi e-scooter/e-bike için pazarlanan şarj cihazı, Alçak Gerilim
        Direktifi kaçak akım mesafesi gerekliliklerini karşılamıyor, bu nedenle bir kullanıcı canlı parçalara
        dokunabilir ve elektrik çarpmasına maruz kalabilir. Uyarı: bu, Xiaomi e-bike''lar için satılan
        üçüncü taraf bir ''Power Charger'' (SLS-4202) olup, OEM Mi Electric Bike şarj cihazı olduğu doğrulanmamıştır,
        bu nedenle bir alıcı, kendi ünitesinin etkilendiğini varsaymadan önce tam model/barkodu eşleştirmelidir.'
      advice: Xiaomi e-bike için satılan SLS-4202 etiketli 36V/42V şarj cihazına sahipseniz, kullanmayı
        bırakın ve AB Safety Gate kaydını kontrol edin; risk, yetersiz iç yalıtımdan kaynaklanan elektrik
        çarpmasıdır.
  evidence:
