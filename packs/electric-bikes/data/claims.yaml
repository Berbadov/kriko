    en:
      title: Himo T1 early-batch instrument panel undervoltage threshold causes sudden power cutout while
        riding
      body: A Chinese owner (smzdm) reports that early production batches of the T1 had the undervoltage
        protection threshold set too high in the instrument panel firmware, so when the throttle is twisted
        the battery's instantaneous voltage dips and the controller cuts all power mid-ride. The manufacturer's
        fix was a replacement instrument panel with a lower threshold. This is a motor-controller/battery-management
        defect that causes sudden loss of propulsion while riding, which is dangerous in traffic.
      advice: If buying a used T1, ask whether the instrument panel was replaced under this issue; if
        riding one, expect sudden power cutouts when battery is not full. Budget for a replacement instrument
        panel if not already fitted.
    tr:
      title: Himo T1 erken parti gösterge paneli düşük voltaj eşiği sürüş sırasında ani güç kesintisine
        neden oluyor
