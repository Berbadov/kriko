        voltaj koruma eşiğinin çok yüksek ayarlandığını, bu nedenle gaz verildiğinde pilin anlık voltajının
        düştüğünü ve kontrolcünün sürüş ortasında tüm gücü kestiğini bildiriyor. Üreticinin düzeltmesi,
        daha düşük eşikli bir gösterge paneli değişimiydi. Bu, sürüş sırasında ani itiş kaybına neden
        olan ve trafikte tehlikeli olan bir motor-kontrolcü/pil yönetimi kusurudur.
      advice: İkinci el bir T1 alıyorsanız, gösterge panelinin bu sorun kapsamında değiştirilip değiştirilmediğini
