  text:
    en:
      title: 'Turkish owner reports: Xiaomi Mi Himo Z20 battery fails to charge and self-discharges'
      body: A Turkish owner on Şikayetvar reports the Xiaomi Mi Himo Z20 battery stopped charging suddenly.
        The warranty service said there was nothing wrong, but testing with another charger on the same
        bike model showed the bike had a contact issue. Another complaint on the same platform says the
        battery drains itself even when the bike is off and unused.
      advice: If you own a Himo Z20, test with a known-good charger and check the charging contact/connector
        before assuming the battery itself is dead. Turkish warranty service may not acknowledge the issue,
        so document everything.
    tr:
      title: 'Türk sahibi bildiriyor: Xiaomi Mi Himo Z20 bataryası şarj olmuyor ve kendiliğinden deşarj
        oluyor'
      body: Şikayetvar'da bir Türk sahibi, Xiaomi Mi Himo Z20 bataryasının aniden şarj olmayı bıraktığını
        bildiriyor. Garanti servisi sorun olmadığını söyledi, ancak aynı bisiklet modelinde başka bir
        şarj cihazıyla test edildiğinde bisikletin bir temas sorunu olduğu görüldü. Aynı platformdaki
        başka bir şikayet, bisiklet kapalı ve kullanılmıyorken bile bataryanın kendiliğinden boşaldığını
        söylüyor.
      advice: Bir Himo Z20'niz varsa, bataryanın kendisinin ölü olduğunu varsaymadan önce bilinen iyi
        bir şarj cihazıyla test edin ve şarj temasını/bağlantısını kontrol edin. Türk garanti servisi
        sorunu kabul etmeyebilir, bu yüzden her şeyi belgeleyin.
