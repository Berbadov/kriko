      body: The manufacturer's user manual for the 122 A++ GI Pro WiFi (listed alongside the 092 A++ in
        the same manual) states the unit contains R32 refrigerant, which is mildly flammable, and warns
        against installation near flammable gases or in smoky/dusty environments. Note the manual's cover
        names the series 'Nefes Inverter 122 A++ GI Pro WiFi'; it shares the 122 A++ GI Pro WiFi model
        designation with the subject Nova unit, so treat this as the same hardware family.
      advice: R32 is mildly flammable, which matters given the reported outdoor-unit ignition event on
        this model. Keep the outdoor unit away from ignition sources and flammable materials, and have
        any refrigerant work done by an authorized technician; a leak or a damaged line near a flame source
        is the risk this warning targets.
