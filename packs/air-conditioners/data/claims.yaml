      title: 'Comfee MPD1-12CRN7 recall: compressor power cable insulation wears against copper pipe,
        sparking can ignite refrigerant and unit'
      body: The recall covers the portable MPD1-12CRN7 (EAN 4048164102914, 2019 production) and the identical
        Midea Mobile 35C. The compressor power cable can rub against the copper refrigerant pipe; with
        prolonged/intense use the insulation wears, causing electrical sparking that can ignite the R290
        refrigerant and the unit itself. The manufacturer asks owners to stop using the unit immediately
        and contact their dealer. This is a high-severity fire hazard from an electrical defect.
      advice: If you own a 2019 Comfee MPD1-12CRN7, stop using it immediately and contact the dealer/Midea
        Europe service (free line +49 6196 90 20 290, MEG.Product@Midea.com) to arrange the recall remedy.
        Do not continue running the unit while waiting.
    tr:
      title: 'Comfee MPD1-12CRN7 geri çağırma: kompresör güç kablosu yalıtımı bakır boruya sürtünerek
        aşınıyor, kıvılcım soğutucu akışkanı ve üniteyi tutuşturabilir'
      body: Geri çağırma, taşınabilir MPD1-12CRN7'yi (EAN 4048164102914, 2019 üretimi) ve aynı olan Midea
        Mobile 35C'yi kapsar. Kompresör güç kablosu bakır soğutucu akışkan borusuna sürtünebilir; uzun
        süreli/yoğun kullanımda yalıtım aşınarak R290 soğutucu akışkanı ve ünitenin kendisini tutuşturabilecek
        elektriksel kıvılcımlara neden olur. Üretici, sahiplerden üniteyi derhal kullanmayı bırakmalarını
        ve bayileriyle iletişime geçmelerini ister. Bu, elektriksel bir kusurdan kaynaklanan yüksek ciddiyette
        bir yangın tehlikesidir.
      advice: 2019 Comfee MPD1-12CRN7'niz varsa, derhal kullanmayı bırakın ve geri çağırma çözümünü ayarlamak
        için bayi/Midea Europe servisiyle (ücretsiz hat +49 6196 90 20 290, MEG.Product@Midea.com) iletişime
        geçin. Beklerken üniteyi çalıştırmaya devam etmeyin.
