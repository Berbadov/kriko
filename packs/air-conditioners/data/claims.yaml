  text:
    en:
      title: KOENIC KAC 3352 recalled by Swiss regulator ESTI for fire and electric-shock hazard (compressor
        power cable contacting refrigerant copper tube)
      body: The Swiss federal regulator (ESTI) and the manufacturer jointly recalled the KOENIC KAC 3352
        portable air conditioner on 20.10.2021. The compressor's power cable sheath can contact the refrigerant
        copper tube and wear through, causing sparking and a fire/electrical-shock risk. Only batches
        with PO numbers 7000008080, 7000008081, 7000008082, 7000008088 are affected; the regulator instructs
        owners to stop using the unit and return it to the point of sale.
      advice: If you own a KAC 3352, check the PO number on the type plate (right side) or packaging.
        If it is one of the four recalled batches, stop using it immediately and contact IMTRON (0800
        200 308 in Switzerland, 0800 7773222 in Germany, contact@imtron.eu) for an on-site inspection,
        replacement, or refund. Units outside these batches are not affected.
    tr:
      title: KOENIC KAC 3352, yangın ve elektrik çarpması tehlikesi nedeniyle İsviçre düzenleyicisi ESTI
        tarafından geri çağrıldı (kompresör güç kablosunun soğutucu bakır boruya temas etmesi)
      body: İsviçre federal düzenleyicisi (ESTI) ve üretici, KOENIC KAC 3352 taşınabilir klimayı 20.10.2021
        tarihinde ortaklaşa geri çağırdı. Kompresörün güç kablosu kılıfı, soğutucu bakır boruya temas
        ederek aşınabilir ve kıvılcım ile yangın/elektrik çarpması riskine yol açabilir. Yalnızca PO numaraları
        7000008080, 7000008081, 7000008082, 7000008088 olan partiler etkilenmiştir; düzenleyici, sahiplerine
        üniteyi kullanmayı bırakmalarını ve satış noktasına iade etmelerini talimat veriyor.
      advice: Bir KAC 3352'niz varsa, tip plakasındaki (sağ taraf) veya ambalajdaki PO numarasını kontrol
        edin. Geri çağrılan dört partiden biriyse, derhal kullanmayı bırakın ve yerinde inceleme, değişim
        veya para iadesi için IMTRON ile iletişime geçin (İsviçre'de 0800 200 308, Almanya'da 0800 7773222,
        contact@imtron.eu). Bu partilerin dışındaki üniteler etkilenmemiştir.
