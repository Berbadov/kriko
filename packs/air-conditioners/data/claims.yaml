      title: Samsung Luzon Dual Split outdoor unit electronic board burned out twice (C203), EU market
      body: An EU consumer's public complaint to Altroconsumo (Italy) documents a Samsung Luzon Dual Split
        outdoor unit (AJ040TXJ2KG/EU) that locked up with error C203 and was found to have a burned electronic
        board, replaced at €341.50, then burned out again with the same C203 code only 8 months later.
        Samsung refused warranty coverage for the replacement board.
      advice: In the EU market, the outdoor unit's electronic board is a documented recurring failure
        point on the Samsung Luzon split series, with a repeat failure within months and a several-hundred-euro
        repair cost; factor that into the running cost and warranty expectations.
    tr:
      title: Samsung Luzon Dual Split dış ünite elektronik kartı iki kez yandı (C203), AB pazarı
      body: Bir AB tüketicisinin Altroconsumo'ya (İtalya) yaptığı kamuya açık şikayet, C203 hatasıyla
        kilitlenen ve elektronik kartının yandığı tespit edilen, 341,50 € karşılığında değiştirilen, ardından
        yalnızca 8 ay sonra aynı C203 koduyla tekrar yanan bir Samsung Luzon Dual Split dış ünitesini
        (AJ040TXJ2KG/EU) belgeliyor. Samsung, değiştirilen kart için garanti kapsamını reddetti.
      advice: AB pazarında, dış ünitenin elektronik kartı Samsung Luzon split serisinde belgelenmiş tekrarlayan
        bir arıza noktasıdır; aylar içinde tekrarlayan bir arıza ve birkaç yüz euroluk onarım maliyeti
        söz konusudur; bunu işletme maliyeti ve garanti beklentilerinize dahil edin.
