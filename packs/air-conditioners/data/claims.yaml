      title: Samsung Wind Free stopped cooling twice within its first year
      body: An owner reports the Wind Free unit stopped cooling twice within a year, with the service
        team blaming the original installation.
      advice: Repeated loss of cooling in a near-new unit means the fault is not resolved by a single
        visit. If a Windfree stops cooling twice in a year, insist on finding the root cause rather than
        accepting a re-charge or re-installation claim.
    tr:
      title: Samsung Wind Free ilk yılında iki kez soğutmayı durdurdu
      body: Bir sahip, Wind Free ünitesinin bir yıl içinde iki kez soğutmayı durdurduğunu ve servis ekibinin
        suçu orijinal kuruluma yüklediğini bildiriyor.
      advice: Neredeyse yeni bir ünitede soğutmanın tekrar tekrar kaybolması, arızanın tek bir ziyaretle
        çözülmediği anlamına gelir. Bir Windfree bir yılda iki kez soğutmayı durdurursa, yeniden gaz dolumu
        veya yeniden kurulum iddiasını kabul etmek yerine kök nedeni bulmakta ısrar edin.
