  text:
    en:
      title: 'IFS-documented fire in a 2019 Comfee portable AC: short circuit between compressor power
        connection and coolant line melted the line, flammable refrigerant leaked and ignited'
      body: IFS investigated a real fire in a server room where a 2019 Comfee 'Eco Friendly' portable
        AC ran about two hours before smoke was noticed; the fire was extinguished before spreading. Laboratory
        examination found a short circuit between the compressor power connection and a coolant line,
        which melted the line so the flammable refrigerant leaked and ignited. IFS notes this matches
        the failure pattern of the MPD1-12CRN7 recall, though the specific unit examined was not itself
        on the recall list. This independently corroborates the manufacturer's recall warning with an
        actual ignition event.
      advice: 'Treat the fire risk as real, not hypothetical: an independent laboratory documented an
        actual ignition from this exact failure mode in a 2019 Comfee portable unit. Verify your unit''s
        serial number against the recall and stop using it until resolved.'
    tr:
      title: 'IFS tarafından belgelenen 2019 Comfee taşınabilir klimada yangın: kompresör güç bağlantısı
        ile soğutucu akışkan hattı arasındaki kısa devre hattı eritti, yanıcı soğutucu akışkan sızdı ve
        tutuştu'
      body: IFS, bir sunucu odasında 2019 Comfee 'Eco Friendly' taşınabilir klimanın yaklaşık iki saat
        çalıştıktan sonra duman fark edildiği gerçek bir yangını inceledi; yangın yayılmadan söndürüldü.
        Laboratuvar incelemesi, kompresör güç bağlantısı ile bir soğutucu akışkan hattı arasında bir kısa
        devre buldu; bu, hattı eritti ve yanıcı soğutucu akışkan sızarak tutuştu. IFS, bunun MPD1-12CRN7
        geri çağırma işleminin arıza örüntüsüyle eşleştiğini, ancak incelenen belirli cihazın kendisinin
        geri çağırma listesinde olmadığını belirtiyor. Bu, üreticinin geri çağırma uyarısını gerçek bir
        tutuşma olayıyla bağımsız olarak destekliyor.
      advice: 'Yangın riskini varsayımsal değil gerçek olarak değerlendirin: bağımsız bir laboratuvar,
        2019 Comfee taşınabilir cihazında tam bu arıza modundan kaynaklanan gerçek bir tutuşmayı belgeledi.
        Cihazınızın seri numarasını geri çağırma listesiyle karşılaştırın ve sorun çözülene kadar kullanmayı
        bırakın.'
