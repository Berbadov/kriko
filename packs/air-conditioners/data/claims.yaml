      title: 'Manufacturer IMTRON confirms KAC 3352 recall: compressor power-line insulation can wear,
        ignite refrigerant and the unit'
      body: IMTRON GmbH (which manages the KOENIC house brand for MediaMarkt/Saturn) published this official
        safety notice. It states that in very rare cases the compressor power line can contact the refrigerant
        copper tube; with long or intensive use the cable sheath can wear, causing sparking, and continued
        operation could ignite the refrigerant and the unit itself. The recall covers only PO batches
        7000008080, 7000008081, 7000008082, 7000008088.
      advice: This is the manufacturer's own confirmation of the fire hazard. Owners of an affected batch
        should stop using the unit and contact IMTRON for a free on-site check, replacement, or refund.
        The manufacturer explicitly advises against opening the unit yourself.
    tr:
      title: 'Üretici IMTRON, KAC 3352 geri çağırmasını doğruladı: kompresör elektrik hattı yalıtımı aşınabilir,
        soğutucu akışkanı ve üniteyi tutuşturabilir'
      body: IMTRON GmbH (MediaMarkt/Saturn için KOENIC ev markasını yöneten şirket) bu resmi güvenlik
        bildirimini yayımladı. Bildirimde, çok nadir durumlarda kompresör elektrik hattının soğutucu bakır
        boruya temas edebileceği; uzun veya yoğun kullanımda kablo kılıfının aşınarak kıvılcım oluşmasına
        yol açabileceği ve çalışmaya devam edilmesinin soğutucu akışkanı ve ünitenin kendisini tutuşturabileceği
        belirtiliyor. Geri çağırma yalnızca PO partileri 7000008080, 7000008081, 7000008082, 7000008088'i
        kapsıyor.
      advice: Bu, üreticinin yangın tehlikesine ilişkin kendi doğrulamasıdır. Etkilenen bir partinin sahipleri
        üniteyi kullanmayı bırakmalı ve ücretsiz yerinde kontrol, değişim veya para iadesi için IMTRON
        ile iletişime geçmelidir. Üretici, üniteyi kendi başınıza açmamanızı açıkça tavsiye ediyor.
