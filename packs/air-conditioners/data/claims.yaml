  text:
    en:
      title: KOENIC KAC 3352 portable AC recalled by Swiss regulator ESTI for fire and electric-shock
        risk from compressor power cable touching refrigerant tube
      body: The Swiss federal regulator ESTI, in voluntary cooperation with Media Markt Schweiz AG / Imtron
        GmbH, recalled the portable KAC 3352 on 20.10.2021. The compressor's power cable sheath can contact
        the copper refrigerant tube, creating a fire and electric-shock hazard; affected units must not
        be used and must be returned.
      advice: 'If you own a KAC 3352, check the PO number on the type plate (right side) or packaging.
        Units with PO 7000008080, 7000008081, 7000008082, or 7000008088 are recalled: stop using them,
        unplug, and contact IMTRON (0800 200 308 in Switzerland, or contact@imtron.eu) for a replacement
        or refund. Other PO numbers are not affected.'
    tr:
      title: KOENIC KAC 3352 taşınabilir klima, kompresör güç kablosunun soğutucu akışkan borusuna temas
        etmesinden kaynaklanan yangın ve elektrik çarpması riski nedeniyle İsviçre düzenleyicisi ESTI
        tarafından geri çağrıldı
      body: İsviçre federal düzenleyicisi ESTI, Media Markt Schweiz AG / Imtron GmbH ile gönüllü işbirliği
        içinde, 20.10.2021 tarihinde taşınabilir KAC 3352'yi geri çağırdı. Kompresörün güç kablosu kılıfı
        bakır soğutucu akışkan borusuna temas ederek yangın ve elektrik çarpması tehlikesi oluşturabilir;
        etkilenen üniteler kullanılmamalı ve iade edilmelidir.
      advice: 'Bir KAC 3352''niz varsa, tip plakasındaki (sağ taraf) veya ambalajdaki PO numarasını kontrol
        edin. PO 7000008080, 7000008081, 7000008082 veya 7000008088 olan üniteler geri çağrılmıştır: kullanmayı
        bırakın, fişini çekin ve değişim veya para iadesi için IMTRON ile iletişime geçin (İsviçre''de
        0800 200 308 veya contact@imtron.eu). Diğer PO numaraları etkilenmemiştir.'
  evidence:
