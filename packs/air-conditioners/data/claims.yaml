    en:
      title: Arçelik/Beko split AC recurring breakdowns resolved only by refrigerant top-ups, never permanently
      body: 'Owner complaint on Şikayetvar: an Arçelik/Beko split AC has broken repeatedly over two years,
        with service visits only adding refrigerant gas and returning it, and the faults continuing; the
        unit went to service 8–10 times with no permanent fix. This is a reliability/refrigerant finding,
        not a safety event.'
      advice: A buyer should know that repeated 'gas top-up' service visits without a permanent fix are
        a documented pattern for Arçelik/Beko split units, and that a refrigerant leak may not be properly
        located. Expect possible repeat service calls rather than a one-visit repair.
    tr:
      title: Arçelik/Beko split klima tekrarlayan arızaları yalnızca soğutucu akışkan takviyesiyle çözülüyor,
        asla kalıcı olarak değil
      body: 'Şikayetvar üzerinde sahip şikayeti: bir Arçelik/Beko split klima iki yıl boyunca defalarca
        arızalandı, servis ziyaretleri yalnızca soğutucu gaz ekleyip üniteyi geri gönderdi ve arızalar
        devam etti; ünite 8–10 kez servise gitti ve kalıcı bir düzeltme yapılmadı. Bu bir güvenilirlik/soğutucu
        akışkan bulgusudur, güvenlik olayı değildir.'
      advice: Bir alıcı, kalıcı bir düzeltme olmaksızın tekrarlanan 'gaz takviyesi' servis ziyaretlerinin
        Arçelik/Beko split üniteleri için belgelenmiş bir örüntü olduğunu ve bir soğutucu akışkan kaçağının
        düzgün şekilde tespit edilemeyebileceğini bilmelidir. Tek ziyaretlik onarım yerine olası tekrarlayan
        servis çağrıları bekleyin.
