      title: 'KOENIC KAC 3352 manufacturer''s own safety notice: worn compressor cable sheath can cause
        sparking and ignite the refrigerant and unit'
      body: IMTRON GmbH, the brand owner for MediaMarkt/Saturn, issued this official safety notice. In
        very rare cases the compressor power cable contacts the copper refrigerant tube; with long or
        intensive use the cable sheath wears, causing electrical sparking at the copper lead that could
        ignite the refrigerant and the unit itself. The company recalled the affected batches preventively.
      advice: This is the manufacturer's own confirmation of the fire hazard. If your KAC 3352 is in PO
        batches 7000008080/81/82/88, stop using it and contact IMTRON (0800 7773222 in Germany, or contact@imtron.eu)
        for an on-site check, replacement, or refund. The recall is EU/Switzerland (MediaMarkt/Saturn);
        no Turkish-market notice was found in this run.
    tr:
      title: 'KOENIC KAC 3352 üreticinin kendi güvenlik bildirimi: aşınmış kompresör kablo kılıfı kıvılcım
        çıkararak soğutucu akışkanı ve üniteyi tutuşturabilir'
      body: MediaMarkt/Saturn'ün marka sahibi IMTRON GmbH bu resmi güvenlik bildirimini yayımladı. Çok
        nadir durumlarda kompresör güç kablosu bakır soğutucu akışkan borusuna temas eder; uzun veya yoğun
        kullanımda kablo kılıfı aşınarak bakır iletkende elektriksel kıvılcım oluşur ve bu da soğutucu
        akışkanı ve ünitenin kendisini tutuşturabilir. Şirket etkilenen partileri önleyici olarak geri
        çağırdı.
      advice: Bu, üreticinin yangın tehlikesine ilişkin kendi teyididir. KAC 3352'niz PO partileri 7000008080/81/82/88
        içindeyse kullanmayı bırakın ve yerinde kontrol, değişim veya para iadesi için IMTRON ile iletişime
        geçin (Almanya'da 0800 7773222 veya contact@imtron.eu). Geri çağırma AB/İsviçre (MediaMarkt/Saturn)
        kapsamındadır; bu çalışmada Türkiye pazarına ait bir bildirim bulunamadı.
