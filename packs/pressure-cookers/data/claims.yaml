  text:
    en:
      title: No recall found for Instant Pot Plus WiFi; only Smart/Smart-60 (2015) recall identified
      body: The only Instant Pot recall identified covers Smart/Smart-60 models (2015, electrical shock
        hazard). No recall was found for the Plus WiFi (RPPC61-BK). Later burn lawsuits concern lid-safety/pressure-retention
        failures but are not specific to the Plus WiFi model.
      advice: The Plus WiFi is not under any identified recall, but buyers should be aware of the broader
        pattern of lid-safety burn lawsuits against Instant Pot brand cookers.
    tr:
      title: Instant Pot Plus WiFi için geri çağırma bulunamadı; yalnızca Smart/Smart-60 (2015) geri çağırması
        tespit edildi
      body: Tespit edilen tek Instant Pot geri çağırması Smart/Smart-60 modellerini kapsıyor (2015, elektrik
        çarpması tehlikesi). Plus WiFi (RPPC61-BK) için geri çağırma bulunamadı. Daha sonraki yanık davaları
        kapak güvenliği/basınç tutma arızalarıyla ilgili ancak Plus WiFi modeline özgü değil.
      advice: Plus WiFi tespit edilen herhangi bir geri çağırma kapsamında değil, ancak alıcılar Instant
        Pot markalı pişiricilere karşı daha geniş kapak güvenliği yanık davaları örüntüsünün farkında
        olmalı.
  evidence:
