      title: Owner reports the lid cannot be made to seal due to the silicone O-ring design
      body: A critical Amazon/Woot review of the Duo Plus (8-quart) reports being unable to get the lid
        to seal at all, blaming the large red O-ring and a lid that is hard to push down and turn to lock.
        This is a single owner's account of the same sealing failure the manual documents, but it is anecdotal
        and the reviewer could not get past a test run.
      advice: This is weaker evidence (one owner) but matches the official steam-leak troubleshooting.
        If you buy a Duo Plus, expect the sealing ring to need correct seating; test the seal with a water
        run before relying on it.
    tr:
