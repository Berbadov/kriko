  text:
    en:
      title: Class action alleges Instant Pot Duo lid-locking assemblies fail, allowing lids to open under
        pressure
      body: The class action names the IP Duo Series among the affected models. The defect is a lid that
        can open while the cooker is still pressurized, ejecting super-heated contents.
      advice: Never force the lid open; always confirm the float valve has dropped and pressure is fully
        released before opening. If the lid opens while pressurized, stop using the unit immediately.
    tr:
      title: Toplu dava, Instant Pot Duo kapak kilitleme düzeneklerinin arızalandığını ve kapakların basınç
        altında açılmasına izin verdiğini iddia ediyor
      body: Toplu dava, etkilenen modeller arasında IP Duo Serisini adlandırıyor. Kusur, pişirici hâlâ
        basınç altındayken açılabilen ve aşırı ısınmış içeriği dışarı fırlatan bir kapak.
      advice: Kapağı asla zorla açmayın; açmadan önce şamandıra valfinin düştüğünü ve basıncın tamamen
        tahliye edildiğini her zaman doğrulayın. Kapak basınç altındayken açılırsa üniteyi derhal kullanmayı
        bırakın.
  evidence:
  - url: https://www.classactionlawsuithelp.com/instant-pot-duo-pressure-cooker-class-action-lawsuit/
    quote: In June 2022, two plaintiffs filed a federal class action lawsuit against Instant Brands Inc.,
      claiming that multiple Instant Pot models contain dangerously defective lid-locking assemblies that
      allow the lids to open while contents remain under pressure, causing super-heated food and steam
      to erupt and scald users with second and third-degree burns.
