  text:
    en:
      title: Instant Pot Ultra manual documents 'Ovht' overheating warning and pressure failure mode
      body: The official Ultra manual documents an 'Ovht' (overheating) warning where the cooker reduces
        heating temperature and may fail to reach cooking pressure, potentially caused by starch deposits
        blocking heat dissipation from the inner pot bottom.
      advice: If the Ultra shows an Ovht warning, stop cooking and inspect the bottom of the inner pot
