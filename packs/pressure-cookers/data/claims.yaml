        sıvı çok koyu olduğunda BURN hatasının göründüğünü ve pişirme döngüsünü iptal ettiğini bildirir.
        Bu, Türkçe kılavuzun Food Burn açıklamasıyla örtüşür ve sahipler tarafından sık bildirilen bir
        davranıştır.
      advice: Minimum sıvı hacimlerini belirten tarifleri izleyin; BURN görünürse basıncı serbest bırakın,
