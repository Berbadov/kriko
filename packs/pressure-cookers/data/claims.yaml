    en:
      title: Duo Nova 60 lid blew off while pressurized, scalding user (lawsuit report)
      body: A legal-news report on an Alabama plaintiff's lawsuit (filed July 9 in the U.S. District Court
        of Illinois) states the Duo Nova 60's lid suddenly blew off while the cooker was still pressurized,
        causing severe burns. The article notes the Duo Nova is advertised with 11 built-in safety features.
      advice: 'This adds a third, independently reported instance of the Duo Nova lid opening under pressure.
        The failure mode is the same: the lid releases while pressure remains, ejecting scalding contents.'
    tr:
      title: Duo Nova 60 kapağı basınç altındayken uçtu, kullanıcıyı haşladı (dava raporu)
      body: Alabama'lı bir davacının davasına (9 Temmuz'da ABD Illinois Bölge Mahkemesi'nde açıldı) ilişkin
        bir hukuk haberi raporu, Duo Nova 60'ın kapağının pişirici hâlâ basınç altındayken aniden uçtuğunu
        ve ciddi yanıklara neden olduğunu belirtiyor. Makale, Duo Nova'nın 11 yerleşik güvenlik özelliğiyle
        tanıtıldığını not ediyor.
      advice: 'Bu, Duo Nova kapağının basınç altında açılmasına dair bağımsız olarak bildirilen üçüncü
        vakayı ekliyor. Arıza modu aynı: kapak basınç devam ederken açılıyor ve haşlayıcı içeriği dışarı
        fırlatıyor.'
