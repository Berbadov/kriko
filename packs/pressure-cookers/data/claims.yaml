  text:
    en:
      title: Viva series lid-locking defect allows lid to open under pressure (Canadian class action)
      body: The Canadian consumer-rights group lists the Viva series among the Instant Pot models covered
        by the US class action, alleging a dangerously defective lid-locking device lets the lid open
        under pressure so super-heated contents erupt and burn users with second- and third-degree burns.
      advice: Independently corroborates the Viva lid-locking defect. The same group notes Instant Brands
        designed a new locking-pin construction around 26 October 2017, so units built before that date
        are the ones implicated. A buyer should treat a pre-2017 Viva as carrying the documented burn
        risk.
    tr:
      title: Viva serisi kapak kilitleme kusuru, basınç altında kapağın açılmasına izin veriyor (Kanada
        toplu davası)
      body: Kanadalı tüketici hakları grubu, Viva serisini ABD toplu davası kapsamındaki Instant Pot modelleri
        arasında listeliyor ve tehlikeli derecede kusurlu bir kapak kilitleme cihazının, kapak basınç
        altındayken açılmasına izin vererek aşırı ısınmış içeriğin fışkırmasına ve kullanıcıları ikinci
        ve üçüncü derece yanıklarla yakmasına neden olduğunu iddia ediyor.
      advice: Viva kapak kilitleme kusurunu bağımsız olarak doğrular. Aynı grup, Instant Brands'in 26
        Ekim 2017 civarında yeni bir kilitleme pimi yapısı tasarladığını, dolayısıyla bu tarihten önce
        üretilen ünitelerin söz konusu olduğunu belirtiyor. Bir alıcı, 2017 öncesi bir Viva'yı belgelenmiş
        yanık riski taşıyan bir ürün olarak değerlendirmelidir.
