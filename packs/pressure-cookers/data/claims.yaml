  text:
    en:
      title: Duo Plus series lid locking assembly can open under pressure, causing second/third-degree
        burns (US class action)
      body: A Canadian consumer-law firm's investigation names the Duo Plus series among Instant Pot models
        covered by an ongoing US class action alleging a dangerously defective lid locking device that
        lets the lid open while contents are under pressure, ejecting superheated contents and burning
        users to the second and third degree. The page also states Instant Brands designed a new locking
        pin construction around 26 October 2017 to address the problem, so units built before that date
        are the ones in question.
      advice: 'If you are buying a Duo Plus in Turkey, this is the highest-risk finding: it alleges a
        lid-lock defect that can cause scalding burns under normal use. Prefer a unit manufactured after
        late 2017 (the page says the new locking-pin construction was designed around 26 October 2017),
        and treat any lid that opens while pressure is still inside as a serious hazard.'
    tr:
      title: Duo Plus serisi kapak kilitleme düzeneği basınç altında açılarak ikinci/üçüncü derece yanıklara
        neden olabilir (ABD toplu davası)
      body: Kanadalı bir tüketici hukuku firmasının incelemesi, Duo Plus serisini, içerik basınç altındayken
        kapağın açılmasına izin veren ve aşırı ısınmış içeriği dışarı fırlatarak kullanıcıları ikinci
        ve üçüncü derecede yakan tehlikeli şekilde kusurlu bir kapak kilitleme cihazı iddiasıyla sürmekte
        olan bir ABD toplu davası kapsamındaki Instant Pot modelleri arasında adlandırıyor. Sayfa ayrıca
        Instant Brands'in sorunu ele almak için yaklaşık 26 Ekim 2017'de yeni bir kilitleme pimi yapısı
        tasarladığını belirtiyor, dolayısıyla söz konusu olanlar bu tarihten önce üretilen üniteler.
      advice: 'Türkiye''de bir Duo Plus alıyorsanız, bu en yüksek riskli bulgu: normal kullanımda haşlanma
        yanıklarına neden olabilecek bir kapak kilidi kusuru iddia ediyor. Geç 2017''den sonra üretilmiş
        bir üniteyi tercih edin (sayfa yeni kilitleme pimi yapısının yaklaşık 26 Ekim 2017''de tasarlandığını
        söylüyor) ve basınç hâlâ içerideyken açılan herhangi bir kapağı ciddi bir tehlike olarak değerlendirin.'
  evidence:
  - url: https://clg.org/Recours-Collectif/Liste-des-recours-collectifs/Autocuiseur--Defaut--Action-collective-canadienne
    quote: Un recours collectif est déjà en cours aux États-Unis, qui allègue que ces produits sont dotés
