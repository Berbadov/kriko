  text:
    en:
      title: Instant Pot Smart-60 lid removable under pressure, per court complaint
      body: Federal complaint (Wilder v. Instant Brands, Docket 1:23-cv-1964) alleges the Smart-60 lid
        can be removed while pressure, heat and steam remain inside, causing scalding burn injuries. This
        is an allegation in litigation, not an adjudicated finding.
      advice: This is a plaintiff's allegation, not a proven defect. If you own a Smart-60, never force
        the lid open and always confirm the float valve has dropped before opening. Treat this as a reported
        risk, not a confirmed failure.
    tr:
      title: Instant Pot Smart-60 kapağı basınç altında çıkarılabilir, mahkeme şikayetine göre
      body: Federal şikayet (Wilder v. Instant Brands, Docket 1:23-cv-1964), Smart-60 kapağının basınç,
        ısı ve buhar içeride kalırken çıkarılabildiğini ve haşlanma yanıklarına yol açtığını iddia ediyor.
        Bu, dava sürecindeki bir iddiadır, hükme bağlanmış bir tespit değildir.
      advice: Bu, davacının iddiasıdır, kanıtlanmış bir kusur değildir. Bir Smart-60'ınız varsa, kapağı
        asla zorla açmayın ve açmadan önce şamandıra valfinin indiğini her zaman doğrulayın. Bunu bildirilen
        bir risk olarak değerlendirin, doğrulanmış bir arıza olarak değil.
  evidence:
