  text:
    en:
      title: Pro Crisp AF 8 pressure cooking lid can be opened while pressurized, ejecting scalding contents
        (lawsuit)
      body: A product-liability lawsuit (Ulloa v. Instant Brands, Eastern District of Tennessee, filed
        July 21) names the Pro Crisp AF 8 specifically and alleges the lid could be rotated and opened
        while the unit remained pressurized, so the scalding contents were ejected onto the user, causing
        severe burn injuries.
      advice: Treat the lid lock as the critical safety part. If the lid can be turned or opened before
        pressure has fully released, stop using the unit immediately and do not attempt to open it under
        pressure; this is the failure mode the lawsuit says causes catastrophic burns.
    tr:
      title: Pro Crisp AF 8 basınçlı pişirme kapağı basınç altındayken açılabilir, haşlayıcı içeriği fırlatır
        (dava)
      body: Bir ürün sorumluluğu davası (Ulloa v. Instant Brands, Eastern District of Tennessee, 21 Temmuz'da
        açıldı) özellikle Pro Crisp AF 8'i adlandırıyor ve kapağın cihaz basınç altındayken döndürülüp
        açılabildiğini, böylece haşlayıcı içeriğin kullanıcıya fırlatıldığını ve ciddi yanık yaralanmalarına
        yol açtığını iddia ediyor.
      advice: Kapak kilidini kritik güvenlik parçası olarak değerlendirin. Basınç tamamen tahliye edilmeden
        önce kapak çevrilebiliyor veya açılabiliyorsa, cihazı hemen kullanmayı bırakın ve basınç altında
        açmaya çalışmayın; davanın felaket yanıklara yol açtığını söylediği arıza modu budur.
