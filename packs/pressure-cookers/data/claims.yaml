  text:
    en:
      title: Duo Nova 80 lid removable under pressure, ejecting scalding contents (court complaint)
      body: A U.S. federal court complaint (Case 3:24-cv-05232-TMC) names the Duo Nova 80 specifically
        and alleges the lid can be rotated and removed while the cooker still holds pressure, so scalding
        contents are ejected onto the user. The plaintiff reports burn injuries on September 24, 2020.
      advice: 'Treat the Duo Nova''s lid-locking claim with caution: the complaint alleges the lid can
        open under residual pressure despite the advertised safety features. If you own this model, never
        force the lid and only open it after the float valve has fully dropped.'
    tr:
      title: Duo Nova 80 kapağı basınç altında çıkarılabilir, kaynar içeriği dışarı fırlatır (mahkeme
        şikayeti)
      body: Bir ABD federal mahkeme şikayeti (Dava 3:24-cv-05232-TMC) özellikle Duo Nova 80'i adıyla belirtir
        ve pişirici hâlâ basınç tutarken kapağın döndürülüp çıkarılabildiğini, böylece kaynar içeriğin
        kullanıcının üzerine fırlatıldığını iddia eder. Davacı, 24 Eylül 2020'de yanık yaralanmaları bildirmiştir.
      advice: 'Duo Nova''nın kapak kilitleme iddiasına temkinli yaklaşın: şikayet, reklamı yapılan güvenlik
        özelliklerine rağmen kapağın kalan basınç altında açılabildiğini iddia eder. Bu modele sahipseniz
        kapağı asla zorlamayın ve yalnızca şamandıra valfi tamamen indikten sonra açın.'
