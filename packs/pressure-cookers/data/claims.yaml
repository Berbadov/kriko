        ünitesinde C7 hatası bildiriyor ve 'basınç valfinde bir sorun olduğuna yöneliyorum' diyor.
      advice: Bir Viva'da tekrarlayan C7 hatasına dair tek bir sahip raporu; sahip tarafından basınç valfine
        atfediliyor. C7, kılavuzda yeterli sıvı olmadığını veya hızlı tahliye düğmesinin Vent konumunda
        bırakıldığını gösterdiği şeklinde belgelenmiştir. Bu anekdot niteliğinde ve düşük ciddiyette,
