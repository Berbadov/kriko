  text:
    en:
      title: Instant Pot Smart/Smart-60 recalled for electric-shock hazard from thermal probe in base
      body: This finding came from the recall search. The U.S. CPSC and Health Canada jointly recalled
        the Instant Pot Smart and Smart-60 in July 2015 because the thermal probe in the base can conduct
        electricity through the cooker, posing an electric-shock risk. The recall covers serial numbers
        1410-1503 and manufacture dates 12/1/2014-6/1/2015; three consumers reported being shocked. A
        buyer should check the serial number on the label under the base; an affected unit should be stopped
        and the base replaced free.
      advice: If you own or are buying a Smart/Smart-60, check the serial number and manufacture date
        on the label under the base. Units in the 1410-1503 range are recalled for an electric-shock hazard
        and should not be used; contact Instant Pot for a free replacement base. The current Turkish-market
        'Akıllı Pişirici' (Smart Cooker) is a different, newer model and is not covered by this recall.
    tr:
      title: Instant Pot Smart/Smart-60, tabandaki termal prob kaynaklı elektrik çarpması tehlikesi nedeniyle
        geri çağrıldı
      body: Bu bulgu geri çağırma aramasından geldi. ABD CPSC ve Health Canada, tabandaki termal probun
        pişirici üzerinden elektrik iletebilmesi ve elektrik çarpması riski oluşturması nedeniyle Instant
        Pot Smart ve Smart-60'ı Temmuz 2015'te ortaklaşa geri çağırdı. Geri çağırma 1410-1503 seri numaralarını
        ve 12/1/2014-6/1/2015 üretim tarihlerini kapsıyor; üç tüketici elektrik çarpması bildirdi. Bir
        alıcı, tabanın altındaki etiketteki seri numarasını kontrol etmelidir; etkilenen bir ünite durdurulmalı
        ve tabanı ücretsiz olarak değiştirilmelidir.
      advice: Bir Smart/Smart-60'a sahipseniz veya satın alıyorsanız, tabanın altındaki etiketteki seri
        numarasını ve üretim tarihini kontrol edin. 1410-1503 aralığındaki üniteler elektrik çarpması
        tehlikesi nedeniyle geri çağrılmıştır ve kullanılmamalıdır; ücretsiz yedek taban için Instant
        Pot ile iletişime geçin. Mevcut Türkiye pazarındaki 'Akıllı Pişirici' (Smart Cooker) farklı, daha
        yeni bir modeldir ve bu geri çağırma kapsamına girmez.
