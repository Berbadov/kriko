  text:
    en:
      title: 'Smart-60 owner wiki: float valve steam leak and sealing ring wear'
      body: The iFixit Smart-60 troubleshooting wiki (this page is in Chinese) documents float-valve steam
        leaks from dirt on the float valve/anti-block shield and sealing-ring compression over time. Owner
        comments on the page also report C6L/C6H error codes.
      advice: Owner-reported failures on this model center on the float valve and sealing ring; cleaning
        the float valve and anti-block shield and periodically replacing the sealing ring are the recurring
        fixes. The page is a student-contributed wiki, so treat it as owner evidence rather than an official
        statement.
    tr:
      title: 'Smart-60 sahip wiki''si: şamandıra valfi buhar kaçağı ve sızdırmazlık halkası aşınması'
      body: iFixit Smart-60 sorun giderme wiki'si (bu sayfa Çince) şamandıra valfi/engelleme önleyici
        kalkan üzerindeki kirden kaynaklanan şamandıra valfi buhar kaçaklarını ve zamanla sızdırmazlık
        halkası sıkışmasını belgeliyor. Sayfadaki sahip yorumları ayrıca C6L/C6H hata kodlarını bildiriyor.
      advice: Bu modelde sahipler tarafından bildirilen arızalar şamandıra valfi ve sızdırmazlık halkası
        etrafında yoğunlaşıyor; şamandıra valfinin ve engelleme önleyici kalkanın temizlenmesi ve sızdırmazlık
        halkasının periyodik olarak değiştirilmesi tekrarlayan çözümler. Sayfa öğrenci katkısıyla oluşturulmuş
        bir wiki olduğundan, resmi bir açıklama yerine sahip kanıtı olarak değerlendirin.
