  text:
    en:
      title: Steam leaks from side of lid when the sealing ring is damaged, not installed properly, or
        the ring rack is warped
      body: The manufacturer's own Duo Plus troubleshooting manual lists steam leaking from the side of
        the lid as a documented fault, with causes including a damaged or mis-installed sealing ring,
        food debris on the ring, and a warped or off-centre sealing ring rack (which the manual says requires
        contacting Customer Care). This is the official failure mode behind the 'lid won't seal' complaint.
      advice: Steam escaping around the lid is the most common sealing failure on this model. It is usually
        the silicone sealing ring (a consumable that wears and absorbs odours) or a warped ring rack;
        the manual says a deformed rack means contacting service rather than a DIY fix. Budget for replacing
        the sealing ring over time.
    tr:
      title: Sızdırmazlık halkası hasarlıysa, düzgün takılmamışsa veya halka yatağı eğrilmişse kapaktan
        yanlardan buhar sızıyor
      body: Üreticinin kendi Duo Plus sorun giderme kılavuzu, kapağın yanından buhar sızmasını belgelenmiş
        bir arıza olarak listeliyor; nedenleri arasında hasarlı veya yanlış takılmış sızdırmazlık halkası,
        halka üzerindeki yemek artıkları ve eğrilmiş veya merkezden kaymış sızdırmazlık halkası yatağı
        (kılavuzun Müşteri Hizmetleri ile iletişime geçilmesini gerektirdiğini söylediği) yer alıyor.
        Bu, 'kapak sızdırmıyor' şikayetinin arkasındaki resmi arıza modudur.
      advice: Kapağın çevresinden buhar kaçması bu modelde en yaygın sızdırmazlık arızasıdır. Genellikle
        silikon sızdırmazlık halkası (aşınan ve kokuları emen bir sarf malzemesi) veya eğrilmiş bir halka
        yatağıdır; kılavuz, deforme olmuş bir yatağın kendin yap çözümü yerine servisle iletişime geçilmesi
        anlamına geldiğini söylüyor. Zamanla sızdırmazlık halkasını değiştirmek için bütçe ayırın.
