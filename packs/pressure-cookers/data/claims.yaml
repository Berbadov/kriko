      title: Duo Nova violent pressure release through lid seal scattered contents 15 feet (incident report)
      body: An incident report (No. 20260105-64920-2147324847) dated January 5, 2026 describes a Duo Nova
        violently expelling all internal pressure and contents through the lid seal, with debris scattered
        up to 15 feet and a gunshot-like sound. The report states no one was injured only because bystanders
        were about 30 feet away.
      advice: This documents a violent, uncontrolled pressure release through the lid seal on the Duo
        Nova. It is a recent (2026) incident and reinforces the burn/projectile hazard on this model.
    tr:
      title: Duo Nova kapak contasından şiddetli basınç tahliyesi içeriği 15 fit'e saçtı (olay raporu)
      body: 5 Ocak 2026 tarihli bir olay raporu (No. 20260105-64920-2147324847), bir Duo Nova'nın tüm
        iç basıncı ve içeriği kapak contasından şiddetle dışarı attığını, molozların 15 fit'e kadar saçıldığını
        ve silah sesine benzer bir ses duyulduğunu açıklıyor. Rapor, yalnızca çevredekilerin yaklaşık
        30 fit uzakta olması nedeniyle kimsenin yaralanmadığını belirtiyor.
      advice: Bu, Duo Nova'da kapak contasından şiddetli, kontrolsüz bir basınç tahliyesini belgeliyor.
        Bu yakın tarihli (2026) bir olaydır ve bu modeldeki yanık/mermi tehlikesini pekiştirmektedir.
