  text:
    en:
      title: 'FamilyFix Slide Pro base (Ref. 8065057110) voluntary recall: green visual indicator can
        show locked when car seat is not fully connected'
      body: This finding came from the seed query 'Maxi-Cosi FamilyFix Slide Pro recall safety' (UK regulator
        GOV.UK recall notice 2605-0109, published 28 May 2026).
      advice: If you own a FamilyFix Slide Pro base manufactured between 20 August 2025 and 24 March 2026,
        check the model reference and manufacturing date against Maxi-Cosi's online checker; affected
        bases are replaced free of charge. Until the replacement arrives, do not rely on the green indicator
        alone — manually verify the car seat is clicked in at front and back, or use the seat belt installation.
    tr:
      title: 'FamilyFix Slide Pro tabanının (Ref. 8065057110) gönüllü geri çağrılması: araç koltuğu tam
        olarak bağlı değilken yeşil görsel gösterge kilitli gösterebilir'
      body: Bu bulgu 'Maxi-Cosi FamilyFix Slide Pro recall safety' başlangıç sorgusundan elde edildi (Birleşik
        Krallık düzenleyicisi GOV.UK geri çağırma bildirimi 2605-0109, yayın tarihi 28 Mayıs 2026).
      advice: 20 Ağustos 2025 ile 24 Mart 2026 arasında üretilmiş bir FamilyFix Slide Pro tabanınız varsa,
        model referansını ve üretim tarihini Maxi-Cosi'nin çevrimiçi kontrol aracıyla kontrol edin; etkilenen
        tabanlar ücretsiz olarak değiştirilir. Yedek parça gelene kadar yalnızca yeşil göstergeye güvenmeyin
        — araç koltuğunun ön ve arka taraftan yerine oturduğunu manuel olarak doğrulayın veya emniyet
        kemeriyle montajı kullanın.
  evidence:
  - url: https://www.gov.uk/product-safety-alerts-reports-recalls/product-recall-maxi-cosi-family-fix-slide-pro-base-2605-0109
    quote: A visual indicator on the base may be disrupted if the car seat is not detached in the intended
      way. If this occurs, the indicator may not function as expected during the following installation.
      This may mean that although the indicator is green, the car seat might not be properly connected
      to the base.
