  text:
    en:
      title: Transport Canada recall 2025-055 — Cybex Aton G Swivel harness can loosen and detach (Canada)
      body: Transport Canada's official public notice (2025-P01 E) confirms the Canadian recall for Aton
        G Swivel models with specific article numbers (522004175, 522004177, 522004179, 522004181, 522004801,
        522004803), manufactured June 3, 2023 to May 10, 2024. 1,811 units sold in Canada.
      advice: If you have an Aton G Swivel with one of the listed article numbers, check the manufacture
        date. Cybex will mail registered owners a free repair kit. If you notice damaged hooks or a missing
        anchor pin, stop using the seat immediately.
    tr:
      title: Transport Canada geri çağırma 2025-055 — Cybex Aton G Swivel koşum takımı gevşeyebilir ve
        ayrılabilir (Kanada)
      body: Transport Canada'nın resmi kamu bildirimi (2025-P01 E), belirli ürün numaralarına (522004175,
        522004177, 522004179, 522004181, 522004801, 522004803) sahip ve 3 Haziran 2023 ile 10 Mayıs 2024
        arasında üretilen Aton G Swivel modelleri için Kanada geri çağırmasını doğrulamaktadır. Kanada'da
        1.811 adet satıldı.
      advice: Listelenen ürün numaralarından birine sahip bir Aton G Swivel'iniz varsa, üretim tarihini
        kontrol edin. Cybex, kayıtlı sahiplerine ücretsiz bir onarım kiti postayla gönderecektir. Hasarlı
        kancalar veya eksik bir sabitleme pimi fark ederseniz, koltuğu hemen kullanmayı durdurun.
  evidence:
  - url: https://tc.canada.ca/en/road-transportation/defects-recalls-vehicles-tires-child-car-seats/cybex-aton-g-swivel-car-seats-loose-detached-harness
