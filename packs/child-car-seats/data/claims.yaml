        (Aton G, Aton G SensorSafe, Aton G Swivel, Aton G Swivel SensorSafe, Eos seyahat sistemleri) ve
        ABD'de potansiyel olarak etkilenen 22.823 birimi listeliyor.
      advice: Koltuğunuzun üretim tarihini kontrol edin (koltuğun altında). 20 Şubat 2023 ile 10 Mayıs
        2024 arasına düşüyorsa, koltuk etkilenmiştir. Ücretsiz çözüm kiti için Cybex'i 877-242-5676 numarasından
        arayın.
