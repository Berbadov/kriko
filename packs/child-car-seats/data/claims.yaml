        models (Aton G, Aton G SensorSafe, Aton G Swivel, Aton G Swivel SensorSafe, Eos travel systems)
        and 22,823 potentially affected units in the US.
      advice: Check your seat's manufacture date (underneath the seat). If it falls between February 20,
        2023 and May 10, 2024, the seat is affected. Contact Cybex at 877-242-5676 for the free remedy
        kit.
