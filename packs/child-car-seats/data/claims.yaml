        aralığını (02/20/2023 – 05/10/2024) listeliyor.
      advice: Etkilenip etkilenmediğini kontrol etmek için koltuğunuzun etiketindeki model numarası önekini
        kullanın. 10 Mayıs 2024'ten önce üretilmiş 522001, 522003 veya 522004 ile başlayan model numaraları
