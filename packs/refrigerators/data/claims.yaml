    en:
      title: Freezer ice/frost builds up under the bottom drawer on Beko RCNA406I30W
      body: An owner of this exact model reports that after about a year, ice/frost starts accumulating
        under the bottom freezer drawer; it does not stop the fridge working but requires periodic manual
        cleaning of the frost. This matches the pack's ice/frost family concern (frost blocking the drain
        area), reported on this specific model code. Evidence is from a Ukrainian buyer of the same model;
        no Turkish-specific report was found.
      advice: Expect to periodically defrost/clean under the bottom freezer drawer even though the unit
        is No Frost; budget for this maintenance rather than assuming a fully self-defrosting freezer.
    tr:
      title: Beko RCNA406I30W alt çekmece altında buzlanma/kırağı birikiyor
      body: Bu modelin bir sahibi, yaklaşık bir yıl sonra alt dondurucu çekmecesinin altında buz/kırağı
        birikmeye başladığını bildiriyor; buzdolabının çalışmasını durdurmuyor ancak kırağının periyodik
        olarak elle temizlenmesini gerektiriyor. Bu, paketin buz/kırağı ailesi endişesiyle (kırağın drenaj
        alanını tıkaması) örtüşüyor ve bu özel model kodunda bildirilmiş. Kanıt aynı modeli satın alan
        bir Ukraynalı alıcıdan geliyor; Türkiye'ye özgü bir bildirim bulunamadı.
      advice: Ünite No Frost olsa bile alt dondurucu çekmecesinin altını periyodik olarak çözün/temizleyin;
        tamamen kendi kendine çözülen bir dondurucu varsaymak yerine bu bakım için bütçe ayırın.
