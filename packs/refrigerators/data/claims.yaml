  text:
    en:
      title: Fan motoru sekiz ayda bozuluyor
      body: Owner's 674533 MB started making noise in month ~6 and by month ~8 the fan motor (which pushes
        cold air) failed; service ordered a part without opening the unit. Owner notes Beko gives 10-year
        warranty on the main compressor but not the fan motor.
      advice: Expect the fan motor to be the first electrical part to fail (around 6–8 months). A noisy
        fan is the early sign; if it fails, cooling stops and food spoils. Check whether the fan motor
        is covered before relying on the compressor's 10-year warranty.
    tr:
      title: Fan motoru sekiz ayda bozuluyor
      body: Sahibin 674533 MB'si yaklaşık 6. ayda ses çıkarmaya başladı ve yaklaşık 8. ayda fan motoru
        (soğuk havayı iten) arızalandı; servis üniteyi açmadan bir parça sipariş etti. Sahip, Beko'nun
        ana kompresör için 10 yıl garanti verdiğini ancak fan motoru için vermediğini belirtiyor.
      advice: Fan motorunun arızalanacak ilk elektriksel parça olmasını bekleyin (yaklaşık 6–8 ay). Gürültülü
        fan erken işarettir; arızalanırsa soğutma durur ve yiyecek bozulur. Kompresörün 10 yıllık garantisine
        güvenmeden önce fan motorunun kapsam dahilinde olup olmadığını kontrol edin.
