      title: No-frost Beko B3RCNA364HXB stopped working after about one year (defrosted, red warning light)
      body: A Ukrainian owner review on the retailer Comfy.ua for the near-identical no-frost code B3RCNA364HXB
        (this subject's code is B3RCNA364HXB1) reports the fridge stopped working after exactly one year,
        defrosted, and showed a red warning light; Beko service could not name a cause and ordered a part.
        Model code differs by the final '1', so this is reported as a family-level claim, not an exact-model
        match.
      advice: 'Treat this as a no-frost-family reliability signal rather than a confirmed fault for this
        exact code: a failure around the one-year mark with a red warning light may require a service
        visit and a replacement part.'
    tr:
      title: Yaklaşık bir yıl sonra çalışmayı durduran no-frost Beko B3RCNA364HXB (çözüldü, kırmızı uyarı
        ışığı)
      body: Perakendeci Comfy.ua'da neredeyse aynı olan no-frost kodu B3RCNA364HXB (bu konunun kodu B3RCNA364HXB1)
        için bir Ukraynalı sahip incelemesi, buzdolabının tam olarak bir yıl sonra çalışmayı durdurduğunu,
        çözüldüğünü ve kırmızı bir uyarı ışığı gösterdiğini bildiriyor; Beko servisi bir neden belirleyemedi
        ve bir parça sipariş etti. Model kodu son '1' ile farklılık gösteriyor, bu nedenle bu, tam model
        eşleşmesi değil, aile düzeyinde bir iddia olarak bildirilmektedir.
      advice: 'Bunu bu tam kod için doğrulanmış bir arıza yerine no-frost ailesi güvenilirlik sinyali
        olarak değerlendirin: bir yıl civarında kırmızı uyarı ışığıyla birlikte bir arıza, servis ziyareti
