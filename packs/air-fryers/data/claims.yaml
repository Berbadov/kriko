  text:
    en:
      title: Large basket stops cooking and beeps days after purchase — basket sensor suspected
      body: A certified owner reports the large 6L compartment stopped cooking and beeps only days after
        purchase while the small basket works; a reply attributes it to a defective basket sensor (capteur
        de bac).
      advice: If the large basket beeps and refuses to cook, first check the basket is fully seated; if
        it persists, this points to a sensor/control fault that will need a warranty service call rather
        than a user fix. It failed within days of purchase, so it is covered by the 2-year warranty —
        do not try to repair it yourself.
    tr:
      title: Büyük sepet satın alımdan günler sonra pişirmeyi durduruyor ve bip sesi veriyor — sepet sensöründen
        şüpheleniliyor
      body: Sertifikalı bir sahip, büyük 6L bölmenin satın alımdan sadece günler sonra pişirmeyi durdurduğunu
        ve bip sesi verdiğini, küçük sepetin ise çalıştığını bildiriyor; bir yanıt bunu arızalı bir sepet
        sensörüne (capteur de bac) bağlıyor.
      advice: Büyük sepet bip sesi verip pişirmeyi reddederse, önce sepetin tam oturduğunu kontrol edin;
        sorun devam ederse bu, kullanıcı müdahalesi yerine garanti servis çağrısı gerektirecek bir sensör/kontrol
        arızasına işaret eder. Satın alımdan günler sonra arızalandı, yani 2 yıllık garanti kapsamındadır
        — kendiniz tamir etmeye çalışmayın.
