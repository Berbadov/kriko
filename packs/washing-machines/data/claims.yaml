      title: Makine ilk kullanımdan itibaren çamaşırları yırtıyor, kesiyor ve deliyor (WGK252Z0TR)
      body: 'Şikayetvar''da sahip şikayeti (''Bosch WGK252Z0TR şikayet'' sorgusu): makine ilk yıkamadan
        itibaren 30°C ve 400 rpm sıkma devrinde bile kıyafetleri yırttı, kesti ve deldi; sahibi, satıcının
        iade talebini reddettiğini bildiriyor.'
      advice: Bu modeli alırsanız, kumaş hasarını kontrol etmek için ilk birkaç yükü ucuz veya feda edilebilir
        bir yükle test edin; ilk günden kıyafetlere zarar veren bir makine iade/değişim için güçlü bir
