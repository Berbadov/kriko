    en:
      title: Door gasket spring detaches and machine leaks water during wash (WGK252Z0TR)
      body: 'Owner complaint on Şikayetvar (query ''Bosch WGK252Z0TR sorun''): within the first month
        the spring inside the door gasket came out; after the gasket was replaced the machine began throwing
        clean (non-detergent) water out during wash on various programs. The owner reports the issue persisted
        unresolved for 9 months across multiple service visits, with service calling it normal.'
      advice: Before buying, check the door seal fit and ask whether gasket/spring detachment is a known
        issue on this model; if it occurs in warranty, push for a documented repair or replacement rather
        than accepting a 'normal' verdict.
    tr:
      title: Kapı contası yayı çıkıyor ve makine yıkama sırasında su sızdırıyor (WGK252Z0TR)
      body: 'Şikayetvar''da kullanıcı şikayeti (''Bosch WGK252Z0TR sorun'' sorgusu): ilk ay içinde kapı
        contasının içindeki yay çıktı; conta değiştirildikten sonra makine çeşitli programlarda yıkama
        sırasında temiz (deterjansız) suyu dışarı atmaya başladı. Kullanıcı, sorunun birden fazla servis
        ziyaretine rağmen 9 ay boyunca çözülmeden devam ettiğini ve servisin bunu normal olarak nitelendirdiğini
        bildiriyor.'
      advice: Satın almadan önce kapı contasının oturuşunu kontrol edin ve bu modelde conta/yay ayrılmasının
        bilinen bir sorun olup olmadığını sorun; garanti kapsamında ortaya çıkarsa 'normal' değerlendirmesini
        kabul etmek yerine belgelenmiş bir onarım veya değişim talep edin.
