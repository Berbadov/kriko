  text:
    en:
      title: Flashing custom firmware bricks Ender 3 S1 to splash screen
      body: On the Ender 3 S1 (STM32F4 SoC), flashing a custom firmware build left the printer stuck on
        the Creality splash screen; recovery required downgrading to an older Creality build first. This
        is a variant-specific brick path, not the original Ender 3's 8-bit board.
      advice: On Ender 3 S1/V2-style STM32F4 boards, a failed custom-firmware flash can leave the machine
        bricked on the splash screen; keep the official firmware image on an SD card to recover before
        re-flashing.
    tr:
      title: Özel firmware yüklemek Ender 3 S1'i açılış ekranında tuğlaya çeviriyor
      body: Ender 3 S1'de (STM32F4 SoC), özel bir firmware derlemesi yüklemek yazıcıyı Creality açılış
        ekranında takılı bıraktı; kurtarma, önce daha eski bir Creality derlemesine düşürmeyi gerektirdi.
        Bu, orijinal Ender 3'ün 8 bitlik kartı değil, varyanta özgü bir tuğlalama yoludur.
      advice: Ender 3 S1/V2 tarzı STM32F4 kartlarında, başarısız bir özel firmware yüklemesi makineyi
        açılış ekranında tuğlaya çevirebilir; yeniden yüklemeden önce kurtarmak için resmi firmware imajını
        bir SD kartta bulundurun.
