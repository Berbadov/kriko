    en:
      title: K1 head PCB (nozzle board) failure stops extrusion mid-print
      body: An owner reports the K1 stops extruding mid-print at the same height; replacing the hotend
        and extruder motor did not help, and the fix was replacing the head PCB. This is a first-hand
        owner account on a French 3D printing forum.
      advice: If a K1 stops extruding mid-print at a consistent height and a hotend swap does not fix
        it, suspect the nozzle/head board rather than a clog. This is a board-level electrical failure,
        not a user-tunable setting.
    tr:
      title: K1 kafa PCB'si (nozul kartı) arızası baskı ortasında ekstrüzyonu durduruyor
      body: Bir sahip, K1'in baskı ortasında aynı yükseklikte ekstrüzyonu durdurduğunu bildiriyor; hotend
        ve ekstrüder motorunu değiştirmek yardımcı olmadı ve çözüm kafa PCB'sini değiştirmek oldu. Bu,
        bir Fransız 3D baskı forumunda bir sahibin birinci elden anlatımıdır.
      advice: Bir K1 tutarlı bir yükseklikte baskı ortasında ekstrüzyonu durdurursa ve hotend değişimi
        bunu düzeltmezse, tıkanıklık yerine nozul/kafa kartından şüphelenin. Bu, kullanıcının ayarlayabileceği
        bir ayar değil, kart düzeyinde bir elektriksel arızadır.
