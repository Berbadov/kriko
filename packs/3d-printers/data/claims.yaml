      body: Anycubic's official wiki documents error 11519, a filament tangle/jam detection. The wiki
        notes that filament that is too thin can cause the extruder gear to fail to advance it, and that
        filament can get stuck in the gears or the buffer mechanism, requiring disassembly of the extruder
        or buffer to extract. This is a known failure mode on the Kobra 3 Combo.
      advice: Use quality filament of consistent diameter; undersized filament can trigger error 11519.
        If filament jams in the gears or buffer, recovery requires disassembling the extruder cover or
        buffer mechanism with hex wrenches.
    tr:
      title: 'Kobra 3 hata 11519: ekstrüder dişlilerinde veya tampon mekanizmasında filaman dolaşması/sıkışması'
      body: Anycubic'in resmi wiki'si, filaman dolaşması/sıkışması algılaması olan hata 11519'u belgeliyor.
        Wiki, çok ince filamanın ekstrüder dişlisinin onu ilerletememesine neden olabileceğini ve filamanın
        dişlilerde veya tampon mekanizmasında sıkışabileceğini, çıkarmak için ekstrüderin veya tamponun
        sökülmesi gerektiğini belirtiyor. Bu, Kobra 3 Combo'da bilinen bir arıza modudur.
      advice: Tutarlı çapta kaliteli filaman kullanın; küçük çaplı filaman hata 11519'u tetikleyebilir.
