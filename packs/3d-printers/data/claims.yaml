        cause. This is a safety shutdown that halts printing. This came from the ''Elegoo Neptune 4 Max
        error code'' search.'
      advice: If this error appears, first re-seat the sensor cable and check for bent pins (2.0mm Allen
        key needed). If the issue persists, the thermal sensor likely needs replacement. A damaged sensor
        can cause unsafe temperature readings, so do not ignore it.
