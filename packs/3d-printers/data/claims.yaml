    en:
      title: Hotend nozzle and heat block clog repeatedly on Ender 3 V3 KE
      body: A new owner reports the nozzle and heating block clogging repeatedly within days, even after
        replacing the nozzle and purging; forum replies point to heatbreak cooling and hot-tightening
        of the nozzle as the cause.
      advice: Expect to clear nozzle clogs and check the heatbreak fan and hot-tightening of the nozzle
        early on; a clogged hotend stops extrusion entirely and costs time and replacement nozzles.
    tr:
      title: Ender 3 V3 KE'de hotend nozulu ve ısı bloğu tekrar tekrar tıkanıyor
      body: Yeni bir sahip, nozulu değiştirip temizledikten sonra bile nozul ve ısıtma bloğunun günler
        içinde tekrar tekrar tıkandığını bildiriyor; forum yanıtları neden olarak heatbreak soğutmasına
        ve nozulun sıcak sıkılmasına işaret ediyor.
      advice: Başlangıçta nozul tıkanıklıklarını açmayı ve heatbreak fanını ve nozulun sıcak sıkılmasını
        kontrol etmeyi bekleyin; tıkanmış bir hotend ekstrüzyonu tamamen durdurur ve zaman ile yedek nozul
        maliyeti getirir.
