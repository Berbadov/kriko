        önce, yazıcı kapatıldığında Z-offset ayarlarını kaybediyor ve zayıf ilk katmanlara neden oluyordu.
        İnceleyen kişi yeniden seviyelendirmeyi unuttuğunda, nozul çevresinde bir 'ölüm yumağı' oluştu,
        hotend'i tamamen tıkadı ve tam ekstrüder değişimi gerektirdi (Elegoo garanti kapsamında yeni bir
        tane gönderdi).
      advice: Z-offset kaybı sorunu ürün yazılımıyla ilgiliydi ve bildirildiğine göre güncellemeyle düzeltildi.
