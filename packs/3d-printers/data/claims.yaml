        hatasını tekrar tekrar verdi. ACE Pro ve ekstrüderin temizlenmesi sorunu gidermedi; başlık, hotend''in
        kontrol edilmesine işaret ediyor. Bu, Anycubic''in resmi 11518 ''Filament clogging detected''
        hata sayfasıyla örtüşüyor.'
      advice: Hata 11518 (filament tıkanması), ACE Pro ve ekstrüder temizlendikten sonra da devam edebilen,
        bazen hotend denetimi gerektiren belgelenmiş, tekrarlayan bir arızadır. Çok renkli baskı yapıyorsanız
