      title: Ender 3 V3 KE'de katman kayması (gevşek kayış, gevşek ekstrüder kiti)
      body: Creality'nin resmi Japonca sorun giderme kılavuzu, katman kaymasını bilinen bir sorun olarak
        listeliyor; belirtilen nedenler arasında gevşek kayışlar ve gevşek ekstrüder kiti yer alıyor.
      advice: Katman kayması bir kusur değil, bir bakım kalemidir (kayış gerginliği, ekstrüder montaj
        vidaları); büyük baskılarda ortaya çıkar ve sıkılarak düzeltilebilir.
