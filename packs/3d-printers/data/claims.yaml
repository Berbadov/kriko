  text:
    en:
      title: Z-offset not saved causes failed first layers and blob of death
      body: Verified buyer review on 3DJake (German). The printer starts too high despite leveling, parts
        don't adhere, and during unattended printing the print head gets covered in a large blob of PLA.
        The user also reports a firmware error preventing nozzle heating for cleanup, forcing full disassembly
        after only 3 prints.
      advice: Z-offset reliability is a known weak point. Verify first-layer adhesion on every print and
        don't leave long prints unattended until you've confirmed the offset holds. A blob of death can
        destroy the hotend assembly.
    tr:
      title: Z-offset kaydedilmediği için başarısız ilk katmanlar ve blob of death
      body: 3DJake'te (Almanca) doğrulanmış alıcı incelemesi. Yazıcı seviyelemesine rağmen çok yüksekten
        başlıyor, parçalar yapışmıyor ve gözetimsiz baskı sırasında baskı kafası büyük bir PLA blob of
        death ile kaplanıyor. Kullanıcı ayrıca temizlik için nozul ısıtmasını engelleyen bir firmware
        hatası bildiriyor ve bu da yalnızca 3 baskıdan sonra tam sökme işlemini zorunlu kılıyor.
      advice: Z-offset güvenilirliği bilinen bir zayıf noktadır. Her baskıda ilk katman yapışmasını doğrulayın
        ve offsetin korunduğunu teyit edene kadar uzun baskıları gözetimsiz bırakmayın. Bir blob of death
        hotend düzeneğini yok edebilir.
