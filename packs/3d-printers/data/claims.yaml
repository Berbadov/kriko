      title: A1 series extruder accumulates filament debris and dust, causing gear jamming or stall
      body: Bambu Lab's official Chinese wiki states that after long use, the A1 series extruder assembly
        can retain filament debris and dust, causing the extruder gear to jam or stop turning; the guide
        provides disassembly and deep-cleaning steps.
      advice: The extruder gear can jam from accumulated debris over time. Bambu Lab's own maintenance
        guide requires disassembling the extruder front cover and idler assembly to clean it, which is
        a non-trivial repair for an owner.
    tr:
      title: A1 serisi ekstrüder, dişli sıkışmasına veya durmasına neden olan filament kalıntısı ve toz
        biriktiriyor
