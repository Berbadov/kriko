  text:
    en:
      title: Nozzle temperature runaway to 300°C+ after hotend replacement
      body: French owner forum thread. After replacing the extruder kit, the nozzle temperature climbed
        uncontrolled past 300°C until firmware faulted and smoke escaped from the ceramic plate. A forum
        reply notes the thermistor may be short-circuited. This is a thermal runaway scenario with fire
        risk.
      advice: If you replace the hotend, verify the thermistor reads correctly before powering on. An
        uncontrolled temperature climb past 300°C indicates a shorted thermistor or heater fault — power
        off immediately.
    tr:
      title: Hotend değişiminden sonra nozul sıcaklığı 300°C+ üzerine kontrolsüz yükseliyor
      body: Fransız sahip forumu konusu. Ekstrüder kitini değiştirdikten sonra nozul sıcaklığı, firmware
        hata verip seramik plakadan duman çıkana kadar 300°C'nin üzerine kontrolsüz şekilde tırmandı.
        Bir forum yanıtı termistörün kısa devre yapmış olabileceğini belirtiyor. Bu, yangın riski taşıyan
        bir termal kaçak senaryosudur.
      advice: Hotend'i değiştirirseniz, gücü açmadan önce termistörün doğru okuduğunu doğrulayın. 300°C'nin
        üzerine kontrolsüz sıcaklık tırmanışı, kısa devre yapmış bir termistör veya ısıtıcı arızasına
        işaret eder — hemen gücü kapatın.
