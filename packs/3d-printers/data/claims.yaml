  text:
    en:
      title: Firmware updated via Fluidd bricks the Neptune 4 series printer
      body: Elegoo's own wiki documents that updating firmware via Fluidd (rather than the official fix-pack
        procedure) is incompatible with the customized Klipper build and bricks the printer. Recovery
        requires an eMMC adapter, USB drive, and TF card — significant technical effort for a non-technical
        owner. This came from the 'Elegoo Neptune 4 Max error code' search.
      advice: Never update Neptune 4 series firmware via Fluidd. Use only Elegoo's official fix-pack +
        motherboard/screen firmware procedure, in the correct order (fix pack first, then motherboard,
        then screen).
    tr:
      title: Fluidd üzerinden güncellenen firmware, Neptune 4 serisi yazıcıyı tuğlaya çeviriyor
      body: Elegoo'nun kendi wiki'si, firmware'i Fluidd üzerinden güncellemenin (resmi fix-pack prosedürü
        yerine) özelleştirilmiş Klipper yapısıyla uyumsuz olduğunu ve yazıcıyı tuğlaya çevirdiğini belgeliyor.
        Kurtarma için bir eMMC adaptörü, USB sürücü ve TF kart gerekir — teknik olmayan bir sahip için
        önemli teknik çaba. Bu, 'Elegoo Neptune 4 Max error code' aramasından geldi.
      advice: Neptune 4 serisi firmware'i asla Fluidd üzerinden güncellemeyin. Yalnızca Elegoo'nun resmi
        fix-pack + anakart/ekran firmware prosedürünü doğru sırayla kullanın (önce fix pack, sonra anakart,
        sonra ekran).
  evidence:
  - url: http://wiki.elegoo.com/neptune/neptune-4-series-option-serial-insection-mcumustbespecified
