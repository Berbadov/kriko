    en:
      title: Firmware upgrade on A1/A1 mini fails due to TH board mismatch, network, or SD card issues
      body: Bambu Lab's official wiki documents that firmware upgrades on the A1/A1 mini fail from TH
        board hardware version mismatch, network/cloud connection problems, insufficient SD card space,
        cross-version upgrade incompatibility, unplugged TH signal cable, or mainboard/TH board hardware
        failure.
      advice: Firmware updates can fail and leave the printer in a bad state. Before updating, ensure
        the TH board is compatible, SD card has space, and the network is stable; if an upgrade fails
        after replacing the TH board, the hardware version may be incompatible with the firmware.
    tr:
      title: A1/A1 mini'de yazılım yükseltmesi TH kartı uyuşmazlığı, ağ veya SD kart sorunları nedeniyle
        başarısız oluyor
      body: Bambu Lab'in resmi wiki'si, A1/A1 mini'de yazılım yükseltmelerinin TH kartı donanım sürümü
        uyuşmazlığı, ağ/bulut bağlantı sorunları, yetersiz SD kart alanı, sürümler arası yükseltme uyumsuzluğu,
        takılı olmayan TH sinyal kablosu veya ana kart/TH kartı donanım arızası nedeniyle başarısız olduğunu
        belgeliyor.
      advice: Yazılım güncellemeleri başarısız olabilir ve yazıcıyı kötü bir durumda bırakabilir. Güncellemeden
        önce TH kartının uyumlu olduğundan, SD kartta alan bulunduğundan ve ağın kararlı olduğundan emin
        olun; TH kartını değiştirdikten sonra bir yükseltme başarısız olursa, donanım sürümü yazılımla
        uyumsuz olabilir.
