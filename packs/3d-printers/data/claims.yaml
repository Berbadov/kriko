  text:
    en:
      title: 'A1 Mini and P1S suddenly fail together: poor adhesion, clogged nozzle, spaghetti, filament
        slipping'
      body: 'A German owner reports both an A1 Mini and a P1S suddenly stopped producing good prints after
        about half a year: filament barely adheres, the nozzle clogs, prints become spaghetti, and filament
        slips through. Even after disassembly, cleaning, cold pulls, and new hotends, the A1 Mini scrapes
        too close over the plate.'
      advice: The A1 Mini can develop combined extrusion and first-layer failures that resist cleaning
        and new hotends. The owner's fixes (disassembly, cold pull, new hotends) did not resolve the scraping-over-plate
        problem.
    tr:
      title: 'A1 Mini ve P1S aniden birlikte başarısız oluyor: zayıf yapışma, tıkanmış nozul, spaghetti,
        filaman kayması'
      body: 'Bir Alman sahip, hem bir A1 Mini''nin hem de bir P1S''in yaklaşık yarım yıl sonra aniden
        iyi baskı üretmeyi bıraktığını bildiriyor: filaman zar zor yapışıyor, nozul tıkanıyor, baskılar
        spaghetti''ye dönüşüyor ve filaman kayıyor. Sökme, temizleme, cold pull ve yeni hotend''lerden
        sonra bile A1 Mini plakanın üzerinde çok yakın sıyırıyor.'
      advice: A1 Mini, temizliğe ve yeni hotend'lere direnen birleşik ekstrüzyon ve ilk katman arızaları
        geliştirebilir. Sahibinin düzeltmeleri (sökme, cold pull, yeni hotend'ler) plakanın üzerinde sıyırma
        sorununu çözmedi.
