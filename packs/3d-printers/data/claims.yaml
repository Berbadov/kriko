      body: A French owner reports a layer offset of 0.2mm appearing after ~1500 hours of printing on
        their Kobra 3, constant around the part and starting at a certain height. The user tested multiple
        slicer versions, replaced the hotend with a ceramic one, and reset the printer, but the issue
        persisted until changing wall order in the slicer. This suggests mechanical wear or Z-axis issues
        after extended use.
      advice: After heavy use (~1500h), layer shifting can appear. The owner found partial mitigation
        by changing wall print order in the slicer. If you buy used or plan long-term use, budget for
        mechanical wear on the Z-axis or print head.
    tr:
      title: Kobra 3'te yaklaşık 1500 saatlik baskıdan sonra katman kayması (sahip raporu)
      body: Fransız bir sahip, Kobra 3'ünde yaklaşık 1500 saatlik baskıdan sonra parçanın çevresinde sabit
        ve belirli bir yükseklikten başlayan 0,2 mm'lik bir katman kayması ortaya çıktığını bildiriyor.
        Kullanıcı birden fazla dilimleyici sürümünü test etmiş, hotend'i seramik olanla değiştirmiş ve
        yazıcıyı sıfırlamış, ancak sorun dilimleyicide duvar sırasını değiştirene kadar devam etmiş. Bu,
        uzun kullanımdan sonra mekanik aşınma veya Z ekseni sorunlarına işaret ediyor.
      advice: Yoğun kullanımdan (~1500 saat) sonra katman kayması ortaya çıkabilir. Sahip, dilimleyicide
        duvar baskı sırasını değiştirerek kısmi bir hafifletme bulmuş. İkinci el alırsanız veya uzun vadeli
