  text:
    en:
      title: Stock Bowden extruder motor skips and clogs on Ender 3
      body: Polymaker's wiki describes the stock original Ender 3's non-geared Bowden extruder as prone
        to motor skips (clicking) and under-extrusion because the stepper lacks torque; the plastic extruder
        also cannot have its tension adjusted.
      advice: Expect extruder clicking and clogs on the stock Ender 3 extruder; a geared or direct-drive
        extruder upgrade is the standard fix, and print speeds should be kept low (about 40 mm/s with
        a 0.4 mm nozzle).
    tr:
      title: Stok Bowden ekstrüder motoru Ender 3'te atlıyor ve tıkanıyor
      body: Polymaker'ın wiki'si, stok orijinal Ender 3'ün dişlisiz Bowden ekstrüderini, step motorun
        torku olmadığı için motor atlamasına (tıklama) ve yetersiz ekstrüzyona yatkın olarak tanımlıyor;
        plastik ekstrüderin gerginliği de ayarlanamıyor.
      advice: Stok Ender 3 ekstrüderinde ekstrüder tıklaması ve tıkanıklıklar bekleyin; dişli veya doğrudan
        tahrikli ekstrüder yükseltmesi standart çözümdür ve baskı hızları düşük tutulmalıdır (0,4 mm nozul
        ile yaklaşık 40 mm/s).
  evidence:
  - url: https://wiki.polymaker.com/printing-tips/common-printing-issues/extruder-motor-skipping-nozzle-clogs
    quote: If you are using a non-geared extruder, especially one set up in a Bowden fashion – such as
      a stock original Ender 3, it is likely you will eventually run into extruder motor skips, where
      you hear a clicking noise coming out of your extruder.
