        Z-offset settings on power-off, causing poor first layers. When the reviewer forgot to re-level,
        a 'blob of death' formed around the nozzle, completely clogging the hotend and requiring a full
        extruder replacement (Elegoo sent a new one under warranty).
      advice: The Z-offset loss issue was firmware-related and reportedly fixed by updating. But if you
        see poor first-layer adhesion, fix it before it becomes a blob of death — a full extruder replacement
        is the cost of ignoring it.
    tr:
