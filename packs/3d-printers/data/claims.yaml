      body: Creality's official Japanese troubleshooting guide lists layer shifting as a known issue,
        with loose belts and a loose extruder kit among the named causes.
      advice: Layer shifting is a maintenance item (belt tension, extruder mounting screws) rather than
        a defect; it shows up on large prints and is fixable by tightening.
