        hatasının büyük olasılıkla hasarlı bir termal sensörden kaynaklandığını, ikincil nedenin bükülmüş
        kablo pimleri olduğunu belirtiyor. Bu, baskıyı durduran bir güvenlik kapanmasıdır. Bu, ''Elegoo
        Neptune 4 Max error code'' aramasından geldi.'
      advice: Bu hata ortaya çıkarsa, önce sensör kablosunu yeniden takın ve bükülmüş pim olup olmadığını
        kontrol edin (2.0mm alyan anahtar gerekir). Sorun devam ederse, termal sensörün büyük olasılıkla
