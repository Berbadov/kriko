  text:
    en:
      title: Wrong firmware version for the C13/C14 board revision bricks the Ender 3 V3 SE
      body: 'Community firmware documentation (query: ''Creality Ender 3 V3 SE firmware update bricked'').
        The Ender 3 V3 SE ships with two incompatible mainboard revisions (C13/STM32F103 and C14/STM32F401)
        that need different firmware files and folder layouts; flashing the wrong one causes boot failure
        or a black/unresponsive screen.'
      advice: Before any firmware update, identify whether the board is C13 or C14 (via the silkscreen
        or the About screen), because installing the wrong firmware can brick the printer into a black
        screen.
    tr:
      title: C13/C14 kart revizyonu için yanlış firmware sürümü Ender 3 V3 SE'yi tuğlaya çeviriyor
      body: 'Topluluk firmware belgeleri (sorgu: ''Creality Ender 3 V3 SE firmware update bricked'').
        Ender 3 V3 SE, farklı firmware dosyaları ve klasör düzenleri gerektiren iki uyumsuz anakart revizyonuyla
        (C13/STM32F103 ve C14/STM32F401) gelir; yanlış olanı yüklemek önyükleme hatasına veya siyah/tepkisiz
        bir ekrana neden olur.'
      advice: Herhangi bir firmware güncellemesinden önce kartın C13 mü C14 mü olduğunu belirleyin (serigrafi
        veya Hakkında ekranı aracılığıyla), çünkü yanlış firmware yüklemek yazıcıyı siyah ekrana düşürerek
        tuğlaya çevirebilir.
