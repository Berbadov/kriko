      body: From Elegoo's official wiki. The Neptune 4 series uses a customized Klipper build; updating
        firmware via Fluidd (rather than Elegoo's official method) is incompatible and can brick the printer.
        Recovery requires an eMMC adapter and fix pack flashing.
