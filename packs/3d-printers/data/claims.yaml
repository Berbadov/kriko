      title: Filament snaps and jams inside the Neptune 4 extruder gear, hard to clear
      body: A French repair-forum thread describes filament snapping inside the extruder's toothed-wheel
        mechanism, leaving a stuck piece that is hard to remove because the gear does not easily disassemble;
        the user had to pry the gear off with a flat screwdriver.
      advice: If filament jams inside the extruder, the toothed gear may need to be pried off to clear
        it; the assembly is not designed for easy cleaning. This is a moderate, owner-reported maintenance
        headache.
    tr:
      title: Filaman Neptune 4 ekstrüder dişlisinin içinde kırılıp sıkışıyor, temizlenmesi zor
      body: Bir Fransız onarım forumu başlığı, filamanın ekstrüderin dişli çark mekanizmasının içinde
        kırılarak sıkışmış bir parça bıraktığını ve dişli kolayca sökülmediği için bunun çıkarılmasının
        zor olduğunu anlatıyor; kullanıcı dişliyi düz bir tornavidayla kanırtarak çıkarmak zorunda kalmış.
      advice: Filaman ekstrüderin içinde sıkışırsa, temizlemek için dişli çarkın kanırtılarak çıkarılması
        gerekebilir; düzenek kolay temizlik için tasarlanmamıştır. Bu, sahibi tarafından bildirilen orta
