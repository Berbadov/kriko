    en:
      title: Worn extruder gear slips under load and combines with a partial nozzle clog
      body: 'Repair-record case study (query: ''Creality Ender 3 V3 SE extruder clog''). A repairer diagnosed
        a worn extruder gear slipping under load combined with a partial nozzle clog, and fixed it by
        replacing the gear, cleaning the hotend and recalibrating E-steps.'
      advice: The extruder gear is a wear item; a partially clogged nozzle increases load and accelerates
        gear wear, so a printer that stops extruding may need the gear replaced, not just the nozzle cleared.
    tr:
      title: Aşınmış ekstrüder dişlisi yük altında kayıyor ve kısmi nozul tıkanıklığıyla birleşiyor
      body: 'Onarım kaydı vaka çalışması (sorgu: ''Creality Ender 3 V3 SE extruder clog''). Bir tamirci,
        yük altında kayan aşınmış bir ekstrüder dişlisinin kısmi nozul tıkanıklığıyla birleştiğini teşhis
        etti ve dişliyi değiştirip hotend''i temizleyerek ve E-adımlarını yeniden kalibre ederek düzeltti.'
      advice: Ekstrüder dişlisi bir aşınma parçasıdır; kısmen tıkanmış bir nozul yükü artırır ve dişli
        aşınmasını hızlandırır, bu nedenle ekstrüzyonu duran bir yazıcıda sadece nozulun temizlenmesi
        değil, dişlinin de değiştirilmesi gerekebilir.
