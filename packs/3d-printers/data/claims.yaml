        kalıntısı ve toz tutabileceğini, bunun da ekstrüder dişlisinin sıkışmasına veya dönmeyi durdurmasına
        neden olabileceğini belirtiyor; kılavuz sökme ve derin temizleme adımlarını sunuyor.
      advice: Ekstrüder dişlisi zamanla biriken kalıntı nedeniyle sıkışabilir. Bambu Lab'in kendi bakım
        kılavuzu, temizlemek için ekstrüder ön kapağının ve avara düzeneğinin sökülmesini gerektiriyor;
        bu, bir sahip için önemsiz olmayan bir onarımdır.
