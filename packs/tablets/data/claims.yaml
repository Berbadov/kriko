  text:
    en:
      title: Touchscreen digitizer failure makes typing and scrolling unusable until restart
      body: From a Galaxus (EU retailer) Q&A thread on the Redmi Pad SE 11" 128GB. An owner describes
        the screen registering phantom repeated keystrokes and rapid taps while scrolling; only a restart
        temporarily fixes it and the problem recurs regularly. The owner suspects the digitizer. This
        is a hardware fault that makes the tablet hard to use and typically needs a screen/digitizer replacement.
      advice: Test the touchscreen thoroughly during the return window; if ghost input appears, claim
        warranty rather than paying for a digitizer swap.
    tr:
      title: Dokunmatik ekran dijitalleştiricisi arızası, yeniden başlatılana kadar yazmayı ve kaydırmayı
        kullanılamaz hale getiriyor
      body: Galaxus (AB perakendecisi) Redmi Pad SE 11" 128GB hakkındaki Soru-Cevap başlığından. Bir sahip,
        ekranın kaydırma sırasında hayalet tekrarlanan tuş vuruşları ve hızlı dokunuşlar kaydettiğini
        anlatıyor; yalnızca yeniden başlatma bunu geçici olarak düzeltiyor ve sorun düzenli olarak tekrarlıyor.
        Sahip dijitalleştiriciden şüpheleniyor. Bu, tabletin kullanımını zorlaştıran ve genellikle ekran/dijitalleştirici
        değişimi gerektiren bir donanım arızasıdır.
      advice: İade süresi içinde dokunmatik ekranı iyice test edin; hayalet giriş görülürse dijitalleştirici
        değişimi için ödeme yapmak yerine garanti talep edin.
