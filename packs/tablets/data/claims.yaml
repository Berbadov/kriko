      title: Galaxy Tab A7 Lite repaired three times under warranty with the same fault persisting
      body: A Spanish consumer complaint (OCU register, EU market) states the tablet was defective within
        the legal warranty period and, despite being repaired three times, presented the same fault each
        time.
      advice: A recurring fault that survives three repairs points to a systemic issue rather than a one-off;
        keep all repair paperwork and push for replacement or refund under EU warranty rules.
    tr:
      title: Galaxy Tab A7 Lite garantide üç kez onarıldı, aynı arıza sürüyor
      body: Bir İspanyol tüketici şikâyeti (OCU kaydı, AB pazarı), tabletin yasal garanti süresi içinde
        arızalı olduğunu ve üç kez onarılmasına rağmen her seferinde aynı arızayı gösterdiğini belirtiyor.
      advice: Üç onarımdan sonra da süren tekrarlayan bir arıza, tek seferlik bir sorun yerine sistemik
        bir soruna işaret eder; tüm onarım belgelerini saklayın ve AB garanti kuralları kapsamında değişim
        veya iade için ısrar edin.
