  text:
    en:
      title: Repeated charging failure, service cannot resolve it
      body: An owner reports the A9 stops charging and was sent to authorized service 3–4 times, with
        the service returning it saying 'no problem' while the fault persists. A second complaint on the
        same site says the charging port was only blocked with dirt and cost 100 TL to fix, while an authorized
        service quoted ~5000 TL for a case swap.
      advice: Charging faults are common and service outcomes vary widely; before paying for a costly
        repair, have a second service check the port for debris. A tablet that repeatedly fails to charge
        is a real cost to discover.
    tr:
      title: Tekrarlanan şarj arızası, servis çözemiyor
      body: Bir sahip, A9'un şarj olmayı kestiğini ve 3–4 kez yetkili servise gönderildiğini, servisin
        arıza devam ederken 'sorun yok' diyerek geri gönderdiğini bildiriyor. Aynı sitedeki ikinci bir
        şikayet, şarj portunun yalnızca kirle tıkandığını ve düzeltmenin 100 TL tuttuğunu, yetkili servisin
        ise kasa değişimi için ~5000 TL fiyat verdiğini söylüyor.
      advice: Şarj arızaları yaygındır ve servis sonuçları büyük ölçüde değişir; maliyetli bir onarım
        için ödeme yapmadan önce ikinci bir servise portu kalıntı açısından kontrol ettirin. Tekrar tekrar
        şarj olmayan bir tablet, keşfedilmesi gerçek bir maliyet olan bir durumdur.
