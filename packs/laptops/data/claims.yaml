      title: Motherboard failure — laptop stopped suddenly and will not power on (UM325UA)
      body: A repair-forum user reports their UM325UA-KG501TS stopped suddenly while in use and will not
        power on, with no LED when the charger is plugged in. The user suspects a short circuit on the
        motherboard. This is a single owner report on a repair forum, so it is anecdotal but points to
        a possible sudden-death failure mode.
      advice: If the machine dies suddenly with no power LED, this may be a motherboard-level failure
        requiring board repair or replacement; check warranty coverage before paying for out-of-warranty
        repair.
    tr:
      title: Anakart arızası — dizüstü aniden durdu ve açılmıyor (UM325UA)
      body: Bir onarım forumu kullanıcısı, UM325UA-KG501TS cihazının kullanım sırasında aniden durduğunu
        ve açılmadığını, şarj cihazı takıldığında hiçbir LED yanmadığını bildiriyor. Kullanıcı anakartta
        kısa devre olduğundan şüpheleniyor. Bu, bir onarım forumunda tek bir sahip raporudur, dolayısıyla
        anekdot niteliğindedir ancak olası bir ani ölüm arıza moduna işaret eder.
      advice: Makine güç LED'i olmadan aniden ölürse, bu kart onarımı veya değişimi gerektiren anakart
        düzeyinde bir arıza olabilir; garanti dışı onarım için ödeme yapmadan önce garanti kapsamını kontrol
        edin.
