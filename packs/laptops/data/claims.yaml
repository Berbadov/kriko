    en:
      title: HP Pavilion 15-eg1xxx hard-reboots on sleep after Windows 11 26H2, BIOS F.26 incompatible
      body: A Pavilion 15-eg1xxx owner reports hard-reboots (Kernel-Power 41) on entering Modern Standby
        after the Windows 11 26H2 update, tied to an incompatible BIOS revision.
      advice: After a Windows feature update, this series can hard-reboot when going to sleep until HP
        ships a compatible BIOS; the workaround is forcing S3 sleep via the registry. Keep BIOS and Windows
        updated, and expect possible sleep-related instability after major updates.
    tr:
      title: HP Pavilion 15-eg1xxx, Windows 11 26H2 sonrası uykuda sabit yeniden başlıyor, BIOS F.26 uyumsuz
      body: Bir Pavilion 15-eg1xxx sahibi, Windows 11 26H2 güncellemesinden sonra Modern Standby'a girerken
        sabit yeniden başlamalar (Kernel-Power 41) yaşadığını ve bunun uyumsuz bir BIOS revizyonuyla bağlantılı
        olduğunu bildiriyor.
      advice: Bir Windows özellik güncellemesinden sonra, HP uyumlu bir BIOS yayınlayana kadar bu seri
        uykuya geçerken sabit yeniden başlayabilir; geçici çözüm, kayıt defteri aracılığıyla S3 uykusunu
        zorlamaktır. BIOS ve Windows'u güncel tutun ve büyük güncellemelerden sonra olası uykuyla ilgili
        kararsızlığa hazırlıklı olun.
  evidence:
  - url: https://h30434.www3.hp.com/t5/Notebook-Operating-System-and-Recovery/BIOS-F-26-incompatible-with-Windows-11-26H2-S0ix-Modern/m-p/9726587
