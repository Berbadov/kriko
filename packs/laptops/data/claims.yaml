        aldı, oysa sahibi gizli kusurun/güvenlik riskinin (yangın tehlikesi) yasal garanti kapsamında
        olması gerektiğini savunuyor.
      advice: Bir M2 Air'de şişmiş pil, erken dönemde kimyasal koku olarak ortaya çıkabilecek bir güvenlik
        sorunudur; garanti süresi içinde herhangi bir kokuyu belgeleyin, çünkü aksi takdirde Apple pili
        daha sonra değiştirmek için ~170€ ücret alabilir.
