      title: IdeaPad 5i Pro 16 screen freezes during light work
      body: Owner of a new IdeaPad 5i Pro 16 reports the screen froze during light work; the system remained
        responsive underneath (mouse moved, keyboard lights responded), and closing/reopening the lid
        recovered it. This points to a display or graphics driver-level freeze rather than a full system
        crash.
      advice: A frozen screen with responsive system underneath is often a driver or display pipeline
        issue. Try updating graphics drivers and Windows; if it recurs, it may be a hardware display fault
        worth checking under warranty.
    tr:
      title: IdeaPad 5i Pro 16 ekranı hafif iş sırasında donuyor
      body: Yeni bir IdeaPad 5i Pro 16 sahibi, ekranın hafif iş sırasında donduğunu bildiriyor; sistem
        altta yanıt vermeye devam etti (fare hareket etti, klavye ışıkları yanıt verdi) ve kapağı kapatıp
        yeniden açmak onu kurtardı. Bu, tam bir sistem çökmesi yerine bir ekran veya grafik sürücüsü düzeyinde
        donmaya işaret eder.
      advice: Altta yanıt veren bir sistemle donmuş ekran genellikle bir sürücü veya ekran hattı sorunudur.
        Grafik sürücülerini ve Windows'u güncellemeyi deneyin; tekrarlarsa, garanti kapsamında kontrol
        edilmeye değer bir donanım ekran arızası olabilir.
