    en:
      title: IdeaPad 5i 2-in-1 hinge screw backs out, shatters display glass
      body: Owner reports hinge screw backing out during normal use, causing the display glass to shatter
        when closing the lid. Owner describes it as 'a widely documented structural issue across this
        specific model line.' Failure occurred just outside warranty, so the owner had to request a courtesy
        repair.
      advice: Check hinge integrity regularly; if a screw feels loose or the lid resistance changes, stop
        using the lid and have it serviced before the glass breaks. This failure can occur outside warranty,
        leaving the owner with a full display replacement cost.
    tr:
      title: IdeaPad 5i 2'si 1 arada menteşe vidası geri çıkıyor, ekran camını parçalıyor
      body: Sahibi, normal kullanım sırasında menteşe vidasının geri çıktığını ve kapak kapatılırken ekran
        camının parçalanmasına neden olduğunu bildiriyor. Sahibi bunu 'bu belirli model serisinde yaygın
        olarak belgelenmiş bir yapısal sorun' olarak tanımlıyor. Arıza garanti süresinin hemen dışında
        meydana geldi, bu yüzden sahibi bir jest onarımı talep etmek zorunda kaldı.
      advice: Menteşe bütünlüğünü düzenli olarak kontrol edin; bir vida gevşek hissedilirse veya kapak
        direnci değişirse, kapağı kullanmayı bırakın ve cam kırılmadan önce servise verin. Bu arıza garanti
        süresi dışında meydana gelebilir ve sahibine tam ekran değişim maliyeti bırakabilir.
  evidence:
  - url: https://forums.lenovo.com/t5/Lenovo-IdeaPad-1xx-3xx-5xx-7xx-Edge-LaVie-Z-Flex-Laptops/Out-of-Warranty-Courtesy-Repair-Request-IdeaPad-5i-2-in-1-Hinge-Mechanical-Failure-Shattered-Glass/m-p/10050396
    quote: A few days ago, a structural hinge screw backed out on its own from the bottom right casing
