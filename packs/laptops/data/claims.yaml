    en:
      title: Envy x360 keyboard stops responding; welded into palmrest makes repair costly
      body: An iFixit thread documents the built-in keyboard stopping responding after updates, with the
        fixer noting the keyboard is welded into the palmrest so the whole upper case must be replaced
        at roughly $100+ in parts. A Czech Alza review in the same run reports the keyboard randomly disconnecting
        twice, requiring two warranty claims.
      advice: If keys stop responding, a USB keyboard confirms it is the internal unit; budget for a full
        upper-case replacement since the keyboard is not separately replaceable on newer models.
    tr:
      title: Envy x360 klavyesi yanıt vermeyi durduruyor; avuç içi dayanağına kaynaklanmış olması onarımı
        maliyetli kılıyor
      body: Bir iFixit başlığı, güncellemelerden sonra yerleşik klavyenin yanıt vermeyi durdurduğunu belgeliyor
        ve onarımcı, klavyenin avuç içi dayanağına kaynaklanmış olduğunu, bu nedenle tüm üst kasanın yaklaşık
        100$+ parça maliyetiyle değiştirilmesi gerektiğini belirtiyor. Aynı dönemde bir Çek Alza incelemesi,
        klavyenin rastgele iki kez bağlantısının kesildiğini ve iki garanti talebi gerektirdiğini bildiriyor.
      advice: Tuşlar yanıt vermeyi durdurursa, bir USB klavye bunun dahili birim olduğunu doğrular; klavye
        yeni modellerde ayrı olarak değiştirilemediği için tam üst kasa değişimi için bütçe ayırın.
