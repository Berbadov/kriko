        says a later firmware update reintroduced the problem.
      advice: 'AMD T14 owners report idle freezes and blank-screen restarts that are firmware-related:
        updating the BIOS can fix them, but a later firmware update can bring the problem back. Keep the
        BIOS current and check the Lenovo community for the latest firmware before assuming hardware failure.'
