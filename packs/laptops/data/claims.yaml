      title: IdeaPad 5i completely dead after being left unplugged overnight
      body: Owner reports the laptop became completely unresponsive after being left unplugged overnight,
        5 months after purchase. The machine would not power on, would not recognize the charger, and
        reset attempts failed.
      advice: A battery/power failure can occur within the first year. If the laptop dies after being
        unplugged, try the hard reset and charging steps, but be prepared that the battery or power board
        may need replacement — ideally under warranty.
    tr:
      title: IdeaPad 5i gece boyunca fişten çekili bırakıldıktan sonra tamamen ölü
      body: Sahibi, satın alımdan 5 ay sonra gece boyunca fişten çekili bırakıldıktan sonra dizüstü bilgisayarın
        tamamen yanıt vermez hale geldiğini bildiriyor. Makine açılmıyor, şarj cihazını tanımıyor ve sıfırlama
        denemeleri başarısız oldu.
      advice: İlk yıl içinde bir pil/güç arızası meydana gelebilir. Dizüstü bilgisayar fişten çekildikten
