      title: MacBook Air M2 image and keyboard faults traced to motherboard, replaced twice without resolution
      body: Apple's authorized service traced it to the motherboard, replaced it, and said a second motherboard
        would be needed. The owner was still without a working unit as of 27/05/2026.
      advice: A recurring image/keyboard fault on an M2 Air may be a motherboard problem that survives
        a screen swap; if you hit repeated repairs under warranty, push for full unit replacement rather
        than accepting endless part swaps.
    tr:
      title: MacBook Air M2 görüntü ve klavye arızalarının kaynağı anakart olarak tespit edildi, iki kez
        değiştirildi ancak çözüm bulunamadı
      body: Apple'ın yetkili servisi sorunun kaynağını anakart olarak tespit etti, değiştirdi ve ikinci
        bir anakartın gerekli olacağını söyledi. Sahibi 27/05/2026 itibarıyla hâlâ çalışan bir cihaza
        sahip değildi.
      advice: Bir M2 Air'de tekrarlayan görüntü/klavye arızası, ekran değişiminden sonra da devam eden
        bir anakart sorunu olabilir; garanti kapsamında tekrarlanan onarımlarla karşılaşırsanız, sonsuz
        parça değişimlerini kabul etmek yerine tam cihaz değişimi için ısrar edin.
