  text:
    en:
      title: Belkin 6-outlet surge protector with rotating plug reported to start fires, Amazon stopped
        selling
      body: News 6 (KPRC/ClickOrlando) reported in September 2015 on Belkin surge protectors with rotating
        plugs starting fires. A family reported flames shooting from a Belkin surge protector, and Amazon
        reviews from 2012-2014 warned of melting and fire hazards. Amazon stopped selling the six-outlet
        commercial surge protector with a rotating plug.
      advice: This is a documented pattern of fire incidents with Belkin 6-outlet surge protectors with
        rotating plugs. Exercise caution, monitor the unit for heat or discoloration, and consider replacing
        it.
    tr:
      title: Döner fişli Belkin 6 çıkışlı dalgalanma koruyucusunun yangın başlattığı bildirildi, Amazon
        satışı durdurdu
      body: News 6 (KPRC/ClickOrlando) Eylül 2015'te döner fişli Belkin dalgalanma koruyucularının yangın
        başlatması hakkında haber yaptı. Bir aile, bir Belkin dalgalanma koruyucusundan alevler fışkırdığını
        bildirdi ve 2012-2014 Amazon incelemeleri erime ve yangın tehlikeleri konusunda uyardı. Amazon,
        döner fişli altı çıkışlı ticari dalgalanma koruyucusunu satmayı durdurdu.
      advice: Bu, döner fişli Belkin 6 çıkışlı dalgalanma koruyucularıyla belgelenmiş bir yangın olayları
        örüntüsüdür. Dikkatli olun, üniteyi ısı veya renk değişimi açısından izleyin ve değiştirmeyi düşünün.
