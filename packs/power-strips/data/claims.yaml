        pose fire/shock danger'
      body: The CPSC has issued a general warning about faulty extension cords, power strips, and surge
        protectors, citing 25 recalls involving 2 million units since 1994 due to undersized wires, loose
        connections, and other defects. This warning is general and does not name Philips or the SPC3064WG/37
        specifically. This finding came from the search query 'Philips surge protector power strip recall
        CPSC'.
      advice: This is a general category warning, not specific to this product. It underscores that power
        strips as a category have documented fire and shock hazards, but no CPSC recall was found for
        the SPC3064WG/37.
    tr:
      title: 'CPSC genel uyarısı: milyonlarca arızalı uzatma kablosu, priz çubuğu ve dalgalanma koruyucusu
        yangın/elektrik çarpması tehlikesi oluşturuyor'
      body: CPSC, arızalı uzatma kabloları, priz çubukları ve dalgalanma koruyucuları hakkında genel bir
        uyarı yayınladı; 1994'ten bu yana yetersiz teller, gevşek bağlantılar ve diğer kusurlar nedeniyle
