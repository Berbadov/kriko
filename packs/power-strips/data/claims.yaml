  text:
    en:
      title: Forum expert raises concern that Anker AC power strips may lack proper UL standards listings
      body: A forum member with apparent electrical standards expertise (posting on Linus Tech Tips in
        response to a CPSC advisory discussion) raises concerns that Anker AC power strip products — including
        the 12-outlet power strip (the 351/A9192) — may not be listed under the appropriate Underwriters
        Laboratory standards (UL 817 for power strips, UL 1363 for relocatable power taps) or may lack
        proper labeling. This is a forum opinion, not an official regulatory finding, but it questions
        the adequacy of the product's safety certification. The product is marketed as 'TUV listed' rather
        than UL listed, which is a different certification body.
      advice: Verify the specific certification markings on the unit you receive. The product is marketed
        as TUV listed, not UL listed. If UL listing matters to you for insurance or safety confidence,
        consider a UL-listed alternative from Belkin or APC. This is a forum-level concern, not an official
        finding, but it raises a legitimate question about certification adequacy.
    tr:
      title: Forum uzmanı, Anker AC güç şeritlerinin uygun UL standartları listelerine sahip olmayabileceği
        endişesini dile getiriyor
      body: Görünüşe göre elektrik standartları uzmanlığına sahip bir forum üyesi (CPSC danışma tartışmasına
        yanıt olarak Linus Tech Tips'te paylaşım yapıyor), Anker AC güç şeridi ürünlerinin — 12 çıkışlı
        güç şeridi (351/A9192) dahil — uygun Underwriters Laboratory standartları (güç şeritleri için
        UL 817, taşınabilir güç prizleri için UL 1363) kapsamında listelenmemiş olabileceği veya uygun
        etiketlemeye sahip olmayabileceği endişesini dile getiriyor. Bu bir forum görüşüdür, resmi bir
        düzenleyici tespit değildir, ancak ürünün güvenlik sertifikasyonunun yeterliliğini sorgulamaktadır.
        Ürün, UL listeli yerine 'TUV listeli' olarak pazarlanmaktadır; bu farklı bir sertifikasyon kuruluşudur.
      advice: Aldığınız ünitedeki belirli sertifikasyon işaretlerini doğrulayın. Ürün, UL listeli değil,
        TUV listeli olarak pazarlanmaktadır. Sigorta veya güvenlik güvencesi açısından UL listelemesi
        sizin için önemliyse, Belkin veya APC'den UL listeli bir alternatif düşünün. Bu forum düzeyinde
        bir endişedir, resmi bir tespit değildir, ancak sertifikasyon yeterliliği hakkında meşru bir soru
        ortaya koymaktadır.
