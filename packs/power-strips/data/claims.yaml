  text:
    en:
      title: 'Owner reports: Belkin rotating plug design can arc and melt, units caught fire'
      body: 'Amazon/Woot customer reviews document multiple failures: the rotating plug''s metal ring
        contacts can arc and melt, one unit melted within 2 months, and another owner reported two Belkin
        units catching fire and setting a bed on fire.'
      advice: Multiple owner reports describe melting and fire incidents with Belkin surge protectors
        featuring rotating plugs. The rotating plug's metal ring contact design is identified as a potential
        arcing point. Consider a fixed-plug surge protector instead.
    tr:
      title: 'Sahip raporları: Belkin dönen fiş tasarımı ark yapabilir ve eriyebilir, üniteler alev aldı'
      body: 'Amazon/Woot müşteri yorumları birden fazla arızayı belgeliyor: dönen fişin metal halka kontakları
        ark yapabilir ve eriyebilir, bir ünite 2 ay içinde eridi ve başka bir sahip iki Belkin ünitesinin
        alev alıp bir yatağı tutuşturduğunu bildirdi.'
      advice: Birden fazla sahip raporu, dönen fişli Belkin dalgalanma koruyucularında erime ve yangın
        olaylarını tanımlıyor. Dönen fişin metal halka kontak tasarımı potansiyel bir ark noktası olarak
        tanımlanıyor. Bunun yerine sabit fişli bir dalgalanma koruyucusu düşünün.
