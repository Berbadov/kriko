  text:
    en:
      title: 'Hong Kong Consumer Council 2019: Philips USB power strips had insufficient insulation distance
        — increased short-circuit risk'
      body: In 2019, the Hong Kong Consumer Council tested 15 USB charging power strips; 13 failed some
        safety tests. Seven had insufficient insulation distance between live USB transformer coils and
        user-accessible USB output sockets, increasing short-circuit risk — Philips was among the brands
        named. Philips' brand holder said the tested model was not imported by them into Hong Kong. This
        is a different model and market from the SPC3064WG/37, but documents another Philips-brand power
        strip safety deficiency. This finding came from the search query 'Philips power strip fire hazard
        recall'.
      advice: This applies to Philips USB charging power strips in the Hong Kong market, not the SPC3064WG/37.
        It shows a pattern of Philips-brand power strip safety issues in testing, but the US model has
        not been implicated.
    tr:
      title: 'Hong Kong Tüketici Konseyi 2019: Philips USB priz çubuklarında yetersiz yalıtım mesafesi
        vardı — artan kısa devre riski'
      body: 2019'da Hong Kong Tüketici Konseyi 15 USB şarjlı priz çubuğunu test etti; 13'ü bazı güvenlik
        testlerinde başarısız oldu. Yedisinde canlı USB transformatör bobinleri ile kullanıcı tarafından
        erişilebilen USB çıkış soketleri arasında yetersiz yalıtım mesafesi vardı ve bu kısa devre riskini
        artırıyordu — Philips adı geçen markalar arasındaydı. Philips'in marka sahibi, test edilen modelin
        kendileri tarafından Hong Kong'a ithal edilmediğini söyledi. Bu, SPC3064WG/37'den farklı bir model
        ve pazardır, ancak başka bir Philips markalı priz çubuğu güvenlik eksikliğini belgeliyor. Bu bulgu
        'Philips power strip fire hazard recall' arama sorgusundan geldi.
      advice: Bu, Hong Kong pazarındaki Philips USB şarjlı priz çubukları için geçerlidir, SPC3064WG/37
        için değil. Testte Philips markalı priz çubuğu güvenlik sorunlarının bir örüntüsünü gösterir,
        ancak ABD modeli suçlanmamıştır.
  evidence:
