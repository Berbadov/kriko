  text:
    en:
      title: Anker officially states power strip overheating is abnormal and may indicate a problem
      body: Anker's official support documentation acknowledges that power strips can get hot and that
        excessive heat is abnormal. Anker instructs users to verify loads don't exceed maximum output
        and to contact support if overheating persists. This is the manufacturer's own admission that
        overheating is a recognized failure mode requiring attention, though it does not document specific
        incidents on the 2100J model.
      advice: If the strip runs hot to the touch under normal loads, unplug it and contact Anker. Do not
        ignore excessive heat, as the manufacturer itself flags it as abnormal. The 8-Point Safety System
        claims temperature control, but the support page confirms abnormal heat is possible.
    tr:
      title: Anker, güç şeridinin aşırı ısınmasının anormal olduğunu ve bir soruna işaret edebileceğini
        resmen belirtiyor
      body: Anker'ın resmi destek belgeleri, güç şeritlerinin ısınabileceğini ve aşırı ısının anormal
        olduğunu kabul ediyor. Anker, kullanıcılara yüklerin maksimum çıkışı aşmadığını doğrulamalarını
        ve aşırı ısınma devam ederse destekle iletişime geçmelerini talimat veriyor. Bu, üreticinin aşırı
        ısınmanın dikkat gerektiren tanınmış bir arıza modu olduğunu kendi kabulüdür, ancak 2100J modelinde
        belirli olayları belgelemiyor.
      advice: Şerit normal yükler altında dokunulacak kadar sıcaksa, fişini çekin ve Anker ile iletişime
        geçin. Aşırı ısıyı görmezden gelmeyin, çünkü üreticinin kendisi bunu anormal olarak işaretliyor.
        8 Noktalı Güvenlik Sistemi sıcaklık kontrolü iddia ediyor, ancak destek sayfası anormal ısının
        mümkün olduğunu doğruluyor.
