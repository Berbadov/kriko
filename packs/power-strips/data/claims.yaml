  text:
    en:
      title: 'CPSC recall: Belkin SurgeMaster 360-degree rotating plug can crack or detach, shock hazard'
      body: The CPSC recall (October 27, 2009) covers SurgeMaster models F9G930-10, F9G930v10, F9G930-10-W
        and F9G930-10-SN manufactured in 2003, approximately 68,700 units. The rotating plug molding can
        crack or detach, posing a shock hazard. Seven consumer complaints reported, no injuries.
      advice: If you own a Belkin SurgeMaster with a rotating plug manufactured in 2003, stop using it
        immediately and contact Belkin for a replacement. Check the model number and date of manufacture
        on the underside of the unit.
    tr:
      title: 'CPSC geri çağırma: Belkin SurgeMaster 360 derece dönen fiş çatlayabilir veya ayrılabilir,
        elektrik çarpması tehlikesi'
      body: CPSC geri çağırma (27 Ekim 2009) 2003'te üretilen SurgeMaster F9G930-10, F9G930v10, F9G930-10-W
        ve F9G930-10-SN modellerini kapsıyor, yaklaşık 68.700 adet. Dönen fiş kalıbı çatlayabilir veya
        ayrılabilir ve elektrik çarpması tehlikesi oluşturur. Yedi tüketici şikayeti bildirildi, yaralanma
        yok.
      advice: 2003'te üretilen dönen fişli bir Belkin SurgeMaster'ınız varsa, kullanmayı hemen bırakın
        ve değişim için Belkin ile iletişime geçin. Ünitenin alt tarafındaki model numarasını ve üretim
        tarihini kontrol edin.
  evidence:
  - url: https://www.cpsc.gov/es/Noticias-y-retiros-del-mercado/2010/Belkin-International-Inc-Recalls-SurgeMaster-Surge-Protectors-Due-to-Shock-Hazard
