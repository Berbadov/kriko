    quote: 有7款樣本的絕緣距離不足，防觸電保護未如理想，主要是USB火牛帶電線圈與用戶可接觸的USB輸出插座的距離不足，增加跳掣及短路的風險，當中包括飛利浦和施耐德電氣的拖板。
