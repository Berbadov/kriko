  text:
    en:
      title: Bosch/Siemens WDT67 heat pump dryer internal technical defect causes fires (IFS investigation)
      body: The IFS (Institut für Schadenverhütung und Schadenforschung), an independent German damage
        investigation institute, reports investigating multiple WDT67 heat pump dryers from Bosch and
        Siemens that caught fire while in operation. In each case, an internal technical defect was identified
        as the cause. The affected units showed a clear damage focus on the right side. Search snippets
        also indicate the affected units date from build years 2020–2022, matching the subject's timeframe.
        This came from the query 'Bosch WDT67 heat pump dryer recall fire'.
      advice: Owners of Bosch/Siemens WDT67 heat pump dryers from 2020–2022 should be aware of a documented
        fire risk from internal technical defects. Do not run the dryer unattended, especially overnight,
        and consider having the unit inspected. A smoke detector near the dryer is strongly advisable.
    tr:
      title: Bosch/Siemens WDT67 ısı pompalı kurutucu iç teknik kusur yangınlara neden oluyor (IFS incelemesi)
      body: Bağımsız bir Alman hasar araştırma enstitüsü olan IFS (Institut für Schadenverhütung und Schadenforschung),
        çalışma sırasında yangın çıkan Bosch ve Siemens'e ait birden fazla WDT67 ısı pompalı kurutucuyu
        incelediğini bildiriyor. Her vakada iç teknik bir kusur neden olarak tespit edildi. Etkilenen
        üniteler sağ tarafta belirgin bir hasar odağı gösterdi. Arama snippet'leri ayrıca etkilenen ünitelerin
        2020–2022 üretim yıllarına ait olduğunu gösteriyor ve bu da konunun zaman aralığıyla uyuşuyor.
        Bu, 'Bosch WDT67 heat pump dryer recall fire' sorgusundan elde edildi.
      advice: 2020–2022 yıllarına ait Bosch/Siemens WDT67 ısı pompalı kurutucu sahipleri, iç teknik kusurlardan
        kaynaklanan belgelenmiş bir yangın riskinin farkında olmalıdır. Kurutucuyu gözetimsiz, özellikle
        gece boyunca çalıştırmayın ve ünitenin incelenmesini düşünün. Kurutucunun yakınında bir duman
        dedektörü kesinlikle tavsiye edilir.
