  text:
    en:
      title: Siemens/Bosch WDT67 heat pump dryer (2020–2022) internal technical defect causes fires —
        IFS investigation
      body: The IFS (Institut für Schadenverhütung) is an independent German damage-prevention institute
        that examined multiple WDT67 heat pump dryers that caught fire while in operation. The fires were
        caused by an internal technical defect, with damage concentrated on the right side of the unit.
        Affected units are from build years 2020–2022. The IFS advises having the dryer checked by a qualified
        technician if drying performance drops and the manufacturer's manual remedies do not restore it.
      advice: Owners of a Siemens/Bosch WDT67 (build years 2020–2022) should not run the dryer unattended,
        and should have it inspected by a qualified technician if drying performance declines. This is
        a documented fire risk, not a general reliability issue.
    tr:
      title: Siemens/Bosch WDT67 ısı pompalı kurutucu (2020–2022) iç teknik kusur yangınlara neden oluyor
        — IFS incelemesi
      body: IFS (Institut für Schadenverhütung), çalışma sırasında yangın çıkan birden fazla WDT67 ısı
        pompalı kurutucuyu inceleyen bağımsız bir Alman hasar önleme enstitüsüdür. Yangınlara iç teknik
        bir kusur neden oldu ve hasar ünitenin sağ tarafında yoğunlaştı. Etkilenen üniteler 2020–2022
        üretim yıllarına aittir. IFS, kurutma performansı düşerse ve üreticinin kılavuzundaki çözümler
        bunu geri getirmezse kurutucunun nitelikli bir teknisyen tarafından kontrol ettirilmesini önermektedir.
      advice: Bir Siemens/Bosch WDT67 (üretim yılları 2020–2022) sahibiyseniz, kurutucuyu gözetimsiz çalıştırmamalı
        ve kurutma performansı düşerse nitelikli bir teknisyen tarafından incelenmesini sağlamalısınız.
        Bu, belgelenmiş bir yangın riskidir, genel bir güvenilirlik sorunu değildir.
  evidence:
