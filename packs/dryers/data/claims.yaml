  text:
    en:
      title: Defective electronic component in control panel can overheat and cause fire (2002 Siemens
        tumble dryers)
      body: This is the manufacturer BSH's own voluntary safety notice (10 Sept 2014) for Siemens tumble
        dryers built Jan-May 2002. It names a defective electronic component in the control panel that
        can overheat and, in extremely rare cases, cause a fire. BSH reports about 100,000 affected appliances
        (majority sold in Germany) and 26 reports of smouldering fires in Germany with no injuries. The
        fix is a free on-site repair by a service technician; until then the dryer should only be run
        supervised and not overnight. This is the core fire finding for the 2002 Siemens dryer series
        and applies to the EU market.
      advice: ''
    tr:
      title: Kontrol panelindeki arızalı elektronik bileşen aşırı ısınarak yangına neden olabilir (2002
        Siemens çamaşır kurutma makineleri)
      body: Bu, üretici BSH'nin Ocak-Mayıs 2002'de üretilen Siemens çamaşır kurutma makineleri için kendi
        gönüllü güvenlik bildirimidir (10 Eylül 2014). Bildirim, kontrol panelinde aşırı ısınabilen ve
        son derece nadir durumlarda yangına neden olabilen arızalı bir elektronik bileşeni adlandırmaktadır.
        BSH, yaklaşık 100.000 etkilenen cihaz (çoğunluğu Almanya'da satılmıştır) ve Almanya'da yaralanma
        olmaksızın 26 korlaşan yangın bildirimi raporlamaktadır. Çözüm, bir servis teknisyeni tarafından
        ücretsiz yerinde onarımdır; o zamana kadar kurutucu yalnızca gözetim altında ve gece boyunca çalıştırılmamalıdır.
        Bu, 2002 Siemens kurutucu serisi için temel yangın bulgusudur ve AB pazarı için geçerlidir.
