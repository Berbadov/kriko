  text:
    en:
      title: Fire recall notice identifies the capacitor as the failing component that can overheat
      body: This finding came from the search "Beko condenser tumble dryer recall fire safety". A New
        Zealand fire-and-emergency product recall notice for Beko dryers names the capacitor as the component
        that may fail and overheat, potentially leading to a risk of fire, using the same 6kg & 7kg condenser
        dryer incident language. Note the notice's listed model (DCU8330GX) differs from the UK 6kg/7kg
        model list, so treat the capacitor identification as the component anchor rather than a model
        match.
      advice: The failing part is the capacitor. Owners of affected 6kg/7kg condenser dryers should not
        attempt to replace it themselves — Beko's recall programme provides a free, qualified in-home
        modification (replacement of the capacitor).
    tr:
      title: Yangın geri çağırma bildirimi, arızalanan ve aşırı ısınabilen bileşen olarak kondansatörü
        tanımlıyor
      body: Bu bulgu "Beko condenser tumble dryer recall fire safety" aramasından elde edilmiştir. Beko
        kurutucular için Yeni Zelanda yangın ve acil durum ürün geri çağırma bildirimi, arızalanabilecek
        ve aşırı ısınarak potansiyel yangın riskine yol açabilecek bileşen olarak kondansatörü adlandırmakta
        ve aynı 6kg & 7kg kondansatörlü kurutucu olayı ifadesini kullanmaktadır. Bildirimde listelenen
        modelin (DCU8330GX) Birleşik Krallık 6kg/7kg model listesinden farklı olduğunu unutmayın; bu nedenle
        kondansatör tanımlamasını model eşleşmesi yerine bileşen dayanağı olarak değerlendirin.
      advice: Arızalanan parça kondansatördür. Etkilenen 6kg/7kg kondansatörlü kurutucuların sahipleri
        bunu kendileri değiştirmeye çalışmamalıdır — Beko'nun geri çağırma programı ücretsiz, yetkili
        bir yerinde tadilat (kondansatörün değiştirilmesi) sağlamaktadır.
