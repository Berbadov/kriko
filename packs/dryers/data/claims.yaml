  text:
    en:
      title: Bosch WQG244C1TR/05 heat pump dryer keeps heating after programme end; owner reports fire
        risk (Turkey)
      body: 'Finding came from the query ''Bosch WQG244C1TR kurutma makinesi yangın''. A verified owner
        complaint (Şikayetvar, 29 May 2025) about a Bosch WQG244C1TR/05 heat pump dryer bought 23 Oct
        2024 in Turkey: the machine kept running the heat pump with intense heat after the programme ended,
        creating serious overheating and a fire risk. A technician said there was no problem; the fault
        recurred 11 times over 6 months. This is a TR-market, non-WDT67 Bosch heat pump dryer, matching
        the subject.'
      advice: 'An owner reports a fire risk on this model: the dryer continued heating after the programme
        ended. If a Bosch heat pump dryer runs hot after the cycle finishes, treat it as a safety concern,
        stop using it, and escalate beyond a single service visit (the owner reports the fault was dismissed
        and recurred 11 times).'
    tr:
      title: Bosch WQG244C1TR/05 ısı pompalı kurutucu program bittikten sonra ısıtmaya devam ediyor; sahibi
        yangın riski bildiriyor (Türkiye)
      body: 'Bulgı ''Bosch WQG244C1TR kurutma makinesi yangın'' sorgusundan elde edildi. Türkiye''de 23
        Eki 2024 tarihinde satın alınan bir Bosch WQG244C1TR/05 ısı pompalı kurutucu hakkında doğrulanmış
        bir sahip şikayeti (Şikayetvar, 29 May 2025): makine program bittikten sonra ısı pompasını yoğun
        ısıyla çalıştırmaya devam etti ve ciddi aşırı ısınma ile yangın riski oluşturdu. Bir teknisyen
        sorun olmadığını söyledi; arıza 6 ay içinde 11 kez tekrarladı. Bu, TR pazarına yönelik, WDT67
        olmayan bir Bosch ısı pompalı kurutucudur ve konuyla uyuşmaktadır.'
      advice: 'Bir sahip bu modelde yangın riski bildiriyor: kurutucu program bittikten sonra ısıtmaya
        devam etti. Bir Bosch ısı pompalı kurutucu döngü bittikten sonra sıcak çalışırsa, bunu bir güvenlik
        sorunu olarak değerlendirin, kullanmayı durdurun ve tek bir servis ziyaretinin ötesine taşıyın
        (sahip, arızanın göz ardı edildiğini ve 11 kez tekrarladığını bildiriyor).'
