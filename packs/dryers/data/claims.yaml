      title: 'UK Commons Library: Whirlpool identified fault in two dryer models; consumers waited up
        to 16 months for repair'
      body: The UK House of Commons Library briefing confirms Whirlpool identified the fault in two dryer
        models (April 2004–September 2015) under Hotpoint, Indesit, Creda brands, and documents that consumers
        waited up to 16 months for repairs despite being promised 6–8 weeks.
      advice: If you own an affected machine, expect possible long delays for repair; consider demanding
        replacement or refund instead.
    tr:
      title: 'Birleşik Krallık Avam Kamarası Kütüphanesi: Whirlpool iki kurutma makinesi modelinde arıza
        tespit etti; tüketiciler onarım için 16 aya kadar bekledi'
      body: Birleşik Krallık Avam Kamarası Kütüphanesi brifingi, Whirlpool'un Hotpoint, Indesit, Creda
        markaları altında iki kurutma makinesi modelinde (Nisan 2004–Eylül 2015) arızayı tespit ettiğini
        doğrular ve tüketicilerin 6–8 hafta vaat edilmesine rağmen onarımlar için 16 aya kadar beklediğini
        belgeler.
      advice: Etkilenen bir makineniz varsa, onarım için olası uzun gecikmeler bekleyin; bunun yerine
        değişim veya para iadesi talep etmeyi düşünün.
  evidence:
