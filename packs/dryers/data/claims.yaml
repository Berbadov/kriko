  text:
    en:
      title: Beko confirms 6kg/7kg condenser dryer (2012) electrical component failure — voluntary corrective
        action
      body: Beko's own official safety notice for the 6kg & 7kg condenser tumble dryers manufactured May–October
        2012, confirming a small number of incidents where an electrical component failed and overheated,
        and offering a free in-home modification. This is the manufacturer's primary documentation for
        the exact subject.
      advice: Beko itself tells owners of affected 6kg/7kg condenser dryers built May–October 2012 to
        stop using the machine and disconnect it, then call 0800 917 2018 (UK) for a free modification.
        The affected models and serial ranges are listed on the page.
    tr:
      title: Beko 6kg/7kg kondenser kurutma makinesinde (2012) elektrikli bileşen arızasını doğruladı
        — gönüllü düzeltici eylem
      body: Beko'nun Mayıs–Ekim 2012'de üretilen 6kg ve 7kg kondenser çamaşır kurutma makineleri için
        kendi resmi güvenlik bildirimi, bir elektrikli bileşenin arızalandığı ve aşırı ısındığı az sayıda
        olayı doğrular ve ücretsiz evde modifikasyon sunar. Bu, tam olarak bu konuya ilişkin üreticinin
        birincil belgesidir.
      advice: Beko, Mayıs–Ekim 2012'de üretilen etkilenen 6kg/7kg kondenser kurutma makinelerinin sahiplerine
        makineyi kullanmayı bırakmalarını ve fişini çekmelerini, ardından ücretsiz modifikasyon için 0800
        917 2018'i (Birleşik Krallık) aramalarını söylüyor. Etkilenen modeller ve seri aralıkları sayfada
        listelenmiştir.
  evidence:
