  text:
    en:
      title: WDT67 heat pump dryers (2020–2022) caught fire from internal technical defects — IFS investigation
      body: The IFS (Institut für Schadenverhütung), a German damage-investigation institute, examined
        multiple WDT67 heat pump dryers that caught fire. Two detailed cases are described where units
        caught fire while in operation; both showed damage concentrated on the right side. The report
        states affected units are from build years 2020–2022 — matching the subject's date range. The
        IFS advises having the dryer checked by a professional if drying performance drops and manufacturer-recommended
        measures don't restore it.
      advice: Owners of WDT67 dryers from 2020–2022 should be alert to reduced drying performance as a
        potential warning sign. Have the unit inspected by a qualified technician if performance degrades.
        Do not leave the dryer running unattended. This is an investigation report and warning, not a
        formal recall — no official BSH/Siemens recall notice was found.
    tr:
      title: WDT67 ısı pompalı kurutucular (2020–2022) iç teknik kusurlar nedeniyle alev aldı — IFS soruşturması
      body: Alman hasar soruşturma enstitüsü IFS (Institut für Schadenverhütung), alev alan birden fazla
        WDT67 ısı pompalı kurutucuyu inceledi. Ünitelerin çalışma sırasında alev aldığı iki ayrıntılı
        vaka tanımlanmıştır; her ikisinde de hasarın sağ tarafta yoğunlaştığı görülmüştür. Rapor, etkilenen
        ünitelerin 2020–2022 üretim yıllarına ait olduğunu belirtmektedir — bu, konunun tarih aralığıyla
        örtüşmektedir. IFS, kurutma performansı düşerse ve üretici tarafından önerilen önlemler bunu geri
        getirmezse kurutucunun bir uzman tarafından kontrol ettirilmesini tavsiye etmektedir.
      advice: 2020–2022 yıllarına ait WDT67 kurutucuların sahipleri, azalan kurutma performansını olası
        bir uyarı işareti olarak dikkate almalıdır. Performans düşerse üniteyi yetkili bir teknisyene
        kontrol ettirin. Kurutucuyu gözetimsiz çalışır durumda bırakmayın. Bu bir soruşturma raporu ve
        uyarıdır, resmi bir geri çağırma değildir — resmi bir BSH/Siemens geri çağırma bildirimi bulunamamıştır.
  evidence:
