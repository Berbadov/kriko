        rattling and scraping noises, and the owner found melting at the rear of the appliance, warning
        other owners to check for melting and fire risk.'
      advice: If you own a DV90T8240-series heat pump dryer, inspect the rear of the machine for melted
        plastic or scorching before running it unattended. Stop use and contact Samsung service if any
        melting, rattling, or burning smell appears.
