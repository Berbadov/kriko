  text:
    en:
      title: Epcos B32332 capacitor with defective Zytel FR50 plastic caused fires; voluntary recall of
        8-9 kg Ares Condenser Dryers
      body: Arcelik's own court filing (response to interrogatories in Arcelik v. DuPont) confirms a voluntary
        recall of 8-9 kg Ares Condenser Dryers with Epcos 9uF capacitors from weeks 11-19 of 2012, following
        21 observed incidents. UK notice issued May 31, 2017.
      advice: Owners of 8-9 kg Ares Condenser Dryers manufactured around 2012 should check whether their
        unit contains an Epcos 9uF B32332 capacitor from weeks 11-19 of 2012 and contact Arcelik for the
        recall rework.
    tr:
      title: Kusurlu Zytel FR50 plastiği içeren Epcos B32332 kondansatörü yangınlara neden oldu; 8-9 kg
        Ares Condenser Dryers için gönüllü geri çağırma
      body: Arcelik'in kendi mahkeme dosyası (Arcelik v. DuPont davasında sorgulara yanıt) 2012'nin 11-19.
        haftalarından Epcos 9uF kondansatörlü 8-9 kg Ares Condenser Dryers için 21 gözlenen olayın ardından
        gönüllü bir geri çağırma olduğunu doğrular. Birleşik Krallık bildirimi 31 Mayıs 2017'de yayımlandı.
      advice: 2012 civarında üretilen 8-9 kg Ares Condenser Dryers sahipleri, ünitelerinin 2012'nin 11-19.
        haftalarından bir Epcos 9uF B32332 kondansatörü içerip içermediğini kontrol etmeli ve geri çağırma
        onarımı için Arcelik ile iletişime geçmelidir.
  evidence:
  - url: https://ia802201.us.archive.org/26/items/gov.uscourts.ded.58044/gov.uscourts.ded.58044.74.1.pdf
    quote: Arcelik therefore initiated a voluntary recall of 8- 9 kg Ares Condenser Dryers that may have
      been manufactured with Epcos 9uF capacitors produced in weeks 11- 19 of 2012. The United Kingdom
      issued a related notice on May 31, 2017.
