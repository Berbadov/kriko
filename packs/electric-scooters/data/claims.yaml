      title: Real-world range is overstated versus the 45 km claim
      body: Verified buyers report the advertised 45 km range is only achievable in lab conditions; realistic
        range is ~25-35 km depending on rider weight, mode, and terrain.
      advice: Budget for roughly 25-35 km of real range, not 45 km, especially in Sport mode or with heavier
        riders.
    tr:
      title: Gerçek dünya menzili 45 km iddiasına göre abartılı
      body: Doğrulanmış alıcılar, reklamı yapılan 45 km menzilin yalnızca laboratuvar koşullarında elde
        edilebildiğini; gerçekçi menzilin sürücü ağırlığına, moda ve araziye bağlı olarak ~25-35 km olduğunu
        bildiriyor.
      advice: 45 km değil, yaklaşık 25-35 km gerçek menzil için bütçe ayırın; özellikle Sport modunda
        veya daha ağır sürücülerle.
