      title: Throttle fault code 14 means the throttle must be replaced (Xiaomi official FAQ)
      body: The maker itself documents that fault code 14 (or one long + four short beeps) means the throttle
        has failed and must be replaced at a service center.
      advice: If the dashboard shows code 14, the throttle is faulty and needs a service-center replacement;
        do not keep riding on a failing throttle.
