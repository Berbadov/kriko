  text:
    en:
      title: Handlebar folding joint wears out after ~200 km and can fold while riding (owner report,
        Hungary)
      body: After only ~200 km the handlebar folding joint wore out so badly the scooter could fold while
        riding, causing personal injury and ~80,000 HUF in parts damage. This matches the pack's known
        handlebar-play issue.
      advice: Check the folding joint for play early; a worn joint can fold mid-ride and cause a crash,
        and the replacement part is costly.
    tr:
      title: Gidon katlama eklemi ~200 km sonra aşınıyor ve sürüş sırasında katlanabiliyor (sahip raporu,
        Macaristan)
      body: Yalnızca ~200 km sonra gidon katlama eklemi o kadar kötü aşındı ki scooter sürüş sırasında
        katlanabiliyor, kişisel yaralanmaya ve ~80.000 HUF parça hasarına neden oluyor. Bu, paketin bilinen
        gidon boşluğu sorunuyla örtüşüyor.
      advice: Katlama ekleminde boşluğu erken kontrol edin; aşınmış bir eklem sürüş ortasında katlanıp
        kazaya neden olabilir ve yedek parça maliyetlidir.
