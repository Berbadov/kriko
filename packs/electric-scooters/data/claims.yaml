      title: Gaz hatası kodu 14, gazın değiştirilmesi gerektiği anlamına gelir (Xiaomi resmi SSS)
      body: Üreticinin kendisi, hata kodu 14'ün (veya bir uzun + dört kısa bip sesinin) gazın arızalandığını
        ve bir servis merkezinde değiştirilmesi gerektiğini belgeliyor.
      advice: Gösterge paneli kod 14 gösteriyorsa, gaz arızalıdır ve servis merkezinde değiştirilmesi
        gerekir; arızalı bir gazla sürmeye devam etmeyin.
