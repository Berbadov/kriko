      title: 'Real-world range is well under the advertised figure (Turkish verified buyer: ~30-32 km
        vs 47 km shown)'
      body: A 4-month owner (70 kg) reports the app shows 47 km at full charge but real riding yields
        only 30-32 km, with strong slowdown below 20% charge.
      advice: Expect roughly two-thirds of the advertised range in real use, and less if you are heavier
        or ride hills. If your commute depends on the full 50 km claim, this model will not deliver it.
    tr:
      title: 'Gerçek menzil, reklamı yapılan rakamın oldukça altında (Türk doğrulanmış alıcı: gösterilen
        47 km''ye karşı ~30-32 km)'
      body: 4 aylık bir sahip (70 kg), uygulamanın tam şarjda 47 km gösterdiğini ancak gerçek sürüşün
        yalnızca 30-32 km verdiğini, %20 şarjın altında güçlü bir yavaşlama olduğunu bildiriyor.
      advice: Gerçek kullanımda reklamı yapılan menzilin kabaca üçte ikisini bekleyin, daha ağırsanız
        veya yokuşlarda sürüyorsanız daha azını. Günlük gidiş-gelişiniz tam 50 km iddiasına bağlıysa,
        bu model bunu karşılamayacaktır.
