      title: Mavic 3 Intelligent Flight Battery fails to charge with the original charger
      body: 'Owner Q&A on the Mavic 3 Intelligent Flight Battery: the battery would not charge via the
        Mavic 3 Classic with the original charger even overnight, no LEDs lit, and the drone would not
        power on; replies point to bad contact on the pins, defective electronics, or a defective cell.'
      advice: A battery that will not charge or wake is a common failure. Check battery health and contact
        pins before buying, and know that a replacement Intelligent Flight Battery is a significant extra
        cost.
    tr:
      title: Mavic 3 Intelligent Flight Battery, orijinal şarj cihazıyla şarj olmuyor
      body: 'Mavic 3 Intelligent Flight Battery hakkında sahip soru-cevabı: pil, Mavic 3 Classic üzerinden
        orijinal şarj cihazıyla bir gecede bile şarj olmadı, hiçbir LED yanmadı ve drone açılmadı; yanıtlar
        pinlerdeki kötü temasa, arızalı elektroniğe veya arızalı bir hücreye işaret ediyor.'
      advice: Şarj olmayan veya uyanmayan bir pil yaygın bir arızadır. Satın almadan önce pil sağlığını
        ve temas pinlerini kontrol edin ve yedek bir Intelligent Flight Battery'nin önemli bir ek maliyet
        olduğunu bilin.
