      title: Gimbal high-frequency vibration/shaking in footage, DJI suggests calibration and prop inspection
      body: On the official DJI forum, a support reply attributes heatwave-like video distortion to high-frequency
        gimbal vibration, listing bent/damaged props, debris, and gimbal motor issues as causes, and recommends
        calibration and prop replacement.
      advice: If footage shows heatwave-like distortion, check props for damage and calibrate the gimbal
        before assuming a camera fault; the fix may be as cheap as new props.
    tr:
      title: Görüntüde gimbal yüksek frekanslı titreşim/sarsıntı, DJI kalibrasyon ve pervane incelemesi
        öneriyor
      body: Resmi DJI forumunda bir destek yanıtı, sıcak hava dalgası benzeri video bozulmasını yüksek
        frekanslı gimbal titreşimine bağlıyor; bükülmüş/hasarlı pervaneler, kalıntılar ve gimbal motoru
        sorunlarını nedenler olarak sıralıyor ve kalibrasyon ile pervane değişimini öneriyor.
      advice: Görüntüde sıcak hava dalgası benzeri bozulma görürseniz, kamera arızası varsaymadan önce
        pervanelerde hasar olup olmadığını kontrol edin ve gimbalı kalibre edin; çözüm yeni pervaneler
        kadar ucuz olabilir.
