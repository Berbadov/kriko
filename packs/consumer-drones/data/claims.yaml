      title: Gimbal rubber bumpers break after a crash
      body: On the iFixit teardown page an owner reports the gimbal's rubber bumpers break in a crash;
        another owner notes the frame, connectors, motors and gyroscope are glued in place, making DIY
        repair extremely difficult.
      advice: 'The Neo is not user-serviceable: internal parts are glued, so a crash that breaks the gimbal
        bumpers or frame effectively means replacement or a service-center repair, which can cost close
        to a new unit.'
    tr:
      title: Bir çarpışmadan sonra gimbal kauçuk tamponlar kırılıyor
      body: iFixit söküm sayfasında bir sahip, gimbalin kauçuk tamponlarının bir çarpışmada kırıldığını
        bildiriyor; başka bir sahip ise çerçevenin, konektörlerin, motorların ve jiroskopun yerlerine
        yapıştırıldığını, bunun da kendin yap onarımını son derece zorlaştırdığını belirtiyor.
      advice: 'Neo kullanıcı tarafından bakımı yapılabilir değildir: iç parçalar yapıştırılmıştır, bu
        nedenle gimbal tamponlarını veya çerçeveyi kıran bir çarpışma fiilen değişim veya servis merkezi
        onarımı anlamına gelir; bu da neredeyse yeni bir cihaz kadar pahalıya mal olabilir.'
