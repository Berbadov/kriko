  text:
    en:
      title: DJI Air 3 gimbal overload error with shaking during video and stiff gimbal
      body: An owner on the DJI official forum reports a persistent 'Gimbal Overload' error, heavy shaking
        during video, a gimbal that fails its power-on self-test and feels stiff/blocked at one point,
        plus a strange sound when reaching the zero point. DJI support recommended calibration, which
        did not resolve it; the unit is out of warranty.
      advice: A gimbal that fails self-test and feels mechanically stiff is usually a hardware fault (damaged
        gimbal motor or ribbon cable), not a calibration issue. Expect a full gimbal module replacement
        cost; the Reboot Hub repair guide lists a full gimbal module at $200-280 and identifies the gimbal-to-mainboard
        ribbon cable (DJI part BC.MA.SS000413.01) as a known failure point in minor collisions.
    tr:
      title: DJI Air 3 gimbal aşırı yük hatası, video sırasında sarsıntı ve sert gimbal
      body: DJI resmi forumunda bir sahip, kalıcı bir 'Gimbal Overload' hatası, video sırasında yoğun
        sarsıntı, açılışta kendi kendini test edemeyen ve bir noktada sert/tıkanmış hissedilen bir gimbal
        ile sıfır noktasına ulaşırken garip bir ses bildiriyor. DJI destek kalibrasyon önerdi, ancak bu
        sorunu çözmedi; ünite garanti kapsamı dışında.
      advice: Kendi kendini test edemeyen ve mekanik olarak sert hissedilen bir gimbal genellikle bir
        donanım arızasıdır (hasarlı gimbal motoru veya şerit kablo), kalibrasyon sorunu değildir. Tam
        bir gimbal modülü değişim maliyeti bekleyin; Reboot Hub onarım kılavuzu tam bir gimbal modülünü
        $200-280 olarak listeliyor ve küçük çarpışmalarda bilinen bir arıza noktası olarak gimbal-ana
        kart şerit kablosunu (DJI parça BC.MA.SS000413.01) tanımlıyor.
