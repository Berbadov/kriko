  text:
    en:
      title: Mavic 3 power system ESC error requires a serialized ESC replacement
      body: After a hard landing/crash on a Mavic 3, the owner got Power System hardware error 16100069
        and ESC error 1608002F; forum replies say a persistent error means a bad ESC, and a replacement
        ESC must be serialized to the main board with special software that is expensive.
      advice: 'ESC failure leaves the drone un-flyable, and a replacement is not plug-and-play: it must
        be serialized to the main board, which costs extra and needs specialist software. Factor this
        in for a used unit that has had any hard landing.'
    tr:
      title: Mavic 3 güç sistemi ESC hatası seri numarası atanmış ESC değişimi gerektiriyor
      body: Bir Mavic 3'te sert iniş/çarpışmadan sonra sahip, Güç Sistemi donanım hatası 16100069 ve ESC
        hatası 1608002F aldı; forum yanıtları, kalıcı bir hatanın bozuk ESC anlamına geldiğini ve yedek
        ESC'nin pahalı olan özel yazılımla ana karta seri numarası atanması gerektiğini söylüyor.
      advice: 'ESC arızası dronu uçamaz hale getirir ve değişim tak-çalıştır değildir: ana karta seri
        numarası atanmalıdır; bu ek maliyet getirir ve uzman yazılımı gerektirir. Herhangi bir sert iniş
        yaşamış ikinci el bir cihaz için bunu hesaba katın.'
  evidence:
