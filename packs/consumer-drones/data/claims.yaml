    en:
      title: Mini 4 Pro firmware update over RC 2 fails mid-way at 58% when batteries deplete
      body: On PhantomHelp, an owner reports the over-the-air firmware update via the RC 2 controller
        failed at 58% because the batteries depleted during the update; it succeeded only when done over
        USB with DJI Assistant on a computer.
      advice: OTA firmware updates through the RC 2 can stall and fail if the batteries run low mid-update.
        Use a fully charged setup or update via DJI Assistant on a computer to avoid a failed update.
    tr:
      title: RC 2 üzerinden Mini 4 Pro ürün yazılımı güncellemesi, piller tükendiğinde %58'de yarıda başarısız
        oluyor
      body: PhantomHelp'te bir sahip, RC 2 kumanda üzerinden kablosuz ürün yazılımı güncellemesinin, güncelleme
        sırasında piller tükendiği için %58'de başarısız olduğunu bildiriyor; yalnızca bir bilgisayarda
        DJI Assistant ile USB üzerinden yapıldığında başarılı oldu.
      advice: RC 2 üzerinden OTA ürün yazılımı güncellemeleri, piller güncelleme ortasında azalırsa durabilir
        ve başarısız olabilir. Başarısız bir güncellemeden kaçınmak için tam şarjlı bir kurulum kullanın
