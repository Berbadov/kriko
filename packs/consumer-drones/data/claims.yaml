      title: Mavic 3 gimbal moves irregularly and triggers an app warning
      body: DJI's own troubleshooting doc (German) lists the Mavic 3 among models where the gimbal can
        move irregularly with an app warning; one listed cause is gimbal hardware failure, and DJI directs
        the product back for inspection if calibration does not fix it.
      advice: Gimbal irregular movement is a recognized symptom on the Mavic 3; if calibration does not
        clear it, DJI treats it as hardware failure needing return. Lower severity because it is manufacturer
        troubleshooting rather than a widespread owner-reported failure.
    tr:
      title: Mavic 3 gimbal düzensiz hareket ediyor ve uygulama uyarısını tetikliyor
      body: DJI'nin kendi sorun giderme belgesi (Almanca), gimbalin uygulama uyarısıyla düzensiz hareket
        edebildiği modeller arasında Mavic 3'ü listeliyor; listelenen nedenlerden biri gimbal donanım
        arızası ve kalibrasyon sorunu çözmezse DJI ürünün incelenmek üzere geri gönderilmesini söylüyor.
      advice: Gimbalin düzensiz hareketi Mavic 3'te tanınan bir belirtidir; kalibrasyon bunu gidermezse
        DJI bunu geri gönderim gerektiren donanım arızası olarak değerlendirir. Önem derecesi daha düşük
        çünkü bu, yaygın sahip bildirimli bir arıza değil, üretici sorun gidermesidir.
