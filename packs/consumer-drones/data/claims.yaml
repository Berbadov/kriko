  text:
    en:
      title: DJI Air 3 firmware before 01.00.1600 vulnerable to FTP storage exhaustion (CVE-2026-78251)
      body: 'A documented CVE (CVE-2026-78251) affects the Air 3 on firmware versions before 01.00.1600:
        a hardcoded-credential FTP service lets an attacker fill onboard storage, blocking flight-log
        writes and subsequent firmware updates.'
      advice: This is a security/software issue rather than an owner-reported flight failure, and it requires
        physical or network access to the drone, so it is lower practical risk for a typical pilot. Still,
        keeping the Air 3 on firmware 01.00.1600 or newer closes the vulnerability and avoids the 'firmware
        update fails' symptom the flaw can cause.
    tr:
      title: 01.00.1600 öncesi DJI Air 3 ürün yazılımı FTP depolama tükenmesine karşı savunmasız (CVE-2026-78251)
      body: 'Belgelenmiş bir CVE (CVE-2026-78251), 01.00.1600 öncesi ürün yazılımı sürümlerindeki Air
        3''ü etkiliyor: sabit kodlanmış kimlik bilgilerine sahip bir FTP hizmeti, saldırganın yerleşik
        depolamayı doldurmasına, uçuş günlüğü yazımlarını ve sonraki ürün yazılımı güncellemelerini engellemesine
        olanak tanıyor.'
      advice: Bu, sahip bildirimli bir uçuş arızasından ziyade bir güvenlik/yazılım sorunudur ve drone'a
        fiziksel veya ağ erişimi gerektirir, bu nedenle tipik bir pilot için pratik riski daha düşüktür.
        Yine de Air 3'ü 01.00.1600 veya daha yeni ürün yazılımında tutmak güvenlik açığını kapatır ve
        kusurun yol açabileceği 'ürün yazılımı güncellemesi başarısız' belirtisini önler.
