      title: Atom SE video is choppy except in straight flight; unusable in turns
      body: Verified-purchase review on Alza.cz (Aug 2025) reporting video is choppy except in straight
        flight or climb and unusable in turns. This aligns with the Digital Camera World review noting
        the camera uses EIS rather than a 3-axis gimbal.
      advice: Buyers who need smooth cinematic video should be aware the Atom SE relies on electronic
        stabilization, not a 3-axis gimbal, so footage in turns and wind can be choppy. Photos in good
        light are fine.
    tr:
      title: Atom SE videosu düz uçuş dışında takılıyor; dönüşlerde kullanılamaz
      body: Alza.cz'de doğrulanmış satın alma incelemesi (Ağu 2025), videonun düz uçuş veya tırmanış dışında
        takıldığını ve dönüşlerde kullanılamaz olduğunu bildiriyor. Bu, kameranın 3 eksenli gimbal yerine
        EIS kullandığını belirten Digital Camera World incelemesiyle uyumlu.
      advice: Akıcı sinematik video isteyen alıcılar, Atom SE'nin 3 eksenli gimbal yerine elektronik sabitlemeye
        dayandığını bilmelidir; bu nedenle dönüşlerde ve rüzgarda görüntü takılabilir. İyi ışıkta fotoğraflar
        sorunsuzdur.
