  text:
    en:
      title: DJI Air 3 flyaway at altitude confirmed as manufacturing defect by DJI
      body: On the Litchi forum, an owner reports a flyaway of a 3-year-old Air 3 during a waypoint mission;
        the flight log cut off at 1032m altitude and 3852m distance due to the aircraft disconnecting
        from the RC, and DJI confirmed it as a manufacturing defect and replaced the unit free even without
        warranty.
      advice: This incident involved flying far beyond reliable transmission range, so some of it is pilot
        risk, but DJI itself classified the failure as a manufacturing defect and replaced the aircraft.
        The practical lesson is that a lost RC link at distance can end in a total flyaway, so keep within
        line-of-sight/transmission range and do not rely on automatic RTH to save an out-of-range aircraft.
    tr:
      title: Yükseklikte DJI Air 3 flyaway, DJI tarafından üretim hatası olarak doğrulandı
      body: Litchi forumunda bir sahip, 3 yıllık bir Air 3'ün waypoint görevi sırasında flyaway yaptığını
        bildiriyor; uçuş günlüğü, hava aracının RC'den bağlantısının kesilmesi nedeniyle 1032m yükseklik
        ve 3852m mesafede kesildi ve DJI bunu üretim hatası olarak doğrulayıp garanti olmasa bile birimi
        ücretsiz değiştirdi.
      advice: Bu olay, güvenilir iletim menzilinin çok ötesinde uçmayı içeriyordu, dolayısıyla bunun bir
        kısmı pilot riskidir, ancak DJI'nin kendisi arızayı üretim hatası olarak sınıflandırdı ve hava
        aracını değiştirdi. Pratik ders, mesafede kaybedilen bir RC bağlantısının tam bir flyaway ile
        sonuçlanabileceğidir; bu nedenle görüş hattı/iletim menzili içinde kalın ve menzil dışındaki bir
        hava aracını kurtarmak için otomatik RTH'ye güvenmeyin.
