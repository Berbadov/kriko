      title: Mini 4 Pro reports battery communication error on all three batteries after full charge
      body: A Turkish complaint-site report (non-US source) describes a Mini 4 Pro that, a few months
        after purchase, began showing a battery communication error and 'battery too low, auto landing'
        on all three batteries minutes after a full charge, persisting after service replaced only one
        battery.
      advice: Some owners report a battery communication error across all batteries shortly after a full
        charge, forcing an auto-land warning. Note this is a non-US complaint-site report; if you see
        repeated battery errors, treat the batteries as suspect and push for a full set replacement.
    tr:
      title: Mini 4 Pro, tam şarjdan sonra üç pilin tümünde pil iletişim hatası bildiriyor
      body: Bir Türk şikayet sitesi raporu (ABD dışı kaynak), satın alımdan birkaç ay sonra üç pilin tümünde
        tam şarjdan dakikalar sonra pil iletişim hatası ve 'pil çok düşük, otomatik iniş' göstermeye başlayan
        ve servisin yalnızca bir pili değiştirmesinden sonra da devam eden bir Mini 4 Pro'yu anlatıyor.
      advice: Bazı sahipler, tam şarjdan kısa süre sonra tüm pillerde pil iletişim hatası bildiriyor ve
        bu da otomatik iniş uyarısını zorunlu kılıyor. Bunun ABD dışı bir şikayet sitesi raporu olduğunu
        unutmayın; tekrarlanan pil hataları görürseniz pilleri şüpheli kabul edin ve tam set değişimi
        için ısrar edin.
