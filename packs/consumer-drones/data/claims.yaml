  text:
    en:
      title: DJI Air 3 ESC error 16080021 led to permanent loss of the drone
      body: An owner on the PhantomHelp forum reports abnormal behavior on the first flight with an ESC
        error (code 16080021); DJI support told them to update firmware and calibrate, the problem recurred,
        and the drone was permanently lost. A moderator notes the ESC error 'could suggest there was a
        hardware-related issue with one of the ESCs or motors.'
      advice: An ESC error code (16080021, or 30085/30210 per repair guides) points to a hardware fault
        in the electronic speed controller or motor, and a firmware/calibration fix rarely resolves it.
        Because this can cause a total loss of the aircraft, treat a recurring ESC error as serious and
        push DJI for a hardware inspection under warranty rather than accepting a software-only fix.
    tr:
      title: DJI Air 3 ESC hatası 16080021 dronun kalıcı olarak kaybedilmesine yol açtı
      body: PhantomHelp forumunda bir sahip, ilk uçuşta ESC hatasıyla (kod 16080021) anormal davranış
        bildiriyor; DJI desteği onlara ürün yazılımını güncellemelerini ve kalibrasyon yapmalarını söylemiş,
        sorun tekrarlamış ve drone kalıcı olarak kaybedilmiş. Bir moderatör, ESC hatasının 'ESC'lerden
        veya motorlardan birinde donanımla ilgili bir sorun olduğunu düşündürebileceğini' belirtiyor.
      advice: Bir ESC hata kodu (16080021 veya onarım kılavuzlarına göre 30085/30210), elektronik hız
        denetleyicisinde veya motorda bir donanım arızasına işaret eder ve ürün yazılımı/kalibrasyon düzeltmesi
        bunu nadiren çözer. Bu, hava aracının tamamen kaybedilmesine neden olabileceğinden, tekrarlayan
        bir ESC hatasını ciddiye alın ve yalnızca yazılım düzeltmesini kabul etmek yerine DJI'yi garanti
        kapsamında donanım incelemesi yapmaya zorlayın.
