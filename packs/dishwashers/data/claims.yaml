  text:
    en:
      title: 'Siemens official: E31/E15/E3100 = water protection system activated'
      body: Siemens' own German support page states E31 (along with E15, F15, E3100) means the water protection
        system is activated. This corroborates the owner-reported E31 on the SN65ZX07CE and confirms it
        is a water-leak safety trigger, not a software glitch.
      advice: 'Treat E31 as a potential leak. Siemens explicitly advises against self-repair for health/safety
        reasons: close the water tap, switch the unit off, and book a service visit. Expect a technician
        diagnosis rather than a user fix.'
    tr:
      title: 'Siemens resmi: E31/E15/E3100 = su koruma sistemi devreye girdi'
      body: Siemens'in kendi Almanca destek sayfası, E31'in (E15, F15, E3100 ile birlikte) su koruma sisteminin
        devreye girdiği anlamına geldiğini belirtiyor. Bu, SN65ZX07CE'de sahibi tarafından bildirilen
        E31'i doğruluyor ve bunun bir yazılım arızası değil, su kaçağı güvenlik tetikleyicisi olduğunu
        teyit ediyor.
      advice: 'E31''i potansiyel bir kaçak olarak değerlendirin. Siemens, sağlık/güvenlik nedenleriyle
        kendi kendine onarımı açıkça önermiyor: su musluğunu kapatın, cihazı kapatın ve bir servis ziyareti
        ayarlayın. Kullanıcı çözümü yerine teknisyen teşhisi bekleyin.'
