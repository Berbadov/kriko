      title: Loose door lock wiring connector stops DIS15022 from starting any cycle
      body: 'This is an owner''s own repair record on the exact DIS15022 model: a loose door-lock wiring
        connector inside the door panel made the machine read the door as permanently open, so it powered
        on but refused to start any programme. The reset procedure in the thread did not fix it; the owner
        had to open the door panel and reseat the connector.'
      advice: If a DIS15022 powers on but will not start a cycle and shows no error code, first try the
        cancel/reset procedure (hold Programme Selection/Programme Cancel for 3 seconds). If that fails,
        the likely cause is the door lock wiring connector inside the door panel working loose; reseating
        it is a DIY fix. A service call to diagnose a no-start typically costs a call-out fee before any
        part is touched.
