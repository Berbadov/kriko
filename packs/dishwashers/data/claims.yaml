        series, which lists model code DW90F89T0UMTAA). Samsung documents the 7E/7C error as the reflector
        being blocked, mispositioned, or misinstalled. The official fix is user-level (remove obstruction,
        reseat vane, power cycle), but if the reflector or its drive fails mechanically, the error recurs
        and requires service.
      advice: If this unit throws 7E/7C, first check for a blocked reflector (pot handle, large knife,
        ladle) and reseat the vane on the gray shuttle. If the error persists after clearing obstructions
        and power-cycling, the WaterWall drive assembly likely needs a service visit — this is the single
        most documented failure mode for this model family.
