      body: Owner complaint (Esra/Salih, Samsun) on Şikayetvar, from the search 'Arçelik A 600 B Star
        bulaşık makinesi sorun'. A new A600B left plates spotted and foamy and did not rinse properly
        from the day of installation; switching detergents at the service's request changed nothing, and
        the replacement request was refused after 4 service visits.
      advice: This is a second independent owner reporting the same new-unit wash/rinse failure, so it
        is a recurring pattern rather than a one-off. A buyer should test rinse quality early and expect
        the manufacturer to attribute it to detergent before any part-level fix.
    tr:
