  text:
    en:
      title: 5C error code — drain pump problem (documented in model-specific manual FAQ)
      body: The 5C error indicates a drain pump problem; the manual advises checking the pump cover and
        for jams. This is a documented failure mode for this exact model.
      advice: If 5C appears, first check the drain pump cover is correctly assembled and the pump isn't
        jammed (often food debris). If it persists, the drain pump itself may need replacement — a service
        visit.
    tr:
      title: 5C hata kodu — tahliye pompası sorunu (modele özgü kılavuz SSS'de belgelenmiş)
      body: 5C hatası bir tahliye pompası sorununa işaret eder; kılavuz pompa kapağının ve sıkışmaların
        kontrol edilmesini önerir. Bu, tam bu model için belgelenmiş bir arıza modudur.
      advice: 5C görünürse, önce tahliye pompası kapağının doğru takıldığını ve pompanın sıkışmadığını
        (genellikle yemek artıkları) kontrol edin. Devam ederse, tahliye pompasının kendisi değiştirilmesi
        gerekebilir — bir servis ziyareti.
  evidence:
