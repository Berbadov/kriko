        gevşek bir kapı kilidi kablolama konektörü, makinenin kapıyı kalıcı olarak açık okumasına neden
        oldu, bu yüzden açılıyor ancak herhangi bir programı başlatmayı reddediyordu. Konudaki sıfırlama
        prosedürü bunu düzeltmedi; sahibi kapı panelini açıp konektörü yeniden yerine oturtmak zorunda
        kaldı.'
      advice: Bir DIS15022 açılıyor ancak bir program başlatmıyor ve hata kodu göstermiyorsa, önce iptal/sıfırlama
