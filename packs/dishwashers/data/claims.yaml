        alarmları ~%20. Kılavuz, beş DW80 varyantının da tek bir platformu ve parça kataloğunu paylaştığını
        belirtiyor.'
      advice: Bu modeli alırsanız, en olası arıza noktasının tahliye yolu olmasını bekleyin; teknisyen
