  text:
    en:
      title: Hover-1 Helix lithium-ion battery can overheat and ignite (CPSC recall 24-065)
      body: Official CPSC recall (24-065) of December 21, 2023, covering about 25,000 Hover-1 Helix hoverboards
        in Camouflage and Galaxy colors with serial numbers containing 15914, 19203, or 19988 as the fifth
        code.
      advice: If you own a Helix in these colors, check the serial number on the bottom label; if it matches,
        stop using it immediately and contact Hover-1 (888-556-8426) for a free replacement. DGL reports
        three fires, five smoke-inhalation injuries (headaches, nausea, coughs), and about $25,000 in
        property damage.
    tr:
      title: Hover-1 Helix lityum iyon pili aşırı ısınabilir ve tutuşabilir (CPSC geri çağırma 24-065)
      body: 21 Aralık 2023 tarihli resmi CPSC geri çağırması (24-065), Kamuflaj ve Galaksi renklerinde,
        seri numaralarının beşinci kodu olarak 15914, 19203 veya 19988 içeren yaklaşık 25.000 Hover-1
        Helix hoverboard'u kapsıyor.
      advice: Bu renklerde bir Helix'iniz varsa, alt etiketteki seri numarasını kontrol edin; eşleşiyorsa
        hemen kullanmayı bırakın ve ücretsiz değişim için Hover-1 (888-556-8426) ile iletişime geçin.
        DGL üç yangın, beş duman soluma yaralanması (baş ağrısı, mide bulantısı, öksürük) ve yaklaşık
        25.000 $ maddi hasar bildiriyor.
