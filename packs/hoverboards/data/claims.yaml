      advice: Eylül 2016 ile Ağustos 2017 arasında üretilmiş bir Hovertrax 2.0'a sahipseniz, pil paketinde
        GLW etiketi/seri numarası olup olmadığını kontrol edin. Varsa, kullanmayı hemen durdurun ve ön
        ödemeli iade kutusu ve ücretsiz yedek pil için Razor (866-467-2967) ile iletişime geçin. Geri
