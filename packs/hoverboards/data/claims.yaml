        nasıl teşhis edileceğini açıklıyor ve arızalı bir bataryanın gecikmeli tekerlek tepkisine de neden
        olabileceğini belirtiyor.
      advice: Tam şarjdan sonra batarya seviyesi ışığı sarı kalırsa, batarya büyük olasılıkla arızalıdır
