      advice: If you own a Hovertrax 2.0 built between September 2016 and August 2017, check the battery
        pack for a GLW label/serial. If present, stop using it immediately and contact Razor (866-467-2967)
        for a prepaid return box and free replacement battery. The recall covers ~237,300 units with 20+
        overheating reports including smoke/fire.
