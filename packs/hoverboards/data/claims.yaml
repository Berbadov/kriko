    en:
      title: Gotrax hoverboard battery discharges unevenly on one side, unusable
      body: A verified buyer reports the battery on one side of a Gotrax hoverboard discharges very quickly,
        leaving the board unusable, with a stated loss of $110. The review does not name the specific
        model, so it applies to Gotrax hoverboards generally rather than the Hoverfly Plus specifically.
      advice: If buying a Gotrax hoverboard, budget for the possibility of an early battery failure; the
        owner reports a $110 loss and that the board cannot be used when one side's battery drains fast.
    tr:
      title: Gotrax hoverboard pili bir tarafta dengesiz boşalıyor, kullanılamaz
      body: Doğrulanmış bir alıcı, bir Gotrax hoverboard'un bir tarafındaki pilin çok hızlı boşaldığını
        ve tahtayı kullanılamaz hale getirdiğini, belirtilen 110 $ kayıp olduğunu bildiriyor. İnceleme
        belirli modeli adlandırmıyor, bu nedenle özellikle Hoverfly Plus yerine genel olarak Gotrax hoverboard'lar
        için geçerlidir.
      advice: Bir Gotrax hoverboard satın alıyorsanız, erken pil arızası olasılığı için bütçe ayırın;
        sahibi 110 $ kayıp bildiriyor ve bir tarafın pili hızla tükendiğinde tahtanın kullanılamadığını
        söylüyor.
