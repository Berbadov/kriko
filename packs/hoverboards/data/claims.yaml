    en:
      title: 'CPSC recall 16-211: Swagway self-balancing scooters/hoverboards battery pack can overheat,
        smoke, catch fire or explode'
      body: 'This is the official CPSC recall (16-211) of Swagway self-balancing scooters/hoverboards,
        267,000 units, with 42 reported incidents of battery packs smoking/catching fire/exploding and
        16 injuries. Caveat: the companion 10-firm recall table identifies the recalled Swagway model
        as ''Swagway X1'', so this official recall covers the X1, not the X2.'
      advice: If considering a Swagway X1, this is a documented, officially recalled fire hazard — do
        not buy one that was not remedied. For the X2, this recall does not directly name it, so treat
        it as context, not proof about the X2.
    tr:
      title: 'CPSC geri çağırma 16-211: Swagway kendi kendini dengeleyen scooter''lar/hoverboard''lar
        pil paketi aşırı ısınabilir, duman çıkarabilir, alev alabilir veya patlayabilir'
      body: 'Bu, Swagway kendi kendini dengeleyen scooter''lar/hoverboard''ların resmi CPSC geri çağırmasıdır
        (16-211), 267.000 adet, pil paketlerinin duman çıkardığı/alev aldığı/patladığına dair 42 bildirilen
        olay ve 16 yaralanma. Uyarı: eşlik eden 10 firma geri çağırma tablosu, geri çağrılan Swagway modelini
        ''Swagway X1'' olarak tanımlıyor, bu nedenle bu resmi geri çağırma X1''i kapsar, X2''yi değil.'
      advice: Bir Swagway X1 düşünüyorsanız, bu belgelenmiş, resmi olarak geri çağrılmış bir yangın tehlikesidir
        — giderilmemiş bir tane satın almayın. X2 için, bu geri çağırma doğrudan onu adlandırmıyor, bu
        nedenle bunu bağlam olarak ele alın, X2 hakkında kanıt olarak değil.
