      body: The Gotrax Hoverfly Plus carries UL 2272 certification, the U.S. safety standard for hoverboard
        electrical drive trains and battery systems introduced after the 2016 hoverboard fire recalls.
        No CPSC recall or documented battery fire was found for this specific model in any of the 7 searches
        run. This certification provides baseline fire safety assurance, though the owner-reported battery
        defect above shows individual units can still develop problems.
      advice: UL 2272 certification is a meaningful safety baseline, but it does not guarantee every unit's
        battery will perform reliably; budget for potential battery issues.
