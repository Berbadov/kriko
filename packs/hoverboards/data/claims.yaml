  text:
    en:
      title: Hover-1 AllStar battery fire while charging destroyed a home (CPSC incident report)
      body: This finding came from the search 'Hover-1 AllStar fire' and 'Hover-1 AllStar CPSC'.
      advice: A documented CPSC incident report records a Hover-1 AllStar hoverboard catching fire while
        charging and destroying a home in Worcester, MA on 2/28/2024. Note the report flags that the chargers
        found were not the same brand as the board and that the tamper seal was broken, so the fire's
        cause is not conclusively the board itself; still, it is an official record of an AllStar fire.
        Buyers should charge only with the supplied charger and never leave the board charging unattended.
    tr:
      title: Hover-1 AllStar pili şarj olurken yangın bir evi yok etti (CPSC olay raporu)
      body: Bu bulgu 'Hover-1 AllStar fire' ve 'Hover-1 AllStar CPSC' aramalarından geldi.
      advice: Belgelenmiş bir CPSC olay raporu, 2/28/2024 tarihinde Worcester, MA'da şarj olurken alev
        alan ve bir evi yok eden bir Hover-1 AllStar hoverboard'u kaydediyor. Raporun, bulunan şarj cihazlarının
        tahtayla aynı marka olmadığını ve kurcalama mührünün kırıldığını işaret ettiğini unutmayın, bu
        nedenle yangının nedeni kesin olarak tahtanın kendisi değildir; yine de bu, bir AllStar yangınının
        resmi kaydıdır. Alıcılar yalnızca birlikte verilen şarj cihazıyla şarj etmeli ve tahtayı asla
        gözetimsiz şarjda bırakmamalıdır.
  evidence:
