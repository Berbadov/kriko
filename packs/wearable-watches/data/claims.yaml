        only fix is a factory reset from recovery mode without restoring a backup, meaning the watch must
        be reconfigured weekly.'
      advice: A buyer should know that screen freezes on this unit were not fixable by normal means and
        forced weekly factory resets, which is a serious usability cost. This is a recurring, not one-off,
        fault for this owner.
    tr:
