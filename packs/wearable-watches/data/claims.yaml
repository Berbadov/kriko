  text:
    en:
      title: Xiaomi Smart Band 8 stops accepting charge near empty battery after ~2 years
      body: A Turkish owner reports the band stopped taking a charge at ~5% battery after two years; the
        cable and pogo pins were verified to deliver 5V, so the fault is internal to the band.
      advice: A band that stops charging near empty is effectively dead after warranty. The owner had
        to troubleshoot cable, contacts and power source before concluding the fault was internal. Cost
        is a full replacement.
    tr:
      title: Xiaomi Smart Band 8, yaklaşık 2 yıl sonra boş bataryaya yakınken şarj kabul etmeyi bırakıyor
      body: Bir Türk sahibi, bandın iki yıl sonra yaklaşık %5 bataryada şarj almayı bıraktığını bildiriyor;
        kablo ve pogo pinlerin 5V sağladığı doğrulandı, bu nedenle arıza bandın içindedir.
      advice: Boşalmaya yakınken şarj olmayı bırakan bir band, garanti sonrasında fiilen ölmüştür. Sahibinin,
        arızanın iç kaynaklı olduğu sonucuna varmadan önce kabloyu, temas noktalarını ve güç kaynağını
        sorun gidermesi gerekti. Maliyet, tam bir değişimdir.
