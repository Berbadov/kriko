    en:
      title: Bip 5 IP68 claim fails in practice — watch dies on water contact
      body: Two separate verified Czech reviews on Alza.hu (Nov 2024 and Sep 2024) report the watch dying
        after water contact despite the IP68 rating; both warranty claims were rejected with 'unknown
        fluid ingress'.
      advice: Do not rely on the IP68 rating for any water exposure — even tap splash killed units, and
        the manufacturer rejected the claims. Treat it as a splash-resistant watch at most.
    tr:
      title: Bip 5 IP68 iddiası pratikte başarısız — saat su temasıyla ölüyor
      body: Alza.hu üzerindeki iki ayrı doğrulanmış Çek incelemesi (Kasım 2024 ve Eylül 2024), IP68 derecesine
        rağmen saatin su temasından sonra öldüğünü bildiriyor; her iki garanti talebi de 'bilinmeyen sıvı
        girişi' gerekçesiyle reddedildi.
      advice: Herhangi bir su maruziyeti için IP68 derecesine güvenmeyin — musluk sıçraması bile cihazları
        öldürdü ve üretici talepleri reddetti. En fazla sıçramaya dayanıklı bir saat olarak değerlendirin.
