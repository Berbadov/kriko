        çözüm, yedek geri yüklemeden kurtarma modundan fabrika ayarlarına sıfırlama, yani saatin her hafta
        yeniden yapılandırılması gerekiyor.'
      advice: Bir alıcı, bu birimdeki ekran donmalarının normal yollarla düzeltilemediğini ve haftalık
        fabrika ayarlarına sıfırlamaları zorunlu kıldığını bilmelidir; bu ciddi bir kullanılabilirlik
