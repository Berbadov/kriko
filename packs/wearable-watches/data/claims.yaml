  text:
    en:
      title: Bip 5 Bluetooth connection drops repeatedly, needs resets
      body: 'Canadian Amazon review (July 2024) — the watch repeatedly drops the phone connection and
        requires resets; after a software update it stopped tracking health data entirely. A Finnish retail
        review (Verkkokauppa) independently confirms: ''Muuten toimiva laite, mutta välillä kadottaa yhteyden
        kännykkään'' (works but occasionally loses connection to the phone).'
      advice: Expect to re-pair the watch regularly; if you rely on notifications, verify they arrive
        reliably before committing.
    tr:
      title: Bip 5 Bluetooth bağlantısı tekrar tekrar kopuyor, sıfırlama gerektiriyor
      body: 'Kanada Amazon incelemesi (Temmuz 2024) — saat telefon bağlantısını tekrar tekrar koparıyor
        ve sıfırlama gerektiriyor; bir yazılım güncellemesinden sonra sağlık verilerini tamamen izlemeyi
        bıraktı. Bir Finlandiya perakende incelemesi (Verkkokauppa) bağımsız olarak doğruluyor: ''Muuten
        toimiva laite, mutta välillä kadottaa yhteyden kännykkään'' (çalışıyor ama ara sıra telefona bağlantıyı
        kaybediyor).'
      advice: Saati düzenli olarak yeniden eşleştirmeyi bekleyin; bildirimlere güveniyorsanız, taahhütte
        bulunmadan önce bunların güvenilir şekilde geldiğini doğrulayın.
