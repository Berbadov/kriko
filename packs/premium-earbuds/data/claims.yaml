      body: Found via Best Buy customer review (rated 2/5). Owner reports the right earbud progressively
        failed to charge and then stopped charging entirely within 3.5 months of purchase, with no fix
        from re-seating or re-pairing.
      advice: If buying, verify the charging behavior of both earbuds within the return window. If the
        right earbud fails to charge, this is a documented hardware failure, not user error.
    tr:
      title: Sağ kulaklık yaklaşık 3,5 ay kullanımdan sonra tamamen şarj olmayı bırakıyor
      body: Best Buy müşteri incelemesiyle bulundu (2/5 olarak derecelendirildi). Sahibi, sağ kulaklığın
        giderek şarj olmadığını ve satın almadan sonraki 3,5 ay içinde tamamen şarj olmayı bıraktığını,
        yeniden yerleştirme veya yeniden eşleştirmenin çözüm olmadığını bildiriyor.
      advice: Satın alacaksanız, iade süresi içinde her iki kulaklığın şarj davranışını doğrulayın. Sağ
        kulaklık şarj olmuyorsa, bu kullanıcı hatası değil, belgelenmiş bir donanım arızasıdır.
