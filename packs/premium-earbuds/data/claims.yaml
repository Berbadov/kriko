    en:
      title: Left earbud emits terrible static sound triggered by walking or bus vibration within 3 months
      body: Amazon SG customer review from Japan (Oct 2024). Owner reports the left earbud produced painful
        static noise triggered by physical movement (walking, bus vibration) within 3 months of careful
        use. This is the owner's second Jabra pair to fail within a year.
      advice: The static is triggered by physical motion, suggesting a loose internal connection or defective
        driver. This failure appeared within 3 months — well inside a typical warranty — so test under
        movement (walking, public transport) early and claim warranty if it occurs.
    tr:
      title: Sol kulaklık 3 ay içinde yürüme veya otobüs titreşimiyle tetiklenen korkunç statik ses yayıyor
      body: Japonya'dan Amazon SG müşteri incelemesi (Ekim 2024). Sahibi, sol kulaklığın dikkatli kullanımın
        3 ayı içinde fiziksel hareketle (yürüme, otobüs titreşimi) tetiklenen acı verici statik gürültü
        ürettiğini bildiriyor. Bu, sahibin bir yıl içinde arızalanan ikinci Jabra çifti.
      advice: Statik, fiziksel hareketle tetikleniyor; bu da gevşek bir iç bağlantıya veya arızalı sürücüye
        işaret ediyor. Bu arıza 3 ay içinde ortaya çıktı — tipik bir garanti süresinin oldukça içinde
        — bu yüzden hareket altında (yürüme, toplu taşıma) erken test edin ve olursa garanti talebinde
        bulunun.
