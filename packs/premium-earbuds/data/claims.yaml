  text:
    en:
      title: Right earbud emits constant black noise in ANC and hear-through modes
      body: Amazon AU verified-purchase review (April 2024). Owner reports persistent static/white noise
        in the right earbud whenever ANC or hear-through is active, persisting after firmware reinstall.
        The reviewer notes this appears to be a common issue online.
      advice: If buying, expect that ANC/hear-through modes may produce audible static in one earbud.
        Test ANC immediately within the return window; firmware reinstall does not fix it per this owner.
        Jabra customer support reportedly did not resolve it.
    tr:
      title: Sağ kulaklık ANC ve şeffaf modda sürekli siyah gürültü yayıyor
      body: Amazon AU doğrulanmış satın alma incelemesi (Nisan 2024). Sahibi, ANC veya şeffaf mod aktif
        olduğunda sağ kulaklıkta kalıcı statik/beyaz gürültü olduğunu ve yazılım yeniden yüklendikten
        sonra da devam ettiğini bildiriyor. İnceleyen, bunun internette yaygın bir sorun olduğunu belirtiyor.
      advice: Satın alacaksanız, ANC/şeffaf modların bir kulaklıkta duyulabilir statik üretebileceğini
        bekleyin. ANC'yi iade süresi içinde hemen test edin; bu sahibe göre yazılım yeniden yükleme sorunu
        çözmüyor. Jabra müşteri desteğinin bunu çözmediği bildiriliyor.
