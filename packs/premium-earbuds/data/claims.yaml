      advice: If the buyer uses these in loud settings (commutes, transit, construction), they should
        expect intermittent crackling/static from the ANC microphones. Bose will treat it as normal and
        not a warranty fault, so it cannot be fixed by replacement.
    tr:
      title: Bose, gürültülü ortamlarda ANC altında çıtırtı/statik sesin 'normal' olduğunu doğruluyor
      body: Bose'un kendi destek bülteni, gürültülü ortamlarda gürültü engelleme altında çıtırtı veya
        bozulmanın ANC mikrofonlarının beklenen davranışı ve 'normal' olduğunu, kusur olmadığını belirtiyor.
      advice: Alıcı bunları gürültülü ortamlarda (işe gidiş-geliş, toplu taşıma, inşaat) kullanırsa, ANC
        mikrofonlarından aralıklı çıtırtı/statik ses beklemelidir. Bose bunu normal sayacak ve garanti
        arızası olarak değerlendirmeyecek, bu nedenle değişimle düzeltilemez.
