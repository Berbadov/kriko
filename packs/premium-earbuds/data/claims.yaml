      title: AirPods Pro 2 left earbud battery dies within 45 minutes at month 13, after warranty
      body: 'A reliability engineer''s documented failure and component-level Weibull analysis: the left
        bud''s battery degraded to under 45 minutes of life one month after Apple''s one-year warranty
        expired, and the analysis identifies the bud batteries (not the ANC/H2 chip) as the dominant failure
        mode, with system reliability dropping to ~56% by year three.'
      advice: Battery degradation is the main long-term failure risk on AirPods Pro 2 and typically shows
        up just after the one-year warranty ends, so a replacement is out-of-pocket. If you plan to keep
        them past a year, weigh AppleCare+ or a retailer's extended warranty against this known battery
        wear-out profile.
    tr:
      title: AirPods Pro 2 sol kulaklık pili 13. ayda, garanti sonrası 45 dakika içinde bitiyor
      body: 'Bir güvenilirlik mühendisinin belgelenmiş arızası ve bileşen düzeyinde Weibull analizi: sol
        kulaklığın pili, Apple''ın bir yıllık garantisinin bitmesinden bir ay sonra 45 dakikanın altına
        düştü ve analiz, baskın arıza modu olarak (ANC/H2 çipi değil) kulaklık pillerini tanımlıyor; sistem
        güvenilirliği üçüncü yıla kadar ~%56''ya düşüyor.'
      advice: Pil bozulması AirPods Pro 2'de ana uzun vadeli arıza riskidir ve genellikle bir yıllık garanti
        bittikten hemen sonra ortaya çıkar, bu nedenle değişim cepten yapılır. Bir yıldan uzun süre kullanmayı
        planlıyorsanız, AppleCare+ veya satıcının genişletilmiş garantisini bu bilinen pil aşınma profiline
        karşı tartın.
