      title: ANC on Jabra Elite 10 appears to make no audible difference (owner reports possible defect)
      body: An owner on the ComputerBase forum reports hearing no difference between ANC on and off on
        the Elite 10, and a fellow poster concludes such units are defective and should be exchanged.
      advice: If you buy and ANC seems to do nothing, verify the app firmware is current and try a firm
        reseat; if there is still no audible difference between ANC on/off, treat it as a likely defective
        unit and exchange under warranty rather than accepting it.
    tr:
      title: Jabra Elite 10'da ANC duyulabilir bir fark yaratmıyor gibi görünüyor (sahip olası kusur bildiriyor)
      body: ComputerBase forumunda bir sahip, Elite 10'da ANC açık ve kapalı arasında hiçbir fark duymadığını
        bildiriyor ve bir başka gönderici bu tür ünitelerin kusurlu olduğu ve değiştirilmesi gerektiği
        sonucuna varıyor.
      advice: Satın alırsanız ve ANC hiçbir şey yapmıyor gibi görünüyorsa, uygulama yazılımının güncel
        olduğunu doğrulayın ve sıkıca yeniden oturtmayı deneyin; ANC açık/kapalı arasında hâlâ duyulabilir
        bir fark yoksa, bunu kabul etmek yerine muhtemelen kusurlu bir ünite olarak değerlendirin ve garanti
        kapsamında değiştirin.
