  text:
    en:
      title: Apple officially acknowledges AirPods Pro 2 ANC audio problems from blocked microphones
      body: Apple's official support document for AirPods Pro 2 (and other ANC models) states that blocked
        or covered external microphones can temporarily cause high-pitched sounds, feedback, or other
        audio-performance problems under ANC — official acknowledgment that ANC-related audio faults occur
        on this model.
      advice: Apple itself documents ANC audio faults (high-pitched sounds, feedback) on AirPods Pro 2
        tied to the external microphones. If you hear such noise, first check/clean the mic openings and
        run the ear-tip fit test before assuming a hardware defect — but a persistent fault in a quiet
        room is the documented owner-reported defect above.
    tr:
      title: Apple, AirPods Pro 2'de tıkanmış mikrofonlardan kaynaklanan ANC ses sorunlarını resmen kabul
        ediyor
      body: Apple'ın AirPods Pro 2 (ve diğer ANC modelleri) için resmi destek belgesi, tıkanmış veya kapatılmış
        harici mikrofonların ANC altında geçici olarak yüksek perdeli seslere, geri beslemeye veya diğer
        ses performansı sorunlarına neden olabileceğini belirtiyor — bu modelde ANC ile ilgili ses arızalarının
        oluştuğuna dair resmi kabul.
      advice: Apple'ın kendisi, AirPods Pro 2'de harici mikrofonlara bağlı ANC ses arızalarını (yüksek
        perdeli sesler, geri besleme) belgeliyor. Böyle bir gürültü duyarsanız, önce mikrofon açıklıklarını
        kontrol edin/temizleyin ve donanım arızası olduğunu varsaymadan önce kulak ucu uyum testini çalıştırın
        — ancak sessiz bir odada kalıcı bir arıza, yukarıda belgelenen sahip bildirimli arızadır.
  evidence:
