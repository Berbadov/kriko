  text:
    en:
      title: Owner reports plastic of power/switch block melting on Xiaomi Mi Smart Space Heater S
      body: An owner of the international version (KRDNQ03ZM) reports that on inspection the plastic of
        the on/off switch block is visibly melting, alongside a persistent smell and a loose internal
        part that causes the unit to switch off when moved. Visible melting of switch-block plastic is
        an overheating/fire hazard signal independent of the Turkish report.
      advice: Inspect the switch block area for deformation or melting; if the plastic is softening, stop
        using the heater and seek service or replacement.
    tr:
      title: Sahip, Xiaomi Mi Smart Space Heater S'te güç/açma-kapama bloğunun plastiğinin eridiğini bildiriyor
      body: Uluslararası sürümün (KRDNQ03ZM) bir sahibi, incelemede açma/kapama anahtarı bloğunun plastiğinin
        gözle görülür şekilde eridiğini, bunun yanı sıra kalıcı bir koku ve cihaz hareket ettirildiğinde
        kapanmasına neden olan gevşek bir iç parça olduğunu bildiriyor. Anahtar bloğu plastiğinin gözle
        görülür şekilde erimesi, Türkiye'deki rapordan bağımsız bir aşırı ısınma/yangın tehlikesi işaretidir.
      advice: Anahtar bloğu bölgesini deformasyon veya erime açısından inceleyin; plastik yumuşuyorsa
        ısıtıcıyı kullanmayı durdurun ve servis veya değişim talep edin.
