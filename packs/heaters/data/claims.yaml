  text:
    en:
      title: TRD41025B enters an un-resettable safety mode and will not turn back on
      body: On the Darty certified-owner forum for the TRD41025B, an owner reports the radiator went into
        safety mode and could not be turned back on; the manual directs them to contact service, with
        the repair quoted at over 100 euros. A second owner reports the same 'won't turn on' failure.
        The manual confirms the unit has a safety device that switches it off on accidental overheating
        and must be reset via Customer Experience, so a lockout is a real, costly failure mode for this
        exact model. This came from the 'De'Longhi Dragon4 TRD41025 common problems' search.
      advice: If the unit trips into safety mode, expect that it may not reset without service support;
        factor in the cost and distance of an authorized repair when buying.
    tr:
      title: TRD41025B sıfırlanamayan bir güvenlik moduna giriyor ve tekrar açılmıyor
      body: TRD41025B için Darty sertifikalı sahip forumunda bir sahip, radyatörün güvenlik moduna girdiğini
        ve tekrar açılamadığını bildiriyor; kılavuz onları servisle iletişime geçmeye yönlendiriyor ve
        onarım için 100 avronun üzerinde fiyat veriliyor. İkinci bir sahip de aynı "açılmıyor" arızasını
        bildiriyor. Kılavuz, birimin kazara aşırı ısınma durumunda onu kapatan ve Müşteri Deneyimi aracılığıyla
        sıfırlanması gereken bir güvenlik cihazına sahip olduğunu doğruluyor, dolayısıyla kilitlenme bu
        tam model için gerçek ve maliyetli bir arıza modudur. Bu, "De'Longhi Dragon4 TRD41025 yaygın sorunlar"
        aramasından geldi.
      advice: Birim güvenlik moduna girerse, servis desteği olmadan sıfırlanmayabileceğini bekleyin; satın
        alırken yetkili onarımın maliyetini ve mesafesini hesaba katın.
