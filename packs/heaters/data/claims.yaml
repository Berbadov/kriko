      title: De'Longhi oil-filled radiator control panel (1980–1988) electrical failures — CPSC recall
        91-108
      body: 'Primary regulator recall (CPSC Release #91-108, 1991-08-15) covering De''Longhi oil-filled
        radiators made 1980–1988. Identified units by a silver sticker on the underside of the control
        box beginning with digits 80–88; a small number sold under Sears/Welbilt carry code 816F. The
        Commission judged electrical failures inside the control panels a potential fire hazard; De''Longhi
        offered free replacement control panels.'
      advice: An owner of a 1980–1988 De'Longhi oil-filled radiator should check the sticker on the underside
        of the control box; if it begins with 80–88 (or the unit is a Sears/Welbilt with code 816F), the
        control panel carries a documented potential fire hazard and was subject to a free replacement
        program. The CPSC noted no fires or injuries were reported at the time of the recall, but the
        hazard is fire-classified and high severity.
    tr:
      title: De'Longhi yağ dolu radyatör kontrol paneli (1980–1988) elektriksel arızalar — CPSC geri çağırma
        91-108
      body: '1980–1988 yıllarında üretilen De''Longhi yağ dolu radyatörleri kapsayan birincil düzenleyici
        geri çağırma (CPSC Yayın #91-108, 1991-08-15). Birimleri kontrol kutusunun altındaki 80–88 rakamlarıyla
        başlayan gümüş bir etiketle tanımladı; Sears/Welbilt altında satılan az sayıda birim 816F kodunu
        taşıyor. Komisyon, kontrol panelleri içindeki elektriksel arızaları potansiyel yangın tehlikesi
        olarak değerlendirdi; De''Longhi ücretsiz yedek kontrol panelleri sundu.'
      advice: 1980–1988 De'Longhi yağ dolu radyatör sahibi, kontrol kutusunun altındaki etiketi kontrol
        etmelidir; 80–88 ile başlıyorsa (veya birim 816F kodlu bir Sears/Welbilt ise), kontrol paneli
        belgelenmiş bir potansiyel yangın tehlikesi taşır ve ücretsiz değişim programına tabiydi. CPSC,
        geri çağırma sırasında yangın veya yaralanma bildirilmediğini belirtti, ancak tehlike yangın sınıfında
