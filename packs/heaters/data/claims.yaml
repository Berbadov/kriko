  text:
    en:
      title: Body surface exceeds 70°C even in minimum mode — burn risk for children
      body: An owner measured surface temperatures above 70°C even in minimum mode and about 90°C at maximum,
        calling it a hazard where small children are present. This is an owner-reported burn risk on the
        hot metal body, consistent with the manufacturer's own 'can become very hot and cause burns' warning.
        It came from the 'common problems' search.
      advice: Keep children and pets away from the body, and position the heater at least the manual's
        recommended distance from furniture; the outer surfaces get hot enough to cause burns even on
        the lowest setting.
    tr:
      title: Gövde yüzeyi minimum modda bile 70°C'yi aşıyor — çocuklar için yanık riski
      body: Bir sahip, minimum modda bile 70°C'nin üzerinde ve maksimumda yaklaşık 90°C yüzey sıcaklıkları
        ölçtü ve küçük çocukların bulunduğu yerlerde bunu bir tehlike olarak nitelendirdi. Bu, üreticinin
        kendi "çok sıcak hale gelebilir ve yanıklara neden olabilir" uyarısıyla tutarlı olarak, sıcak
        metal gövdede sahip tarafından bildirilen bir yanık riskidir. "Yaygın sorunlar" aramasından geldi.
      advice: Çocukları ve evcil hayvanları gövdeden uzak tutun ve ısıtıcıyı kılavuzun önerdiği mesafeden
        en az mobilyalardan uzak konumlandırın; dış yüzeyler en düşük ayarda bile yanıklara neden olacak
        kadar ısınır.
  evidence:
  - url: https://hotline.ua/ua/bt-obogrevateli/delonghi-trd40820e/?tab=reviews
