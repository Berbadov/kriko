        kaçınılacak net şeyler verir. Bu, 'De'Longhi TRD41025 şikayet' aramasından geldi.
      advice: Radyatör açıkken asla üstünü örtmeyin ve çamaşır kurutmak için kullanmayın; gövdeden hiç
        yağ sızarsa, kullanmayı bırakın ve De'Longhi servisine bildirin.
