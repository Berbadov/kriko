  text:
    en:
      title: Xiaomi Fan Heater internal melting and fire risk after ~1 month of use
      body: An owner who bought the Xiaomi fan heater from Teknosa reports that after about one month
        of use, left on overnight, the unit produced a strong smell and melted internally; the authorized
        service refused repair calling it 'user error', and the owner states this is a serious fire and
        life-safety risk especially while sleeping.
      advice: Do not run this fan heater unattended (e.g. overnight). If you smell burning or see signs
        of internal melting, stop using it immediately and do not accept a 'user error' dismissal — push
        for inspection or replacement. The owner's report shows the unit did not protect itself from an
        internal melt condition.
    tr:
      title: Xiaomi Fan Heater ~1 ay kullanımdan sonra içten erime ve yangın riski
      body: Teknosa'dan Xiaomi fanlı ısıtıcı satın alan bir sahip, yaklaşık bir ay kullanımdan sonra,
        gece boyunca açık bırakıldığında, cihazın güçlü bir koku yaydığını ve içten eridiğini bildiriyor;
        yetkili servis bunu 'kullanıcı hatası' diyerek onarımı reddetti ve sahip bunun özellikle uyurken
        ciddi bir yangın ve can güvenliği riski olduğunu belirtiyor.
      advice: Bu fanlı ısıtıcıyı gözetimsiz (ör. gece boyunca) çalıştırmayın. Yanık kokusu alırsanız veya
        içten erime belirtileri görürseniz, kullanmayı hemen durdurun ve 'kullanıcı hatası' gerekçesiyle
        reddedilmeyi kabul etmeyin — inceleme veya değişim için ısrar edin. Sahibin raporu, cihazın içten
        erime durumuna karşı kendini korumadığını gösteriyor.
