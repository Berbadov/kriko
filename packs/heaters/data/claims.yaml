    en:
      title: Philips HD3478 oil heater recall — production-stage defective unit can smoke/ignite
      body: The Japan Consumer Affairs Agency recall database lists the HD3478 (JAN 87 10103 094012, 9,976
        units) among the Philips oil heaters recalled for a smoke/fire risk, and records that a product-burnout
        fire occurred.
      advice: If you own or are considering a Philips HD3478 oil heater, treat it as a recalled fire-risk
        unit. Stop using it immediately and contact Philips' recall center for the free inspection/recall.
        Do not buy a used HD3478 without confirming it has been inspected.
    tr:
      title: Philips HD3478 yağlı radyatör geri çağırması — üretim aşamasında kusurlu cihaz duman çıkarabilir/tutuşabilir
      body: Japonya Tüketici İşleri Ajansı geri çağırma veritabanı, duman/yangın riski nedeniyle geri
        çağrılan Philips yağlı radyatörler arasında HD3478'i (JAN 87 10103 094012, 9.976 adet) listeliyor
        ve bir ürün yanması yangınının meydana geldiğini kaydediyor.
      advice: Bir Philips HD3478 yağlı radyatöre sahipseniz veya almayı düşünüyorsanız, bunu geri çağrılmış
        bir yangın riski taşıyan cihaz olarak değerlendirin. Kullanmayı hemen durdurun ve ücretsiz inceleme/geri
        çağırma için Philips'in geri çağırma merkeziyle iletişime geçin. İncelendiği doğrulanmadan ikinci
        el bir HD3478 satın almayın.
