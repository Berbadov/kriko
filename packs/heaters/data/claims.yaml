        that could cause fires. De'Longhi offered free replacement control panels.
      advice: If you own a De'Longhi oil-filled radiator from 1980–1988, check for the silver sticker
        on the underside of the metal control box; stickers starting with '80' through '88' identify affected
        units. Contact De'Longhi for the free control panel replacement. Do not continue using an unrepaired
        unit.
