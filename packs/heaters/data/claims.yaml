  text:
    en:
      title: Xiaomi EU manual warns of molten plug or fire from plug overheating and prohibits extension
        cords
      body: The EU-market user manual explicitly ties plug overheating to a fire risk, instructing users
        to check the plug prongs (above 55°C) to avoid a molten plug or fire and never to use an extension
        cord. This corroborates the manufacturer FAQ's plug-overheating warning and documents the fire
        risk in the EU market.
      advice: Use a grounded 10 A outlet directly, never an extension cord, and check the plug for excessive
        heat after the first ~30 minutes of use.
    tr:
      title: Xiaomi AB kılavuzu, fişin aşırı ısınmasından kaynaklanan erimiş fiş veya yangın konusunda
        uyarıyor ve uzatma kablolarını yasaklıyor
      body: AB pazarına yönelik kullanım kılavuzu, fişin aşırı ısınmasını açıkça yangın riskiyle ilişkilendiriyor,
        kullanıcılara erimiş fiş veya yangından kaçınmak için fiş uçlarını (55°C üzeri) kontrol etmelerini
        ve asla uzatma kablosu kullanmamalarını talimat veriyor. Bu, üreticinin SSS'lerindeki fiş aşırı
        ısınma uyarısını destekliyor ve AB pazarındaki yangın riskini belgeliyor.
      advice: Doğrudan topraklı 10 A priz kullanın, asla uzatma kablosu kullanmayın ve kullanımın ilk
        ~30 dakikasından sonra fişi aşırı ısı açısından kontrol edin.
  evidence:
