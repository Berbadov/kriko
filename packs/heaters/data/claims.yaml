    en:
      title: Kobe KBE8280200K oil radiator recalled for fire risk from plug overheating defect
      body: Official UK Trading Standards recall (PSD case 2606-0205) for the Kobe 2kW Oil-Filled 9 Fin
        Radiator, product code KBE8280200K, sold from January 2024 onwards.
      advice: If you own this radiator, stop using it immediately and arrange a refund with Cromwell Tools
        Limited (0800 33 88 77 / hsqeteam@cromwell.co.uk). Check the batch numbers 0081430138-151 and
        0081476187-538. The failure is in the mains plug, which can overheat and ignite during normal
        use.
    tr:
      title: Kobe KBE8280200K yağlı radyatör, fiş aşırı ısınma kusurundan kaynaklanan yangın riski nedeniyle
        geri çağrıldı
