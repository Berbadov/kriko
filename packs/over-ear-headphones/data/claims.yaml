  text:
    en:
      title: Live 770NC fails to power on after ~3 months of use
      body: Owner reports the unit would not power on after three months; charging overnight and hard
        reset attempts did not help initially, then it resumed working after being left plugged in for
        days, suggesting a firmware/software power state fault rather than a dead battery.
      advice: If you buy this model, be aware of a reported failure to power on after a few months of
        use. A hard reset may not recover it immediately; leaving it charged for an extended period appeared
        to revive it in this case. This is a single owner report, not a widespread documented pattern.
    tr:
      title: Live 770NC yaklaşık 3 ay kullanımdan sonra açılmıyor
      body: Sahip, ünitenin üç ay sonra açılmadığını bildiriyor; gece boyunca şarj etme ve zorla sıfırlama
        denemeleri başlangıçta yardımcı olmadı, ardından günlerce takılı bırakıldıktan sonra çalışmaya
        başladı, bu da ölü bir pil yerine bir firmware/yazılım güç durumu arızasına işaret ediyor.
      advice: Bu modeli satın alırsanız, birkaç ay kullanımdan sonra açılmama bildiriminin farkında olun.
        Zorla sıfırlama hemen kurtaramayabilir; uzun bir süre şarjda bırakmak bu durumda onu canlandırmış
        görünüyor. Bu tek bir sahip bildirimidir, yaygın olarak belgelenmiş bir örüntü değildir.
