    en:
      title: Left ear cup swivel point breaks, requiring full headband replacement at $198
      body: Owner reports the plastic swivel joint broke about a week after the 1-year warranty expired.
        Sony's authorized repair center quoted $198 to replace the entire headband because the swivel
        is not sold as a separate part. This makes the repair cost nearly the price of a new pair.
      advice: Buyers should check the swivel joints early and consider that a broken swivel effectively
        totals the headphones since Sony only offers a full headband replacement at ~$198.
    tr:
      title: Sol kulaklık kabı döner noktası kırılıyor, 198 $ karşılığında tam kafa bandı değişimi gerekiyor
      body: Sahibi, plastik döner eklemin 1 yıllık garanti süresinin dolmasından yaklaşık bir hafta sonra
        kırıldığını bildiriyor. Sony'nin yetkili servis merkezi, döner eklem ayrı parça olarak satılmadığı
        için tüm kafa bandını değiştirmek üzere 198 $ fiyat verdi. Bu, onarım maliyetini neredeyse yeni
        bir çiftin fiyatına çıkarıyor.
      advice: Alıcılar döner eklemleri erkenden kontrol etmeli ve kırık bir döner eklemin kulaklığı fiilen
        hurdaya çıkardığını göz önünde bulundurmalıdır, çünkü Sony yalnızca yaklaşık 198 $ karşılığında
        tam kafa bandı değişimi sunuyor.
