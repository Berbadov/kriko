  text:
    en:
      title: Earpads split open along the heat-sealed seam within months of purchase
      body: An Italian consumer complaint (Altroconsumo) on the exact QC 2023 model reports the original
        earpads opening and coming unglued along the heat-sealed seam, with foam spilling out, within
        months of purchase.
      advice: The QC 2023's earpads are reported to delaminate within the first year. The complainant
        says Bose refused warranty as 'wear' and that official replacement kits are no longer sold, leaving
        third-party sellers charging over €120 for two pads. Budget for early earpad replacement or verify
        warranty/right-to-repair terms before buying.
    tr:
      title: Satın alımdan aylar sonra kulak yastıkları ısıyla yapıştırılmış dikiş boyunca yarıldı
      body: İtalyan bir tüketici şikayeti (Altroconsumo), tam olarak QC 2023 modeliyle ilgili olarak,
        orijinal kulak yastıklarının satın alımdan aylar sonra ısıyla yapıştırılmış dikiş boyunca açıldığını
        ve yapışkanının çözüldüğünü, süngerinin dışarı taştığını bildiriyor.
      advice: QC 2023'ün kulak yastıklarının ilk yıl içinde katmanlarına ayrıldığı bildiriliyor. Şikayetçi,
        Bose'un garantiyi "aşınma" gerekçesiyle reddettiğini ve resmi yedek parça kitlerinin artık satılmadığını,
        üçüncü taraf satıcıların iki yastık için 120 €'nun üzerinde ücret aldığını söylüyor. Erken kulak
        yastığı değişimi için bütçe ayırın veya satın almadan önce garanti/onarım hakkı koşullarını doğrulayın.
