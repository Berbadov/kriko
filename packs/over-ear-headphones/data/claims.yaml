        in the same article describe hinges breaking at 3 months, 4 months, and just after the one-year
        warranty, with Sony refusing coverage. This is the most commonly reported physical failure for
        this model.
      advice: Expect the hinge to be a weak point. If buying, consider an extended warranty or protection
        plan, as Sony often declines coverage for hinge breakage. If you already own a pair, handle by
        the headband, not the earcups, and inspect the hinge area for looseness that precedes failure.
    tr:
      title: WH-1000XM5 kulak kabuğu menteşesi normal kullanımda kırılıyor, genellikle garantiden hemen
        sonra
      body: SoundGuys'in 2.000'den fazla sahibiyle yaptığı okuyucu anketi, %24'ünün menteşe kırılması
        yaşadığını buldu. Aynı makaledeki okuyucu alıntıları, menteşelerin 3. ayda, 4. ayda ve bir yıllık
        garantiden hemen sonra kırıldığını, Sony'nin kapsamı reddettiğini anlatıyor. Bu, bu model için
        en yaygın bildirilen fiziksel arızadır.
      advice: Menteşenin zayıf bir nokta olmasını bekleyin. Satın alıyorsanız, Sony menteşe kırılması
        için kapsamı sıklıkla reddettiğinden uzatılmış garanti veya koruma planı düşünün. Zaten bir çiftiniz
        varsa, kulak kabuklarından değil kafa bandından tutun ve arızadan önce gelen gevşeklik için menteşe
        bölgesini inceleyin.
