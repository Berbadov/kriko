    en:
      title: NC700 intermittent audio and sporadic Bluetooth connections (official Bose troubleshooting)
      body: Bose's own support article for the NC700 documents intermittent audio and sporadic Bluetooth
        connections, attributing them to multipoint interference and Bluetooth memory issues.
      advice: Intermittent audio is a recognised firmware/Bluetooth behaviour Bose itself documents, triggered
        by multipoint connections. A buyer can mitigate it by turning off secondary Bluetooth devices
        and clearing paired-device memory, so it is a nuisance rather than a hardware failure.
    tr:
      title: NC700 aralıklı ses ve ara sıra Bluetooth bağlantıları (resmi Bose sorun giderme)
      body: Bose'un NC700 için kendi destek makalesi, aralıklı sesi ve ara sıra Bluetooth bağlantılarını
        belgeleyerek bunları çok noktalı girişime ve Bluetooth bellek sorunlarına bağlıyor.
      advice: Aralıklı ses, Bose'un kendisinin belgelediği, çok noktalı bağlantılarla tetiklenen tanınmış
        bir yazılım/Bluetooth davranışıdır. Bir alıcı, ikincil Bluetooth cihazlarını kapatarak ve eşleştirilmiş
        cihaz belleğini temizleyerek bunu hafifletebilir, dolayısıyla bu bir donanım arızası değil bir
        sıkıntıdır.
