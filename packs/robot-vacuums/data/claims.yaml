        yetersiz servis desteğiyle bildiriyor.
      advice: Türkiye'de satın almadan önce mevcut yetkili servis sağlayıcısını ve garanti koşullarını
        teyit edin; bu sahip servis sağlayıcısını belirsiz bulmuş, aylarca beklemiş ve arıza geri dönmüş.
