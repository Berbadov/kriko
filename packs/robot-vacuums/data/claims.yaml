    en:
      title: Charging contact plate sinks in, blocking charging; Ecovacs refuses free repair after warranty
      body: An Italian consumer (Altroconsumo complaint board) reports the charging contact plate sank
        in, blocking charging; it was replaced under warranty, but mapping problems, Wi-Fi disconnections
        and abnormal suction/mop behaviour persisted, and once the warranty lapsed Ecovacs refused a free
        repair and offered only a 10% discount code.
      advice: Before buying, check the charging contact plate and whether the unit still charges reliably;
        note that Ecovacs' post-warranty support here was a 10% discount rather than a repair. EU market.
    tr:
      title: Şarj temas plakası içeri gömülüyor ve şarjı engelliyor; Ecovacs garanti sonrası ücretsiz
        onarımı reddediyor
      body: İtalyan bir tüketici (Altroconsumo şikayet panosu), şarj temas plakasının içeri gömüldüğünü
        ve şarjı engellediğini bildiriyor; plaka garanti kapsamında değiştirilmiş, ancak haritalama sorunları,
        Wi-Fi bağlantı kopmaları ve anormal emiş/paspas davranışı devam etmiş ve garanti sona erdiğinde
        Ecovacs ücretsiz onarımı reddederek yalnızca %10 indirim kodu teklif etmiş.
      advice: Satın almadan önce şarj temas plakasını ve cihazın hâlâ güvenilir şekilde şarj olup olmadığını
        kontrol edin; burada Ecovacs'in garanti sonrası desteğinin onarım yerine %10 indirim olduğunu
        unutmayın. AB pazarı.
