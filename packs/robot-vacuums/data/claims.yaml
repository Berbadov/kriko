  text:
    en:
      title: T20 Omni water-delivery pump fails; mop pads stop getting wet despite full clean-water tank
      body: Owners report the mop pads stop getting wet even with a full clean-water tank; the fix is
        replacing the pump behind the station, which several report recurring (one owner twice) and requiring
        sending the unit to service.
      advice: Before buying, check whether the water-delivery pump is covered by warranty and how long
        service takes; owners report roughly a month without the robot and recurring pump failures. A
        full reset and cleaning the strainer/filter sometimes helps, but the pump replacement is the documented
        repair.
    tr:
      title: T20 Omni su besleme pompası arızalanıyor; temiz su tankı dolu olmasına rağmen paspas pedleri
        ıslanmayı durduruyor
      body: Sahipler, temiz su tankı dolu olmasına rağmen paspas pedlerinin ıslanmayı durdurduğunu bildiriyor;
        düzeltme istasyonun arkasındaki pompanın değiştirilmesi ve birkaç kişi bunun tekrarladığını (bir
        sahip iki kez) ve ünitenin servise gönderilmesi gerektiğini bildiriyor.
      advice: Satın almadan önce su besleme pompasının garanti kapsamında olup olmadığını ve servisin
        ne kadar sürdüğünü kontrol edin; sahipler yaklaşık bir ay robotsuz kaldıklarını ve pompa arızalarının
        tekrarladığını bildiriyor. Tam sıfırlama ve süzgeç/filtre temizliği bazen yardımcı olur, ancak
        pompa değişimi belgelenmiş onarımdır.
  evidence:
  - url: https://sav.darty.com/forum/ECOVACS/DEEBOT-T20-OMNI/LES-SERPILLIERES-NE-SE-MOUILLENT-PLUS-L-EAU-NE-DESCENDS-PLUS/5428371/604332
