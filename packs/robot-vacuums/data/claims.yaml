      title: Fall-prevention sensor error stops cleaning; Ecovacs support unreachable for a month (Turkey)
      body: A Turkish owner on Şikayetvar reports a persistent 'clean the fall-prevention sensor' error
        that stops cleaning entirely, persists after repeated cleaning, and Ecovacs support was unreachable
        for about a month (a WhatsApp number went unanswered for a week).
      advice: In Turkey this unit can be stopped dead by a sensor error the owner cannot clear, with very
        slow support response. Check the sensor area and the local service channel before buying.
    tr:
      title: Düşme önleme sensörü hatası temizliği durduruyor; Ecovacs desteğine bir ay boyunca ulaşılamıyor
        (Türkiye)
      body: Şikayetvar'da bir Türk sahibi, temizliği tamamen durduran, tekrarlanan temizlikten sonra da
        devam eden kalıcı bir 'düşme önleme sensörünü temizleyin' hatası bildiriyor ve Ecovacs desteğine
        yaklaşık bir ay boyunca ulaşılamamış (bir WhatsApp numarası bir hafta boyunca yanıtsız kalmış).
      advice: Türkiye'de bu ünite, sahibinin gideremediği bir sensör hatasıyla tamamen durdurulabilir
        ve destek yanıtı çok yavaştır. Satın almadan önce sensör bölgesini ve yerel servis kanalını kontrol
        edin.
