      title: Combo j7+ cleaning-pad actuator stalls (error 1008) — robot will not mop
      body: iRobot's own knowledge base documents error 1008 on the Combo j7+, where the cleaning-pad
        drive mechanism stalls and the robot pauses mid-job and waits for the user to move it. It is a
        documented, model-specific failure mode.
      advice: If you buy the Combo j7+ for mopping, know that the pad actuator can stall (error 1008)
        and the robot will stop and wait for manual help; the official fix is repositioning and a 20-second
        reboot. Not a repair part you can buy, so it lands on warranty/service.
    tr:
      title: Combo j7+ temizleme pedi aktüatörü takılıyor (hata 1008) — robot paspas yapmıyor
      body: iRobot'un kendi bilgi bankası, Combo j7+'ta temizleme pedi tahrik mekanizmasının takıldığı
        ve robotun iş ortasında duraklayıp kullanıcının onu hareket ettirmesini beklediği hata 1008'i
        belgeliyor. Bu, belgelenmiş ve modele özgü bir arıza modudur.
      advice: Combo j7+'ı paspaslama için satın alıyorsanız, ped aktüatörünün takılabileceğini (hata 1008)
        ve robotun durup manuel yardım bekleyeceğini bilin; resmi çözüm yeniden konumlandırma ve 20 saniyelik
