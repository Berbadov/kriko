    en:
      title: L10s Ultra battery drains to 10-15% after ~70 minutes instead of ~200 minutes
      body: From the same Turkish complaint. The owner reports runtime far below the ~200-minute spec,
        dropping to 10-15% after about 70 minutes, and says the problem continued on the replacement unit.
      advice: If you rely on long single-pass runs, verify real runtime early; a battery that falls short
        of spec and is not fixed by a replacement unit is a costly thing to discover later.
    tr:
      title: L10s Ultra bataryası ~200 dakika yerine ~70 dakika sonra %10-15'e düşüyor
      body: Aynı Türkçe şikayetten. Sahip, çalışma süresinin ~200 dakikalık spesifikasyonun çok altında
        olduğunu, yaklaşık 70 dakika sonra %10-15'e düştüğünü bildiriyor ve sorunun değişim cihazında
        da devam ettiğini söylüyor.
      advice: Uzun tek geçişli çalışmalara güveniyorsanız gerçek çalışma süresini erkenden doğrulayın;
        spesifikasyonun altında kalan ve değişim cihazıyla düzeltilmeyen bir batarya, sonradan keşfedilmesi
        maliyetli bir durumdur.
