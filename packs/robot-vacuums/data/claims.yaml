  text:
    en:
      title: L10s Ultra scheduled cleaning stops after first cycle and robot fails to make dock contact
        to recharge
      body: An owner whose unit ran well for two years reports a scheduled cleaning that stopped after
        the first cycle, with the planned intermediate charge not happening and the robot sitting in the
        dock without making charging contact; a friend's identical unit showed the same fault, and the
        owner attributes it to software.
      advice: If you depend on multi-cycle scheduled cleaning, this failure mode means the robot may stop
        mid-task and fail to recharge; the owner could not roll back the firmware, so a fix depends on
        a software update.
    tr:
      title: L10s Ultra planlı temizlik ilk döngüden sonra duruyor ve robot şarj olmak için üsle temas
        kuramıyor
      body: Ünitesi iki yıl iyi çalışan bir sahip, planlı temizliğin ilk döngüden sonra durduğunu, planlanan
        ara şarjın gerçekleşmediğini ve robotun şarj teması kurmadan üstte oturduğunu bildiriyor; bir
        arkadaşının aynı ünitesi aynı arızayı göstermiş ve sahip bunu yazılıma bağlıyor.
      advice: Çok döngülü planlı temizliğe bağlıysanız bu arıza modu, robotun görev ortasında durabileceği
        ve şarj olamayabileceği anlamına gelir; sahip ürün yazılımını geri alamamış, yani düzeltme bir
        yazılım güncellemesine bağlı.
  evidence:
  - url: https://www.computerbase.de/forum/threads/dreame-l10s-ultra-probleme-mit-automatischer-reinigung.2240749/
    quote: Vor einigen Wochen kam ich dann nach Hause und das Gerät hatte nur den ersten Zyklus der geplanten
