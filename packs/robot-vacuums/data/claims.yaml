    en:
      title: Combo j7+ charging contacts fail after about a year — robot won't dock-charge
      body: An EU (Slovak) verified owner of the Combo j7+ (c7558) reports that after about a year the
        robot stopped returning to the dock and charging, and a technician diagnosed the charging contacts
        — yet it charges when manually placed on the dock. This is an EU-market, model-specific electrical
        failure.
      advice: 'The charging contacts are a known failure point on the Combo j7+ after roughly a year:
        the robot won''t dock-charge even though it charges when placed manually. Check whether the contacts
        are the cause before assuming a battery fault, and note the owner''s report that the warranty
        was not honored.'
    tr:
      title: Combo j7+ şarj kontakları yaklaşık bir yıl sonra arızalanıyor — robot dock'ta şarj olmuyor
      body: Combo j7+ (c7558) modelinin AB (Slovakya) doğrulanmış bir sahibi, yaklaşık bir yıl sonra robotun
        dock'a dönmeyi ve şarj olmayı bıraktığını, bir teknisyenin şarj kontaklarını teşhis ettiğini,
        ancak dock'a manuel olarak yerleştirildiğinde şarj olduğunu bildiriyor. Bu, AB pazarına özgü,
        modele özgü bir elektrik arızasıdır.
      advice: 'Şarj kontakları, Combo j7+ modelinde yaklaşık bir yıl sonra bilinen bir arıza noktasıdır:
        robot manuel olarak yerleştirildiğinde şarj olsa bile dock''ta şarj olmaz. Pil arızası olduğunu
        varsaymadan önce kontakların neden olup olmadığını kontrol edin ve sahibin garantinin yerine getirilmediği
        yönündeki bildirimini dikkate alın.'
