    en:
      title: 'Official troubleshooting page: a wet filter can cause abnormal noise during cleaning'
      body: From the manufacturer's official French troubleshooting page for the L10s Ultra. It documents
        abnormal cleaning noise and lists a wet filter as a cause, along with side-brush deformation and
        tangled main-brush ends.
      advice: 'Low-severity and owner-fixable: if the unit gets noisy, the official guidance is to let
        a washed filter dry fully and check the side brush and main brush for tangling before contacting
        service.'
    tr:
      title: 'Resmi sorun giderme sayfası: ıslak filtre temizlik sırasında anormal gürültüye neden olabilir'
      body: L10s Ultra için üreticinin resmi Fransızca sorun giderme sayfasından. Anormal temizlik gürültüsünü
        belgeliyor ve neden olarak ıslak filtreyi, yan fırça deformasyonu ve ana fırça uçlarının dolaşmasıyla
        birlikte listeliyor.
      advice: 'Düşük önem derecesi ve sahibi tarafından düzeltilebilir: ünite gürültülü hale gelirse resmi
        yönlendirme, yıkanmış filtrenin tamamen kurumasını beklemek ve servisle iletişime geçmeden önce
        yan fırça ile ana fırçada dolaşma olup olmadığını kontrol etmektir.'
