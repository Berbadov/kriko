      title: X30 Ultra sağ tahrik tekerleği kilitleniyor ve robot daireler çizerek gidiyor
      body: Alman bir sahip, satın almadan üç hafta sonra sağ tekerleğin tamamen kilitlendiğini ve robotun
        daireler çizerek gittiğini bildiriyor; satıcı değişim değil yalnızca para iadesi teklif etmiş.
      advice: Tahrik tekerleği arızası erken (haftalar içinde) ortaya çıkabilir ve robotu gezinemez hale
        bırakabilir; sahibine değişim yerine para iadesi teklif edildiğinden satın almadan önce iade/para
