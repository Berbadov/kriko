    en:
      title: T20 Omni stops after wetting its mop pads and does not resume the task after returning to
        base in mopping mode
      body: In mopping mode the robot wets its pads then stops, and after returning to the base to clean
        the pads it declares the task finished instead of resuming; a factory reset did not fix it.
      advice: Expect that mopping runs may need manual restarts or per-zone selection; owners report a
        factory reset does not resolve it. Suction-only mode works, so this is specific to the mopping
        task logic.
    tr:
      title: T20 Omni paspas pedlerini ıslattıktan sonra duruyor ve paspaslama modunda üsse döndükten
        sonra görevi sürdürmüyor
      body: Paspaslama modunda robot pedlerini ıslatıyor sonra duruyor ve pedleri temizlemek için üsse
        döndükten sonra görevi sürdürmek yerine görevi tamamlandı olarak bildiriyor; fabrika ayarlarına
        sıfırlama bunu düzeltmedi.
      advice: Paspaslama çalışmalarının manuel yeniden başlatma veya bölge bazında seçim gerektirebileceğini
        bekleyin; sahipler fabrika ayarlarına sıfırlamanın bunu çözmediğini bildiriyor. Yalnızca emiş
        modu çalışıyor, yani bu paspaslama görev mantığına özgü.
