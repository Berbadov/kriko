      title: Omni/docking station leaks water; mop-wash catch basin overflows
      body: Multiple independent owners report the docking station leaking water around it and the mop-wash
        basin overflowing, with one owner noting the intake valve itself was not the leak point.
      advice: Before buying, check the station's water plumbing and the mop-wash tray seal; a leak here
        can damage flooring and is reported to recur even after service. Expect this to be a warranty/repair
        issue rather than a user-fixable one.
    tr:
      title: Omni/dock istasyonu su sızdırıyor; paspas yıkama toplama haznesi taşıyor
      body: Birden fazla bağımsız sahip, dock istasyonunun çevresinden su sızdırdığını ve paspas yıkama
        haznesinin taştığını bildiriyor; bir sahip giriş valfinin kendisinin sızıntı noktası olmadığını
        belirtiyor.
      advice: Satın almadan önce istasyonun su tesisatını ve paspas yıkama tepsisinin contasını kontrol
        edin; buradaki bir sızıntı zeminlere zarar verebilir ve servis sonrasında bile tekrarladığı bildirilmektedir.
        Bunun kullanıcı tarafından düzeltilebilir bir sorun değil, garanti/onarım sorunu olmasını bekleyin.
