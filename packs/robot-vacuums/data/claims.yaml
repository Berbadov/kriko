      body: An Italian owner reports the wall base leaking water at month 23; the service centre refused
        warranty repair citing water infiltration and motherboard oxidation, quoting €187 — nearly the
        unit's full value. This documents both the leak and the service/warranty cost of it.
      advice: 'The leak is not just cosmetic: water reaching the robot''s mainboard is treated as out-of-warranty
        damage, and the quoted repair (~€187) approaches the product''s value. Verify warranty terms before
        relying on coverage for a leak.'
    tr:
      title: Robot gövdesine su girmesi anakartı oksitliyor; garanti ~187 € teklifle reddedildi
      body: İtalyan bir sahip, duvar tabanının 23. ayda su sızdırdığını bildiriyor; servis merkezi su
        sızması ve anakart oksitlenmesini gerekçe göstererek garanti onarımını reddetti ve ünitenin neredeyse
        tam değeri olan 187 € teklif etti. Bu, hem sızıntıyı hem de bunun servis/garanti maliyetini belgeliyor.
      advice: 'Sızıntı yalnızca kozmetik değil: robotun ana kartına ulaşan su garanti dışı hasar olarak
        değerlendiriliyor ve teklif edilen onarım (~187 €) ürünün değerine yaklaşıyor. Bir sızıntı için
