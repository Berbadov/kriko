      body: 'Şikayetvar''da bir sahip şikayeti bu tam modeli (PUE611BB5E Serie 4) adlandırıyor ve yaklaşık
        bir aylık sorunlardan sonra ocağın bölgeler arasında belirgin güç dengesizliği geliştirdiğini
