      title: Arçelik OV 643 T cam ocağı camı iki kez kendiliğinden patladı
      body: 'Owner report (Şikayetvar, 27 Sept 2025) naming the OV 643t model: the ceramic glass top shattered
        spontaneously, was replaced for a fee even while under warranty, then shattered again while cooking.'
      advice: The glass top on this model has shattered more than once on the same unit, in one case while
        cooking, so a buyer should treat a cracked/shattered top as a recurring risk rather than a one-off
        and should not assume warranty coverage — the owner was charged despite the warranty.
    tr:
      title: Arçelik OV 643 T cam ocağı camı iki kez kendiliğinden patladı
      body: 'Sahip raporu (Şikayetvar, 27 Eylül 2025) OV 643t modelini adlandırıyor: seramik cam üst kısım
        kendiliğinden paramparça oldu, garanti kapsamındayken bile ücret karşılığında değiştirildi, ardından
        pişirme sırasında tekrar paramparça oldu.'
      advice: Bu modeldeki cam üst kısım aynı ünitede birden fazla kez paramparça olmuştur, bir durumda
        pişirme sırasında, bu nedenle alıcı çatlamış/paramparça olmuş üst kısmı tek seferlik bir olay
        değil, tekrarlayan bir risk olarak değerlendirmeli ve garanti kapsamını varsaymamalıdır — sahibinden
        garantiye rağmen ücret alınmıştır.
  evidence:
