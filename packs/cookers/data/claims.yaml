    en:
      title: Altus ALA 189 oven caught fire after service reversed the electrical connection
      body: Owner report from query 'Altus fırın yangını servis ihmali şikayet'. After an Altus ALA 189
        hob/oven set was serviced and the hob replaced, a reversed electrical connection caused the oven
        to suddenly catch fire on 16 June; the house reached burning point, the owner's mother was hospitalized
        for smoke inhalation, and firefighters intervened.
      advice: The documented Altus oven fire followed a service visit in which the electrical connection
        was reversed, not a spontaneous product fault. If you have an Altus oven serviced, verify the
        connection is correct before use; a mis-wired oven can ignite and escalate to a house fire quickly.
    tr:
      title: Altus ALA 189 fırın, servis elektrik bağlantısını ters çevirdikten sonra alev aldı
      body: '''Altus fırın yangını servis ihmali şikayet'' sorgusundan sahip raporu. Bir Altus ALA 189
        hob/fırın seti servis edilip hob değiştirildikten sonra, ters çevrilmiş bir elektrik bağlantısı
        16 Haziran''da fırının aniden alev almasına neden oldu; ev yanma noktasına geldi, sahibin annesi
        duman soluması nedeniyle hastaneye kaldırıldı ve itfaiye müdahale etti.'
      advice: Belgelenen Altus fırın yangını, kendiliğinden bir ürün arızası değil, elektrik bağlantısının
        ters çevrildiği bir servis ziyaretini takip etti. Altus fırınınız servis edilirse, kullanmadan
        önce bağlantının doğru olduğunu doğrulayın; yanlış kablolanmış bir fırın hızla tutuşabilir ve
        ev yangınına dönüşebilir.
