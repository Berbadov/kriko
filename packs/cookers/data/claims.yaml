  text:
    en:
      title: Samsung NV75N5671RS Dual Cook exterior lower glass spontaneously exploded
      body: Owner on Darty SAV forum reports the lower exterior glass of the Samsung Dual Cook oven exploded
        spontaneously. A second respondent in the same thread reports the oven self-starting repeatedly
        and paying €281 per repair. The glass shattering is a documented failure mode for this exact model
        (NV75N5671RS).
      advice: If you own this oven, inspect the exterior glass for stress cracks. If it shatters, contact
        Samsung support and the retailer. Do not use the oven if the glass is compromised. Replacement
        glass is a significant cost.
    tr:
      title: Samsung NV75N5671RS Dual Cook dış alt camı kendiliğinden patladı
      body: Darty SAV forumundaki sahibi, Samsung Dual Cook fırınının alt dış camının kendiliğinden patladığını
        bildiriyor. Aynı başlıktaki ikinci bir yanıtlayan, fırının tekrar tekrar kendi kendine çalıştığını
        ve onarım başına €281 ödediğini bildiriyor. Camın paramparça olması, bu tam model (NV75N5671RS)
        için belgelenmiş bir arıza modudur.
      advice: Bu fırına sahipseniz, dış camı gerilim çatlakları açısından inceleyin. Paramparça olursa,
        Samsung desteği ve satıcıyla iletişime geçin. Cam hasarlıysa fırını kullanmayın. Yedek cam önemli
        bir maliyettir.
  evidence:
