  text:
    en:
      title: Bosch PUE611BB5 induction hob third zone cycles on/off; service diagnoses motherboard (anakart)
        fault
      body: 'Owner report on the close model PUE611BB5 (listed on the PUE611BB5E complaint page, found
        via the ''glass door shattered forum'' and ''cam patlaması'' searches): opening the third zone
        produces a repeated on/off ''tık tık'' cycling sound, with heating cutting out and restarting
        in sync. The authorized service diagnosed a faulty motherboard (anakart) and set about sourcing
        a replacement.'
      advice: Expect that a motherboard fault on this series may present as a single zone cycling on/off
        rather than a total failure. Have the service confirm the part and warranty coverage before paying;
        the owner here was told the motherboard was faulty and needed replacing.
    tr:
      title: Bosch PUE611BB5 indüksiyon hob üçüncü bölge açılıp kapanıyor; servis anakart arızası teşhisi
        koyuyor
      body: 'Yakın model PUE611BB5 hakkında sahip raporu (PUE611BB5E şikayet sayfasında listelenmiş, ''glass
        door shattered forum'' ve ''cam patlaması'' aramalarıyla bulundu): üçüncü bölgeyi açmak, ısıtmanın
        kesilip senkronize şekilde yeniden başlamasıyla tekrarlanan açık/kapalı ''tık tık'' döngü sesi
        üretiyor. Yetkili servis arızalı bir anakart teşhisi koydu ve yedek parça tedarik etmeye başladı.'
      advice: Bu seride bir anakart arızasının toplam arıza yerine tek bir bölgenin açılıp kapanması şeklinde
        ortaya çıkabileceğini bekleyin. Ödeme yapmadan önce servisin parçayı ve garanti kapsamını doğrulamasını
        sağlayın; buradaki sahibe anakartın arızalı olduğu ve değiştirilmesi gerektiği söylendi.
