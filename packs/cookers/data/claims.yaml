        geldi.'
      advice: Bu ocağınız varsa veya alıyorsanız, eşit olmayan ısınma ve pişirme kaplarının aşırı ısınmasına
        dikkat edin; tavalarda yanma veya beklenmedik taşma olursa etkilenen bölgeyi kullanmayı bırakın
        ve Bosch servisine başvurun. Sahibin bildirimi, ocağa güvenmeden önce doğrulanması gereken şeyin
