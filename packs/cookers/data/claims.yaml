  text:
    en:
      title: Beko built-in oven middle door glass shattered after normal use at 200°C
      body: Owner reports the middle door glass of a Beko built-in oven shattered about 5 minutes after
        normal use at 200°C (well below the oven's 250°C maximum), scattering glass on the floor. The
        service technician attributed it to user error and charged for the glass. This indicates the failure
        occurs within normal operating parameters and owners bear the cost.
      advice: Treat Beko built-in oven door glass as a documented failure point even under normal use;
        if it shatters, expect the service to blame user error and charge for replacement.
    tr:
      title: Beko ankastre fırının orta kapı camı 200°C'de normal kullanımdan sonra paramparça oldu
      body: Sahibi, bir Beko ankastre fırının orta kapı camının 200°C'de (fırının 250°C maksimumunun oldukça
        altında) normal kullanımdan yaklaşık 5 dakika sonra paramparça olduğunu ve camın yere saçıldığını
        bildiriyor. Servis teknisyeni bunu kullanıcı hatasına bağladı ve cam için ücret aldı. Bu, arızanın
        normal çalışma parametreleri içinde meydana geldiğini ve maliyeti sahiplerin üstlendiğini gösteriyor.
      advice: Beko ankastre fırın kapı camını normal kullanımda bile belgelenmiş bir arıza noktası olarak
        değerlendirin; paramparça olursa, servisin kullanıcı hatasını suçlamasını ve değişim için ücret
        almasını bekleyin.
