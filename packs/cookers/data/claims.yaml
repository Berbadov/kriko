      title: Samsung slide-in electric ranges recalled for fire hazard from front-mounted knobs
      body: Official CPSC recall notice of Aug 8, 2024 for Samsung Electric Slide-In Ranges with front-mounted
        knobs. The knobs can be activated by accidental contact by humans or pets, posing a fire hazard.
        Recalled model numbers include NE58K9430SS/AA, NE58F9500SS/AA, NE58K9850WS/AA, NE63T8111SS/AA,
        NE63T8711SS/AA, NE63T8751SS/AA and others. Remedy is free knob locks or covers.
      advice: Check the model number (inside upper left corner of oven door or inside the bottom storage
        bin) against the recalled list. If affected, request the free knob lock/cover kit from Samsung
        and keep children, pets, and objects off the cooktop when not in use.
