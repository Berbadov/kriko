  text:
    en:
      title: Samsung slide-in electric range front-mounted knob fire hazard recall (CPSC 24-335)
      body: Official CPSC recall notice, recall number 24-335, dated August 8, 2024. Affected models include
        NE58K9430SS/AA, NE58R9431SS/AA, NE58F9500SS/AA, NE63T8711SS/AA and others listed on the page.
        Sold May 2013 through August 2024 for $1,250-$3,050. Manufactured in Thailand. Remedy is free
        knob locks or covers.
      advice: If you own a Samsung slide-in electric range with front-mounted knobs, check the model number
        (inside upper left of oven door or in the storage bin) against the recalled list. If affected,
        request the free knob lock/covers kit from Samsung immediately, keep children and pets away from
        the knobs, check knobs are off before leaving home or going to bed, and never leave objects on
        the range top. Note this recall is US/Canada-specific; no equivalent EU/RAPEX recall was found
        in this run.
    tr:
      title: Samsung ankastre elektrikli ocak ön tarafa monte düğme yangın tehlikesi geri çağırması (CPSC
        24-335)
      body: Resmi CPSC geri çağırma bildirimi, geri çağırma numarası 24-335, tarih 8 Ağustos 2024. Etkilenen
        modeller arasında NE58K9430SS/AA, NE58R9431SS/AA, NE58F9500SS/AA, NE63T8711SS/AA ve sayfada listelenen
        diğerleri bulunur. Mayıs 2013 ile Ağustos 2024 arasında 1.250-3.050 $ fiyatla satıldı. Tayland'da
        üretildi. Çözüm ücretsiz düğme kilitleri veya kapaklarıdır.
      advice: Ön tarafa monte düğmeleri olan bir Samsung ankastre elektrikli ocağınız varsa, model numarasını
        (fırın kapağının iç üst solunda veya saklama bölmesinde) geri çağrılan listeyle karşılaştırın.
        Etkilenmişse derhal Samsung'dan ücretsiz düğme kilidi/kapak setini talep edin, çocukları ve evcil
        hayvanları düğmelerden uzak tutun, evden ayrılmadan veya yatmadan önce düğmelerin kapalı olduğunu
        kontrol edin ve ocak üstünde asla nesne bırakmayın. Bu geri çağırmanın ABD/Kanada'ya özgü olduğunu
