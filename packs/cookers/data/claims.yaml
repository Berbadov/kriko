      body: Bu bulgu 'Vestel ankastre fırın yangın riski' aramasından geldi. Kullanıcı, pişirmeden saatler
        sonra fırının alt kısmından yoğun duman çıktığını, aileyi tahliye ettiğini ve alt kapağı açınca
        içindeki yanmaz elyafın bir kısmının yandığını, onu koruyan metal plakanın boşta durduğunu gördüğünü
        anlatıyor. Bu, fırının alt bölümünde yangın riski oluşturan bir malzeme/montaj hatası kaydıdır.
      advice: Vestel fırın sahipleri, pişirme sonrası fırın kapalıyken bile alt kısımdan yanık kokusu
        veya duman gelmesi durumunda cihazı kullanmayı bırakıp fişini çekmeli; bu belirti alt bölümde
        yanma/erime riskine işaret ediyor. Alıcı için bu, yangın riski taşıyan bir model hakkında karar
        verirken dikkate alınacak ciddi bir kayıttır.
