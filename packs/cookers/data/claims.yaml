        that after about a month of problems the hob developed marked power imbalance between zones: three
        separate pans'' bottoms burned and one pan''s base separated completely, and while cooking the
        rear-zone kettle suddenly boiled over. This is a documented fire-adjacent incident specific to
        this product, not a general brand complaint. It came from the Turkish seed query ''Bosch PUE611BB5E
        yangın riski''.'
      advice: If you own or are buying this hob, watch for uneven heating and overheating of cookware;
        if pans burn or boil unexpectedly, stop using the affected zone and contact Bosch service. The
        owner's report suggests the power-distribution behaviour is the thing to verify before relying
        on the hob.
