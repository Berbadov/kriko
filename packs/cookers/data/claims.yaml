      title: Samsung oven-door glass shattering incidents reported to CPSC (Consumer Reports investigation)
      body: Consumer Reports identified 10 Samsung-specific complaints among ~400 CPSC glass-shattering
        reports.
      advice: Samsung oven-door glass has shattered without warning in some units, sometimes days after
        the appliance was turned off. If you own a Samsung range, be aware of this failure mode; Samsung
        has stated it will repair oven door glass free of charge regardless of warranty status. This is
        a US-focused finding; no equivalent EU/TR documentation was found in this run.
    tr:
      title: Samsung fırın kapağı camının kırılması olayları CPSC'ye bildirildi (Consumer Reports soruşturması)
      body: Consumer Reports, yaklaşık 400 CPSC cam kırılması raporu arasında Samsung'a özgü 10 şikayet
        tespit etti.
      advice: Samsung fırın kapağı camı bazı ünitelerde uyarı olmadan kırıldı, bazen cihaz kapatıldıktan
        günler sonra. Bir Samsung ocak sahibiyseniz bu arıza modunun farkında olun; Samsung, garanti durumundan
        bağımsız olarak fırın kapağı camını ücretsiz onaracağını belirtti. Bu, ABD odaklı bir bulgudur;
        bu çalışmada eşdeğer bir AB/TR belgesi bulunamadı.
