  text:
    en:
      title: 'Owner report: Beko HIYG 64225 SBO large burner thermocouple exposed, early oxidation'
      body: An Italian consumer complaint on Altroconsumo's claims board about a Beko gas hob named as
        'HIYG 64225 SBO' (the near-identical SBO variant of the SBOP subject). After normal domestic use,
        the large dual-ring burner is described as designed with a downward structure leaving the thermocouple
        exposed and unprotected, so cooking/cleaning liquids flow inward, the thermocouple stays exposed
        to moisture, and early oxidation is already present; the owner also reports the liquids can reach
        the oven below with a potential electrical-safety concern. The authorized technician reportedly
        said the repair would be uneconomical and the defect would recur. This is a single owner's report,
        not a service record or recall.
      advice: This is one owner's account of a design defect on the closely related SBO variant, not an
        official notice. A buyer should weigh it as anecdotal; the documented, official risk for this
        family remains the gas-leak fire recall described above.
    tr:
      title: 'Sahip raporu: Beko HIYG 64225 SBO büyük brülör termokuplu açıkta, erken oksidasyon'
      body: Altroconsumo'nun talep panosunda 'HIYG 64225 SBO' olarak adlandırılan bir Beko gaz ocağı hakkında
        İtalyan tüketici şikayeti (SBOP konusunun neredeyse aynısı olan SBO varyantı). Normal ev kullanımından
        sonra, büyük çift halkalı brülörün, termokuplu açıkta ve korumasız bırakan aşağı yönlü bir yapıyla
        tasarlandığı, böylece pişirme/temizlik sıvılarının içe doğru aktığı, termokuplun neme maruz kaldığı
        ve erken oksidasyonun zaten mevcut olduğu anlatılıyor; sahibi ayrıca sıvıların aşağıdaki fırına
        ulaşabileceğini ve potansiyel bir elektrik güvenliği endişesi olduğunu bildiriyor. Yetkili teknisyenin,
        onarımın ekonomik olmayacağını ve arızanın tekrarlayacağını söylediği bildiriliyor. Bu, tek bir
        sahibin raporudur, servis kaydı veya geri çağırma değildir.
      advice: Bu, yakından ilişkili SBO varyantındaki bir tasarım kusuruna dair tek bir sahibin anlatımıdır,
        resmi bir bildirim değildir. Alıcı bunu anekdot olarak değerlendirmelidir; bu aile için belgelenmiş,
        resmi risk yukarıda açıklanan gaz kaçağı yangın geri çağırması olmaya devam etmektedir.
  evidence:
