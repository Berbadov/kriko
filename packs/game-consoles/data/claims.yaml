  text:
    en:
      title: Series X system software slows to a crawl and games fail to load until a factory reset
      body: A July 2024 EU-market Series X owner reports the console suddenly slowing down, games stuttering
        and failing to load with error codes 0x87e5002b / 0x87e50033, delayed inputs and 5-6 minute save
        loads; only a full factory reset restores it, and the problem recurred ~5 weeks later. The owner
        notes the same issue is widely reported on Microsoft's forum and Reddit with no identified cause
        or permanent fix.
      advice: Expect a recurring software-level slowdown that a hard reset does not fix; only a factory
        reset restores the console, and it can return weeks later. This is a firmware/OS issue, not a
        hardware fault, so a warranty return may not resolve it.
    tr:
      title: Series X sistem yazılımı ağırlaşıyor ve fabrika sıfırlaması yapılana kadar oyunlar yüklenmiyor
      body: Temmuz 2024'te AB pazarındaki bir Series X sahibi, konsolun aniden yavaşladığını, oyunların
        takıldığını ve 0x87e5002b / 0x87e50033 hata kodlarıyla yüklenemediğini, girişlerin geciktiğini
        ve kayıtların 5-6 dakika yüklendiğini bildiriyor; yalnızca tam bir fabrika sıfırlaması düzeltiyor
        ve sorun yaklaşık 5 hafta sonra tekrar ortaya çıktı. Sahip, aynı sorunun Microsoft'un forumunda
        ve Reddit'te yaygın olarak bildirildiğini, tanımlanmış bir neden veya kalıcı bir çözüm olmadığını
        belirtiyor.
      advice: Sabit sıfırlamanın düzeltmediği, tekrarlayan yazılım düzeyinde bir yavaşlama bekleyin; konsolu
        yalnızca fabrika sıfırlaması düzeltiyor ve sorun haftalar sonra geri dönebiliyor. Bu bir donanım
        arızası değil, ürün yazılımı/işletim sistemi sorunudur, bu nedenle garanti iadesi bunu çözmeyebilir.
