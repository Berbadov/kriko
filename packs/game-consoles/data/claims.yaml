  text:
    en:
      title: CE-108255-1 crash error on PS5 Slim Disc Edition when joining online matches
      body: A PS5 Slim Disc Edition owner reports crashes with error CE-108255-1 specifically when entering
        online matches; a separate French forum thread calls CE-108255-1 a recurring Sony error code on
        PS5, usually resolved by clearing cache or reinstalling the game.
      advice: CE-108255-1 is a known PS5 crash error code. It is often a software/data issue (clear cache,
        rebuild database, reinstall the game) rather than hardware, but if it persists across games a
        repairer may suspect the internal SSD. Try the software fixes before paying for hardware diagnosis.
    tr:
      title: PS5 Slim Disc Edition'da çevrimiçi maçlara katılırken CE-108255-1 çökme hatası
      body: Bir PS5 Slim Disc Edition sahibi, özellikle çevrimiçi maçlara girerken CE-108255-1 hatasıyla
        çökmeler bildiriyor; ayrı bir Fransız forum başlığı CE-108255-1'i PS5'te tekrarlayan bir Sony
        hata kodu olarak nitelendiriyor ve genellikle önbelleği temizleyerek veya oyunu yeniden yükleyerek
        çözüldüğünü belirtiyor.
      advice: CE-108255-1 bilinen bir PS5 çökme hata kodudur. Genellikle donanım değil yazılım/veri sorunudur
        (önbelleği temizleyin, veritabanını yeniden oluşturun, oyunu yeniden yükleyin), ancak oyunlar
        arasında devam ederse bir tamirci dahili SSD'den şüphelenebilir. Donanım teşhisi için ödeme yapmadan
        önce yazılım düzeltmelerini deneyin.
