      body: Sony's official support documentation for the disc model covers disc-reading problems and
        a manual procedure to remove a disc stuck in the drive (using a screw on the drive), confirming
        the disc drive is a serviceable part with recognized failure modes.
      advice: For the Disc edition specifically, the optical drive is the part unique to this model. Sony's
        own guide documents reading faults and stuck discs and provides a manual eject screw, so a stuck
        disc is recoverable without sending the console away, but drive faults are a repair-shop item.
