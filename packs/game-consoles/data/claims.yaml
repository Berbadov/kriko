        NVMe tarzı önyükleme hataları ve yüksek GPU sıcaklıkları yaşandığını bildiriyor.
      advice: Bir LCD Deck alırsanız, bir BIOS güncellemesinin rastgele kapanmaları ve termal sıçramaları
        tetikleyebileceğini bilin; sahipler çözüm olarak BIOS'u geri almayı bildiriyor. Satın almadan
        önce birimin BIOS/SteamOS sürümünü doğrulayın.
