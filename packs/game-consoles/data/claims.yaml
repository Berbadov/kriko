    en:
      title: PS5 Slim shuts down under load in native PS5 games (Sonics bus error)
      body: A repair-forum case documents a PS5 Slim (EDM-052 board) that crashes and fully shuts down
        under load in native PS5 games, with Syscon logs showing a Sonics bus error (B0088108) and SSD
        controller watchdog timeout.
      advice: A PS5 that powers off only under heavy game load (not in menus) points to a hardware/power
        fault rather than software; the Syscon error log is what a repairer reads to diagnose it. This
        is a single-unit repair case, not evidence of a widespread defect.
    tr:
      title: PS5 Slim yerel PS5 oyunlarında yük altında kapanıyor (Sonics veri yolu hatası)
      body: Bir onarım forumu vakası, yerel PS5 oyunlarında yük altında çöken ve tamamen kapanan bir PS5
