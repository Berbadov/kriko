      title: Switch Lite right thumbstick drifts and keeps drifting after replacement
      body: An owner reports the right thumbstick drifted upward and that three replacement sticks all
        drifted the same way, pointing to the ZIF connector/motherboard rather than the stick itself.
      advice: Stick drift is the most commonly reported Switch Lite hardware fault. Because the sticks
        are built into the console (not detachable like Joy-Cons), a drift means a full console repair
        or a motherboard-level fix, not a cheap controller swap.
    tr:
      title: Switch Lite sağ analog çubuğu kayıyor ve değişimden sonra da kaymaya devam ediyor
      body: Bir sahip, sağ analog çubuğun yukarı doğru kaydığını ve üç yedek çubuğun da aynı yönde kaydığını
        bildiriyor; bu, çubuğun kendisinden ziyade ZIF konektörü/ana karta işaret ediyor.
      advice: Çubuk kayması, en sık bildirilen Switch Lite donanım arızasıdır. Çubuklar konsola gömülü
        olduğundan (Joy-Con'lar gibi çıkarılabilir değil), kayma ucuz bir denetleyici değişimi değil,
        tam konsol onarımı veya ana kart düzeyinde bir düzeltme anlamına gelir.
