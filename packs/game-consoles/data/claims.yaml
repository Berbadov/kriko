      title: Xbox Series S internal SSD failure leaves console stuck at dashboard and E109 error after
        cloning
      body: A repair thread describes a Series S that boots games to a blackscreen and returns to the
        dashboard; the suspected cause is a failing SSD, and a self-repair clone produced an E109 error
        because the drive key did not transfer.
      advice: A failing internal SSD makes the console drop back to the dashboard when launching games;
        DIY cloning is risky (E109 error from the missing key), so this is an expensive repair that most
        buyers will not attempt.
    tr:
      title: Xbox Series S dahili SSD arızası, klonlamadan sonra konsolu panoda takılı ve E109 hatasıyla
        bırakıyor
      body: Bir onarım başlığı, oyunları siyah ekrana açıp panoya dönen bir Series S'i anlatıyor; şüphelenilen
        neden arızalı bir SSD ve kendi kendine onarım klonlaması, sürücü anahtarı aktarılmadığı için E109
        hatası üretti.
      advice: Arızalı bir dahili SSD, oyunları başlatırken konsolun panoya geri düşmesine neden olur;
        kendin yap klonlama risklidir (eksik anahtardan kaynaklanan E109 hatası), bu nedenle bu, çoğu
        alıcının denemeyeceği pahalı bir onarımdır.
