      title: Audi e-tron battery self-discharge can cause thermal overload and fire — official NHTSA recall
        document
      body: Primary official NHTSA recall circular (Safety Recall Code 93V2) describing the defect mechanism.
      advice: 'This is the manufacturer''s own description of the defect: self-discharge in certain HV
        battery modules can lead to thermal overload and fire. The remedy is a software update plus module
        replacement where needed, and until then Audi limits charge to 80%. Buyers should verify the recall
        was performed on any used e-tron.'
    tr:
      title: Audi e-tron akü kendiliğinden deşarjı termal aşırı yüklenmeye ve yangına neden olabilir —
        resmi NHTSA geri çağırma belgesi
      body: Kusur mekanizmasını açıklayan birincil resmi NHTSA geri çağırma genelgesi (Güvenlik Geri Çağırma
        Kodu 93V2).
      advice: 'Bu, üreticinin kusurun kendi açıklamasıdır: belirli HV akü modüllerinde kendiliğinden deşarj,
        termal aşırı yüklenmeye ve yangına yol açabilir. Çözüm, bir yazılım güncellemesi ve gerektiğinde
        modül değişimidir ve o zamana kadar Audi şarjı %80 ile sınırlar. Alıcılar, kullanılmış herhangi
        bir e-tron''da geri çağırmanın yapıldığını doğrulamalıdır.'
