      title: 'Turkey: Model Y crashed into a truck and caught fire, firefighters took ~3 hours to extinguish'
      body: 'A documented Model Y battery fire in Turkey (Aydın/Efeler) after a collision with a truck:
        the lithium pack entered thermal runaway, required about three hours of cooling to extinguish,
        and carried a re-ignition risk.'
      advice: This is a crash-induced battery fire, not a spontaneous one; the practical cost for an owner
        is that a Model Y fire is very hard to put out (tens of thousands of gallons of water) and can
        reignite, so parking/charging near structures carries risk.
    tr:
