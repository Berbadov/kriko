      title: 'EQB 250+ 70,5 kWh Farasis akü: dahili kısa devre yangın riski, değişim 2028''e ertelendi'
      body: 70,5 kWh Farasis akülü EQB 250+ (2021-2024) dahili kısa devre yangın riski taşır. Geri çağırma
        dünya çapında 51.000'den fazla aracı kapsıyor (Almanya'da ~4.700) ve sınırlı parça bulunabilirliği
        nedeniyle akü değişimi Mart 2028'e kadar ertelenebilir.
      advice: EQB 250+ sahipleri, değişim aküsü için uzun bir bekleyişle karşı karşıyadır. O zamana kadar
        şarjı %80 veya altında tutmalı ve garajlarda veya yer altı otoparklarında park etmekten kaçınmalıdırlar.
