        ilgili yangın riski tespit etti (Almanya'da 4.677). Bir Stuttgart mahkemesi, yalnızca şarj ve
        park kısıtlamalarının aracı kullanılamaz hale getirdiğine hükmederek satış sözleşmesinin feshine
        karar verdi.
      advice: Yangın riski çözülmedi ve geçici kısıtlamalar (dışarıda park etme, en fazla %80 şarj) önemlidir.
