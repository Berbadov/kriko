      title: 'EQB 250+ 70.5 kWh Farasis battery: internal short-circuit fire risk, replacement delayed
        to 2028'
      body: The EQB 250+ with the 70.5 kWh Farasis battery (2021-2024) carries an internal short-circuit
        fire risk. The recall covers more than 51,000 vehicles worldwide (~4,700 in Germany), and battery
        replacement may be delayed until March 2028 due to limited parts availability.
      advice: Owners of the EQB 250+ face a long wait for the replacement battery. Until then they must
        keep charge at or below 80% and avoid parking in garages or underground car parks.
