      body: In a fatal October 2024 Model Y fire in Anseong, witnesses could not open the doors; Tesla's
        manual says the front release is a lever and the rear release is a cable under the door-pocket
        mat, and that not all Model Ys have the rear manual release.
      advice: 'This is the concrete failure behind the recall: the electronic door release can be unusable
        after a crash, and the manual backup is hard to find, especially for rear passengers; an owner
        should locate and practice both releases on their own car.'
    tr:
