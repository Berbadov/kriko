        a model range (A1257-A1647) that could be read to include A1640, but the authoritative CPSC notice
        lists specific models and A1640 is not one of them.
    tr:
      title: Anker CPSC geri çağırması PowerCore Solar 10000'i (A1640) içermiyor
      body: Birincil CPSC bildirimi (18 Eylül 2025) yalnızca A1647, A1652, A1257, A1681 ve A1689'u adlandırıyor.
        A1640 (PowerCore Solar 10000) bunlar arasında değil ve daha önceki Haziran 2025 geri çağırması
        farklı bir ürün olan PowerCore 10000 A1263 içindi.
      advice: A1640'ın geri çağrıldığını varsaymayın. İkincil makaleler ikinci geri çağırmayı, A1640'ı
        içerecek şekilde okunabilecek bir model aralığını (A1257-A1647) kapsıyor şeklinde tanımlıyor,
