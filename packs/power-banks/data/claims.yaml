  text:
    en:
      title: CPSC Anker power bank recall excludes A1685
      body: 'The official CPSC recall (Sept 18, 2025, recall #25-466, ~481,000 units) covers models A1647,
        A1652, A1257, A1681 and A1689. The A1685 subject model is NOT among the recalled models, so it
        is not covered by the recall remedy (full cash refund or gift card).'
      advice: Because the A1685 is not in the CPSC recall, a buyer of this specific model has no recall-based
        remedy and should not assume the unit is protected. The recall itself documents 33 fire/explosion
        reports across the recalled Anker models, showing the broader risk family, but it does not extend
        to the A1685.
    tr:
      title: CPSC Anker power bank geri çağırması A1685'i kapsamıyor
      body: 'Resmi CPSC geri çağırması (18 Eylül 2025, geri çağırma #25-466, ~481.000 adet) A1647, A1652,
        A1257, A1681 ve A1689 modellerini kapsıyor. Söz konusu A1685 modeli geri çağrılan modeller arasında
        DEĞİLDİR, bu nedenle geri çağırma telafisi (tam nakit iade veya hediye kartı) kapsamında değildir.'
      advice: A1685 CPSC geri çağırmasında yer almadığı için, bu belirli modeli satın alan birinin geri
        çağırmaya dayalı bir telafisi yoktur ve ünitenin korunduğunu varsaymamalıdır. Geri çağırmanın
        kendisi, geri çağrılan Anker modelleri genelinde 33 yangın/patlama raporunu belgeleyerek daha
        geniş risk ailesini göstermektedir, ancak bu A1685'i kapsamamaktadır.
