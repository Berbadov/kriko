  text:
    en:
      title: Owner reports solar panel surface temperature exceeding 60°C during solar charging, risking
        battery cell damage
      body: A Japanese Amazon reviewer of the Anker PowerCore Solar 10000 (A1640) reports that solar charging
        causes the unit to overheat to the point of potential battery cell damage, noting the solar panel
        surface temperature exceeds 60°C in summer. This is an owner observation, not a documented safety
        event like a fire or recall. This finding came from the search 'Anker PowerCore Solar 10000 A1640
        overheating'.
      advice: The A1640 has a high-temperature indicator (per its manual) that warns when the unit exceeds
        its operating temperature limit. Owners should avoid leaving the unit in direct sunlight for extended
        solar charging, especially in summer, as the heat may degrade the battery cells.
    tr:
      title: Sahip, güneş enerjisiyle şarj sırasında güneş paneli yüzey sıcaklığının 60°C'yi aştığını
        ve pil hücresi hasarı riski oluşturduğunu bildiriyor
      body: Anker PowerCore Solar 10000 (A1640) ürününün bir Japon Amazon yorumcusu, güneş enerjisiyle
        şarjın ünitenin potansiyel pil hücresi hasarına yol açacak kadar aşırı ısınmasına neden olduğunu
        ve yaz aylarında güneş paneli yüzey sıcaklığının 60°C'yi aştığını belirtiyor. Bu bir sahip gözlemidir,
        yangın veya geri çağırma gibi belgelenmiş bir güvenlik olayı değildir. Bu bulgu 'Anker PowerCore
        Solar 10000 A1640 overheating' aramasından elde edilmiştir.
      advice: A1640'ın (kılavuzuna göre) ünitenin çalışma sıcaklığı sınırını aştığında uyaran bir yüksek
        sıcaklık göstergesi vardır. Sahipler, ısının pil hücrelerini bozabileceğinden, özellikle yaz aylarında
        üniteyi uzun süreli güneş enerjisiyle şarj için doğrudan güneş ışığında bırakmaktan kaçınmalıdır.
