  text:
    en:
      title: Anker PowerCore 10000 recall covers model A1263 only, not the 523/A1245
      body: The June 12, 2025 CPSC recall (No. 25-338) of ~1.158M Anker PowerCore 10000 units applies
        to model A1263 only, not to the subject A1245 (523 Power Bank / PowerCore Slim 10K PD). Anker's
        own recall page confirms the same model A1263. The A1245 is a different model and is not named
        in this recall or in Anker's September 18, 2025 recall (models A1647, A1652, A1257, A1681, A1689).
      advice: A buyer of the Anker 523 Power Bank (A1245) should not assume it is part of the widely-reported
        June 2025 PowerCore 10000 recall — that recall is model A1263 only. Verify the model number printed
        on the bottom of the unit (A1245 vs A1263) before acting on recall notices. No A1245-specific
        recall, fire, overheating, or swelling event was found in this run.
    tr:
      title: Anker PowerCore 10000 geri çağırması yalnızca A1263 modelini kapsıyor, 523/A1245 modelini
        değil
      body: 12 Haziran 2025 tarihli CPSC geri çağırması (No. 25-338), yaklaşık 1,158 milyon adet Anker
        PowerCore 10000 ünitesini kapsıyor ve yalnızca A1263 modeli için geçerlidir; konu olan A1245 (523
        Power Bank / PowerCore Slim 10K PD) için geçerli değildir. Anker'in kendi geri çağırma sayfası
        da aynı A1263 modelini doğrulamaktadır. A1245 farklı bir modeldir ve ne bu geri çağırmada ne de
        Anker'in 18 Eylül 2025 tarihli geri çağırmasında (A1647, A1652, A1257, A1681, A1689 modelleri)
        adı geçmektedir.
      advice: Bir Anker 523 Power Bank (A1245) alıcısı, yaygın olarak bildirilen Haziran 2025 PowerCore
        10000 geri çağırmasının bir parçası olduğunu varsaymamalıdır — o geri çağırma yalnızca A1263 modelidir.
        Geri çağırma bildirimlerine göre hareket etmeden önce ünitenin altında yazılı model numarasını
        (A1245 ile A1263) doğrulayın. Bu çalışmada A1245'e özgü bir geri çağırma, yangın, aşırı ısınma
        veya şişme olayı bulunamadı.
