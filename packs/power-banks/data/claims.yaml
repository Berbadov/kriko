  text:
    en:
      title: Anker Zolo Magnetic Power Bank A1685 sparked and burned while unused
      body: An owner reported her Anker Zolo Magnetic Power Bank A1685 10k sparked and burned at ~1 a.m.
        while unplugged and unused, about a year after purchase. She explicitly stated her model (A1685)
        was not part of Anker's global recall. Anker's local distributor reached out to coordinate an
        investigation. This is a documented fire incident tied directly to the A1685 model number.
      advice: The A1685 is not covered by Anker's recall, so a buyer cannot rely on a recall remedy for
        this model. If you own or buy this unit, treat it as unrecalled, monitor it for heat/swelling,
        and do not leave it charging unattended or near flammables overnight. The incident occurred while
        the unit was idle, so even 'unused' units have been reported to ignite.
    tr:
      title: Anker Zolo Magnetic Power Bank A1685 kullanılmadığı sırada kıvılcım çıkardı ve yandı
      body: Bir sahibi, Anker Zolo Magnetic Power Bank A1685 10k'nın satın alımdan yaklaşık bir yıl sonra,
        saat ~01.00'de fişe takılı değilken ve kullanılmadığı sırada kıvılcım çıkarıp yandığını bildirdi.
        Modelinin (A1685) Anker'in küresel geri çağırmasının bir parçası olmadığını açıkça belirtti. Anker'in
        yerel distribütörü bir soruşturmayı koordine etmek için iletişime geçti. Bu, doğrudan A1685 model
        numarasına bağlı belgelenmiş bir yangın olayıdır.
      advice: A1685, Anker'in geri çağırması kapsamında değildir, bu nedenle bir alıcı bu model için geri
        çağırma çözümüne güvenemez. Bu cihaza sahipseniz veya satın alırsanız, geri çağrılmamış olarak
        değerlendirin, ısınma/şişme açısından izleyin ve gece boyunca gözetimsiz veya yanıcı maddelerin
        yakınında şarjda bırakmayın. Olay cihaz boştayken meydana geldi, bu nedenle 'kullanılmayan' cihazların
        bile tutuştuğu bildirilmiştir.
  evidence:
