        in lithium-ion batteries that can cause overheating, melting of plastic components, smoke, and
        fire. The recall covers units from January 3, 2024 to September 17, 2024, with an expanded recall
        launched in June 2025.
      advice: If you own an A1652, immediately stop using it, check the serial number on Anker's recall
        page, and dispose of it at a facility that accepts lithium-ion batteries. Do not throw it in the
        trash or recycling bins.
    tr:
      title: Anker, lityum iyon batarya kusurundan kaynaklanan yangın riski nedeniyle A1652 MagGo Power
        Bank'i resmen geri çağırıyor
      body: Bu, A1652'nin aşırı ısınmaya, plastik bileşenlerin erimesine, dumana ve yangına neden olabilecek
        lityum iyon bataryalardaki üretim kusurundan etkilendiğini doğrulayan Anker'in resmi geri çağırma
        sayfasıdır. Geri çağırma, 3 Ocak 2024 ile 17 Eylül 2024 arasındaki birimleri kapsıyor ve Haziran
        2025'te genişletilmiş bir geri çağırma başlatıldı.
      advice: Bir A1652'ye sahipseniz, derhal kullanmayı bırakın, seri numarasını Anker'in geri çağırma
        sayfasında kontrol edin ve lityum iyon bataryaları kabul eden bir tesiste bertaraf edin. Çöpe
        veya geri dönüşüm kutularına atmayın.
