note: Only A1236 had documented recall evidence tied to its exact model number. No
  CPSC or manufacturer recalls were found for A1246, A1247, A1245, A1229, or A1640.
  The Japanese Consumer Affairs Agency recall covered A1263 models (original PowerCore
  10000), not the PD+ or Redux variants. Specs for A1245 were found on Anker's official
  service page and a Persian retailer; capacity and output for other models could
  not be sourced from pages I opened.
out_of_scope:
- Anker 321 Power Bank (PowerCore 5K, Black) A1112 — recalled by Anker for a battery
  manufacturing defect (overheating, melting, smoke, fire), but it is 5,000 mAh, outside
  the ~10,000 mAh scope
- Baseus 30,000 mAh portable charger (BS-30KP365) — recalled for battery swelling
  and fires, but a different brand and capacity
