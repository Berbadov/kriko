      body: Intel'in kendi bilgi tabanı, B580'in VRAM'inin boşta tam 2375 MHz'de kaldığını doğruluyor,
        ancak bunu beklenen davranış olarak çerçeveliyor ve ASPM/L1/PCIe bağlantı güç tasarrufları etkinleştirildiğinde
        GPU'nun 10W'ın altında boşta kaldığını belirtiyor.
      advice: Boşta güç tüketimi burada gerçek bir kusur değil — Intel bunu beklenen olarak belgeliyor
