      body: Intel's own knowledge base confirms the B580's VRAM stays at full 2375 MHz at idle, but frames
        this as expected behavior and states the GPU idles under 10W once ASPM/L1/PCIe link power savings
        are enabled.
      advice: Idle power is not a real defect here — Intel documents it as expected and under 10W with
        power-saving features on — so a shopper should not treat high idle draw as a reason to avoid the
        card.
    tr:
