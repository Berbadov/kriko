  text:
    en:
      title: MSI RTX 3060 VENTUS 2X OC reaches ~90 °C under load after two years, even after repasting
      body: PcComponentes community thread (EU) where an owner of an MSI GeForce RTX 3060 VENTUS 2X OC
        reports the card started overheating to ~90 °C under load after two years, with fans at maximum,
        and that replacing thermal paste did not help. This is variant-specific and age-related rather
        than a series-wide defect.
      advice: A 3060 running hot after a couple of years may need new thermal pads and proper heatsink
        re-seating, not just paste; on this MSI Ventus variant, repasting alone did not fix it. Check
        thermals before buying a used card of this age.
    tr:
      title: MSI RTX 3060 VENTUS 2X OC iki yıl sonra yük altında ~90 °C'ye ulaşıyor, termal macun yenilense
        bile
      body: PcComponentes topluluk başlığı (AB); bir MSI GeForce RTX 3060 VENTUS 2X OC sahibi, kartın
        iki yıl sonra yük altında fanlar maksimumdayken ~90 °C'ye aşırı ısınmaya başladığını ve termal
        macun değişiminin yardımcı olmadığını bildiriyor. Bu, seri genelinde bir kusur değil, varyanta
        özgü ve yaşa bağlı bir durumdur.
      advice: Birkaç yıl sonra sıcak çalışan bir 3060, sadece macun değil yeni termal pedler ve düzgün
        soğutucu yeniden oturtma gerektirebilir; bu MSI Ventus varyantında yalnızca macun yenilemek sorunu
        çözmedi. Bu yaşta kullanılmış bir kart almadan önce termalleri kontrol edin.
