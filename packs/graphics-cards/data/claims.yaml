  text:
    en:
      title: RTX 5090 12V-2x6 connector current imbalance — two wires carry 22 A+, connector reaches 150
        °C
      body: Der8auer measured on a 5090 Founders Edition that two of the six 12V wires carried over 22
        A while the rest sat around 2 A, and the PSU-side connector reached 150 °C, against a per-pin
        design of ~9.5 A.
      advice: The 12V-2x6 connector does not balance current across its six wires, so a single high-resistance
        pin can carry most of the load and overheat. This is the mechanism behind the melting reports;
        a shopper cannot see it without thermal/current instrumentation, so it is a real hidden risk on
        any 5090.
    tr:
      title: RTX 5090 12V-2x6 konektör akım dengesizliği — iki kablo 22 A+ taşıyor, konektör 150 °C'ye
        ulaşıyor
      body: Der8auer, bir 5090 Founders Edition üzerinde yaptığı ölçümde altı 12V kablosundan ikisinin
        22 A'nın üzerinde taşıdığını, geri kalanının ise yaklaşık 2 A civarında olduğunu ve PSU tarafındaki
        konektörün ~9,5 A'lik bir pin başına tasarıma karşı 150 °C'ye ulaştığını ölçtü.
      advice: 12V-2x6 konektörü akımı altı kablosu arasında dengelemez, bu nedenle tek bir yüksek dirençli
        pin yükün çoğunu taşıyabilir ve aşırı ısınabilir. Bu, erime raporlarının arkasındaki mekanizmadır;
        bir alıcı bunu termal/akım enstrümantasyonu olmadan göremez, bu yüzden herhangi bir 5090'da gerçek
        bir gizli risktir.
