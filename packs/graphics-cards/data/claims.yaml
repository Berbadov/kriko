  text:
    en:
      title: RTX 3060 black screen after Windows auto-installs driver; card no longer detected
      body: French-language Microsoft Q&A thread (EU market) where an RTX 3060 owner reports that after
        Windows auto-installs the driver and the PC restarts, the card is no longer detected and the screen
        stays black, while the card works perfectly on Linux. The conflict is between Windows' auto-installed
        driver and the NVIDIA driver.
      advice: On Windows, the auto-installed driver can leave the 3060 undetected with a black screen
        after reboot; owners resolve this by fully removing the driver with DDU in Safe Mode before installing
        the NVIDIA driver. Expect this as a possible setup hurdle, not a hardware fault.
    tr:
      title: Windows sürücüyü otomatik yükledikten sonra RTX 3060 siyah ekran; kart artık algılanmıyor
      body: Fransızca Microsoft Q&A başlığı (AB pazarı); bir RTX 3060 sahibi, Windows sürücüyü otomatik
        yükleyip PC yeniden başladıktan sonra kartın artık algılanmadığını ve ekranın siyah kaldığını,
        kartın Linux'ta ise kusursuz çalıştığını bildiriyor. Çatışma, Windows'un otomatik yüklediği sürücü
        ile NVIDIA sürücüsü arasındadır.
      advice: Windows'ta otomatik yüklenen sürücü, yeniden başlatma sonrası 3060'ı siyah ekranla algılanamaz
        bırakabilir; sahipler bunu NVIDIA sürücüsünü yüklemeden önce Güvenli Mod'da DDU ile sürücüyü tamamen
        kaldırarak çözüyor. Bunu olası bir kurulum engeli olarak bekleyin, donanım arızası olarak değil.
