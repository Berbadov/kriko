  text:
    en:
      title: RTX 5090 12+4-pin power connector melting — repair centre receives seven bricked cards in
        two days
      body: A single repair shop received seven bricked Nvidia cards in two days, mostly RTX 5090s across
        multiple brands including the Founders Edition, all with burnt 12+4-pin interfaces, some melted
        into the socket so the cable had to be snipped off.
      advice: Before buying, budget for a PSU/cable with a fully seated 12V-2x6 connector and check the
        12V readout in GPU-Z; the repairman notes that if the 12+4-pin voltage drops well below 12 V (to
        ~11.3–11.4 V) the connector is likely failing and should be checked by hand for heat. This is
        the highest-cost failure mode — a melted connector can brick the card and damage the PSU.
    tr:
      title: RTX 5090 12+4-pin güç konektörü eriyor — onarım merkezine iki günde yedi bozuk kart geldi
      body: Tek bir onarım dükkânına iki günde yedi bozuk Nvidia kartı geldi; çoğu Founders Edition dahil
        birden fazla markadan RTX 5090'lardı ve hepsinde yanmış 12+4-pin arayüzleri vardı, bazıları sokete
        erimişti, bu yüzden kablonun kesilmesi gerekti.
      advice: Satın almadan önce, tam oturmuş 12V-2x6 konektörlü bir PSU/kablo için bütçe ayırın ve GPU-Z'deki
        12V değerini kontrol edin; tamirci, 12+4-pin voltajı 12 V'nin çok altına düşerse (~11,3–11,4 V)
        konektörün muhtemelen arızalandığını ve elle ısı açısından kontrol edilmesi gerektiğini belirtiyor.
        Bu, en yüksek maliyetli arıza modudur — erimiş bir konektör kartı bozabilir ve PSU'ya zarar verebilir.
  evidence:
