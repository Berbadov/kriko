  text:
    en:
      title: ZOTAC RTX 3060 Twin Edge OC melted PSU-to-GPU wires (owner report)
      body: Two-star Amazon owner review of the ZOTAC Gaming GeForce RTX 3060 Twin Edge OC 12GB. The owner
        reports the first unit smoked the PSU and that plugging the card in melted the wires from PSU
        to GPU, while a second card and a swapped PSU worked fine. Single anecdote on one AIB variant,
        so treat as a possible unit-level defect rather than a series-wide issue.
      advice: A melted PSU-to-GPU power cable is a fire hazard; if it happens, stop use immediately, replace
        the PSU/cables, and RMA the card. This is one owner's report on a single variant, not evidence
        of a series-wide connector problem like the RTX 4090's.
    tr:
      title: ZOTAC RTX 3060 Twin Edge OC PSU-GPU kablolarını eritti (sahip bildirimi)
      body: ZOTAC Gaming GeForce RTX 3060 Twin Edge OC 12GB için iki yıldızlı Amazon sahip incelemesi.
        Sahip, ilk ünitenin PSU'yu dumanlandırdığını ve kartı takmanın PSU'dan GPU'ya giden kabloları
        erittiğini, ikinci bir kart ve değiştirilmiş bir PSU'nun ise sorunsuz çalıştığını bildiriyor.
        Tek bir AIB varyantı üzerine tek anekdot, bu nedenle seri genelinde bir sorun değil olası ünite
        düzeyinde bir kusur olarak değerlendirin.
      advice: Erimiş bir PSU-GPU güç kablosu yangın tehlikesidir; olursa kullanımı hemen durdurun, PSU/kabloları
        değiştirin ve kartı RMA'ya gönderin. Bu, tek bir varyant üzerine bir sahibin bildirimidir; RTX
        4090'ınki gibi seri genelinde bir konnektör sorununun kanıtı değildir.
