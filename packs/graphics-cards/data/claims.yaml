  text:
    en:
      title: RTX 4090 12VHPWR power connector melting
      body: The 16-pin 12VHPWR connector is the documented failure point on the RTX 4090; repair shops
        report receiving multiple 4090s with melted connectors in a matter of days, across brands (MSI,
        ASUS, Gainward, NVIDIA FE). NVIDIA's revised 12V-2×6 connector is designed to reduce it, but reports
        continue.
      advice: 'Before buying, treat the 12VHPWR connection as the main risk: seat the plug fully, avoid
        sharp bends, and monitor the 12V rail (a drop toward ~11.3 V under load is a warning sign). A
        melted connector can damage the card''s PCB and voids warranty if the wrong cable/adapter is blamed.'
    tr:
      title: RTX 4090 12VHPWR güç konektörü erimesi
      body: 16 pinli 12VHPWR konektörü, RTX 4090'da belgelenmiş arıza noktasıdır; tamir atölyeleri, markalar
        arasında (MSI, ASUS, Gainward, NVIDIA FE) birkaç gün içinde erimiş konektörlü birden fazla 4090
        aldıklarını bildiriyor. NVIDIA'nın revize edilmiş 12V-2×6 konektörü bunu azaltmak için tasarlanmıştır,
        ancak bildirimler devam ediyor.
      advice: 'Satın almadan önce, 12VHPWR bağlantısını ana risk olarak değerlendirin: fişi tam olarak
        oturtun, keskin bükülmelerden kaçının ve 12V rayını izleyin (yük altında ~11,3 V''a doğru bir
        düşüş bir uyarı işaretidir). Erimiş bir konektör kartın PCB''sine zarar verebilir ve yanlış kablo/adaptör
        suçlanırsa garantiyi geçersiz kılar.'
  evidence:
