  text:
    en:
      title: RTX 3060 recurring crashes in games tied to nvlddmkm.sys 0x116 TDR failure
      body: Microsoft Q&A thread from an RTX 3060 owner reporting constant in-game crashes with a VIDEO_TDR_FAILURE
        (0x116) pointing at nvlddmkm.sys. The user tried DDU clean installs of multiple driver versions
        without success; only lowering GPU clock and memory speed in Afterburner stopped the crashes.
      advice: If a 3060 crashes in games with a 0x116/nvlddmkm.sys error, a clean driver reinstall may
        not fix it; undervolting/undervolting the clock and memory is the workaround owners report. This
        is a driver-level quirk, not a hardware failure, but it costs troubleshooting time.
    tr:
      title: RTX 3060'ta oyunlarda tekrarlayan çökmeler nvlddmkm.sys 0x116 TDR hatasına bağlı
      body: Bir RTX 3060 sahibinin Microsoft Q&A başlığı; nvlddmkm.sys'i işaret eden VIDEO_TDR_FAILURE
        (0x116) ile oyun içinde sürekli çökmeler bildiriliyor. Kullanıcı birden fazla sürücü sürümünü
        DDU ile temiz kurmayı başarısız şekilde denedi; çökmeleri yalnızca Afterburner'da GPU çekirdek
        ve bellek hızını düşürmek durdurdu.
      advice: Bir 3060 oyunlarda 0x116/nvlddmkm.sys hatasıyla çöküyorsa, temiz sürücü yeniden kurulumu
        bunu düzeltmeyebilir; çekirdek ve bellek hızını düşürmek/undervolt yapmak sahiplerin bildirdiği
        geçici çözümdür. Bu donanım arızası değil, sürücü düzeyinde bir tuhaflıktır, ancak sorun giderme
        zamanına mal olur.
