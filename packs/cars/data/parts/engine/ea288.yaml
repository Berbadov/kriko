- id: ea288_engine_ea288_1_6_tdi_turbo_bear_v1
  claim_key: ea288_engine_ea288_1_6_tdi_turbo_bear
  version: 1
  is_current: true
  title: EA288 1.6 TDI turbo bearing failure from oil coking
  title_tr: EA288 1.6 TDI turbo yatak arızası (yağ koklaşması)
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  rationale: This specific EA288 diesel can suffer turbocharger bearing damage after
    about 150,000 km due to oil coking and heat. The repair is very expensive because
    it requires removing the axle and DPF, and delay can destroy the DPF. A buyer
    should listen for whistling and check for power loss during a test drive.
  rationale_tr: Bu EA288 dizel, yaklaşık 150.000 km sonra yağ koklaşması ve ısı stresi
    nedeniyle turbo yatak hasarı yaşayabilir. Onarım çok pahalıdır çünkü aks ve DPF
    sökülmesi gerekir; gecikme DPF'i de tahrip edebilir. Alıcı test sürüşünde ıslık
    sesi ve güç kaybına dikkat etmelidir.
  inspection_advice: During test drive, listen for turbo whistling/wailing and sudden
    power loss. Check service history for regular oil changes; after 150,000 km budget
    for possible turbo/DPF replacement. Scan for fault code P0299.
  inspection_advice_tr: Test sürüşünde turbo ıslık/uluma sesi ve ani güç kaybını dinleyin.
    Düzenli yağ değişimi için servis geçmişini kontrol edin; 150.000 km sonra olası
    turbo/DPF değişimi için bütçe ayırın. P0299 hata kodunu tarayın.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://what-breaks.com/vw/golf-7
    source_domain: what-breaks.com
    site_or_channel: what-breaks.com
    quote: '"Turbocharger Bearing Wear from 150,000 km Turbocharger bearing damage
      results from oil coking and thermal stress. Removal is laborious: front axle
      release, DPF removal — total cost for parts and approx. 8 hours labour can reach
