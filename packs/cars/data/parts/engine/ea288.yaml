  kind: known_issue
  domain: emissions
  severity: high
  confidence: 0.6
  rationale: The diesel particulate filter (DPF) traps soot, but must get very hot
    to burn it off. On short city trips it never heats up enough, so the filter fills
    with soot, causing power loss, stalling, and expensive filter replacement. This
    is a known issue on this engine if most driving is short distance.
  rationale_tr: Dizel partikül filtresi (DPF) kurum tutar, ancak yakmak için çok ısınması
    gerekir. Kısa şehir içi yolculuklarda yeterince ısınmadığı için filtre kurumla
    dolar ve güç kaybı, stop etme ve pahalı filtre değişimine neden olur. Bu motor
    için çoğunlukla kısa mesafe kullanımda bilinen bir sorundur.
  inspection_advice: Check for DPF warning light, ask about typical driving routes,
    and consider a diagnostic scan to check soot load and regeneration history. Look
    for evidence of prior DPF replacement or cleaning in service records.
  inspection_advice_tr: DPF uyarı lambasını kontrol edin, tipik kullanım güzergahlarını
    sorun ve is yükü ile rejenerasyon geçmişini kontrol etmek için arıza tarama cihazı
    kullanın. Servis kayıtlarında önceki DPF değişimi veya temizliği kanıtlarını arayın.
  status: review
  promoted_by: ledger
  sources:
