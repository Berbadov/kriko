    bir kayış kullanır. Bu kayışın belirli bir kilometrede (120.000–150.000 km) değiştirilmesi
    gerekir, ancak birçok sahip bunu atlar. Kayış koparsa motor ciddi şekilde hasar
    görebilir ve onarım binlerce liraya mal olabilir.
  inspection_advice: Ask to see service records proving the timing belt was replaced
    at the specified interval. If the car is near or past 120,000 km and there's no
    proof, assume it's due at your expense. Listen for unusual noise or check for
    oil leaks, but the belt itself is not visible without disassembly.
  inspection_advice_tr: Zamanlama kayışının belirtilen aralıkta değiştirildiğini kanıtlayan
    servis kayıtlarını isteyin. Araç 120.000 km'ye yakınsa veya geçtiyse ve kanıt
    yoksa, masrafın size ait olacağını varsayın. Olağan dışı ses veya yağ sızıntısı
    olup olmadığını dinleyin, ancak kayışın kendisi sökülmeden görünmez.
