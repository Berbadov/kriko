- id: ea288_fuel_system_ea288_cp4_1_pump_failure_v1
  claim_key: ea288_fuel_system_ea288_cp4_1_pump_failure
  version: 1
  is_current: true
  title: EA288 CP4.1 pump failure risk from overdue fuel filter changes
  title_tr: 'EA288 CP4.1 pompa arıza riski: gecikmiş yakıt filtresi değişimi'
  kind: known_issue
  domain: fuel system
  severity: high
  confidence: 0.6
  rationale: The CP4.1 high-pressure fuel pump on EA288 TDI engines can fail if the
    fuel filter isn't changed every 60,000 km as recommended. Contaminants and poor
    fuel quality accelerate wear, so a neglected filter can lead to an expensive pump
    replacement. Unless previous service records prove the filter was changed, a buyer
    should assume it is overdue and budget for its replacement.
  rationale_tr: EA288 TDI motorlardaki CP4.1 yüksek basınçlı yakıt pompası, önerilen
    60.000 km'de yakıt filtresi değişimi yapılmazsa arızalanabilir. Kirleticiler ve
    düşük yakıt kalitesi aşınmayı hızlandırır; bu nedenle ihmal edilmiş bir filtre,
    pahalı bir pompa değişimine yol açabilir. Önceki servis kayıtları filtre değişimini
    kanıtlamadıkça, alıcı bunun gecikmiş olduğunu varsaymalı ve değişim için bütçe
    ayırmalıdır.
  inspection_advice: Check service history for fuel filter replacements at 60,000
    km or less. Ask about fuel quality and refueling habits. Look for any stored fault
    codes related to fuel pressure (e.g., P0087). If the car is high mileage without
    records, factor a filter change and possibly a fuel pump inspection into the price.
  inspection_advice_tr: Servis geçmişinde yakıt filtresinin 60.000 km veya daha kısa
    aralıklarla değiştirildiğini kontrol edin. Yakıt kalitesi ve yakıt ikmali alışkanlıklarını
    sorun. Yakıt basıncıyla ilgili saklanmış hata kodlarını (örn. P0087) arayın. Araç
    yüksek kilometreye sahipse ve kayıt yoksa, fiyata filtre değişimi ve olası pompa
    muayenesi maliyetini ekleyin.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://kfz-dietrich.com/blog/vw-ea288-hochdruck-p0087-diagnose/
    source_domain: kfz-dietrich.com
    site_or_channel: kfz-dietrich.com
    quote: '"Prävention: Kraftstofffilterwechsel alle 40.000 km statt der Hersteller-60.000
      km, besonders bei wechselnder Tankqualität – schützt die CP4.1 vor Verschleiß."'
    independent: true
  applies_when:
    min_mileage_km: 60000
  component_id: engine_fuel_pump
  detection: diagnostic
- id: ea288_fuel_system_ea288_crkb_continental_i_v1
  claim_key: ea288_fuel_system_ea288_crkb_continental_i
  version: 1
  is_current: true
  title: EA288 CRKB Continental injector premature failure
  title_tr: EA288 CRKB Continental enjektör erken arızası
  kind: known_issue
  domain: fuel system
  severity: high
  confidence: 0.6
  rationale: Some 1.6 TDI engines with the CRKB code use Continental injectors that
    often fail between 50,000 and 100,000 km, sometimes right after a Dieselgate software
    update. Symptoms include heavy shaking, cylinder misfires, and hard cold starts.
    Repair costs are high, and VW goodwill depends on full service history.
  rationale_tr: CRKB kodlu bazı 1.6 TDI motorlarda, 50.000-100.000 km arasında sıklıkla
    arızalanan Continental enjektörler kullanılır; bazen Dieselgate yazılım güncellemesinden
    hemen sonra da arızalanabilir. Belirtiler arasında şiddetli titreme, silindir
    teklemesi ve zor soğuk çalışma yer alır. Onarım maliyetleri yüksektir ve VW'nin
    iyi niyet uygulaması tam servis geçmişine bağlıdır.
  inspection_advice: At viewing, start the engine cold and listen for uneven idle
    or misfires. Check service history for any injector replacements or goodwill work.
    If possible, read fault codes for cylinder-specific misfires (e.g., P0300-P0304)
    and fuel injection faults. Given the known pattern, budget for injector replacement
    if the car has >80,000 km and no proof of replacement.
  inspection_advice_tr: Araç muayenesinde motoru soğukken çalıştırıp düzensiz rölanti
    veya tekleme seslerini dinleyin. Servis geçmişinde enjektör değişimi veya iyi
    niyet işlemlerini kontrol edin. Mümkünse silindir bazlı tekleme (ör. P0300-P0304)
    ve yakıt enjeksiyon arıza kodlarını okuyun. Bilinen sorun nedeniyle, araç 80.000
    km'den fazlaysa ve değişim kanıtı yoksa enjektör değişimi için bütçe ayırın.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://what-breaks.com/vw/golf-7
    source_domain: what-breaks.com
    site_or_channel: what-breaks.com
    quote: '"Injector Failure (Continental Type) from 80,000 km The Continental injectors
      in the 105 hp variant (and related CRKB variants) fail between 50,000 and 100,000
      km. After the Dieselgate software update failures cluster shortly after reprogramming;
      VW only offers goodwill with a complete service history. Symptoms: Heavy juddering
      at idle, engine running on three cylinders, difficult cold start, fault codes
      for individual cylinders"'
    independent: true
  applies_when:
    min_mileage_km: 50000
  component_id: engine_injectors
  detection: diagnostic
- id: ea288_fuel_system_fuel_injector_clogging_g_v1
  claim_key: ea288_fuel_system_fuel_injector_clogging_g
  version: 1
  is_current: true
  title: Fuel injector clogging/gasket failures in EA288 2.0 TDI
  title_tr: EA288 2.0 TDI'de enjektör tıkanması/contası arızaları
  kind: known_issue
  domain: fuel system
  severity: high
  confidence: 0.6
  rationale: The 2.0 TDI diesel engine family, which includes the EA288, has a known
    chronic issue where fuel injectors clog or leak due to gasket failure. This can
    cause misfires, rough idling, loss of power, and poor fuel economy. Replacing
    injectors is costly, so these symptoms matter for a used-car buyer.
  rationale_tr: EA288 dahil 2.0 TDI dizel motor ailesinde, yakıt enjektörlerinin tıkanması
    veya conta arızası nedeniyle sızıntı yapması bilinen kronik bir sorundur. Bu durum
    tekleme, rölantide düzensizlik, güç kaybı ve yakıt ekonomisinin bozulmasına neden
    olabilir. Enjektör değişimi pahalıdır, bu nedenle bu belirtiler ikinci el alıcı
    için önemlidir.
  inspection_advice: Ask if injectors have been replaced and check service records.
    During a test drive, feel for rough idle or hesitation. If possible, run an OBD
    scan for misfire codes (e.g., P0200–P0299 range) and look at injector correction
    values. Also sniff under the hood for diesel fuel odor and inspect the injector
    area for wetness or soot.
  inspection_advice_tr: Enjektörlerin değiştirilip değiştirilmediğini sorun ve bakım
    kayıtlarını kontrol edin. Test sürüşünde rölanti düzensizliğine veya hızlanmada
    kekemeliğe dikkat edin. Mümkünse OBD taraması yapıp tekleme hatalarını (örn. P0200–P0299
    aralığı) ve enjektör düzeltme değerlerini inceleyin. Ayrıca motor bölmesinde dizel
    yakıt kokusu olup olmadığını kontrol edin ve enjektör çevresinde ıslaklık veya
    kurum izi arayın.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://autozilla.co.uk/volkswagen/vw-2-0-tdi-engine-problems/
    source_domain: autozilla.co.uk
    site_or_channel: autozilla.co.uk
    quote: '"Fuel injector failure is a common issue in 2.0 TDI engines. The function
      of the fuel injector is to pump fuel into the cylinders of an engine’s activating
      combustion. A failed fuel injector will throw the AFRs off and cut back on engine
      idles and performance. Though different causes play culprits to fuel injector
      failure, clogging is a major cause of this problem. Failed fuel injector can
      also occur due to gasket failure."'
    independent: true
  component_id: engine_injectors
  detection: diagnostic
- id: ea288_fuel_system_high_pressure_fuel_pump__v1
  claim_key: ea288_fuel_system_high_pressure_fuel_pump_
  version: 1
  is_current: true
  title: High-Pressure Fuel Pump Failure in EA288 1.6 TDI
  title_tr: EA288 1.6 TDI Yüksek Basınçlı Yakıt Pompası Arızası
  kind: known_issue
  domain: fuel system
  severity: high
  confidence: 0.6
  rationale: The high-pressure fuel pump on the 1.6 TDI (EA288) engine can fail without
    warning, causing the car to stall or not start. This is a costly repair and can
    be triggered by contamination or a clogged fuel filter. Look for evidence of regular
    fuel filter changes and avoid cars with a history of stalling.
  rationale_tr: 1.6 TDI (EA288) motorundaki yüksek basınçlı yakıt pompası uyarı vermeden
    arızalanabilir, aracın stop etmesine veya çalışmamasına neden olabilir. Bu pahalı
    bir onarımdır ve kirlilik veya tıkalı yakıt filtresi nedeniyle tetiklenebilir.
    Düzenli yakıt filtresi değişimine dair kanıt arayın ve stop etme geçmişi olan
    araçlardan kaçının.
  inspection_advice: At viewing, check for a log of fuel filter changes, and test
    the car from cold start. If possible, have a professional check fuel pressure
    with a diagnostic tool. DTC codes like P0087 or P0191 may indicate fuel pressure
    issues.
  inspection_advice_tr: Araç muayenesinde yakıt filtresi değişim kayıtlarını kontrol
    edin ve aracı soğuk çalıştırmada test edin. Mümkünse bir profesyonele teşhis cihazıyla
    yakıt basıncını kontrol ettirin. P0087 veya P0191 gibi DTC kodları yakıt basıncı
    sorunlarını gösterebilir.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://autozilla.co.uk/audi/vw-audi-1-6-tdi-engine-problems/
    source_domain: autozilla.co.uk
    site_or_channel: autozilla.co.uk
    quote: '"A common problem with the high-pressure fuel pump (HPFP) is very well
      known. The HPFP is responsible for delivering fuel to the engine and if it fails,
      the engine will not start or stall while driving. This annoying issue can be
      caused by a faulty HPFP or a clogged fuel filter."'
    independent: true
  component_id: engine_fuel_pump
  detection: diagnostic
