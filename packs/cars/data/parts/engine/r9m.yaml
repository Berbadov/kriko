    stranded. Specific symptoms and failure mileage are not detailed, but the risk
    is real and not easily detected in a standard inspection.
  rationale_tr: R9M 1.6 dCi motorunda yüksek basınçlı yakıt pompası erken arızalanabilmektedir.
