- id: r9m_engine_r9m_egr_carbon_buildup_r_v1
  claim_key: r9m_engine_r9m_egr_carbon_buildup_r
  version: 1
  is_current: true
  title: r9m EGR carbon buildup restricts airflow
  title_tr: r9m EGR karbon birikimi hava akışını kısıtlıyor
  kind: known_issue
  domain: engine
  severity: medium
  confidence: 0.6
  rationale: The EGR system recirculates exhaust gases containing soot and oil vapor,
    which coat the intake manifold and valve backs over time. This buildup narrows
    the airflow passages, reducing engine performance and potentially causing rough
    running. It is a chronic issue on this engine, often occurring with higher mileage.
  rationale_tr: EGR sistemi, kurum ve yağ buharı içeren egzoz gazlarını geri dolaştırır;
    bu gazlar zamanla emme manifoldu ve supap arkalarında birikinti oluşturur. Bu
    birikim hava geçişlerini daraltır, motor performansını düşürür ve düzensiz çalışmaya
    yol açabilir. Bu motorun yüksek kilometrede sık görülen kronik bir sorundur.
  inspection_advice: At viewing, check for DTC codes like P0401 (EGR insufficient
    flow) or P2002 (Diesel Particulate Filter efficiency), and look for symptoms such
    as rough idle, reduced power, or soot in the exhaust. Ask if the EGR system or
    intake has ever been cleaned; no cleaning history at high mileage raises risk.
  inspection_advice_tr: Araç muayenesinde P0401 (EGR yetersiz akışı) veya P2002 (DPF
    verimliliği) gibi DTC kodlarını kontrol edin; rölantide düzensizlik, güç kaybı
    veya egzozda kurum gibi belirtilere bakın. EGR sistemi veya emişin daha önce temizlendiğini
    sorun; yüksek kilometrede temizlik geçmişi yoksa risk artar.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://www.araclo.com/vehicles/renault-megane-1.6-dci/degerlendirmeler/kullanici-sorunlari
