  claim_key: r9m_engine_r9m_engine_cracks_near_o
  version: 1
  is_current: true
  title: R9M engine cracks near oil/water galleries
  title_tr: R9M motorunda yağ/su kanalları yakınında çatlaklar
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  rationale: The R9M engine can develop cracks where the oil return and water cooling
    passages are adjacent, allowing oil and coolant to mix. This leads to overheating
    and potential engine failure if not caught early. It is a specific, high-consequence
    failure for this engine code.
  rationale_tr: R9M motorunda, yağ dönüş ve su soğutma kanallarının bitişik olduğu
    bölgede çatlaklar oluşabilir, bu da yağ ve soğutma sıvısının karışmasına neden
    olur. Erken yakalanmazsa aşırı ısınmaya ve motor arızasına yol açabilir. Bu, bu
    motor kodu için spesifik ve yüksek sonuçlu bir arızadır.
  inspection_advice: Check the oil filler cap and dipstick for mayonnaise-like sludge
    indicating coolant contamination. Inspect the coolant reservoir for oil streaks
    or a brownish tint. Look for bubbles in the coolant at idle. Consider a cooling
    system pressure test to detect internal leaks.
  inspection_advice_tr: Yağ kapağını ve yağ çubuğunu, soğutma sıvısı karışımını gösteren
    mayonez benzeri tortu açısından kontrol edin. Soğutma sıvısı rezervuarında yağ
    izleri veya kahverengimsi bir renk olup olmadığını inceleyin. Rölantide soğutma
    sıvısında kabarcıkları arayın. İç kaçakları tespit etmek için soğutma sistemi
    basınç testi yapmayı düşünün.
