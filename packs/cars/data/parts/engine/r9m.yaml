  rationale_tr: R9M 1.6 dCi turboşarjı, yağ değişimleri atlanırsa veya araç çoğunlukla
    kısa mesafelerde kullanılırsa erken aşınabilir. Bu durum yağ kaçağı, duman, güç
    kaybı ve ıslık sesine yol açar. Servis geçmişini ve turbo sorunu belirtilerini
    kontrol edin.
  inspection_advice: Ask for proof of oil changes at correct intervals. At viewing,
    start cold and warm-up, listen for turbo whistle, check exhaust smoke (blue/black)
    and oil leaks around turbo area. If possible, have a mechanic check turbo shaft
    play.
  inspection_advice_tr: Yağ değişimlerinin doğru aralıklarla yapıldığına dair kanıt
    isteyin. Görüşmede aracı soğuk çalıştırıp ısınınca turbo ıslığı dinleyin, egzoz
    dumanını (mavi/siyah) ve turbo çevresindeki yağ kaçaklarını kontrol edin. Mümkünse
    bir ustaya turbo mili boşluğunu kontrol ettirin.
