claims:
- id: h5d_engine_aluminum_engine_overheat_v1
  claim_key: h5d_engine_aluminum_engine_overheat
  version: 1
  is_current: true
  title: Aluminum engine overheating risk (H5Dt)
  title_tr: Alüminyum motor aşırı ısınma riski (H5Dt)
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  rationale: This engine has an aluminum block that can warp or crack if it overheats.
    A cooling system failure or poor maintenance can lead to catastrophic engine damage.
    Buyers should verify the cooling system is in good condition and check maintenance
    history.
  rationale_tr: Bu motor, aşırı ısınma durumunda eğilebilen veya çatlayabilen alüminyum
    bir blok kullanır. Soğutma sistemi arızası veya bakım eksikliği, motorun tamamen
    hasar görmesine yol açabilir. Alıcılar soğutma sisteminin iyi durumda olduğunu
    doğrulamalı ve bakım geçmişini kontrol etmelidir.
  inspection_advice: Check coolant level and condition, look for leaks or oil/coolant
    mixing, verify cooling fan operation, and review service records for coolant replacement
    and any overheating-related repairs.
  inspection_advice_tr: Soğutma sıvısı seviyesini ve durumunu kontrol edin, sızıntı
    veya yağ/soğutma sıvısı karışımı olup olmadığını inceleyin, fan çalışmasını doğrulayın
    ve bakım kayıtlarında soğutma sıvısı değişimi ile aşırı ısınma onarımlarını araştırın.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://mymotorlist.com/engines/renault/h5dt/
    source_domain: mymotorlist.com
    site_or_channel: mymotorlist.com
    quote: '"It is also important to monitor the cooling system, aluminum engines
      do not tolerate overheating."'
    independent: true
- id: h5d_engine_chronic_oil_consumption__v1
  claim_key: h5d_engine_chronic_oil_consumption_
  version: 1
  is_current: true
  title: Chronic oil consumption in select 1.0 TSI production years
  title_tr: Chronic oil consumption in select 1.0 TSI production years
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  rationale: Some 1.0 TSI engines, particularly in certain production years, suffer
    from chronic oil consumption issues. This tends to manifest after 50,000 km, in
    heavy urban driving conditions, or when maintenance intervals are extended. If
    left unchecked, this can lead to accelerated internal engine wear.
  rationale_tr: Some 1.0 TSI engines, particularly in certain production years, suffer
    from chronic oil consumption issues. This tends to manifest after 50,000 km, in
    heavy urban driving conditions, or when maintenance intervals are extended. If
    left unchecked, this can lead to accelerated internal engine wear.
  inspection_advice: Check the oil level regularly and monitor for excessive oil consumption.
    Look for blueish smoke from the exhaust, which can indicate oil burning. Verify
    the engine’s oil consumption history and ensure timely oil top-ups.
  inspection_advice_tr: Check the oil level regularly and monitor for excessive oil
    consumption. Look for blueish smoke from the exhaust, which can indicate oil burning.
    Verify the engine’s oil consumption history and ensure timely oil top-ups.
  status: review
  promoted_by: ledger
  sources:
