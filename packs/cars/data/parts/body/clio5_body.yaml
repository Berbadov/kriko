- id: clio5_body_engine_crankshaft_camshaft_sens_v1
  claim_key: clio5_body_engine_crankshaft_camshaft_sens
  version: 1
  is_current: true
  title: Crankshaft/camshaft sensor failure on 1.3 TCe (clio5_body)
  title_tr: Krank/eksantrik sensör arızası 1.3 TCe (clio5_body)
  kind: known_issue
  domain: engine
  severity: medium
  confidence: 0.6
  rationale: The crankshaft and camshaft position sensors tell the engine computer
    when to spark and inject fuel. On this 1.3 TCe engine, they can fail chronically,
    causing delayed cranking, rough idle, and weak throttle response even after other
    parts are replaced. A buyer cannot see this without a diagnostic scan because
    it may not illuminate a warning light until the sensor completely fails.
  rationale_tr: Krank ve eksantrik mili sensörleri, motor bilgisayarına ateşleme ve
    yakıt enjeksiyonu zamanlamasını söyler. Bu 1.3 TCe motorda kronik olarak arızalanabilir;
    gecikmiş başlatma, düzensiz rölanti ve zayıf gaz tepkisine neden olabilirler,
    hatta diğer parçalar değiştirilse bile. Bu durum, sensör tamamen arızalanana kadar
    uyarı lambası yakmayabileceğinden, alıcı bunu teşhis taraması olmadan göremez.
  inspection_advice: Check for DTC codes P0335/P0340 (crank/cam sensor circuit). Try
    a cold start; note if it cranks long before firing. If the car has service records
    for repeated sensor or injection-related repairs, suspect it. A scan tool showing
    intermittent sensor faults confirms the risk.
  inspection_advice_tr: P0335/P0340 (krank/kam sensör devresi) DTC kodlarını kontrol
    edin. Soğuk çalıştırma deneyin; ateşlemeden önce uzun süre marş basıyorsa not
    edin. Araçta tekrarlanan sensör veya enjeksiyonla ilgili onarımlar varsa şüphelenin.
    Bir tarama aletiyle aralıklı sensör hatalarının tespiti riski doğrular.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://yoldakiusta.com/motor-arizalari/renault-clio-5-enjeksiyonu-kontrol-ettirin-arizasi-286.html
    source_domain: yoldakiusta.com
    site_or_channel: yoldakiusta.com
    quote: '"Krank sensörü veya eksantrik mili sensörleri düzgün çalışıyor mu? (Bozulursa
      düzensiz yanmaya ve marşta gecikmeye neden olabilir.)"'
    independent: true
  component_id: engine_cam_crank_sensors
  detection: diagnostic
- id: clio5_body_fuel_system_fuel_injector_leaks_caus_v1
  claim_key: clio5_body_fuel_system_fuel_injector_leaks_caus
  version: 1
  is_current: true
  title: Fuel injector leaks cause delayed starts in Clio 5
  title_tr: Clio 5'te enjektör kaçağı geç çalışmaya neden oluyor
  kind: known_issue
  domain: fuel system
  severity: high
  confidence: 0.6
  rationale: This evidence points to a chronic fuel injector issue in the 1.3 TCe
    engine, where small leaks cause delayed starts and poor throttle response. The
    problem persists even after cleaning or replacement, indicating a design or component
    weakness. Buyers should be aware as this is not easily caught in a routine inspection
    and can be costly to fix.
  rationale_tr: Bu kanıt, 1.3 TCe motorunda kronik bir enjektör sorununa işaret ediyor;
    küçük kaçaklar geç çalışmaya ve zayıf gaz tepkisine neden oluyor. Sorun temizlik
    veya değişim sonrası bile devam ediyor, bu da tasarım veya parça zafiyetini gösteriyor.
    Alıcılar bunun rutin kontrolde kolayca tespit edilemeyeceğini ve tamirinin maliyetli
    olabileceğini bilmeli.
  inspection_advice: Check for engine codes like P0171/P0172 during a diagnostic scan.
    Listen for long cranking times on cold start, smell fuel near the engine bay,
    and ask if injectors have been replaced or cleaned (and if the problem returned).
  inspection_advice_tr: Diagnostik taramada P0171/P0172 gibi motor kodlarını kontrol
    edin. Soğuk çalıştırmada uzun marş süresini dinleyin, motor bölümünde yakıt kokusu
    alıp almadığınıza bakın ve enjektörlerin değiştirilip temizlenmediğini (ve sorunun
    geri dönüp dönmediğini) sorun.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://yoldakiusta.com/motor-arizalari/renault-clio-5-enjeksiyonu-kontrol-ettirin-arizasi-286.html
    source_domain: yoldakiusta.com
    site_or_channel: yoldakiusta.com
    quote: '"Enjektörlerden şüphelenmiyorlar ama bazen enjektörlerde küçük kaçaklar
      olabilir ve bu da zengin veya fakir karışımla çalışma sorunları yaratır. Aracın
      geç çalışması ve marşın uzun sürmesi enjektör sızıntısının işareti olabilir."'
    independent: true
  component_id: engine_injectors
  detection: diagnostic
- id: clio5_body_general_clio5_body_structural_co_v1
  claim_key: clio5_body_general_clio5_body_structural_co
  version: 1
  is_current: true
  title: clio5_body structural corrosion, chassis weakness
  title_tr: clio5_body yapısal korozyon, şasi zayıflığı
  kind: known_issue
  domain: general
  severity: high
  confidence: 0.6
  rationale: The Clio5 body shell and subframe can suffer from structural corrosion,
    affecting body mountings and chassis strength. This is a known chronic issue in
    Renault Clio models and can compromise safety and lead to expensive repairs.
  rationale_tr: Clio5 gövde ve alt şasi, gövde bağlantıları ve şasi mukavemetini etkileyen
    yapısal korozyona uğrayabilir. Bu, Renault Clio modellerinde bilinen kronik bir
    sorundur ve güvenliği tehlikeye atabilir ve pahalı onarımlara yol açabilir.
  inspection_advice: During inspection, check the underbody for rust, especially body
    mountings, subframe, sills, and floor pan. Look for bubbling paint or corroded
    spots. A professional underbody inspection on a lift is necessary to assess structural
    integrity.
  inspection_advice_tr: İnceleme sırasında, özellikle gövde bağlantıları, alt şasi,
    eşikler ve zemin paneli olmak üzere aracın altını pas açısından kontrol edin.
    Kabarcık yapan boya veya korozyon noktaları arayın. Yapısal bütünlüğü değerlendirmek
    için liftli profesyonel bir alt kontrol gereklidir.
  status: review
