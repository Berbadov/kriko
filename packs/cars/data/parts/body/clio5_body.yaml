- id: clio5_body_general_clio_5_aeb_system_failur_v1
  claim_key: clio5_body_general_clio_5_aeb_system_failur
  version: 1
  is_current: true
  title: Clio 5 AEB system failure triggers warning light
  title_tr: Clio 5 Otonom acil frenleme arızası uyarı ışığı yakar
  kind: known_issue
  domain: general
  severity: high
  confidence: 0.6
  rationale: The Renault Clio 5 can experience a failure in its autonomous emergency
    braking system, which may illuminate the master warning light without an obvious
    mechanical or electrical cause. This suggests a possible design or software flaw
    that could affect braking performance in critical situations. A buyer cannot easily
    detect this issue during a standard pre-purchase inspection, so it represents
    an unpredictable safety risk.
  rationale_tr: Renault Clio 5'te otonom acil frenleme sisteminde bir arıza meydana
    gelebilir ve bu durum, belirgin bir mekanik veya elektriksel neden olmaksızın
    ana uyarı lambasını yakabilir. Bu, kritik durumlarda fren performansını etkileyebilecek
    olası bir tasarım veya yazılım hatasına işaret eder. Bu sorun standart bir satış
    öncesi ekspertizde kolayca tespit edilemez, bu nedenle öngörülemeyen bir güvenlik
    riski oluşturur.
  inspection_advice: During the viewing, ask the seller whether the master warning
    light has ever appeared. If possible, have a diagnostic scan performed for AEB-related
    DTCs (e.g., in the ABS or electronic brake control module). A test drive in a
    safe, open area may reveal unexpected braking interventions or warning lights.
  inspection_advice_tr: Araç görüşmesinde satıcıya ana uyarı lambasının hiç yanıp
    yanmadığını sorun. Mümkünse, AEB ile ilgili DTC'ler için (örn. ABS veya elektronik
    fren kontrol modülünde) diagnostik tarama yaptırın. Güvenli ve açık bir alanda
    deneme sürüşü, beklenmedik fren müdahalelerini veya uyarı ışıklarını ortaya çıkarabilir.
  status: review
  promoted_by: ledger
  sources:
