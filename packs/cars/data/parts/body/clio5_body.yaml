- id: clio5_body_emissions_catalyst_and_dpf_failure_v1
  claim_key: clio5_body_emissions_catalyst_and_dpf_failure
  version: 1
  is_current: true
  title: Catalyst and DPF failures in clio5_body emissions
  title_tr: clio5_body emisyon sisteminde katalizör ve DPF arızaları
  kind: known_issue
  domain: emissions
  severity: high
  confidence: 0.6
  rationale: Renault Clio models often develop exhaust emissions problems, especially
    catalytic converter inefficiency and Diesel Particulate Filter (DPF) blockage.
    These issues can lead to MOT failure and expensive repairs.
  rationale_tr: Renault Clio modellerinde egzoz emisyon sorunları sık görülür, özellikle
    katalitik konvertör verimsizliği ve Dizel Partikül Filtresi (DPF) tıkanması. Bu
    sorunlar MOT başarısızlığına ve pahalı onarımlara yol açabilir.
  inspection_advice: Check for a valid MOT, look for warning lights, and perform an
    OBD scan for emissions-related codes such as P0420 (catalyst) or DPF blockage
    codes. Ask if the catalyst or DPF has been replaced recently.
  inspection_advice_tr: Geçerli bir MOT kontrol edin, uyarı lambalarına bakın ve P0420
    (katalizör) veya DPF tıkanıklığı gibi emisyon kodları için OBD taraması yapın.
    Katalizör veya DPF'in yakın zamanda değiştirilip değiştirilmediğini sorun.
