  domain: emissions
  severity: medium
  confidence: 0.6
  rationale: The text describes a scenario where the Renault Clio 5 exhibits a loss
    of power and poor throttle response, which is attributed to potential catalytic
    converter clogging. This is a known chronic issue in turbocharged engines where
    exhaust backpressure builds up, restricting exhaust flow and reducing engine performance.
    The mention of 'katalitik konvertör tıkalı olabilir' (catalytic converter may
    be clogged) supports this defect.
  rationale_tr: The text describes a scenario where the Renault Clio 5 exhibits a
    loss of power and poor throttle response, which is attributed to potential catalytic
    converter clogging. This is a known chronic issue in turbocharged engines where
    exhaust backpressure builds up, restricting exhaust flow and reducing engine performance.
    The mention of 'katalitik konvertör tıkalı olabilir' (catalytic converter may
    be clogged) supports this defect.
  inspection_advice: Check for excessive backpressure in the exhaust system using
    a manifold vacuum gauge or exhaust flow tester. Inspect the catalytic converter
    for physical damage or excessive heat buildup. Listen for unusual exhaust noises
    (e.g., rattling or hissing) that may indicate a clogged converter.
  inspection_advice_tr: Check for excessive backpressure in the exhaust system using
