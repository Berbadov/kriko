  is_current: true
  title: Parking sensor multiplex transmission failure (2011 Renault Mégane 3)
  title_tr: Parking sensor multiplex transmission failure (2011 Renault Mégane 3)
  kind: known_issue
  domain: electrical
  severity: medium
  confidence: 0.6
  rationale: The car displays a 'Check parking sensor' error alongside a multiplex
    transmission failure (C15900) for the parking sensor system, indicating a chronic
    issue with the multiplexing system controlling sensor inputs. This suggests a
    broader electrical multiplexing defect affecting multiple systems.
  rationale_tr: The car displays a 'Check parking sensor' error alongside a multiplex
    transmission failure (C15900) for the parking sensor system, indicating a chronic
    issue with the multiplexing system controlling sensor inputs. This suggests a
    broader electrical multiplexing defect affecting multiple systems.
  inspection_advice: Scan for error codes (e.g., C15900) using an OBD-II scanner.
    Inspect the multiplex wiring and control module for parking sensors, and check
    if other sensor-controlled functions (e.g., rear parking sensors) are affected.
  inspection_advice_tr: Scan for error codes (e.g., C15900) using an OBD-II scanner.
    Inspect the multiplex wiring and control module for parking sensors, and check
    if other sensor-controlled functions (e.g., rear parking sensors) are affected.
