      title: Galaxy S25 Ultra stuck in boot loop after One UI 8.5 update
      body: This finding came from the query 'Samsung Galaxy S25 bootloop frozen screen problem'. An owner
        reports the S25 Ultra getting stuck in a 'phone is starting' loop after the One UI 8.5 update,
        unable to enter the PIN or factory reset. This is a single owner report on a repair forum, so
        it is anecdotal but a genuine user-reported failure mode.
      advice: If an S25 gets stuck in a boot loop after an update, the standard recovery is a force restart
        (Volume Down + Power), booting to Safe Mode, or wiping the cache partition; a factory reset is
        the last resort. Back up data before updating.
    tr:
      title: One UI 8.5 güncellemesi sonrası Galaxy S25 Ultra önyükleme döngüsünde takılı kaldı
      body: Bu bulgu 'Samsung Galaxy S25 bootloop frozen screen problem' sorgusundan geldi. Bir sahip,
        S25 Ultra'nın One UI 8.5 güncellemesinden sonra 'telefon başlatılıyor' döngüsünde takılı kaldığını,
        PIN girilemediğini veya fabrika ayarlarına sıfırlanamadığını bildiriyor. Bu, bir onarım forumunda
        tek bir sahip raporudur, dolayısıyla anekdot niteliğindedir ancak gerçek bir kullanıcı tarafından
        bildirilen arıza modudur.
      advice: Bir güncellemeden sonra bir S25 önyükleme döngüsünde takılı kalırsa, standart kurtarma yöntemi
        zorla yeniden başlatma (Ses Kısma + Güç), Güvenli Mod'a önyükleme veya önbellek bölümünü temizlemedir;
        fabrika ayarlarına sıfırlama son çaredir. Güncellemeden önce verileri yedekleyin.
