        geçmişte Samsung S20/S21/S22 serilerini vuran bilinen bir OLED donanım arıza modelidir (kötü lehim,
        zayıf konektör, panel kusuru); S25 yalnızca olgunun sürdüğü mevcut nesil olarak anılıyor, benzersiz
        şekilde etkilenen bir model olarak değil.
      advice: Bu, S25'e özgü bir kusur değil, genel bir OLED riskidir. Yeşil bir çizgi ortaya çıkarsa,
        bu ekran değişimi gerektiren fiziksel bir panel arızasıdır — yazılım düzeltmesi değildir — ve
