        green line is a known OLED hardware failure pattern (bad solder, weak connector, panel defect)
        that has historically hit Samsung S20/S21/S22 series; the S25 is cited only as the current generation
        where the phenomenon persists, not as a uniquely affected model.
      advice: This is a general OLED risk rather than an S25-specific defect. If a green line appears,
        it is a physical panel fault requiring screen replacement — not a software fix — and is typically
        covered by warranty if it appears early.
    tr:
