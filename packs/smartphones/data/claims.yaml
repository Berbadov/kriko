        Sept 2024 was sent to authorized service three times in one year: repeated power-button malfunction,
        then abnormal overheating even in mild ambient temperatures, proximity-sensor malfunction during
        calls, and a sudden motherboard failure that caused total irreversible loss of all personal data.'
      advice: An EU buyer should know the power button and motherboard are reported weak points; a sudden
        motherboard failure can wipe all data with no backup possible. Keep backups and be ready to use
        the legal warranty (the complainant was still within the conformity guarantee).
