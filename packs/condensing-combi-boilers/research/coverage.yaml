note: The lineup lists the popular series this run looked for in Turkey and Europe. The
  uncovered entries either returned only single owner reports or only service-delay
  complaints, so no subject was filed for them. Vaillant ecoTEC plus and pro share the
  F.28 and F.75 evidence recorded on the turboTEC and ecoTEC Intro subjects, but the
  complaint pages that named those exact series did not show a repeated pattern.
out_of_scope:
- Electric combi boilers (ECA Arceus and similar are a different appliance type)
- Heat pumps and hybrid systems
- Service quality, appointment delays and prices when no appliance fault is described
- Commercial boilers and central plant
