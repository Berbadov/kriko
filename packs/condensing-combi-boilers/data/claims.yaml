  text:
    en:
      title: F.75 pressure fault recurs until the boiler stops
      body: An owner reports F.75 appearing intermittently for about a year before the boiler
        stopped working completely. Vaillant's help page defines F75 as too small a pressure
        change when the heating pump starts and lists the pressure sensor, pump, expansion vessel
        and wiring as causes.
      advice: Treat a repeating F75 as a component fault, not a water top-up problem. Ask for the
        pressure sensor, pump and expansion vessel to be tested, not just refilled.
    tr:
      title: F.75 basınç arızası kombi durana kadar tekrarlıyor
      body: Bir sahip, yaklaşık bir yıl boyunca aralıklarla F.75 gördüğünü ve sonunda kombinin
        tamamen çalışmaz hale geldiğini bildiriyor. Vaillant'ın yardım sayfası F75'i ısıtma
        pompası çalışırken basınç değişiminin çok düşük olması olarak tanımlıyor ve basınç
        sensörü, pompa, genleşme tankı ile kabloları neden olarak sıralıyor.
      advice: Tekrarlayan F75'i su tamamlama sorunu değil, parça arızası olarak görün. Sadece su
        basmak yerine basınç sensörü, pompa ve genleşme tankının test edilmesini isteyin.
