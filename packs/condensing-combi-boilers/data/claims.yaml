      body: Several Condens 2200i owners report domestic hot water that turns hot, then lukewarm,
        then hot again during a shower. One owner has lived with the cycle for a year and another
        for two months while the boiler was under warranty.
      advice: Measure the outlet temperature over a full minute before accepting a no-fault
        answer. A repeating cycle points to the hot-water control or plate exchanger, not to user
        error.
