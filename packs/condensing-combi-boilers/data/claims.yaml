  text:
    en:
      title: Water escapes from the lower part of the unit
      body: A landlord reports two of ten new ecoTEC Intro boilers leaking from the bottom within
        six months. A second owner reports water from two points under the boiler immediately
        after a service visit.
      advice: Check under the boiler and around pipe joints during the first heating season.
        Photograph any leak before the engineer arrives, because a leak that follows a service
        can be attributed to the visit rather than the appliance.
    tr:
      title: Cihazın alt kısmından su kaçıyor
      body: Bir apartman sahibi, yeni alınan on ecoTEC Intro kombiden ikisinin altı ay dolmadan
        alt kısmından su kaçırdığını bildiriyor. İkinci bir sahip, servis ziyaretinin hemen
        ardından kombinin altından iki ayrı noktadan su geldiğini bildiriyor.
      advice: İlk ısıtma sezonunda kombinin altını ve boru bağlantılarını kontrol edin. Servis
        gelmeden önce kaçağın fotoğrafını çekin; çünkü servis sonrası kaçak, cihazdan çok ziyarete
        bağlanabilir.
