  text:
    en:
      title: Radiators stay cold after repeated service visits
      body: Owners report the boiler running but not heating the radiators, with the fault
        unresolved after several visits. One owner says the house was not heated for about a
        year; another reports three years of intermittent no-heat or no-hot-water faults.
      advice: Record flow and return temperatures at the boiler and at the radiators. If the
        boiler fires but the circuit stays cold, ask for the pump, diverter and a blockage test
        rather than accepting that the installation is at fault.
    tr:
      title: Tekrarlanan servis ziyaretlerine rağmen petekler ısınmıyor
      body: Sahipler, kombinin çalıştığını ancak petekleri ısıtmadığını ve arızanın birçok ziyarete
        rağmen çözülmediğini bildiriyor. Bir sahip evin yaklaşık bir yıl ısıtılamadığını, bir
        diğeri üç yıl boyunca aralıklarla ısıtma veya sıcak su arızası yaşadığını belirtiyor.
      advice: Kombi ve peteklerdeki gidiş dönüş sıcaklıklarını kaydedin. Kombi yanıyor ama devre
        soğuk kalıyorsa tesisatı suçlamak yerine pompa, üç yollu vana ve tıkanıklık testi isteyin.
