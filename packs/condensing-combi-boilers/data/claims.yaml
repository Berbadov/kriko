        garanti kapsamındayken iki ay yaşamış.
      advice: Arıza yok cevabını kabul etmeden önce çıkış sıcaklığını bir dakika boyunca ölçün.
        Tekrarlayan döngü kullanıcı hatasına değil, sıcak su kontrolüne veya plakalı eşanjöre
