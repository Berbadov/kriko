    en:
      title: Main board burned within six months
      body: An owner reports the boiler failed after six months and the engineer found the main
        board burned. The service attributed it to high voltage, which moves the cost dispute to
        the electrical supply.
      advice: Keep the board and ask for a written diagnosis. If high voltage is blamed, have the
        supply and any regulator checked before paying for a second board.
    tr:
      title: Ana kart altı ay içinde yandı
      body: Bir sahip, kombinin altı ay sonra arızalandığını ve servisin ana kartın yandığını
        tespit ettiğini bildiriyor. Servis bunu yüksek gerilime bağlamış; bu da masraf tartışmasını
        elektrik beslemesine taşıyor.
      advice: Kartı saklayın ve yazılı teşhis isteyin. Yüksek gerilim suçlanıyorsa ikinci kart
        için ödeme yapmadan önce besleme ve varsa regülatör kontrol edilmeli.
