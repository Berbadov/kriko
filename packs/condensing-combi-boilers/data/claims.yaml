  text:
    en:
      title: Loud banging ignition every time hot water is drawn
      body: Owners of the ecoTEC Intro report a violent bang each time the boiler fires for hot
        water, from the first days of use. Two separate owners describe the same noise and treat
        it as a safety concern rather than normal operation.
      advice: Do not accept the noise as normal. Ask for gas pressure and combustion setup to be
        checked under warranty before the unit is used unattended.
    tr:
      title: Her sıcak su açılışında yüksek patlama sesiyle ateşleme
      body: ecoTEC Intro sahipleri, ilk günlerden itibaren sıcak su için her ateşlemede şiddetli
        bir patlama sesi bildiriyor. İki ayrı sahip aynı sesi tarif ediyor ve bunu normal çalışma
        değil güvenlik endişesi olarak görüyor.
      advice: Sesi normal kabul etmeyin. Cihaz gözetimsiz kullanılmadan önce garanti kapsamında
        gaz basıncı ve yanma ayarının kontrol edilmesini isteyin.
