  text:
    en:
      title: F.28 ignition lockout returns at intervals
      body: Two owners report repeated F.28 lockouts that shut the boiler down; one sees the fault
        up to eight or ten times a day. Vaillant's own help page defines F28 as the flame signal
        not being detected during ignition and lists gas supply, ignition and PCB causes.
      advice: Repeated resets do not fix an F28. If it returns, have gas pressure, ignition
        electrodes and the PCB checked, and keep the service records as evidence of a recurring
        fault.
    tr:
      title: F.28 ateşleme kilidi aralıklarla tekrarlıyor
      body: İki sahip, kombiyi kapatan tekrarlayan F.28 kilitlenmeleri bildiriyor; birinde arıza
        günde sekiz-on kez görülüyor. Vaillant'ın kendi yardım sayfası F28'i ateşleme sırasında
        alev sinyalinin algılanmaması olarak tanımlıyor ve gaz beslemesi, ateşleme ile kart
        nedenlerini sıralıyor.
      advice: Tekrarlanan resetler F28'i çözmez. Arıza geri gelirse gaz basıncı, ateşleme
        elektrotları ve kart kontrol edilmeli; tekrarlayan arıza kanıtı için servis kayıtları
        saklanmalı.
