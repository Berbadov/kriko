      body: 'The Bravia 8 II is explicitly named among models hit by Sony''s v114.602.050.1 / v114.602.080.1
        firmware: Dolby Vision playback failure, audio desync worsening over time, and complete audio
        dropouts via eARC. Sony''s fix v114.603.100.1 was rolled out to US owners, but the article states
        UK and European owners were still waiting — directly relevant to this EU-market subject.'
      advice: If buying an 8 II in the EU, check the installed firmware version before relying on Dolby
        Vision/eARC; the buggy v114.602.x builds shipped in 2025 and the European fix lagged the US one.
    tr:
      title: Firmware v114.602.050/080, Bravia 8 II'de Dolby Vision ve HDMI eARC sesini bozuyor
      body: 'Bravia 8 II, Sony''nin v114.602.050.1 / v114.602.080.1 firmware''inden etkilenen modeller
        arasında açıkça adlandırılıyor: Dolby Vision oynatma hatası, zamanla kötüleşen ses senkronizasyon
        sorunu ve eARC üzerinden tam ses kesintileri. Sony''nin düzeltmesi v114.603.100.1 ABD''li sahiplere
        dağıtıldı, ancak makale Birleşik Krallık ve Avrupalı sahiplerin hâlâ beklediğini belirtiyor —
        bu AB pazarı konusuyla doğrudan ilgili.'
      advice: AB'de bir 8 II satın alıyorsanız, Dolby Vision/eARC'ye güvenmeden önce yüklü firmware sürümünü
        kontrol edin; hatalı v114.602.x sürümleri 2025'te piyasaya sürüldü ve Avrupa düzeltmesi ABD'dekini
        geriden takip etti.
