      title: LG C1 random restarts under gaming load — LG cites possible mainboard/power-supply overheating
      body: 'German owner forum (EU market): the C1 restarts by itself under high load during gaming on
        both PS5 and Xbox Series X; LG''s own reply to the owner suggested a possible overheating problem
        on the mainboard or power supply. A forum member notes the LG exchange program for power-supply
        faults covers only 2016-2019 models, so the C1 is not covered by it.'
      advice: If a C1 restarts only under gaming load, suspect the mainboard or power supply rather than
        the cable or firmware; this is a hardware fault not covered by LG's older power-supply exchange
        program.
    tr:
      title: LG C1 oyun yükü altında rastgele yeniden başlıyor — LG olası ana kart/güç kaynağı aşırı ısınmasına
        işaret ediyor
      body: 'Alman sahip forumu (AB pazarı): C1, PS5 ve Xbox Series X''te oyun sırasında yüksek yük altında
        kendi kendine yeniden başlıyor; LG''nin sahibe kendi yanıtı ana kartta veya güç kaynağında olası
        bir aşırı ısınma sorununa işaret etti. Bir forum üyesi, güç kaynağı arızaları için LG değişim
        programının yalnızca 2016-2019 modellerini kapsadığını, dolayısıyla C1''in bunun kapsamında olmadığını
        belirtiyor.'
      advice: Bir C1 yalnızca oyun yükü altında yeniden başlıyorsa kablodan veya firmware'den değil ana
        karttan veya güç kaynağından şüphelenin; bu, LG'nin eski güç kaynağı değişim programı kapsamında
        olmayan bir donanım arızasıdır.
