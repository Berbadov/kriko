      advice: CEC glitches after firmware updates are common and here self-resolved. Low concern for buyers;
        a firmware update or power cycle usually restores it.
    tr:
      title: QN90A'nın alıcıyla CEC kontrolü yazılım güncellemesinden sonra çalışmayı durduruyor, sonra
        kendiliğinden düzeliyor
      body: Bir AVS Forum sahibi, QN90A ile bir Onkyo alıcı arasındaki CEC (HDMI-CEC) kontrolünün çalışmayı
        durdurduğunu, muhtemelen bir yazılım güncellemesinden sonra, ancak herhangi bir değişiklik olmadan
        kendiliğinden düzeldiğini bildiriyor. Bu geçici bir bağlantı can sıkıcılığıdır, kalıcı bir kusur
        değildir.
      advice: Yazılım güncellemelerinden sonra CEC aksaklıkları yaygındır ve burada kendiliğinden çözülmüştür.
