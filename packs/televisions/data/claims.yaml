      title: TCL 65C805 HDMI/eARC signal loss persists after main board replacement
      body: 'A Spanish owner''s formal complaint to the OCU consumer association: a 65C805 bought July
        2024 lost HDMI/eARC signal; the official TCL service replaced the main board in October 2025,
        but the defect persisted identically. The service technician reportedly warned the set was irreparable
        if the board swap did not fix it, and the owner is seeking a declaration of irreparability for
        a refund.'
      advice: If HDMI/eARC drops out on a C805, a main-board replacement may not fix it; the defect can
        persist after official repair. Buyers should verify HDMI/eARC function early in the warranty period
        and be prepared for a repair that may not resolve the issue.
    tr:
      title: TCL 65C805 HDMI/eARC sinyal kaybı ana kart değişiminden sonra da sürüyor
      body: 'İspanyol bir sahibin OCU tüketici derneğine resmi şikayeti: Temmuz 2024''te satın alınan
        bir 65C805 HDMI/eARC sinyalini kaybetti; resmi TCL servisi Ekim 2025''te ana kartı değiştirdi,
        ancak arıza birebir aynı şekilde devam etti. Servis teknisyeninin, kart değişimi sorunu çözmezse
        cihazın onarılamaz olduğu uyarısında bulunduğu bildiriliyor ve sahip, para iadesi için onarılamazlık
        beyanı talep ediyor.'
      advice: Bir C805'te HDMI/eARC kesilirse, ana kart değişimi bunu çözmeyebilir; arıza resmi onarımdan
        sonra da sürebilir. Alıcılar HDMI/eARC işlevini garanti süresinin başlarında doğrulamalı ve sorunu
        çözmeyebilecek bir onarıma hazırlıklı olmalıdır.
