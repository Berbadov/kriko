[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kriko"
version = "0.8.1"
description = "A local-first, open knowledge engine for manufactured products"
readme = "README.md"
# Lowered from ">=3.14" on 2026-09-14 (B110). The floor was unsatisfiable in
# practice: 3.13 was refused by this line, and 3.14.0rc2 — the only 3.14 many
# platforms can fetch today — breaks the `pydantic` pinned in
# `requirements.lock` on import. So a contributor had no interpreter on which a
# clean `tools/setup.sh` could succeed, and the workaround for that is always a
# hand-built environment nobody else can reproduce.
#
# Nothing was relaxed on a hunch: the whole of `tools/gate.sh` — pytest, both JS
# suites, svelte-check and the stale-bundle check — passes on 3.13. The floor
# was not load-bearing for anything the tests cover. Raise it again when there
# is a reason a test can state, not because a newer version exists.
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
    "pydantic>=2.0",
    "pyyaml>=6.0.1",
    "mcp>=1.0,<2.0",
    "ptyprocess>=0.7; sys_platform != 'win32'",
    "pywinpty>=2.0; sys_platform == 'win32'",
]

# `kriko` on PATH after an install. It was `python -m app.cli` everywhere, which
# is fine in a checkout and wrong in every document written for someone who
# installed the wheel — and `kriko tui` in particular should be a command, not
# an incantation.
[project.scripts]
kriko = "app.cli:main"

[project.optional-dependencies]
# Building knowledge, not reading it. None of this is needed to install a
# pack and answer a question; all of it is needed to research one.
pipeline = [
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
    "mistralai>=1.0.0",
    "langextract>=1.6.0",
    "yt-dlp>=2024.1.1",
    "trafilatura>=1.9.0",
    "textual>=0.60.0",
    "exa-py>=2.14.0",
    "anthropic",
    "python-dotenv",
]
dev = ["pytest>=8.0.0"]

# The built frontend. ui/ is the source and is not packaged; this bundle is,
# so `pip install kriko` serves a working UI with no Node toolchain.
[tool.setuptools.package-data]
"app.web" = ["static/**/*"]
# The store's DDL is read from disk at every `connect()`, not imported. Without
# this line an editable install works and a real wheel raises FileNotFoundError
# on the first query — which is how it went unnoticed until a PyInstaller build
# hit the same missing-data-file problem. Enforced by
# test_every_data_file_under_src_is_declared_as_package_data.
"kriko.store" = ["*.sql"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kriko*", "app*"]
