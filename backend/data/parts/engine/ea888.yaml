    source_domain: torquecars.com
    site_or_channel: torquecars.com
    quote: N249 problems are generally manifest as a fault code, but the N249 and
      N75 are often confused, as they are both connected to the turbo and perform
      similar(ish) tasks involving air control. The cut off valve is a solenoid that
      controls the recirculation and is installed on the turbo. These had a brittle
