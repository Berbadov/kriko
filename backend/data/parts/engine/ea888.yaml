  title: EA888 Gen3 water pump seal leaks coolant
  title_tr: EA888 Gen3 su pompası contası soğutma sızıntısı
  kind: known_issue
  domain: cooling
  severity: high
  confidence: 0.6
  rationale: The water pump seal in EA888 Gen3 engines can fail, causing coolant to
    leak into the timing chain area or through weep holes. This is often mistaken
    for an oil leak and can lead to overheating if not fixed. Replacement is expensive
    because the pump and thermostat are a combined unit.
  rationale_tr: EA888 Gen3 motorlarda su pompası contası arızalanarak soğutma sıvısının
    zamanlama zinciri bölgesine veya tahliye deliklerinden sızmasına neden olabilir.
    Bu genellikle yağ sızıntısıyla karıştırılır ve onarılmazsa aşırı ısınmaya yol
    açabilir. Pompa ve termostat birleşik bir ünite olduğu için değişim pahalıdır.
  inspection_advice: Check for coolant residue or stains near the water pump/timing
    cover, and inspect the coolant level and weep hole. Look for signs of dried coolant
    colored pink/orange. If possible, pressure test the cooling system and check for
    DTCs related to coolant temperature.
  inspection_advice_tr: Su pompası/zamanlama kapağı yakınında soğutma sıvısı kalıntısı
    veya lekeleri, soğutma sıvısı seviyesini ve tahliye deliğini kontrol edin. Pembe/turuncu
    kurumuş soğutma sıvısı belirtilerine bakın. Mümkünse soğutma sistemine basınç
    testi yapın ve soğutma sıvısı sıcaklığıyla ilgili DTC'leri kontrol edin.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://autodataplug.com/repairs-fixes/why-the-ea888-gen3-water-pump-and-thermostat-are-a-combined-unit-on-vwaudi-and-why-its-so-expensive-to-replace/
