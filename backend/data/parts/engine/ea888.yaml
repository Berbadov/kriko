- claim_key: ea888_fuel system_hpfp_cam_follower_we
  title: HPFP cam follower wear (EA888 2.0T direct-injection variants)
  kind: known_issue
  domain: fuel system
  severity: medium
  confidence: 0.9
  status: verified
  promoted_by: auto
  rationale: Certain EA888 variants suffer from premature wear of the high-pressure
    fuel pump (HPFP) cam follower, which can damage the camshaft over time. This is
    an inspectable issue with relatively low repair cost if caught early.
  inspection_advice: Remove the high-pressure fuel pump and inspect the cam follower
    for wear or pitting. Look for **P0087/P0088** (fuel pressure too low/high) or
    **P0190–P0194** (fuel system performance codes). Check for fuel leaks or erratic
    idle conditions. Confirm if the engine uses direct injection (common in EA888
    TDI or turbocharged petrol variants).
  sources:
  - source_url: https://problemsbyvin.com/engines/vw-audi-2-0t-ea888/
    source_domain: problemsbyvin.com
    site_or_channel: problemsbyvin.com
    quote: The HPFP cam follower wears through over time on certain variants and damages
      the camshaft when it fails. Inspection is easy — pop the high-pressure fuel
      pump off and look. Replacement is cheap if caught early.
    independent: true
