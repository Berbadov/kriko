- claim_key: ea888_electrical_sudden_engine_shutdo
  title: Sudden engine shutdown (EA888 2.0T, all generations)
  kind: known_issue
  domain: electrical
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: Multiple owner reports describe sudden, unexplained engine shutdowns
    with no prior warning lights or symptoms. This suggests latent electrical or fuel
    system failures (e.g., EPC system malfunctions, fuel pump relay issues, or software
    glitches) that can lead to catastrophic failure on the road.
  inspection_advice: Test the **EPC system** (Electronic Power Control) for faults
    using a diagnostic scanner (**P0500–P0507** for speed sensor issues, **P0560–P0563**
    for voltage problems). Check for **P0171/P0174** (lean fuel mixture) or **P0600–P0608**
    (ECU communication errors). Inspect the fuel pump relay, high-pressure fuel pump,
    and wiring harness for damage. Verify if the **BlueDriver** or OBD-II scanner
    shows no stored codes despite failure (indicative of intermittent or software-related
    issues).
  sources:
  - source_url: https://problemsbyvin.com/engines/vw-audi-2-0t-ea888/
    source_domain: problemsbyvin.com
    site_or_channel: problemsbyvin.com
    quote: The engine could not be started after 13 years and 103,000+ miles. I had
      to get the car towed to my garage at night, after several prior trips same day.
      There were no check engine lights or any other indicators.
    independent: true
