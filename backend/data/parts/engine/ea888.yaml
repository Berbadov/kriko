    zamanlama zincirine işaret edebilir. Servis kayıtlarında zamanlama zinciri veya
    kılavuz ray değişimi olup olmadığını kontrol edin. Kapsamlı bir kontrol için,
    bir tamirci zamanlama zinciri uzamasını ölçebilir ve yağ karteri veya supap kapağından
    kılavuz rayları inceleyebilir.
