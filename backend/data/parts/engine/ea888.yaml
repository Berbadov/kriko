- claim_key: ea888_fuel system_carbon_buildup_in_in
  title: Carbon buildup in intake valves (Gen 3 EA888)
  kind: known_issue
  domain: fuel system
  severity: medium
  confidence: 0.9
  status: verified
  promoted_by: auto
  rationale: The Gen 3 EA888 engines are susceptible to carbon buildup on intake valves
    due to the design of the direct-injection system and the use of thinner-bore injectors.
    Carbon deposits can restrict airflow, reduce engine efficiency, and cause rough
    idling, hesitation, or misfires. This issue is exacerbated by the use of synthetic
    oils or improper fuel additives, which can contribute to carbon formation over
    time.
  inspection_advice: Inspect intake valves for black carbon deposits during maintenance
    or if the engine exhibits rough idling, hesitation, or reduced power. Check for
    error codes related to misfires or fuel system issues (e.g., P0300, P0301-P0304).
    If carbon buildup is confirmed, valve cleaning or replacement may be required—this
    is often a hidden issue that only becomes apparent after significant mileage or
    poor maintenance.
