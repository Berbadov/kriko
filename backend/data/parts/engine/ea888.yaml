- claim_key: ea888_engine_excessive_crankshaft
  title: Excessive crankshaft axial play damaging main bearings and oil pump (EA888)
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: Excessive crankshaft axial play (beyond OEM tolerance of 0.006–0.010
    inches) distorts main bearing load distribution, accelerates wear, and starves
    adjacent systems (e.g., oil pump) of lubrication. This causes vibration spikes
