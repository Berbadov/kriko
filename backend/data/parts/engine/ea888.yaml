- claim_key: ea888_electrical_ignition_coil_failur
  title: Ignition coil failure (Gen 3 EA888)
  kind: known_issue
  domain: electrical
  severity: medium
  confidence: 0.9
  status: verified
  promoted_by: auto
  rationale: Ignition coils in the Gen 3 EA888 engines (1.8T/2.0T) are known to fail
    prematurely, leading to misfires, rough idling, or reduced engine performance.
    This issue is often attributed to the high voltage demands of the turbocharged
    direct-injection system, which can stress the coils over time. Failure can be
    sudden or gradual, and repeated coil failures may indicate an underlying electrical
    or wiring issue.
  inspection_advice: Scan for misfire error codes (e.g., P0300, P0301-P0304) and inspect
    ignition coils for physical damage or corrosion. Test individual coils for proper
    voltage output and resistance. If coils fail repeatedly, check wiring harnesses,
    connectors, and the coil driver module for faults. Replace faulty coils immediately,
    as prolonged misfires can damage catalysts or other components.
