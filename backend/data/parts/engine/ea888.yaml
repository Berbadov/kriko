    brittle over time. This causes the valve to leak, reducing turbo pressure and
    causing hesitation when accelerating. It can even trigger limp-home mode if the
    engine computer detects low boost.
  rationale_tr: Turbo devridaim valfinin (N249) kauçuk diyaframı zamanla gevrekleşir.
    Bu, valfin sızmasına neden olarak turbo basıncını düşürür ve hızlanırken sarsıntıya
    yol açar. Motor bilgisayarı düşük turbo basıncı algılarsa, aracın emniyet moduna
    geçmesine bile neden olabilir.
  inspection_advice: During a test drive, feel for hesitation under hard acceleration.
    Perform an OBD diagnostic scan and look for stored boost pressure or N249-related
    fault codes. Visually inspect the N249 valve for cracks or oil residue.
  inspection_advice_tr: Test sürüşünde sert hızlanmada sarsıntı olup olmadığını hissedin.
    OBD arıza taraması yapın ve turbo basıncı veya N249 ile ilgili kayıtlı hata kodlarına
    bakın. N249 valfini görsel olarak çatlak veya yağ kalıntısı açısından inceleyin.
