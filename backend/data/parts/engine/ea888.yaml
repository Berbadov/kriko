  is_current: true
  title: EA888 Gen3 thermostat sticking from wax pellet failure
  title_tr: EA888 Gen3 termostat yapışması (mum elemanı bozulması)
  kind: known_issue
  domain: cooling
  severity: high
  confidence: 0.6
  rationale: The EA888 Gen3 engine uses a combined water pump and thermostat unit.
    Over time, the wax pellet inside the thermostat can degrade, causing the valve
    to stick open or closed. If stuck closed, the engine can rapidly overheat, risking
    serious damage, and replacement is expensive because the entire unit must be replaced.
  rationale_tr: EA888 Gen3 motoru, birleşik su pompası ve termostat ünitesi kullanır.
    Termostatın içindeki mum elemanı zamanla bozulabilir ve valfin açık veya kapalı
    kalmasına neden olabilir. Kapalı kalırsa motor hızla aşırı ısınabilir ve ciddi
    hasar riski oluşur; ayrıca değiştirme maliyeti yüksektir çünkü tüm ünitenin değiştirilmesi
    gerekir.
  inspection_advice: Check the engine temperature gauge during a test drive; ensure
    it reaches normal operating temperature and stays steady. Look for coolant leaks
    near the water pump housing. Ask for service records showing water pump/thermostat
    replacement. A diagnostic scan may show related fault codes (e.g., P00B3, P2181).
  inspection_advice_tr: Test sürüşü sırasında motor sıcaklık göstergesini kontrol
    edin; normal çalışma sıcaklığına ulaştığından ve sabit kaldığından emin olun.
    Su pompası muhafazası yakınında soğutucu sızıntısı olup olmadığını kontrol edin.
    Su pompası/termostat değişimi için servis kayıtlarını isteyin. Diyagnostik tarama
    ilgili hata kodlarını (örn. P00B3, P2181) gösterebilir.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://autodataplug.com/repairs-fixes/why-the-ea888-gen3-water-pump-and-thermostat-are-a-combined-unit-on-vwaudi-and-why-its-so-expensive-to-replace/
    source_domain: autodataplug.com
    site_or_channel: autodataplug.com
    quote: '"Inside the unit, the thermostat relies on a wax pellet to open and close
      its valve. Over time, that pellet can degrade or even leak, causing the valve
      to stick open or closed."'
    independent: true
  component_id: engine_thermostat
  detection: diagnostic
