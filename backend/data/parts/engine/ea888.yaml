- claim_key: ea888_cooling_water_pump_impeller_
  title: Water pump impeller brittle fracture (EA888 2.0T)
  kind: known_issue
  domain: cooling
  severity: high
  confidence: 0.9
  status: review
  promoted_by: pending_human
  rationale: The EA888’s water pump uses a plastic impeller that degrades over time,
    leading to sudden coolant loss and overheating. This is a common failure mode
    across all generations, requiring costly repairs if undetected.
  inspection_advice: Check for coolant leaks around the water pump pulley or radiator
    hoses. Look for **P0128** (coolant temperature too low) or **P0115–P0118** (coolant
    sensor issues) if overheating occurs intermittently. Visually inspect the impeller
    for cracks or brittleness during a coolant system flush. Confirm coolant level
    and condition (discoloration or debris may indicate pump failure).
