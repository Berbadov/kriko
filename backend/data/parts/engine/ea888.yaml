- claim_key: ea888_engine_pcv_valve_diaphragm_
  title: PCV valve diaphragm cracking (EA888 2.0T TSI, 60K–100K miles)
  kind: known_issue
  domain: engine
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The plastic PCV valve diaphragm in the EA888 2.0T TSI cracks over time,
    creating a **permanent vacuum leak**. This causes lean conditions (**P0171 code**)
    and a loping idle. The failure is common between **60K–100K miles** and requires
    PCV replacement (~$200–$400).
  inspection_advice: Check for **P0171 (lean bank)** codes and a **loping idle**.
    Inspect the **PCV valve** for cracks or replace it as a preventive measure if
    near the mileage range. Listen for **vacuum hiss** near the PCV line during engine
    operation.
  sources:
  - source_url: https://www.ampauto.io/symptoms/vw-2-0t-tsi-problems
    source_domain: ampauto.io
    site_or_channel: ampauto.io
    quote: The plastic PCV valve diaphragm cracks and creates a permanent vacuum leak.
      Usually shows as P0171 (lean) and a loping idle. Common at 60K-100K.
    independent: true
  applies_when:
    min_mileage_km: 60000
