    duman olup olmadığını kontrol edin, yağ çubuğunu düşük seviye için inceleyin,
    karterden tıslama sesi dinleyin ve P0171/P0174 veya P0507 kodlarını kontrol edin.
    PCV değişimini kanıtlayan servis kayıtları isteyin.
