  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: The EA211 1.4 TSI is an interference engine, meaning catastrophic failure
    can occur if the timing belt breaks. The belt design necessitates a mandatory
    replacement at 60,000 km, a significantly lower interval than many non-interference
    engines, indicating a chronic reliability concern.
  inspection_advice: Verify the last timing belt replacement date and confirm it was
    done at the manufacturer-recommended 60,000 km interval. Check for any signs of
    past belt failure (e.g., damaged camshaft lobes, bent valves).
  sources: []
