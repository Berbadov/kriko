- id: ea211_engine_carbon_buildup_on_intake_v1
  claim_key: ea211_engine_carbon_buildup_on_intake
  version: 1
  is_current: true
  title: Carbon buildup on intake valves in EA211 direct-injection engines
  title_tr: EA211 direkt enjeksiyon motorlarda emme supaplarında karbon birikimi
  kind: known_issue
  domain: engine
  severity: medium
  confidence: 0.8
  rationale: The EA211 engine family (1.0, 1.4, 1.5 TSI/TFSI) uses direct injection,
    so fuel cannot wash over the intake valves. Over time, carbon deposits accumulate
    on the valves and intake tract, leading to rough idle, power loss, and increased
    fuel consumption. Periodic cleaning, such as walnut blasting, is needed, typically
    between 40,000 and 100,000 km.
  rationale_tr: EA211 motor ailesi (1.0, 1.4, 1.5 TSI/TFSI) direkt enjeksiyon kullandığı
    için yakıt emme supaplarını yıkayamaz. Zamanla supaplarda ve emme kanallarında
    karbon birikimi oluşur; bu da rölantide sarsıntı, güç kaybı ve artan yakıt tüketimine
    neden olur. Ceviz kabuğu temizliği gibi periyodik temizlik genellikle 40.000-100.000
    km arasında gerekir.
  inspection_advice: Check service history for intake valve cleaning; if absent, ask
    for a borescope inspection of the intake valves. Rough idle or hesitation during
    test drive may indicate carbon buildup. Use this to negotiate price or require
    cleaning cost reduction.
  inspection_advice_tr: Servis geçmişinde emme supabı temizliği olup olmadığını kontrol
    edin; yoksa emme supaplarının boroskopla incelenmesini isteyin. Test sürüşünde
    rölanti titremesi veya hızlanma zorluğu karbon birikimine işaret edebilir. Bu
    durumu fiyat pazarlığında veya temizlik maliyetinin düşürülmesinde kullanın.
  status: verified
