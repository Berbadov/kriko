  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: Low-speed pre-ignition (LSPI) causes uncontrolled combustion before piston
    top reaches TDC, delivering a reverse impact that fractures piston segment channels.
    Common in 160 HP Twincharger variants (CAVA/CAVE) when driven aggressively at
    low RPM.
  inspection_advice: Check for EPC light activation + stumbling under load (indicating
    misfire), excessive oil consumption (1L+ per 1000km), or 'knocking' sounds at
    low RPM. Inspect piston channels for cracks during rebuilds; opt for forged pistons
    (Wössner/CP) to mitigate risk.
  sources: []
