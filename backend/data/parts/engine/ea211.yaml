      Bu durum rölantide titreşim, güç kaybı ve artan yakıt tüketimine yol açar. 60.000
      – 120.000 km arasında sıkça görülmektedir."'
    independent: true
  applies_when:
    min_mileage_km: 60000
- id: ea211_emissions_opf_clogging_on_short_tr_v1
  claim_key: ea211_emissions_opf_clogging_on_short_tr
  version: 1
  is_current: true
  title: OPF clogging on short trips in VW EA211 EVO engines
  title_tr: VW EA211 EVO motorlarında kısa mesafelerde OPF tıkanması
  kind: known_issue
  domain: emissions
  severity: high
  confidence: 0.6
  rationale: The Otto particulate filter (OPF) can clog early if the car is mostly
    driven on short trips, especially in EA211 EVO engines. This restricts exhaust
    flow and can lead to expensive repairs or engine damage if ignored. It's a hidden
    risk because standard pre-purchase inspections don't usually check OPF condition.
  rationale_tr: Otto partikül filtresi (OPF), özellikle EA211 EVO motorlarda araç
    çoğunlukla kısa mesafelerde kullanılırsa erken tıkanabilir. Bu, egzoz akışını
    kısıtlar ve göz ardı edilirse pahalı onarımlara veya motor hasarına yol açabilir.
    Standart ekspertizler genellikle OPF durumunu kontrol etmediği için gizli bir
    risktir.
  inspection_advice: At viewing, scan for DTCs like P2002 or P2000 related to particulate
    filter efficiency. Ask about typical driving distances and whether the OPF has
    been replaced or regenerated. Listen for reduced power or warning lights.
  inspection_advice_tr: Araç incelerken, partikül filtresi verimliliğiyle ilgili P2002
    veya P2000 gibi DTC kodlarını taratın. Tipik sürüş mesafelerini ve OPF'nin değiştirilip
    değiştirilmediğini veya rejenerasyon yapılıp yapılmadığını sorun. Güç kaybı veya
    uyarı ışıklarına dikkat edin.
  status: review
