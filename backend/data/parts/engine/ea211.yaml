      kararsızlıklara ve yazılımsal çakışmalara oldukça duyarlıdır."'
    independent: true
- id: ea211_electrical_recurring_48v_hybrid_com_v1
  claim_key: ea211_electrical_recurring_48v_hybrid_com
  version: 1
  is_current: true
  title: Recurring 48V hybrid comm failures in EA211 eTSI
  title_tr: EA211 eTSI'da tekrarlayan 48V hibrit iletişim arızaları
  kind: known_issue
  domain: electrical
  severity: medium
  confidence: 0.6
  rationale: The Golf 8 eTSI with the 1.0/1.5 EA211 engine has a chronic issue where
    the 48V mild-hybrid control units lose communication, often due to software sync
    or a weak 12V battery. This triggers a persistent 'drive system fault' warning
    even without physical damage. Buyers should expect this recurring warning and
    potential diagnostic costs.
  rationale_tr: 1.0/1.5 EA211 motora sahip Golf 8 eTSI'de, 48V hafif hibrit kontrol
    üniteleri arasındaki iletişim kopmaları kronik bir sorundur; genellikle yazılım
    senkronizasyonu veya zayıf 12V aküden kaynaklanır. Fiziksel hasar olmasa bile
    kalıcı 'tahrik sistemi arızası' uyarısı tetiklenir. Alıcılar bu tekrarlayan uyarıyı
    ve olası teşhis masraflarını beklemelidir.
  inspection_advice: At viewing, scan for DTCs like U0100/U0121 or similar communication
    faults between gateway and 48V BMS; check the 12V battery voltage and condition;
    ask about recent software updates.
  inspection_advice_tr: İncelemede, gateway ile 48V BMS arasındaki iletişim hataları
    için U0100/U0121 gibi DTC'leri tarayın; 12V akü voltajını ve durumunu kontrol
    edin; son yazılım güncellemelerini sorun.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://fmhaber.com.tr/volkswagen-golf-8-etsi-motorlarda-tahrik-sistemi-arizasi-uyarisi-nasil-silinir
    source_domain: fmhaber.com.tr
    site_or_channel: fmhaber.com.tr
    quote: '"Gösterge panelinde beliren ''Tahrik sistemi arızası! Lütfen servise başvurun''
      uyarısı, sürücüler arasında en yaygın karşılaşılan can sıkıcı durumlardan biridir.
      Bu uyarının arkasındaki mekanizmayı anlamak, motor kontrol ünitesi (ECU) veya
      merkezi ağ geçidi (Gateway - J533) modülünün, sistem bileşenlerinden milisaniyelik
      bir süre boyunca hatalı veya eksik veri almasıyla oluşur... Çoğu zaman fiziksel
      hiçbir hasar olmasa bile, sadece bu anlık iletişim kopukluğu arıza kaydının
      hafızada kalıcı hale gelmesine neden olur."'
    independent: true
- id: ea211_emissions_egr_valve_clogging_in_ea_v1
  claim_key: ea211_emissions_egr_valve_clogging_in_ea
  version: 1
  is_current: true
  title: EGR valve clogging in EA211 1.4 TFSI engines
  title_tr: EA211 1.4 TFSI motorlarda EGR valfi tıkanması
  kind: known_issue
  domain: emissions
  severity: medium
  confidence: 0.6
  rationale: The EGR valve in EA211 1.4 TFSI engines can clog with carbon, especially
    in city driving. This causes rough idle, power loss, and higher fuel consumption,
    typically between 60,000 and 120,000 km. Replacing an EGR valve is costly, so
    this risk is worth checking before buying.
  rationale_tr: EA211 1.4 TFSI motorlarda EGR valfi, özellikle şehir içi kullanımda
    karbon birikimiyle tıkanabilir. Bu durum rölantide titreme, güç kaybı ve yakıt
    tüketiminde artışa neden olur; genellikle 60.000–120.000 km arasında görülür.
    EGR valfi değişimi masraflı olduğundan, satın almadan önce bu risk kontrol edilmelidir.
  inspection_advice: During a test drive, check for rough idle or hesitation. Ask
    the seller for any fault codes related to the EGR system (e.g., P0401). If possible,
    have the EGR valve visually inspected for carbon buildup.
  inspection_advice_tr: Test sürüşü sırasında rölanti titremesi veya gaz tepkisizliği
    olup olmadığını kontrol edin. Satıcıdan EGR sistemiyle ilgili hata kodlarını (ör.
    P0401) isteyin. Mümkünse EGR valfini karbon birikimi açısından görsel olarak inceletin.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://www.araclo.com/vehicles/audi-a4-sedan-1.4-tfsi-sport/degerlendirmeler/kullanici-sorunlari
    source_domain: araclo.com
