  title: EA211 eTSI 48V software instability
  title_tr: EA211 eTSI 48V yazılım kararsızlığı
  kind: known_issue
  domain: electrical
  severity: medium
  confidence: 0.6
  rationale: Early 2020-2022 Golf 8 eTSI models with EA211 evo engines may show recurrent
    'Drive System Fault' warnings due to software conflicts between the hybrid system's
    gateway, battery management, and engine control unit. This is a known electronic
    issue, not a mechanical failure, and can be resolved with software updates. Buyers
    should verify that the latest updates are installed.
  rationale_tr: 2020-2022 Golf 8 eTSI modellerinde EA211 evo motorlu araçlarda, hibrit
    sistemin ağ geçidi, batarya yönetimi ve motor kontrol ünitesi arasındaki yazılım
    çakışmaları nedeniyle tekrarlayan 'Sürüş Sistemi Arızası' uyarıları görülebilir.
    Bu mekanik bir arıza değil, bilinen bir elektronik sorundur ve yazılım güncellemeleriyle
    çözülebilir. Alıcılar en son güncellemelerin yapıldığını doğrulamalıdır.
  inspection_advice: Take the car for a longer test drive to trigger any intermittent
    warning. Check the service history for software update campaigns, especially for
    the 48V hybrid control modules (J533, BMS, and ECU). If a warning appears, a diagnostic
    scan will show communication errors; ensure the dealer has applied the latest
    TPI/TSB.
  inspection_advice_tr: Aracı uzun bir test sürüşüne çıkarın ve aralıklı uyarıları
    tetikleyin. Servis geçmişinde özellikle 48V hibrit kontrol modülleri (J533, BMS
    ve ECU) için yazılım güncelleme kampanyalarını kontrol edin. Uyarı görünürse arıza
    taraması iletişim hatalarını gösterecektir; bayiin en güncel TPI/TSB'yi uyguladığından
    emin olun.
  status: review
  promoted_by: ledger
