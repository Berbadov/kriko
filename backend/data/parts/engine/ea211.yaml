- claim_key: ea211_engine_plastic_water_pump_h
  title: Plastic water pump housing cracking/leaking
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.9
  status: review
  promoted_by: pending_human
  rationale: The EA211 1.4 TSI uses a plastic water pump housing integrated with the
    thermostat, which deforms and leaks coolant over time due to heat exposure. This
    is a chronic design flaw exacerbated by overheating or prolonged idling.
  inspection_advice: Check for coolant leaks near the timing belt cover, white residue
    under the engine bay, and signs of overheating (e.g., burnt coolant smell, dashboard
    warning lights). Verify if the water pump has been replaced preventively.
  sources:
