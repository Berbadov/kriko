- id: ea211_fuel_system_ea211_tsi_intake_valve_c_v1
  claim_key: ea211_fuel_system_ea211_tsi_intake_valve_c
  version: 1
  is_current: true
  title: EA211 TSI intake valve carbon buildup
  title_tr: EA211 TSI supap karbon birikimi
  kind: known_issue
  domain: fuel system
  severity: medium
  confidence: 0.6
  rationale: The direct-injection (TSI) variants of the EA211 engine can accumulate
    carbon deposits on intake valves over time. This happens because fuel is injected
    directly into the cylinder, not onto the intake valves, so the valves are not
    cleaned by fuel. The deposits can reduce airflow, causing rough idle, power loss,
    and increased fuel consumption. This issue is predictable based on engine type
    and mileage.
  rationale_tr: EA211 motorunun doğrudan enjeksiyonlu (TSI) varyantlarında zamanla
    emme supaplarında karbon birikintileri oluşabilir. Bunun nedeni, yakıtın silindire
    doğrudan enjekte edilmesi ve supap yüzeylerini temizlememesidir. Birikintiler
    hava akışını azaltarak rölanti düzensizliğine, güç kaybına ve artan yakıt tüketimine
    yol açabilir. Bu sorun motor tipine ve kilometreye göre öngörülebilir.
  inspection_advice: At viewing, ask if the intake valves have been cleaned (carbon
    blasting) and check service records. Consider a borescope inspection of the intake
    ports, which is not part of a standard check. Look for symptoms like rough idle,
    hesitation, or low power; DTC P2014/P2015 may indicate intake manifold flap issues,
    but not directly carbon. A compression test may show valve sealing problems, but
    it's routine. Carbon build-up is best confirmed via borescope.
  inspection_advice_tr: Görüşmede, emme supabı temizliği (karbon temizleme) yapılıp
    yapılmadığını sorun ve servis kayıtlarını kontrol edin. Standart kontrolün bir
    parçası olmayan boreskop ile emme portlarını inceletmeyi düşünün. Rölanti düzensizliği,
    tepkisizlik veya güç kaybı gibi belirtilere bakın. DTC P2014/P2015 emme manifoldu
    kanatçık sorunlarını gösterebilir, ancak doğrudan karbonla ilgili değildir. Sıkıştırma
    testi supap sızdırmazlık sorunlarını gösterebilir, ancak bu rutin bir kontroldür.
    Karbon birikimini en iyi boreskop doğrular.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://autopartswd.com/volkswagen-ea211-engine-guide/
    source_domain: autopartswd.com
    site_or_channel: autopartswd.com
    quote: '"On direct-injection variants (TSI), carbon deposits can form on intake
