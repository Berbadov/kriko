- claim_key: h4d_75_engine_manual_valve_adjustm
  title: Manual valve adjustment requirement (H4Dt 1.0 TCe)
  kind: known_issue
  domain: engine
  severity: low
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: The absence of **hydraulic lifters** means the H4Dt engine requires **manual
    valve adjustment every 60,000 km (40,000 miles)**. Neglecting this leads to **valve
    lash buildup, power loss, and rough running**, though it’s not a catastrophic
    failure mode.
  inspection_advice: Listen for **ticking noises from the valve train** (especially
