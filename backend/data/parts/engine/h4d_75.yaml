claims:
- claim_key: h4d_75_engine_premature_timing_cha
  title: Premature timing chain stretch/rattle due to oil quality
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The H4D engine's fine-pitch timing chain is highly sensitive to oil quality
    and maintenance intervals. Late oil changes lead to accelerated wear of chain
    pins and rollers, causing a distinctive cold-start rattle and eventual chain stretch.
    Ignoring this symptom risks catastrophic failure (e.g., bent valves) due to chain
    skipping.
  inspection_advice: Listen for a cold-start rattle (lasting a few seconds) that subsides
    as oil pressure builds. Check oil change history—engines serviced at 10,000-mile
    intervals with RN17-approved oil rarely develop this issue before 120,000 miles.
  sources:
  - source_url: https://oil-select.com/best-engine-oil-for-renault-clio-5-1-0-tce/
    source_domain: oil-select.com
    site_or_channel: oil-select.com
    quote: '"The first symptom is a distinctive rattle on cold start, lasting a few
      seconds before oil pressure reaches the hydraulic chain tensioner. This rattle
      indicates that the tensioner is taking up more slack than it was designed for,
      meaning the chain has stretched beyond its normal tolerance. At this stage,
      the chain and tensioner should be replaced promptly. Ignoring the rattle risks
      the chain skipping a tooth on the sprocket, which will bend valves and destroy
      the engine."'
    independent: true
- claim_key: h4d_75_engine_timing_chain_failure
  title: Timing chain failure risk (H4Dt 1.0 TCe)
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: The thin timing chain on the H4Dt 1.0 TCe engine is prone to failure
    between **120,000–150,000 km**, risking catastrophic valve damage if it snaps.
    This is a critical failure mode due to the lack of hydraulic tensioners and the
    chain's fragility under prolonged use.
  inspection_advice: Check for **timing chain stretch or rattling noises** during
    startup (especially when cold). Verify service records for **timing chain kit
    replacements**—this should be done at **~120,000 km** to prevent failure. Inspect
    for **oil leaks around the timing chain cover** (indicating potential wear).
  sources: []
- claim_key: h4d_75_engine_intake_camshaft_phas
