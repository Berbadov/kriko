  rationale: The H4D 400's diesel particulate filter (DPF) is prone to clogging when
    used primarily for short trips, which prevents proper regeneration and leads to
    costly failures.
  inspection_advice: Check for DPF warning lights, excessive backpressure, or soot
    buildup around the exhaust system. Verify maintenance records for DPF regeneration
