- claim_key: ea888_300_engine_ea888_coolant_system
  title: EA888 coolant system pressure instability from small leaks
  kind: known_issue
  domain: engine
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: Small leaks in the EA888 cooling system can destabilize system pressure,
    affecting temperature regulation, heater performance, and emissions control—even
    before overheating occurs. The modern cooling system is pressure-managed, and
    gradual coolant loss undermines its safety margins.
  inspection_advice: Monitor for repeated coolant top-offs, intermittent low-coolant
    warnings, or inconsistent heater performance. Look for sweet odors (evaporated
    coolant) and dried residue near the housing or junctions, which indicate gradual
    pressure loss.
  sources:
  - source_url: https://motronix.net/blog/audi-2-0t-ea888-water-pump-thermostat-housing-leak/
    source_domain: motronix.net
    site_or_channel: motronix.net
    quote: '"Even before overheating, coolant loss can reduce system pressure, change
      heater performance, trigger warnings, and create ''false'' symptoms that confuse
      diagnosis."'
    independent: true
- claim_key: ea888_300_engine_ea888_coolant_leak_m
  title: EA888 coolant leak misdiagnosis due to 'no puddle' evaporation
  kind: known_issue
  domain: engine
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: Small coolant leaks on the EA888 engine often evaporate on hot surfaces,
    leaving no visible puddle but causing dried residue, sweet odors, and gradual
    coolant loss. This makes leaks harder to detect early, leading to delayed diagnosis
    and potential overheating.
  inspection_advice: Inspect for dried pink/white residue near the housing or junctions,
    and note sweet odors after parking. Confirm leaks by trending coolant levels and
    observing heat-soak patterns (leaks become more visible after shutdown).
  sources:
  - source_url: https://motronix.net/blog/audi-2-0t-ea888-water-pump-thermostat-housing-leak/
    source_domain: motronix.net
    site_or_channel: motronix.net
    quote: '"Because small seepage can land on hot engine surfaces and evaporate,
      leaving odor and residue instead of a visible drip."'
    independent: true
