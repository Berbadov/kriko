- claim_key: ea888_300_engine_thermostat_housing_c
  title: Thermostat housing cracking/warping (EA888 Gen3)
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The integrated plastic-and-metal thermostat housing on EA888 Gen3 engines
    fails due to thermal expansion mismatch between aluminum engine block and glass-fiber-reinforced
    plastic housing, leading to warping, micro-cracks, and seal failure. This causes
    coolant leaks, temperature regulation issues, and potential catastrophic engine
    damage if coolant enters combustion chambers.
  inspection_advice: Check for coolant residue (pink/orange) along the seam where
    the plastic housing meets the aluminum engine block. Look for signs of coolant
    leaks under the intake manifold, and verify if the engine consistently runs below
    90°C or overheats with coolant visibly circulating in the expansion tank. Inspect
    for white, sweet-smelling exhaust smoke indicating internal coolant leaks.
  sources:
  - source_url: https://autodataplug.com/repairs-fixes/why-the-ea888-gen3-water-pump-and-thermostat-are-a-combined-unit-on-vwaudi-and-why-its-so-expensive-to-replace/
    source_domain: autodataplug.com
    site_or_channel: autodataplug.com
    quote: '"The housing is made from glass-fiber-reinforced plastic, but it bolts
      directly to a cast aluminum engine block. Here’s the kicker: aluminum expands
      and contracts a lot more than plastic does when it heats up and cools down.
      Over thousands of these thermal cycles, that mismatch puts incredible stress
      on the plastic. It warps, develops micro-cracks, and eventually, the seals fail."'
    independent: true
- claim_key: ea888_300_engine_water_pump_shaft_sea
  title: Water pump shaft seal failure (EA888 Gen3)
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The mechanical seal around the water pump impeller shaft degrades, causing
    coolant leaks internally or externally. This can lead to coolant dripping into
    the timing chain cover area, often mistaken for an oil leak.
  inspection_advice: Inspect the timing chain cover area for coolant residue (not
    oil). Check for coolant leaks near the weep hole or under the intake manifold.
    Look for white, sweet-smelling exhaust smoke if coolant has entered the combustion
    chamber.
  sources:
  - source_url: https://autodataplug.com/repairs-fixes/why-the-ea888-gen3-water-pump-and-thermostat-are-a-combined-unit-on-vwaudi-and-why-its-so-expensive-to-replace/
    source_domain: autodataplug.com
    site_or_channel: autodataplug.com
    quote: '"The water pump’s mechanical seal around the impeller shaft is another
      common wear point. Once that seal goes, coolant leaks out, usually through a
      weep hole or into the timing chain cover area."'
    independent: true
- claim_key: ea888_300_engine_coolant-induced_corr
  title: Coolant-induced corrosion and brittleness (EA888 Gen3)
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: Use of non-OAT (Organic Acid Technology) coolants like generic silicate-based
    coolants accelerates electrolytic corrosion of the aluminum mating surface and
    makes the plastic housing brittle, leading to premature failure.
  inspection_advice: Verify the type of coolant used (must be G12, G12+, G12++, or
    G13). Check for signs of corrosion on the aluminum block near the housing and
    inspect the housing for brittleness or cracks.
  sources:
  - source_url: https://autodataplug.com/repairs-fixes/why-the-ea888-gen3-water-pump-and-thermostat-are-a-combined-unit-on-vwaudi-and-why-its-so-expensive-to-replace/
    source_domain: autodataplug.com
    site_or_channel: autodataplug.com
    quote: '"If you or a previous owner used a generic silicate-based coolant, you’ve
      essentially put a ticking time bomb in there. It accelerates electrolytic corrosion,
      attacking the aluminum mating surface and making that plastic housing brittle."'
    independent: true
- claim_key: ea888_300_engine_internal_coolant_see
  title: Internal coolant seepage into combustion chamber (EA888 Gen3)
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: Failure of internal seals (thermostat or pump shaft) can allow coolant
    to seep into the combustion chamber, leading to hydrolock and catastrophic engine
    failure (bent connecting rods).
  inspection_advice: Look for white, sweet-smelling exhaust smoke and check for coolant
