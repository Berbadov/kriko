    or bent rods.
  sources:
  - source_url: https://autodataplug.com/repairs-fixes/why-the-ea888-gen3-water-pump-and-thermostat-are-a-combined-unit-on-vwaudi-and-why-its-so-expensive-to-replace/
    source_domain: autodataplug.com
    site_or_channel: autodataplug.com
    quote: '"If the thermostat seal or the pump shaft seal degrades, coolant can get
      where it shouldn’t. Left unchecked, that coolant can eventually find its way
      into a combustion chamber. And trust me, you don’t want to deal with hydrolock
      and bent connecting rods – that’s catastrophic engine failure."'
    independent: true
