claims:
- claim_key: ea888_230_engine_hidrolik_tensioner_f
  title: Hidrolik tensioner failure leading to timing chain stretch and catastrophic
    engine damage
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: Third-gen EA888 engines suffer from premature timing chain stretch due
    to hydraulic tensioner failures under thermal/mechanical stress. The lack of secondary
    mechanical locking in OEM tensioners causes catastrophic engine damage (bent valves,
    piston-valve contact) when hydraulic failure occurs, often requiring expensive
    repairs (~$7,200).
  inspection_advice: Check for signs of hydraulic tensioner failure (e.g., uneven
    chain tension, excessive chain stretch before 80,000 miles), listen for unusual
    noises, and verify if the engine has had hydraulic tensioner replacements or remanufactured
    kits installed.
  sources:
  - source_url: https://www.oruidereman.com/tr/blog/reman-parts-for-volkswagen-ea888-engines-installation-tips
    source_domain: oruidereman.com
    site_or_channel: oruidereman.com
    quote: '"3. nesil EA888 motorlar, özellikle sürekli termal ve mekanik stres altında
      bozulan, yağ basıncına bağlı hidrolik gerdiriciler nedeniyle 80.000 mil öncesinde
      zamanlama zinciri uzamasına eğilimlidir. Bu erken uzama, gevşeklik ve hizalanmamışlık
      yaratır ve piston-valf teması gibi felaket sonuçlu arızaların riskini artırır.
      ... OEM EA888 gerdiricileri ikincil mekanik kilitleme mekanizmalarına sahip
      değildir; bu nedenle hidrolik çökme anında zamanlama kaybı, bükülmüş supaplar
      ve ortalama 7.200 ABD Doları tutarındaki motor tamiri kaçınılmaz hâle gelir."'
    independent: true
- claim_key: ea888_230_cooling system_aluminum_water_pump_
  title: Aluminum water pump housing corrosion due to coolant pH imbalance
  kind: known_issue
  domain: cooling
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: EA888 engines with high mileage experience accelerated corrosion in aluminum
    water pump housings when coolant pH deviates from the optimal range (7.5–10.5),
    leading to structural weakening and potential failure.
  inspection_advice: Inspect the water pump housing for pitting, corrosion, or structural
    weakness. Check coolant pH levels and ensure they are within the recommended range.
    Look for signs of coolant leaks or contamination.
  sources:
  - source_url: https://www.oruidereman.com/tr/blog/reman-parts-for-volkswagen-ea888-engines-installation-tips
    source_domain: oruidereman.com
    site_or_channel: oruidereman.com
    quote: '"Yüksek Kilometreli EA888 Ünitelerinde Alüminyum Gövde Korozyonu ve Çark
      Kavitasyonu: Yaşlanan EA888 motorlarda alüminyum su pompası muhafazaları, soğutma
      sıvısı pH değerinin optimal aralığın (genellikle 7,5–10,5) dışına çıkması durumunda
      hızlandırılmış elektrolitik korozyona uğrar; bu da çukurlaşmaya ve yapısal bütünlüğün
      zayıflamasına neden olur."'
    independent: true
- claim_key: ea888_230_cooling system_water_pump_cavitatio
  title: Water pump cavitation damage and seal failure
  kind: known_issue
  domain: cooling
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: EA888 engines experience cavitation in water pump impellers when RPM
    exceeds 40,000, causing blade erosion and metal particle contamination. This contaminates
    seals, accelerating wear and leading to leaks.
  inspection_advice: Check the water pump impeller for signs of erosion or pitting.
    Inspect seals for wear or leaks, and verify if the pump has been replaced with
    a remanufactured unit featuring improved seal materials.
  sources:
  - source_url: https://www.oruidereman.com/tr/blog/reman-parts-for-volkswagen-ea888-engines-installation-tips
    source_domain: oruidereman.com
    site_or_channel: oruidereman.com
    quote: '"Aynı zamanda, pompanın milinin devir sayısı 40.000 RPM’yi aştığında meydana
      gelen kavitasyon nedeniyle çark kanatları aşınır ve metal parçacıklar oluşur.
      Bu kirleticiler mile monte edilen salmastra contalarını aşındırarak sızıntıyı
      hızlandırır."'
    independent: true
- claim_key: ea888_230_engine_excessive_crankshaft
  title: Excessive crankshaft axial play causing bearing and oil pump failure
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: Excessive crankshaft axial play (beyond OEM tolerances of 0.006–0.010
    inches) disrupts load distribution in main bearings, accelerates wear, and starves
    adjacent systems (e.g., oil pump) of lubrication. This leads to increased vibration,
    fatigue cracks in bearing surfaces, and premature failure.
  inspection_advice: Check for excessive crankshaft endplay by measuring axial movement.
    Listen for unusual noise patterns (e.g., increased vibration) and inspect main
    bearings and oil pump for signs of wear or failure.
  sources:
  - source_url: https://www.oruidereman.com/tr/blog/reman-parts-for-volkswagen-ea888-engines-installation-tips
    source_domain: oruidereman.com
    site_or_channel: oruidereman.com
    quote: '"Aşırı krank mili uç oyunu—fabrika tolerans aralığını (0,006–0.010 inç)
      aşması—kademeli mekanik arızalara neden olur. Anormal eksenel kuvvetler ana
      yatakların yük dağılımını bozar, aşınmayı hızlandırır ve yağ pompası gibi komşu
      sistemleri sürekli yağlamadan mahrum bırakır. Titreşim %300’e kadar artar; bu
      da mekanik salmastra üzerindeki gerilimi artırır ve yatak yüzeylerinde yorulma
      çatlaklarının oluşumunu teşvik eder."'
    independent: true
- claim_key: ea888_230_engine_oem_pushrods_lacking
  title: OEM pushrods lacking material consistency and surface finish
  kind: known_issue
  domain: engine
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: OEM pushrods in EA888 engines lack the material precision and surface
