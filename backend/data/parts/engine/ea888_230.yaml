  sources:
  - source_url: https://www.oruidereman.com/tr/blog/reman-parts-for-volkswagen-ea888-engines-installation-tips
    source_domain: oruidereman.com
    site_or_channel: oruidereman.com
    quote: '"Reman itme pulları, genel amaçlı yedek parçalar tarafından eşlenemeyen
      metalurjik titizlikle OEM eksikliklerini giderir. Yüzey sertliği 55–60 HRC (Rockwell
      C ölçeği), termal döngü sırasında krank mili yataklarına mikro-kaynak oluşumunu
      önler; aynı zamanda ultra-pürüzsüz 8–12 Ra mikroinç yüzey pürüzlülüğü, hidrodinamik
      yağ filmi tutunumunu en üst düzeye çıkarır."'
    independent: true
- claim_key: ea888_230_engine_chronic_carbon_depos
  title: Chronic carbon deposits on intake valves (Gen 1/2)
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: Direct injection in Gen 1/2 2.0 TSI engines causes unchecked carbon buildup
    on intake valves, leading to restricted valve movement, misfires, and eventual
    valve failure. Port injection in Gen 3 mitigates this issue.
  inspection_advice: Check for carbon deposits on intake valves by inspecting valve
    heads for black buildup or misaligned valve movement. Look for check engine light
    codes related to misfires (P0300-P0308).
  sources:
