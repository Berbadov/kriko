    source_domain: carsandwrenches.com
    site_or_channel: carsandwrenches.com
    quote: '"Carbon deposits are one of the biggest concerns with this engine. This
      engine is using direct injection and if you are familiar with this system, you
      know that it is very problematic... This allows carbon deposits to develop and
      prevent the valves from opening and closing correctly. This will eventually
      result in complete valve failure and you will start to experience misfires."'
    independent: true
