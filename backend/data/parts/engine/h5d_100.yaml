  kind: known_issue
  domain: engine
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The 1.3 TCe (H5Ht) engine, previously a popular high-performance option
    in the Renault Clio Mk5, was discontinued after the facelift in 2023. This removal
    may leave buyers without access to a proven, higher-performance engine variant
    in newer models.
  inspection_advice: Check if the vehicle is a pre-facelift model (2019–2023) to confirm
    availability of the 1.3 TCe engine. Verify engine code via VIN or service records
    if considering a used Clio with this engine.
