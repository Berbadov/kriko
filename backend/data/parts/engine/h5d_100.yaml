  - source_url: https://www.drivisual.tv/en/reviews/renault-clio-mk5-in-depth-review-real-world-mpg-reliability-and-common-faults
    source_domain: drivisual.tv
    site_or_channel: drivisual.tv
    quote: '"The 1.3 TCe (H5Ht) engine was developed by the Alliance but benefits
      from joint engineering with Mercedes-Benz (used in Mercedes models under the
      M282 code). This 130 HP power machine was unfortunately removed from the price
      lists with the facelift (Phase 2)."'
    independent: true
