- claim_key: ea288_emissions_dpf-regenerationspro
  title: DPF-Regenerationsprobleme und Verstopfung durch Kurzstreckenbetrieb
  kind: known_issue
  domain: emissions
  severity: high
  confidence: 0.6
  status: rejected
  promoted_by: pending_human
  rationale: Der EA288 hat Probleme mit der automatischen DPF-Regeneration, besonders
    bei Kurzstrecken- oder Stadtverkehrsfahrern. Der Filter verstopft durch unvollständige
    Verbrennung von Ruß und Asche, was zu Überdruck im Abgassystem, Leistungseinbruch
    und potenziellen Turboschäden führt.
  inspection_advice: Achten auf häufige Aktivierung der Motor-Kontrollleuchte, Meldung
    'Partikelfilter beladen', erhöhten Kraftstoffverbrauch und Ruckeln im Notlauf.
    DPF auf Verstopfung und Überdruck prüfen lassen.
  sources:
  - source_url: https://www.motorzentrale.de/magazin/vw-ea288-motorprobleme-symptome-loesungen/
    source_domain: motorzentrale.de
    site_or_channel: motorzentrale.de
    quote: '"Auch der beim EA288 verbaute Dieselpartikelfilter (DPF) sorgt bei vielen
      Fahrzeughaltern für Kopfzerbrechen. Besonders bei viel Stadtverkehr oder Kurzstreckenbetrieb
      wird die automatische Regeneration gestört – was auf Dauer zur Verstopfung des
      Filters führt. [...] Erhöhter Kraftstoffverbrauch, Ruckeln oder Notlauf-Modus
      bei starker Beladung."'
    independent: true
- claim_key: ea288_engine_zahnriemenverschleiß
  title: Zahnriemenverschleiß und Rissgefahr trotz Ölbadschmierung
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  status: rejected
  promoted_by: pending_human
  rationale: Der EA288 nutzt einen nasslaufenden Zahnriemen im Ölbad, der trotz Ölschmierung
    durch Materialverschleiß ausfransen und abreißen kann. Dies führt zu Motorschäden,
    da der Riemenabrieb den Ölkreislauf verschmutzt und kritische Komponenten wie
    Turbolader, Nockenwellenversteller oder Ölpumpe gefährdet.
  inspection_advice: Auf Pfeifgeräusche im Leerlauf oder bei Gasstößen achten, Öl
    auf Riemenfasern oder schwarzen Schlamm prüfen. Zahnriemen ab 150.000 km auf Verschleiß
    untersuchen lassen, auch wenn der Serviceplan dies nicht vorsieht.
  sources:
  - source_url: https://www.motorzentrale.de/magazin/vw-ea288-motorprobleme-symptome-loesungen/
    source_domain: motorzentrale.de
    site_or_channel: motorzentrale.de
    quote: '"Anders als viele ältere VW-Dieselaggregate besitzt der EA288 keinen Steuerkettentrieb,
      sondern einen Zahnriemen, der jedoch ebenfalls nicht wartungsfrei ist – entgegen
      früherer Werbeaussagen. [...] Pfeifgeräusche im Leerlauf oder bei Gasstößen,
      Ölverunreinigungen mit Riemenfasern im Motor, unregelmäßige Motorleistung oder
      sporadische Fehlzündungen. [...] Spätestens ab 150.000 km: Riemenriss-Gefahr
      mit Motorschaden."'
    independent: true
