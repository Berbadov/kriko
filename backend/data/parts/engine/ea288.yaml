- claim_key: ea288_emissions_dpf_blockage_due_to_
  title: DPF blockage due to city driving
  kind: known_issue
  domain: emissions
  severity: high
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: The Diesel Particulate Filter (DPF) is prone to clogging in vehicles
    used primarily in city driving conditions, leading to costly repairs and limp
    mode activation. Proper highway use is required to clear the DPF through regeneration
    cycles.
  inspection_advice: Check for DPF warning lights and limp mode activation. Verify
    if the vehicle has been used mostly in city driving conditions without sufficient
    highway runs (minimum 30+ minutes at 100+ km/h every 2-3 weeks). Inspect for soot
    buildup in the DPF during a thorough inspection.
