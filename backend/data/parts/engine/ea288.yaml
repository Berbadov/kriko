- claim_key: ea288_engine_defective_coolant_pu
  title: Defective Coolant Pump (N499 sensor-dependent failure)
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: EA288 1.6–2.0 TDI engines suffer from a design flaw in the electric coolant
    pump (N499 sensor-controlled), where the pump fails intermittently due to a metal
    cover mechanism that malfunctions, leading to overheating. This is exacerbated
    by poor antifreeze maintenance, causing debris buildup and premature pump failure.
  inspection_advice: Check for coolant leaks around the pump housing, unusual noises
    (grinding/clunking) from the pump area, and verify if the pump engages properly
    when the engine is started. Look for signs of overheating (e.g., coolant temperature
    warnings) or a 'clunking' sound when the metal cover mechanism fails to operate
    correctly.
  sources:
  - source_url: https://www.rsamotorsports.com/blog/vag-1-6-2-0-tdi-sorunlar-ve-coezuemleri-ea-288
    source_domain: rsamotorsports.com
    site_or_channel: rsamotorsports.com
    quote: '"Hararet: Yüksek Motor Soğutma Sıvısı Sıcaklığı (Hararet): Bu uyarıyı
      ekranda gördüğünüz zaman aracınızı daha fazla sürmeden ilk olarak kenara park
      etmelisiniz. Aşağıda paylaşmış olduğumuz soğutma pompası (devir-daim) bozuluyor
      ve bu sorun bundan kaynaklanıyor. EA288 motorlarda farklı sıcaklıklarda, farklı
      su çevrimi oluyor. Pompa elektrikli ve n499 sensörden aldığı verilere göre su
      pompalamakta veya pompalamamaktadır. Pompanın üstüne metal kapak kapanıp/açılarak
      su çevrimini durdurmakta veya başlatmaktadır. Soğutma pompasını sistem aktif
      edemediğinde ise motor soğutma sıvısının sıcaklığı yükselerek ekranda uyarıyı
      verir. Kontak açıp kapatılarak takılı kalmış pompa düzelebilir fakat bu geçici
      çözümdür, bir süre sonra tekrarlayacaktır.


      Sebepleri:

      - Üretim hatasına sahip soğutma sıvısı pompası.

      - Uygun kullanılmayan/değişmeyen antifreeze ve sonucu pompanın üzerinde biriken
      kalıntıların pompayı bozması"'
    independent: true
