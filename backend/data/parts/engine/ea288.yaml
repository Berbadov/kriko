  status: held
  promoted_by: pending_human
  rationale: A failed CP4.1 pump can release metallic particles (from the tappet and
    camshaft journals) into the fuel system, contaminating the entire high-pressure
    circuit. This accelerates wear on injector sealing rings, causes needle blockages,
