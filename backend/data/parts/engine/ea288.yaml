- claim_key: ea288_engine_agr-kühler_und_agr-v
  title: AGR-Cooler and AGR-Valve Failures with Coolant Loss
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The AGR-cooler and AGR-valve of the EA288 2.0 TDI engine are prone to
    internal leaks that allow coolant to enter the exhaust system. This causes gradual
    coolant loss, white smoke emission, engine protection emergency shutdowns, and
    in the worst case, severe engine damage. The use of G13 coolant is particularly
    problematic, as delayed detection can lead to clogging of the cooling circuit
    and engine overheating.
  inspection_advice: Check for white smoke during startup or acceleration, which may
    indicate coolant in the exhaust system. Pay attention to error codes such as P0401,
    P0403, or P2413. If there is suspicion of internal coolant loss, perform a diagnosis
    using an engine tester or coolant leak measurement.
  sources:
  - source_url: https://motorenlager.de/blog/vw-ea288-2-0-tdi-probleme/
    source_domain: motorenlager.de
    site_or_channel: motorenlager.de
    quote: '"Defekte Dichtungen oder Risse [im AGR-Kühler] können dazu führen, dass
      Kühlmittel in den Abgastrakt gelangt – die Folge sind schleichender Kühlmittelverlust,
      weißlicher Rauch, Motorschutz-Warnungen und bei Ignorieren im Extremfall Kopfschäden
      oder Motorschaden. [...] Der Kühlmittelverlust findet oft intern statt. Kein
      Fleck unter dem Auto, kein sichtbares Leck – das Kühlmittel verdampft über den
      Abgastrakt. Was sich leider häuft, ist das Problem mit dem G13-Kühlmittel. Wenn
      man es zu spät merkt, verstopft es den kleinen Kühlkreislauf und der Zylinderkopf
      bekommt zu viel Temperatur."'
    independent: true
