- claim_key: ea288_fuel system_common_rail_fuel_pre
  title: Fuel filter clogging causes common rail pressure loss
  kind: known_issue
  domain: fuel system
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: A saturated fuel filter increases flow resistance, preventing the low-pressure
    pump from delivering sufficient fuel to the high-pressure pump. This causes cavitation
    in the high-pressure pump, triggering P0087 even when the pump and injectors are
    intact.
  inspection_advice: 'Check for a clogged fuel filter by measuring the pressure at
    the fuel filter housing. If the pressure drops below 3.0 bar, the filter is likely
    the cause. Replace the filter if it is saturated or clogged. Diagnostic code(s)
    to check for: P0087.'
  sources:
  - source_url: https://kfz-dietrich.com/blog/vw-ea288-hochdruck-p0087-diagnose/
    source_domain: kfz-dietrich.com
    site_or_channel: kfz-dietrich.com
    quote: '"Kraftstofffilter (einfachste Ursache): Gesättigter Filter erhöht den
      Strömungswiderstand im Zulauf. Die Vorförderpumpe kann nicht mehr ausreichend
      Kraftstoff liefern – Hochdruckpumpe läuft gegen Kavitation. P0087 tritt auf,
      obwohl Pumpe und Injektoren intakt sind. Filtertausch: 20–50€."'
    independent: true
- claim_key: ea288_fuel system_low-pressure_fuel_pu
  title: Low-pressure fuel pump failure (EA288 TDI)
  kind: known_issue
  domain: fuel system
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The low-pressure fuel pump inside the fuel tank is designed to create
    the necessary low-pressure fuel supply (ranging between 0.3 and 0.5 bar) for the
    high-pressure fuel pump. After approximately **150,000 to 200,000 kilometers**,
    the pump can degrade and fail to sustain the required fuel pressure, which causes
    the **P0087** code to activate (indicating a low fuel pressure condition).
  inspection_advice: 'To confirm this issue, use a **fuel pressure gauge** to measure
    the fuel pressure at the **fuel filter housing**. If the pressure consistently
    drops **below 3.0 bar** and remains low even after manually opening the fuel filter
    housing (to bypass the high-pressure pump), this strongly suggests a **defective
    low-pressure fuel pump**. Diagnostic code(s) to check for: P0087.'
  sources:
  - source_url: https://kfz-dietrich.com/blog/vw-ea288-hochdruck-p0087-diagnose/
    source_domain: kfz-dietrich.com
    site_or_channel: kfz-dietrich.com
    quote: '"Vorförderpumpe (Tank-Kraftstoffpumpe): Die elektrische Kraftstoffpumpe
      im Tank liefert Niederdruck (0,3–0,5 bar) als Zulauf für die Hochdruckpumpe.
      Verschlissene Pumpe nach 150.000–200.000 km: Vorförderdruckabfall. Messbar mit
      Druckmanometer am Filtegehäuse."'
    independent: true
  applies_when:
    min_mileage_km: 150000
- claim_key: ea288_fuel system_internal_leakage_in_
  title: Common Rail injector internal leaks
