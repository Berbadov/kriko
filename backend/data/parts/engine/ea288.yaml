- claim_key: ea288_fuel system_common_rail_fuel_pre
  title: Common Rail fuel pressure drop (P0087) due to clogged fuel filter
  kind: known_issue
  domain: fuel system
  severity: medium
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: A saturated fuel filter increases flow resistance, preventing the low-pressure
    pump from delivering sufficient fuel to the high-pressure pump. This causes cavitation
    in the high-pressure pump, triggering P0087 even when the pump and injectors are
    intact.
  inspection_advice: Check for a clogged fuel filter by measuring the pressure at
    the fuel filter housing. If the pressure drops below 3.0 bar, the filter is likely
    the cause. Replace the filter if it is saturated or clogged.
  sources: []
- claim_key: ea288_fuel system_low-pressure_fuel_pu
  title: Low-pressure fuel pump failure (Vorförderpumpe) leading to P0087
  kind: known_issue
  domain: fuel system
  severity: high
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: The low-pressure fuel pump in the tank provides the necessary fuel pressure
    (0.3–0.5 bar) for the high-pressure pump. A worn-out pump after 150,000–200,000
    km can cause a drop in fuel pressure, leading to P0087.
  inspection_advice: Measure the pressure at the fuel filter housing using a pressure
    gauge. If the pressure drops below 3.0 bar and remains low even after opening
    the filter housing, the low-pressure pump is likely faulty.
  sources: []
- claim_key: ea288_fuel system_internal_leakage_in_
