  domain: engine
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The EA288’s direct injection and EGR system design predisposes it to
    carbon deposits on intake valves/throttle bodies—a chronic issue in modern direct-injection
    engines. While not unique to the EA288, the text highlights it as a persistent
