- claim_key: ea288_engine_zahnriemenverschleiß
  title: Timing belt wear and risk of failure despite oil bath lubrication
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  status: rejected
  promoted_by: pending_human
  rationale: The EA288 engine uses a wet timing belt running in an oil bath. Despite
    oil lubrication, the belt can fray and snap due to material wear, leading to engine
    damage. Belt debris contaminates the oil system, posing a risk to critical components
    such as the turbocharger, camshaft phasers, or oil pump.
  inspection_advice: Listen for whining noises during idle or throttle inputs, and
    check the oil for belt fibers or black sludge. Inspect the timing belt for wear
    after 150,000 km, even if not specified in the service schedule.
  sources:
  - source_url: https://www.motorzentrale.de/magazin/vw-ea288-motorprobleme-symptome-loesungen/
    source_domain: motorzentrale.de
    site_or_channel: motorzentrale.de
    quote: '"Anders als viele ältere VW-Dieselaggregate besitzt der EA288 keinen Steuerkettentrieb,
      sondern einen Zahnriemen, der jedoch ebenfalls nicht wartungsfrei ist – entgegen
      früherer Werbeaussagen. [...] Pfeifgeräusche im Leerlauf oder bei Gasstößen,
      Ölverunreinigungen mit Riemenfasern im Motor, unregelmäßige Motorleistung oder
      sporadische Fehlzündungen. [...] Spätestens ab 150.000 km: Riemenriss-Gefahr
      mit Motorschaden."'
    independent: true
