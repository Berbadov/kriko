  title: DPF clogging and regeneration failure
  kind: known_issue
  domain: emissions
  severity: high
  confidence: 0.9
  status: verified
  promoted_by: auto_verified_agent
  rationale: Short city trips prevent the DPF from reaching regeneration temperatures,
    leading to clogging, loss of power, increased fuel consumption, and potential
    engine damage if unaddressed. Common in fleet cars with low mileage (80,000–100,000
    km).
  inspection_advice: Check for DPF warning lights, reduced power, or burning smells.
    Verify DPF health via diagnostic scan. Ensure the car has regular high-speed drives
    (20–30 mins at 2,500–3,000 rpm) to trigger passive regeneration.
  sources:
  - tier: A
    source_url: https://gaga.ba/en/najcesci-kvarovi/renault-megane-4-1-5-dci
    source_domain: gaga.ba
    site_or_channel: gaga.ba
    quote: '"The Megane 4 with the K9K engine is Euro 6 from the start, meaning a
      stricter DPF system than the Megane 3. Short city trips are the killer for this
      filter because the engine never reaches the temperature needed for active regeneration.
      On examples that served as urban delivery fleet cars, the DPF can be critical
      as early as 80,000-100,000 km."'
    independent: true
  - tier: A
    source_url: https://gaga.ba/en/najcesci-kvarovi/renault-megane-3-1-5-dci
    source_domain: gaga.ba
    site_or_channel: gaga.ba
    quote: The source text explicitly mentions DPF clogging due to short city trips,
      regeneration failure, loss of power, increased fuel consumption, and limp mode
      activation in the 1.5 dCi Euro 5 variant (K9K 110hp)
    independent: true
