  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The cam follower beneath the mechanical high-pressure fuel pump has a
    low-friction coating prone to wear, leading to rapid camshaft destruction if the
    coating fails. This issue was addressed in later models (e.g., 220bhp BUL engines)
    with revised cam lobe configurations.
  inspection_advice: Inspect the cam follower for worn or exposed metal surfaces every
    30,000 miles. Check for fuel pump pressure loss or illuminated check engine lights
    as early warning signs.
