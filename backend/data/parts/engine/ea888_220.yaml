- claim_key: ea888_220_engine_excessive_oil_consum
  title: Excessive oil consumption due to low-tension piston rings
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: Gen 1 and Gen 2 EA888 engines suffered from piston rings designed with
    low tension, allowing oil to slip past into the combustion chamber, leading to
    extreme oil consumption (e.g., 1 quart per 1,000 miles). This was a widespread
    issue with documented class-action lawsuits and a VW-sponsored piston ring update
    for affected models.
  inspection_advice: Check for blue-tinted exhaust smoke (burning oil), oil leaks
    around the valve cover or oil filter housing, and verify maintenance records for
    oil changes. Look for VW service bulletins or extended warranty updates related
    to piston ring replacements.
  sources:
  - source_url: https://problemsbyvin.com/engines/vw-audi-2-0t-ea888/
    source_domain: problemsbyvin.com
    site_or_channel: problemsbyvin.com
    quote: '"The piston rings were a low-tension design that allowed oil to slip past
      the rings into the combustion chamber, and a meaningful percentage of these
      engines ended up burning a quart every 1,000 miles or worse."'
    independent: true
  - source_url: https://vwtuning.co/vw-ea888-engine-problems/
    source_domain: vwtuning.co
    site_or_channel: vwtuning.co
    quote: '"This is a hot topic for the Gen 2 engines, both 1.8 and 2.0 series. This
      is also the main reason this Volkswagen engine gets a bad reputation. Excessive
      oil consumption is what it sounds like, the engine takes in more oil than the
      acceptable range of oil during normal conditions. [...] Volkswagen made the
      piston rings too thin out of the factory. Unfortunately, if you have a Gen2,
      you will have to replace the pistons and piston rings with the previous Gen
      1."'
    independent: true
  - source_url: https://www.ampauto.io/symptoms/audi-2-0t-ea888-problems
    source_domain: ampauto.io
    site_or_channel: ampauto.io
    quote: '"This is a hot topic for the Gen 2 engines, both 1.8 and 2.0 series. This
