  - source_url: https://www.torquecars.com/volkswagen/2-0-tfsi-problems.php
    source_domain: torquecars.com
    site_or_channel: torquecars.com
    quote: The primary weak point is the cam follower placed underneath the mechanical
      high-pressure fuel pump. It features a low friction covering similar to 'Teflon.'
      The follower is shaped like a thimble and is located at the bottom of the fuel
      pump. Check for wear on this every couple years or around 30,000 miles. This
      flaw was corrected in subsequent models by the use of a new cam lobe configuration;
      for example, the 220bhp BUL engines are not impacted by this issue.
