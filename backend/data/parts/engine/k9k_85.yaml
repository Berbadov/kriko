- claim_key: k9k_85_engine_turbocharger_actuato
  title: Turbocharger actuator failure (K9K 834)
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The variable-geometry turbocharger (VGT) actuator is a chronic weak point,
    particularly in city-driven models where frequent short trips and high thermal
    loads exacerbate failures. This leads to power loss and requires costly repairs.
  inspection_advice: Check for error codes related to turbo actuator failure (e.g.,
    P0299, P029A) and listen for unusual turbo noise or loss of power. Inspect for
    oil leaks around the turbocharger housing, as actuator failure is often linked
    to lubrication issues.
  sources:
  - source_url: https://www.enginecode.uk/renault/k9k-834-specs
    source_domain: enginecode.uk
    site_or_channel: enginecode.uk
    quote: '"The K9K 834''s primary reliability risk is turbocharger actuator failure,
      with elevated incidence in vehicles subjected to frequent short trips and high
      thermal loads. Renault internal data indicated a high frequency of actuator
      faults in city-driven Clio and Captur models... The most frequent issues are
      turbo actuator failure causing power loss..."'
    independent: true
- claim_key: k9k_85_emissions_dpf_clogging_due_to_
  title: DPF clogging due to insufficient regeneration (K9K 834)
  kind: known_issue
  domain: emissions
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The Diesel Particulate Filter (DPF) fails to regenerate properly in urban
    driving conditions, leading to clogging, reduced performance, and frequent emissions
    test failures. This is a common issue in city-driven Renault Clio IV and Captur
    models.
  inspection_advice: Check for DPF regeneration error codes (e.g., P0420, P2455) and
    inspect the exhaust system for blackened or clogged DPF. Verify if the vehicle
    has been driven on highways regularly to allow DPF regeneration. Look for warning
    lights related to emissions systems.
  sources:
  - source_url: https://www.enginecode.uk/renault/k9k-834-specs
    source_domain: enginecode.uk
    site_or_channel: enginecode.uk
    quote: '"The K9K 834''s primary reliability risk... is turbocharger actuator failure,
      with elevated incidence in vehicles subjected to frequent short trips and high
      thermal loads. UK DVSA records show DPF-related issues as a common cause of
      emissions test failures... The most frequent issues... are DPF clogging due
      to insufficient regeneration..."'
    independent: true
  - source_url: https://autodataplug.com/vehicle-specific-issues/why-dpf-and-egr-clog-so-quickly-on-renault-dci-15l16l-engines/
    source_domain: autodataplug.com
    site_or_channel: autodataplug.com
    quote: '"DPF almost always boils down to two things: oil ash and failed regeneration
      cycles... If you’re not running the specific Renault RN0720 low-ash (low-SAPS)
      oil, you’re leaving behind non-combustible residue every time the engine burns
      even a tiny bit of oil. Over time, that ash builds up in the DPF... Once it
      hits about 60 grams per liter, that filter is pretty much done for."'
    independent: true
