- claim_key: k9k_85_fuel system_common_rail_delphi_f
  title: Common Rail Delphi fuel system fragility
  kind: known_issue
  domain: fuel system
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The Delphi Common Rail fuel system (pre-2009) is highly sensitive to
    air in the system, clogged fuel filters, and poor-quality diesel fuel. These issues
    cause metal debris to form, clogging injectors and accelerating wear on the turbocharger
    and oil pump.
  inspection_advice: Inspect the fuel system for air leaks, check the condition of
    the fuel filter, and verify the quality of the diesel fuel used. Look for signs
    of injector clogging (e.g., rough idling, misfires, or black smoke). Ensure the
    fuel system has been properly bled and maintained according to manufacturer guidelines.
  sources:
  - source_url: https://mymotorlist.com/engines/renault/k9k/
    source_domain: mymotorlist.com
    site_or_channel: mymotorlist.com
    quote: '"The bulk of diesel engines until 2009 were equipped with the Common Rail
      Delphi system, which does not tolerate airing, a clogged fuel filter and bad
      diesel fuel. For any of these reasons, it begins to drive chips and primarily
      clogs the nozzles. Also, this metal pollen significantly reduces the life of
      the turbine and oil pump."'
    independent: true
