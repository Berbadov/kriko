  promoted_by: pending_human
  rationale: The K9K engine is prone to catastrophic failure of connecting rod bearings,
    particularly in European models where oil changes are less frequent (every 30,000
    km). This can lead to severe engine damage if not addressed promptly.
  inspection_advice: Check for signs of oil leaks, unusual engine noises (e.g., knocking
    or rattling), or excessive play in the engine components. Verify oil change history
    and ensure proper oil quality and viscosity are used. Look for recall notices
    or service bulletins related to bearing failures in the specific engine variant.
  sources:
