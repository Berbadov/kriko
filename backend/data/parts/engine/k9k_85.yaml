- claim_key: k9k_85_engine_interference_engine_
  title: Interference engine risk (K9K 834)
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The K9K 834 is an interference engine, meaning that failure of the timing
    chain or a jump in timing could cause catastrophic internal damage due to piston-valve
    collisions. While the chain is durable, this is a critical risk if the chain fails.
  inspection_advice: Verify the timing chain condition during an inspection, especially
    if the vehicle has undergone a timing chain replacement. Check for any signs of
    oil leaks or unusual noises from the timing chain area. Ensure oil changes are
    performed on schedule to maintain chain lubrication.
  sources:
  - source_url: https://www.enginecode.uk/renault/k9k-834-specs
    source_domain: enginecode.uk
    site_or_channel: enginecode.uk
    quote: '"Yes, it has moderate tuning potential... However, pushing beyond this
      is not recommended without upgrading the turbo actuator and ensuring the DPF
      can handle increased soot loads. **The K9K 834 is an interference engine.**
      If the timing chain were to fail (which is very rare) or jump timing, the pistons
      would collide with the open valves, causing catastrophic internal damage..."'
    independent: true
  - source_url: https://www.enginecode.uk/renault/k9k-837-specs
    source_domain: enginecode.uk
    site_or_channel: enginecode.uk
    quote: '"Yes, the K9K 837 is an interference engine. If the timing chain were
      to fail or jump, the pistons would collide with the open valves, causing catastrophic
      internal engine damage."'
    independent: true
