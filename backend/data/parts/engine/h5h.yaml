  kind: known_issue
  domain: emissions
  severity: medium
  confidence: 0.6
  rationale: The oxygen sensor in this engine sits in very hot exhaust gas and wears
    out over time. When it fails it gives wrong air-fuel ratio readings, so the engine
    runs poorly and uses more fuel. This is a known chronic problem for the H5H 1.3
    TCe.
  rationale_tr: Bu motordaki oksijen sensörü çok sıcak egzoz gazında bulunur ve zamanla
