  kind: known_issue
  domain: cooling
  severity: high
  confidence: 0.6
  rationale: The 1.3 TCe engine uses a plastic thermostat housing that can crack after
    repeated high-temperature driving, especially at sustained high speeds. This causes
    coolant to leak and can lead to engine overheating and serious damage if not fixed
    promptly.
  rationale_tr: 1.3 TCe motor, özellikle uzun süreli yüksek hızlarda sürüş sonrası
    tekrarlanan yüksek ısı döngülerinde çatlayabilen plastik bir termostat gövdesi
    kullanır. Bu, soğutma sıvısı sızıntısına ve motorun aşırı ısınmasına yol açabilir;
    zamanında müdahale edilmezse ciddi hasara neden olabilir.
  inspection_advice: At viewing, check the coolant level and condition, look for dried
    coolant residue or stains around the thermostat housing and radiator hoses, and
    during a test drive monitor the temperature gauge for any spikes. If there is
    a coolant smell or visible leaks, this likely indicates a failing thermostat housing.
    Also verify service history for any thermostat housing replacement.
  inspection_advice_tr: Araç muayenesinde, soğutma sıvısı seviyesini ve durumunu kontrol
    edin; termostat gövdesi ve radyatör hortumları çevresinde kurumuş soğutma sıvısı
    kalıntısı veya lekeleri arayın. Test sürüşü sırasında sıcaklık göstergesini izleyin
    ve ani yükselmeler olup olmadığına bakın. Soğutma sıvısı kokusu veya görünür sızıntı
    varsa, bu büyük olasılıkla termostat gövdesinde bir arıza olduğunu gösterir. Ayrıca
    servis geçmişinde termostat gövdesi değişimi olup olmadığını doğrulayın.
