- id: h5h_cooling_plastic_thermostat_housi_v1
  claim_key: h5h_cooling_plastic_thermostat_housi
  version: 1
  is_current: true
  title: Plastic thermostat housing single-point failure on H5H/M282
  title_tr: H5H/M282 plastik termostat gövdesi tek nokta arızası
  kind: known_issue
  domain: cooling
  severity: high
  confidence: 0.6
  rationale: The H5H/M282 engine uses a plastic thermostat housing that combines the
    thermostat, sensor and bypass valve. If it cracks or fails, coolant can leak or
    the engine can overheat or run too cold, and the whole assembly must be replaced.
    This is a known failure on this specific engine, not a general car issue.
  rationale_tr: H5H/M282 motorunda termostat, sensör ve baypas valfini birleştiren
    plastik bir termostat gövdesi kullanılır. Çatlar veya arızalanırsa soğutma sıvısı
    sızabilir, motor aşırı ısınabilir veya gereğinden soğuk çalışabilir; komple gövdenin
    değiştirilmesi gerekir. Bu, bu motora özgü bilinen bir arızadır.
  inspection_advice: At viewing, check coolant level and look for dried coolant residue
    or stains around the thermostat housing. If possible, pressure-test the cooling
    system and ask for proof the housing has already been replaced.
  inspection_advice_tr: Araç görüşmesinde soğutma sıvısı seviyesini kontrol edin ve
    termostat gövdesi çevresinde kurumuş soğutma sıvısı kalıntısı veya leke olup olmadığına
    bakın. Mümkünse soğutma sistemi basınç testi yapın ve gövdenin daha önce değiştirildiğini
    gösteren belge isteyin.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://en.mercedesassistance.com/mercedes-m282-engine/
    source_domain: en.mercedesassistance.com
    site_or_channel: en.mercedesassistance.com
    quote: the M282 integrates the thermostat element, coolant temperature sensor
      and bypass circuit into a single plastic housing assembly. This design reduces
      the number of cooling circuit connection points but creates a single-point failure.
      When the housing fails — whether at the gasket, the element or the bypass valve
      — the entire assembly requires replacement.
    independent: true
