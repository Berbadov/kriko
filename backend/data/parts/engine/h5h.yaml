- id: h5h_emissions_h5h_1_3_tce_egr_valve_fa_v1
  claim_key: h5h_emissions_h5h_1_3_tce_egr_valve_fa
  version: 1
  is_current: true
  title: H5H 1.3 TCe EGR valve failure damages turbo and DPF
  title_tr: H5H 1.3 TCe EGR valfi arızası turbo ve DPF'ye zarar verir
  kind: known_issue
  domain: emissions
  severity: high
  confidence: 0.6
  rationale: The EGR valve recirculates exhaust gas to cut emissions. On this engine,
    it tends to fail, causing black smoke, poor fuel economy, and can lead to costly
    damage to the turbocharger and diesel particulate filter. This is a serious, expensive
    repair.
  rationale_tr: EGR valfi, emisyonları azaltmak için egzoz gazını geri dolaştırır.
    Bu motorda sık arızalanır; siyah duman, yakıt tüketiminde artış ve turbo ile dizel
    partikül filtresinde pahalı hasarlara yol açabilir. Bu ciddi ve masraflı bir onarımdır.
  inspection_advice: During the test drive, watch for black smoke on acceleration,
    rough idle, or a fuel smell. Use an OBD scanner to check for EGR-related fault
    codes such as P0401, P0405, or P0409. Inspect the EGR valve and pipe for heavy
    carbon buildup if accessible.
  inspection_advice_tr: Test sürüşünde hızlanmada siyah duman, rölanti dalgalanması
    veya yakıt kokusu olup olmadığını gözlemleyin. OBD tarayıcı ile P0401, P0405 veya
    P0409 gibi EGR ile ilgili hata kodlarını kontrol edin. Erişilebilirse EGR valfi
    ve borusunda ağır kurum birikintisi olup olmadığını inceleyin.
  status: review
  promoted_by: ledger
  sources:
