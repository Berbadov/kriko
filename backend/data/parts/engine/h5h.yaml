- id: h5h_engine_carbon_buildup_on_intake_v1
  claim_key: h5h_engine_carbon_buildup_on_intake
  version: 1
  is_current: true
  title: Carbon buildup on intake valves/ports (direct injection-specific)
  title_tr: Carbon buildup on intake valves/ports (direct injection-specific)
  kind: known_issue
  domain: engine
  severity: low
  confidence: 0.6
  rationale: Direct-injected engines like the 1.3 TCe H5Ht lack the air-fuel mixture
    cleaning effect of port injection, leading to carbon deposits on intake valves
    and ports. While rare to cause severe performance issues, it can restrict airflow
    and reduce efficiency over time.
  rationale_tr: Direct-injected engines like the 1.3 TCe H5Ht lack the air-fuel mixture
    cleaning effect of port injection, leading to carbon deposits on intake valves
    and ports. While rare to cause severe performance issues, it can restrict airflow
    and reduce efficiency over time.
  inspection_advice: Check for black carbon deposits on intake valves and ports during
    a visual inspection of the engine bay or during a valve cover removal. Listen
    for rough idling or reduced power, which may indicate restricted airflow due to
    carbon buildup.
  inspection_advice_tr: Check for black carbon deposits on intake valves and ports
    during a visual inspection of the engine bay or during a valve cover removal.
    Listen for rough idling or reduced power, which may indicate restricted airflow
    due to carbon buildup.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://uscarsnew.com/renault-1-3-tce-h5ht-engine/
    source_domain: uscarsnew.com
    site_or_channel: uscarsnew.com
    quote: '"All engines with direct fuel injection basically experience carbon accumulation
      on the intake valves and ports. With a port injection, gasoline is injected
      into the intake ports and cleans a by-product of oil and fuel burn. Since they
      spray fuel directly into combustions, direct-injected engines do not have this
      side effect of the existence of air and fuel mixture inside intake ports. Over
      time, a build-up of gunk or sludge forms on the intake valves and walls inside
      intake ports. In some unusual cases, the carbon accumulation can have visible
      performance ramifications since it restricts the air flow so that the engine
      does not get enough oxygen to burn fuel effectively."'
    independent: true
