  version: 1
  is_current: true
  title: h5h (1.3 TCe) fuel pressure sensor wiring heat damage
  title_tr: h5h (1.3 TCe) yakıt basınç sensörü kablo ısı hasarı
  kind: known_issue
  domain: electrical
  severity: medium
  confidence: 0.6
  rationale: The h5h engine (1.3 TCe) runs hot, which over time damages the fuel rail
    pressure sensor and its wiring. This can cause the engine warning light to come
    on with a false low fuel pressure error code, even though the fuel system works
    fine. Repair usually means replacing the sensor or fixing the harness.
  rationale_tr: h5h motoru (1.3 TCe) yüksek ısı üretir ve bu, yakıt raylı basınç sensörünü
    ve kablolarını zamanla bozar. Bu durum, yakıt sistemi normal çalışsa bile motor
    arıza lambasının yanmasına ve hatalı düşük yakıt basıncı hata kodu oluşmasına
    neden olabilir. Onarım genellikle sensörün değiştirilmesi veya kablo tamirini
    içerir.
  inspection_advice: At viewing, ask about past P0087 fault codes and inspect the
    fuel rail wiring connector for heat damage or corrosion. Consider a fuel pressure
    test while the engine is hot; if pressure is normal but P0087 appeared, the wiring/sensor
    is likely the culprit.
  inspection_advice_tr: Araç incelerken geçmişte P0087 hata kodu olup olmadığını sorun
    ve yakıt raylı kablo konnektörünü ısı hasarı veya korozyon açısından kontrol edin.
    Motor sıcakken yakıt basıncı testi yapılmasını düşünün; basınç normal ancak P0087
    oluşmuşsa, sorun büyük olasılıkla sensör veya kabloda demektir.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://bilgiweb.com.tr/dacia-duster-1-3-tce-motor-ariza-lambasi-ve-p0087-hata-kodu-nasil-cozulur
