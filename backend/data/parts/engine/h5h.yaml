- id: h5h_engine_timing_chain_failure_ris_v1
  claim_key: h5h_engine_timing_chain_failure_ris
  version: 1
  is_current: true
  title: Timing chain failure risk due to improper parking and oil pressure delay
  title_tr: Timing chain failure risk due to improper parking and oil pressure delay
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  rationale: The 1.4 TSI lacks a ratchet mechanism on the timing chain tensioner,
    increasing the risk of timing chain slippage when the car is left in gear and
    rolls backward. This can misalign the timing, causing catastrophic valve-to-piston
    contact. Additionally, incomplete oil drain during oil changes can delay oil pressure
    buildup, further risking chain tensioner failure.
  rationale_tr: The 1.4 TSI lacks a ratchet mechanism on the timing chain tensioner,
    increasing the risk of timing chain slippage when the car is left in gear and
    rolls backward. This can misalign the timing, causing catastrophic valve-to-piston
    contact. Additionally, incomplete oil drain during oil changes can delay oil pressure
    buildup, further risking chain tensioner failure.
  inspection_advice: Verify the car is never left in gear when parked, especially
    on slopes or uneven surfaces. Check for signs of oil leaks or unusual engine noises
    during startup. Review service records for proper oil change procedures (avoid
    draining oil for extended periods).
  inspection_advice_tr: Verify the car is never left in gear when parked, especially
    on slopes or uneven surfaces. Check for signs of oil leaks or unusual engine noises
    during startup. Review service records for proper oil change procedures (avoid
    draining oil for extended periods).
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://www.sciroccocentral.co.uk/forum/viewtopic.php?t=22411
    source_domain: sciroccocentral.co.uk
    site_or_channel: sciroccocentral.co.uk
    quote: The chain tensioner on all TSI engines is hydraulically driven, i.e. it
      relies on oil pressure to fully apply tension to the timing chain... So if the
      car is left in gear, and it rolls back just a bit (say parked on a hill or even
      a driveway) then due to the design of the lower chain sprocket and where the
      tensioner applies it's pressure on the guide rail - the slackened chain can
      slip a tooth or 2 when the crankshaft is turned in reverse (ie car rolling backwards
      in gear). Then when you start the car up the timing is out, the valves smash
      into the pistons and your engine is ruined.
    independent: true
