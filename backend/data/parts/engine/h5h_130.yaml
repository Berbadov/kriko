- claim_key: h5h_130_engine_sprocket_wear_and_pr
  title: Sprocket wear and premature failure (timing chain system)
  kind: known_issue
  domain: engine
  severity: medium
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: The timing chain sprockets (camshaft and crankshaft) wear out prematurely
    due to the stretched chain. The crankshaft sprocket, in particular, is double-tracked
    and rotates at double the speed of camshaft sprockets, accelerating wear. Replacing
    only the chain without the sprockets risks repeated failure.
  inspection_advice: Verify if the full timing chain kit (chain, tensioners, slide
    rails, and **all sprockets**) was replaced during service. Ask for the service
    invoice to confirm. Check for uneven wear on the camshaft or crankshaft sprocket
    teeth.
  sources: []
