  title: DPF and EGR system interdependency leading to cascading failures
  title_tr: DPF and EGR system interdependency leading to cascading failures
  kind: known_issue
  domain: emissions
  severity: high
  confidence: 0.6
  rationale: The DPF and EGR systems are interconnected; failure in one accelerates
    failure in the other. EGR issues create excess soot, clogging the DPF faster,
    while DPF restrictions increase backpressure, stressing the EGR system further.
  rationale_tr: The DPF and EGR systems are interconnected; failure in one accelerates
    failure in the other. EGR issues create excess soot, clogging the DPF faster,
    while DPF restrictions increase backpressure, stressing the EGR system further.
  inspection_advice: Check for both DPF and EGR warning lights, reduced power, and
    limp mode. Verify if the car has a history of short trips, poor oil quality, or
    coolant leaks. Scan for related codes (e.g., P2002, P242F, P0401, P0402).
  inspection_advice_tr: Check for both DPF and EGR warning lights, reduced power,
    and limp mode. Verify if the car has a history of short trips, poor oil quality,
    or coolant leaks. Scan for related codes (e.g., P2002, P242F, P0401, P0402).
  status: review
  promoted_by: ledger
  sources:
