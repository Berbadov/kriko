- id: k9k_emissions_dpf_thermal_damage_from__v1
  claim_key: k9k_emissions_dpf_thermal_damage_from_
  version: 1
  is_current: true
  title: DPF thermal damage from failed regeneration cycles
  title_tr: DPF thermal damage from failed regeneration cycles
  kind: known_issue
  domain: emissions
  severity: high
  confidence: 0.6
  rationale: Short city trips prevent DPF passive regeneration, forcing the ECU to
    trigger active regenerations. If these cycles are interrupted or incomplete, soot
    builds up, causing temperature spikes that melt or crack the ceramic substrate,
    rendering the DPF unusable.
  rationale_tr: Short city trips prevent DPF passive regeneration, forcing the ECU
    to trigger active regenerations. If these cycles are interrupted or incomplete,
    soot builds up, causing temperature spikes that melt or crack the ceramic substrate,
    rendering the DPF unusable.
  inspection_advice: Check for DPF warning lights and limp mode. Look for signs of
    thermal damage (melted/cracked DPF) and verify driving habits (frequent short
    trips). Scan for regeneration-related codes (e.g., P242F).
  inspection_advice_tr: Check for DPF warning lights and limp mode. Look for signs
    of thermal damage (melted/cracked DPF) and verify driving habits (frequent short
    trips). Scan for regeneration-related codes (e.g., P242F).
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://autodataplug.com/vehicle-specific-issues/why-dpf-and-egr-clog-so-quickly-on-renault-dci-15l16l-engines/
    source_domain: autodataplug.com
    site_or_channel: autodataplug.com
    quote: '"Short city trips are a DPF killer. The engine never gets hot enough,
      long enough, for passive regeneration to happen... So the ECU tries active regenerations
      more often. But if those cycles are constantly interrupted or never completed,
      soot builds up, temperatures spike, and you end up with a melted or cracked
      ceramic substrate."'
    independent: true
- id: k9k_emissions_egr_cooler_corrosion_and_v1
  claim_key: k9k_emissions_egr_cooler_corrosion_and
  version: 1
  is_current: true
  title: EGR cooler corrosion and failure
  title_tr: EGR cooler corrosion and failure
  kind: known_issue
  domain: emissions
  severity: high
  confidence: 0.6
  rationale: The EGR cooler condenses exhaust gases, creating a corrosive sludge that
    clogs passages and damages the cooler. Cracked EGR coolers leak coolant into the
    exhaust, damaging the DPF and turbocharger, creating a feedback loop of failure.
  rationale_tr: The EGR cooler condenses exhaust gases, creating a corrosive sludge
    that clogs passages and damages the cooler. Cracked EGR coolers leak coolant into
    the exhaust, damaging the DPF and turbocharger, creating a feedback loop of failure.
  inspection_advice: Check for coolant leaks in the exhaust system, rough idle, or
    dark exhaust smoke. Look for EGR-related codes (e.g., P0401, P0402) and inspect
    the EGR cooler for cracks or sludge buildup. Verify if the car has a history of
    short trips or poor-quality diesel.
  inspection_advice_tr: Check for coolant leaks in the exhaust system, rough idle,
    or dark exhaust smoke. Look for EGR-related codes (e.g., P0401, P0402) and inspect
    the EGR cooler for cracks or sludge buildup. Verify if the car has a history of
    short trips or poor-quality diesel.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://autodataplug.com/vehicle-specific-issues/why-dpf-and-egr-clog-so-quickly-on-renault-dci-15l16l-engines/
    source_domain: autodataplug.com
    site_or_channel: autodataplug.com
    quote: '"The EGR cooler takes hot exhaust gas and chills it before sending it
      back into the intake. That cooling creates condensation, which then mixes with
      soot. What do you get? A thick, corrosive sludge that clogs up the cooler’s
      tiny passages and gums up the EGR valve itself... If the internal core cracks,
      it leaks coolant directly into the exhaust stream."'
    independent: true
