    source_domain: lom-s.ru
    site_or_channel: lom-s.ru
    quote: Due to low-quality or “dry” diesel fuel (and all rubbing components of
      the CommonRail are lubricated with fuel), and even more so due to the water
      content in the fuel or short-term airing of the fuel system, the Delphi injection
      pump may begin to “drive chips” due to which subsequently spreads the entire
      fuel system. Chips are formed in the pair “injection pump rotor – shaft rollers”.
      As a result, the injectors and the pump itself may fail.
    independent: true
