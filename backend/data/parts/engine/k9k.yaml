- id: k9k_timing_belt_failure_v1
  claim_key: k9k_timing_belt_failure
  version: 1
  is_current: true
  title: Timing belt and hydraulic lifter failure
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.67
  status: verified
  promoted_by: auto_verified_agent
  rationale: A snapped timing belt can cause bent valves, leading to a full cylinder
    head rebuild. Symptoms include rattling from the front of the engine on startup,
    uneven idle, or complete engine stop.
  inspection_advice: Verify timing belt condition and alignment of the high-pressure
    pump. Replace the timing belt, tensioners, and water pump no later than 100,000
    km (Renault specifies 120,000 km or 6 years).
  sources:
  - tier: A
    source_url: https://gaga.ba/en/najcesci-kvarovi/renault-megane-3-1-5-dci
    source_domain: gaga.ba
    site_or_channel: gaga.ba
    quote: '"Timing belt and hydraulic lifter failure ... The K9K has a timing belt
      (NOT a chain). Renault specifies replacement at 120,000 km or 6 years, but on
      this engine the belt can snap earlier if it is not properly tensioned or if
      the high-pressure pump is not properly aligned. A snapped belt means bent valves,
      and that is a full cylinder head rebuild."'
    independent: true
  - tier: C
    source_url: https://au7o.io/known-issues/renault-megane
    source_domain: au7o.io
    site_or_channel: au7o.io
    quote: The source explicitly describes the K9K 1.5 dCi timing belt failure as
