  severity: high
  confidence: 0.6
  status: review
  promoted_by: human
  rationale: 'The K9K 1.5 dCi uses a rubber timing belt with a Renault-specified replacement
    interval of 90,000 km or 5 years. A snapped belt causes catastrophic valve/piston
    contact (interference engine). The belt also drives the high-pressure fuel pump
    on the injection rail — misalignment here is a known failure path.

    '
  inspection_advice: 'Ask for the belt replacement invoice. If none, budget for immediate
    replacement (belt, tensioner, water pump together — ~€300–500 in labour + parts).

    '
