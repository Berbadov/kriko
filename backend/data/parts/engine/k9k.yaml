  title: k9k Delphi injection pump metal chips fail injectors
  title_tr: k9k Delphi pompası metal talaş üretip enjektörleri bozabilir
  kind: known_issue
  domain: fuel system
  severity: high
  confidence: 0.6
  rationale: The Delphi common-rail injection pump used in the k9k fuel system can
    generate metal chips if the fuel is contaminated or contains water. These chips
    can spread through the fuel system and cause both the pump and injectors to fail,
    which is an expensive repair.
  rationale_tr: k9k yakıt sisteminde kullanılan Delphi common-rail enjeksiyon pompası,
    yakıt kirliyse veya su içeriyorsa metal talaşlar üretebilir. Bu talaşlar yakıt
    sistemine yayılarak hem pompanın hem de enjektörlerin arızalanmasına neden olabilir;
    bu da pahalı bir onarımdır.
  inspection_advice: Check service history for regular fuel filter changes. At viewing,
    listen for abnormal pump noise and check fuel pressure via OBD (e.g., DTCs P0087,
    P0089). Remove and inspect the fuel filter for metal particles if possible.
  inspection_advice_tr: Servis geçmişinde düzenli yakıt filtresi değişimi kontrol
    edin. Görüşmede anormal pompa sesini dinleyin ve OBD ile yakıt basıncını kontrol
    edin (ör. DTC P0087, P0089). Mümkünse yakıt filtresini çıkarıp metal parçacıklar
    açısından inceleyin.
