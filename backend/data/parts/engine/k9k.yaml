    source_domain: autodataplug.com
    site_or_channel: autodataplug.com
    quote: '"EGR problems present differently... but the underlying causes are different.
      Knowing the typical symptoms helps you narrow it down before you even plug in
      a scan tool... EGR issues lead to more soot, which then clogs the DPF faster.
      See? They’re always connected."'
    independent: true
- id: k9k_emissions_dpf_clogging_due_to_oil__v1
  claim_key: k9k_emissions_dpf_clogging_due_to_oil_
  version: 1
  is_current: true
  title: DPF clogging due to oil ash buildup
  title_tr: DPF clogging due to oil ash buildup
  kind: known_issue
  domain: emissions
  severity: high
  confidence: 0.6
  rationale: The 1.5 and 1.6 dCi engines suffer from DPF failure caused by non-combustible
    oil ash residue, which accumulates when non-Renault RN0720 low-ash oil is used.
    Once ash reaches ~60 grams per liter, the DPF becomes irreparable, leading to
    costly replacements.
  rationale_tr: The 1.5 and 1.6 dCi engines suffer from DPF failure caused by non-combustible
    oil ash residue, which accumulates when non-Renault RN0720 low-ash oil is used.
    Once ash reaches ~60 grams per liter, the DPF becomes irreparable, leading to
    costly replacements.
  inspection_advice: Check for DPF warning lights (P2002, P242F, P2463) and verify
    oil type history. Look for reduced power, hesitation, or limp mode—signs of DPF
    restriction. Inspect for thermal damage (melted/cracked ceramic substrate) if
    the car has a history of short trips.
  inspection_advice_tr: Check for DPF warning lights (P2002, P242F, P2463) and verify
    oil type history. Look for reduced power, hesitation, or limp mode—signs of DPF
    restriction. Inspect for thermal damage (melted/cracked ceramic substrate) if
    the car has a history of short trips.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://autodataplug.com/vehicle-specific-issues/why-dpf-and-egr-clog-so-quickly-on-renault-dci-15l16l-engines/
    source_domain: autodataplug.com
    site_or_channel: autodataplug.com
    quote: '"DPF almost always boils down to two things: oil ash and failed regeneration
      cycles... If you’re not running the specific Renault RN0720 low-ash (low-SAPS)
      oil, you’re leaving behind non-combustible residue every time the engine burns
      even a tiny bit of oil. Over time, that ash builds up in the DPF... Once it
      hits about 60 grams per liter, that filter is pretty much done for."'
    independent: true
