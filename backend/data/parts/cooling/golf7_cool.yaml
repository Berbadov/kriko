- claim_key: golf7_cool_engine_chronic_failure_of_e
  title: Chronic failure of electric water pump (thermostat pump) in VW Group 1.4/1.6
    TSI engines (Golf 7 2016)
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: The electric water pump (thermostat pump) is a critical component for
    engine cooling in modern turbocharged engines. Chronic failures in this part,
    especially in VW Group's 1.4/1.6 TSI engines, can lead to overheating and engine
    damage if not addressed promptly. The mention of this part failing alongside the
    DSG gearbox unit in a 2016 Golf 7 suggests a recurring issue in this model.
  inspection_advice: Check for warning lights (e.g., engine temperature warning) and
    verify if the electric water pump has been replaced with an OEM or high-quality
    aftermarket part (e.g., INA, ContiTech, or SKF). Ensure the cooling system has
    been properly bled of air after any pump replacement.
  sources: []
- claim_key: golf7_cool_engine_recurring_cooling_sy
  title: Recurring cooling system airlock and antifreeze loss after electric water
    pump/replacement
  kind: known_issue
  domain: engine
  severity: medium
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: The text explicitly states that replacing either the electric water pump
    or auxiliary water pump (circulation pump) will result in antifreeze loss and
    air entering the cooling system. This is a known issue in VW Group vehicles, where
    improper bleeding of the cooling system after part replacement can lead to chronic
    overheating or cooling system inefficiency.
  inspection_advice: Verify that the cooling system has been properly bled of air
    after any pump replacement. Check for antifreeze leaks around the pump mounts
    and connections. Ensure the correct G13 antifreeze mix (50% G13 antifreeze + 50%
    distilled water) is used.
  sources: []
