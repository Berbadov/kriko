- claim_key: golf7_cool_engine_overheating_under_lo
  title: Overheating under load on 1.6 TDI engines (EA189)
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The user reports that their 2017 Volkswagen Golf 7.5 with a 1.6 TDI engine
    (likely EA189 family) exhibits **chronic overheating under load**, specifically
    when accelerating or driving aggressively. The temperature spikes to ~120-125°C,
    which is dangerously close to the boiling point of coolant and suggests a **design
    or cooling system flaw** rather than standard wear-and-tear. The issue is intermittent
    but tied to performance driving, indicating a potential **thermal management defect**
    in the engine cooling system or turbocharger-related overheating.
  inspection_advice: Check for **coolant leaks, radiator cap pressure, thermostat
    function, and turbocharger housing gasket integrity**. Verify the **coolant level
    and condition** (discoloration or debris may indicate internal corrosion or coolant
    degradation). Inspect the **intercooler and charge pipe** for proper routing and
    potential heat-soak issues. Test the **coolant temperature sensor** and **coolant
    pump** for proper operation. Look for **radiator or heater core blockages** and
    ensure the **cooling fan** operates correctly under load.
  sources:
