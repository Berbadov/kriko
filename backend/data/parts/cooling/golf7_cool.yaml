- claim_key: golf7_cool_emissions_unintended_dpf_regen
  title: Unintended DPF Regeneration Triggering at Low Mileage
  kind: known_issue
  domain: emissions
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The DPF (Diesel Particulate Filter) appears to trigger regeneration cycles
    unintentionally, even at low mileage (90,000 km). This can cause erratic engine
    behavior, such as high RPM and fuel consumption spikes, indicating a potential
    flaw in the DPF management system or sensor calibration.
  inspection_advice: Check for DPF-related error codes (e.g., P0420, P242A) via a
    diagnostic tool. Monitor fuel consumption and engine RPM during regeneration cycles.
    Look for soot buildup or physical damage to the DPF. Verify if the issue persists
    after a manual regeneration cycle.
