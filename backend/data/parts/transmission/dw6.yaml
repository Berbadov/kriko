  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.6
  rationale: The DW6 automatic gearbox uses two clutches to engage odd and even gears.
    If one clutch fails, the car will refuse to engage even gears (2nd, 4th, 6th)
    and may enter limp mode. This is a known, expensive repair, so buyers should test
    all gears during a test drive.
  rationale_tr: DW6 otomatik şanzıman, tek ve çift vitesleri kavramak için iki kavrama
    kullanır. Bir kavrama arızalanırsa, araç çift viteslere (2., 4., 6.) geçmeyi reddeder
    ve yokuş moduna girebilir. Bu, bilinen ve pahalı bir onarımdır, bu yüzden alıcılar
    test sürüşünde tüm vitesleri denemelidir.
  inspection_advice: During test drive, accelerate through all gears, especially check
    2nd, 4th, and 6th gear engagement. Look for jerking, hesitation, or warning lights.
    Ask for gearbox service history and check for any common DTCs like P284A or P284B
    related to clutch failure.
  inspection_advice_tr: Test sürüşü sırasında tüm vitesleri deneyin, özellikle 2.,
    4. ve 6. vites geçişlerini kontrol edin. Sarsıntı, tereddüt veya uyarı ışıklarına
    bakın. Şanzıman bakım geçmişini isteyin ve kavrama arızasıyla ilgili P284A veya
    P284B gibi yaygın DTC kodlarını kontrol edin.
