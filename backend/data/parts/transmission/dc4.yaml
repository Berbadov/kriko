- claim_key: dc4_transmission_tcu_(edc_beyni)_yazı
  title: TCU (EDC Beyni) Yazılım/Kalibrasyon Çökmesi ve Elektronik Hatalar
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: TCU (Transmission Control Unit) yazılım hataları veya kalibrasyon bozuklukları,
    vites kaybı, vites konumunu algılayamama ve hatta araç hareket etmemesi gibi ciddi
    sorunlara yol açar. Bu hatalar genellikle soğuk başlangıçta görünmez, ancak trafikte
    30-40 dakika süren dur-kalk işlemleri sırasında sıklıkla ortaya çıkar.
  inspection_advice: Araçta vites kaybı, vites kolunun D veya R konumuna alındığında
    N veya P gösteren hatalar, veya kontak açıldığında 'Vites Kutusunu Kontrol Ettirin'
    uyarılarının görüldüğünü kontrol et. Ayrıca, trafikte uzun süreli dur-kalk işlemleri
    sonrası vites geçişlerinde anormal davranışlar olup olmadığını test et.
  sources:
