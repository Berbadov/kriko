- id: dc4_transmission_dc4_getrag_transmission__v1
  claim_key: dc4_transmission_dc4_getrag_transmission_
  version: 1
  is_current: true
  title: dc4 Getrag transmission mechatronics wear causing gear change issues
  title_tr: dc4 Getrag şanzıman mekatronik aşınması vites değişim sorunlarına yol
    açıyor
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.6
  rationale: The Getrag automatic transmission in this car can develop worn mechatronics
    (the electronic control unit that shifts gears) and software glitches, especially
    in early examples. This can cause rough or delayed gear changes. Replacing the
    mechatronics is an expensive repair, so it's worth checking the transmission behavior.
  rationale_tr: Bu aracın Getrag otomatik şanzımanı, özellikle ilk üretim örneklerinde
    mekatronik ünitenin (vites değiştiren elektronik kontrol ünitesi) aşınması ve
    yazılım hataları geliştirebilir. Bu, sert veya gecikmeli vites değişimlerine neden
    olabilir. Mekatroniği değiştirmek pahalı bir onarım olduğundan, vites davranışını
    test etmek önemlidir.
  inspection_advice: Take a test drive and feel for jerky or hesitant gear changes,
    especially when cold. Check for transmission warning lights or codes (e.g., P0700,
    P17xx). Ask if the mechatronics has been replaced or updated under warranty. Note
    that a routine inspection won't easily detect internal mechatronics wear without
    a diagnostic scan.
  inspection_advice_tr: Test sürüşü yapın ve özellikle soğukken vites geçişlerinde
