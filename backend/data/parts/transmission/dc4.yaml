    gevşemesiyle bilinir ve bu, motorun tamamen arızalanmasına yol açabilir. Yağ tüketimi
    genellikle erken bir uyarı işaretidir. Bu, bu motor koduna özgü ciddi ve pahalı
    bir sorundur.
  inspection_advice: Listen for rattling noise from the timing chain area on cold
    start, check engine oil level and any history of oil consumption complaints. Look
    for fault codes like P0011 or P0016 (if available) and verify whether the timing
    chain has been replaced.
