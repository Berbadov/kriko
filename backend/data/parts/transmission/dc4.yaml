- claim_key: dc4_transmission_chronic_clutch-like_
  title: Chronic clutch-like slippage in DC4 automatic transmissions (1st→2nd gear)
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: Excessive slippage during gear engagement, particularly from 1st to 2nd
    gear, mimicking a manual clutch failure. This is not a standard progressive engagement
    behavior but rather a defect in the automatic transmission's clutch packs or hydraulic
    system.
  inspection_advice: Check for unusual hesitation or slippage when shifting from 1st
    to 2nd gear, especially during acceleration or uphill driving. Listen for grinding
    or unusual noises during gear changes. Test drive on inclines to confirm slippage
    behavior.
  sources: []
- claim_key: dc4_transmission_false_negatives_in_r
