- claim_key: dc4_transmission_chronic_output_beari
  title: Chronic output bearing failure in BMW N62 7-speed DCT transmissions
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: The 7-speed dual-clutch transmission (DCT) in the BMW Z4 35i (N62 engine)
    appears to suffer from premature output bearing failure, even at low mileage (~57k).
    The noise is localized to the rear of the transmission, suggesting internal wear
    or a design flaw in the sealed unit, which lacks serviceability or spare parts
    from independent garages.
  inspection_advice: Listen for a rotational metallic clicking noise from the rear
    of the transmission, especially when the car is elevated (e.g., on a ramp). Check
    for any signs of oil leaks (even historical) around the transmission mount, as
    internal lubrication failure may be the root cause. Verify if the transmission
    has been previously serviced or if there are any service records indicating unusual
    wear.
  sources: []
- claim_key: dc4_transmission_lack_of_independent_
  title: Lack of independent serviceability for BMW 7-speed DCT transmissions
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: The 7-speed DCT in the BMW Z4 35i is a sealed unit with no available
    spares or service options from independent transmission specialists, forcing owners
    to rely solely on BMW dealerships for repairs. This creates a chronic reliability
    issue due to limited access to diagnostics and repairs outside official channels.
  inspection_advice: Confirm whether the transmission has been serviced exclusively
    by BMW or an authorized dealer. Check if the car has any service history documenting
    transmission-related issues or repairs. Attempt to locate an independent mechanic
    experienced with DCT coding or transmission swaps, as these may not be straightforward.
  sources: []
- claim_key: dc4_transmission_mechatronic_unit_fai
  title: Mechatronic unit failures in DCT/DSG transmissions
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: The mechatronic control unit is critical for smooth gear shifts. Failures
    in this component can cause erratic shifting behavior, delayed responses, or complete
    loss of automatic shifting functionality.
  inspection_advice: Test for erratic shifting patterns, delayed gear engagement,
    or error codes related to the transmission control module. Check for warning lights
