- claim_key: dc4_transmission_tcu_(edc_beyni)_yazı
  title: TCU (Engine/Transmission Control Unit - EDC Software) Failure and Electronic
    Errors
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: Software errors or calibration faults in the TCU (Transmission Control
    Unit) can cause severe issues such as **loss of gear engagement**, **incorrect
    gear position detection**, and even **vehicle immobility**. These errors often
    remain hidden during cold starts but frequently manifest after **30-40 minutes
    of stop-and-go traffic conditions**, particularly during prolonged idling or gear
    shifts.
  inspection_advice: Check for **loss of gear engagement**, **gear position errors**
    (e.g., displaying **N or P** when shifting to **D or R**), or **‘Check Transmission
    System’ warnings** when the ignition is turned off. Additionally, test for **abnormal
    gear shift behavior** (e.g., hesitation, slipping, or failure to engage) **after
    prolonged stop-and-go traffic conditions**.
  sources:
  - source_url: https://parcaekseni.com/edc-beyni-arizasi-nasil-anlasilir/
    source_domain: parcaekseni.com
    site_or_channel: parcaekseni.com
    quote: '"Vites Kaybı: Araç sadece tekli viteslere (1-3-5) veya sadece çiftli viteslere
      (2-4-6) geçer. Diğer vitesleri tamamen atlar."'
    independent: true
- claim_key: dc4_transmission_edc_çift_kavrama_dis
  title: Wear and Slippage of the EDC Dual Clutch Plates (Clutch Discs)
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The EDC dual clutch plates wear out over time and begin to slip. This
    causes the vehicle to experience symptoms such as the engine revving up when the
    accelerator is pressed without the speed increasing, vibrations, hesitation (where
    the engine speed rises but the vehicle does not accelerate), and metallic clunking
    noises during gear shifts. These issues are particularly noticeable when climbing
    hills and when shifting from 1st to 2nd gear.
  inspection_advice: Check if the vehicle exhibits vibrations, hesitation (where the
    engine revs but the speed does not increase), metallic clunking noises during
    gear shifts, and instability during takeoff, especially when climbing hills or
    shifting from 1st to 2nd gear. Also, verify if there is any stiffness or abnormal
    delay during gear shifts.
  sources:
  - source_url: https://parcaekseni.com/edc-beyni-arizasi-nasil-anlasilir/
    source_domain: parcaekseni.com
    site_or_channel: parcaekseni.com
    quote: '"Titreme ve Silkeleme: Özellikle yokuş kalkışlarında veya 1. vitesten
      2. vitese geçerken araçta ciddi bir titreme hissedilir."'
    independent: true
- claim_key: dc4_transmission_edc_kavrama_adaptasy
  title: Failure of EDC Clutch Adaptation
  kind: known_issue
  domain: transmission
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: If the clutch or Transmission Control Unit (TCU) is replaced without
    performing the adaptation process, issues such as harsh gear shifts, clutch engagement
    errors, and unstable acceleration may occur. This indicates that the system requires
    recalibration.
  inspection_advice: Check for harshness during gear shifts, abnormal clutch engagement
    behavior, or unstable acceleration. Also, verify whether the adaptation process
    was performed and whether it was done correctly.
  sources:
  - source_url: https://parcaekseni.com/edc-beyni-arizasi-nasil-anlasilir/
    source_domain: parcaekseni.com
    site_or_channel: parcaekseni.com
    quote: '"Bu yüzden sadece parçayı değiştirmek değil, adaptasyonu doğru yapmak
      gerekiyor."'
    independent: true
- claim_key: dc4_transmission_edc_aktüatör_veya_vi
  title: Issues with the EDC Actuator or Gearshift Motor
  kind: known_issue
  domain: transmission
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: A failure in the EDC actuator or gearshift motor can cause delays, stiffness,
    or even a complete failure to engage during gear shifts. These issues may also
    affect other components such as the Transmission Control Unit (TCU) or clutch
