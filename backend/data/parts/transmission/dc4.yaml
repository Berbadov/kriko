- claim_key: dc4_electrical_pmdc_motor_friction_
  title: PMDC Motor Friction Brush Wear and Failure
  kind: known_issue
  domain: electrical
  severity: medium
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: Friction brushes in PMDC motors wear down over time, leading to poor
    electrical contact with the commutator, which can cause the motor to fail to start
    or operate inefficiently. Severe wear or damage necessitates replacement.
  inspection_advice: Check the brushes for wear beyond half their original length
    and inspect for cracks or chipping. Ensure they maintain proper contact with the
    commutator.
  sources: []
- claim_key: dc4_electrical_pmdc_motor_commutato
  title: PMDC Motor Commutator Damage and Contamination
  kind: known_issue
  domain: electrical
  severity: medium
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: The commutator in PMDC motors can become contaminated with dirt, dust,
    or carbon deposits, or suffer physical damage (e.g., grooves, cracks), leading
    to poor electrical contact with the brushes and causing motor failure or erratic
    operation.
  inspection_advice: Inspect the commutator for signs of contamination (dirt, carbon
    buildup) and physical damage (grooves, cracks). Clean it gently with fine sandpaper
    or replace it if severely damaged.
