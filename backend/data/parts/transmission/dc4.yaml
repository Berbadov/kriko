    defects)
  kind: known_issue
  domain: transmission
  severity: medium
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: The transmission exhibits chronic defects (slippage, erratic shifts)
    but no fault codes are detected by Renault Technical Experts, indicating a potential
    flaw in the diagnostic system or a non-capturable transmission issue.
  inspection_advice: If a Renault dealership reports no fault codes despite observed
    transmission issues, consider seeking a second opinion from an independent transmission
    specialist or mechanic. Look for persistent symptoms even when diagnostics show
    'no issues'.
  sources: []
- claim_key: dc4_transmission_chronic_dct_shift_de
  title: Chronic DCT shift delay/non-response in early i4 models
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: The Dual-Clutch Transmission (DCT) in early i4 models suffered from significant
    delays and non-response when shifting between gears (R, N, D), requiring multiple
    lever movements and taking an eternity to engage. This was a known flaw that required
    a software update to fix.
  inspection_advice: Check if the car has the latest software update installed. Test
    the DCT by shifting between gears (R, N, D) and observe if there are noticeable
    delays or multiple lever movements required. Early models may exhibit sluggish
    or non-responsive shifts.
  sources: []
- claim_key: dc4_transmission_initial_dct_software
