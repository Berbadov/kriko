- claim_key: dq381_transmission_dq200_(0am)_clutch_p
  title: DQ200 (0AM) clutch pump reliability issues inherited in DQ381 (0GC)
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The DQ381 transmission, a redesign of the reliable DQ500, incorporates
    a compact electric-mechatronic pump (similar to the DQ200's unreliable pump) to
    support start-stop functionality. This design choice risks propagating the chronic
    pump failures seen in the DQ200, which was the least reliable of VW's DSG units.
  inspection_advice: Check for signs of fluid leaks around the transmission pump area,
    unusual noises during start-stop operation, or error codes related to clutch/pump
    malfunctions. Verify if the vehicle has undergone start-stop system activation
    and inspect for overheating or fluid degradation in the transmission fluid.
  sources:
  - source_url: https://www.colvoss.com.au/blog/2023/10/29/volkswagen-audi-dq381-dual-clutch-transmission-diagnosis-and-repair
    source_domain: colvoss.com.au
    site_or_channel: colvoss.com.au
    quote: '"The pump is made up of a hydraulic gear system powered by an electric
      motor the design is very similar to the DQ200 mechatronic pump. Yes that is
      right the unreliable 0AM unit has left its mark."'
    independent: true
