  is_current: true
  title: Clutch debris contaminates mechatronics (DQ381)
  title_tr: Debri debri mekatroniği kirletiyor (DQ381)
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.6
  rationale: The DQ381 transmission uses a single oil circuit, so clutch wear debris
    can circulate into the mechatronics (control unit). This debris accelerates valve
    wear, leading to expensive repairs. Frequent oil changes are required to delay
    or prevent this damage.
  rationale_tr: DQ381 şanzıman tek bir yağ devresi kullanır, bu nedenle debriyaj aşınma
    parçacıkları mekatroniğe (kontrol ünitesi) karışabilir. Bu parçacıklar valf aşınmasını
    hızlandırır ve pahalı onarımlara yol açar. Bu hasarı geciktirmek veya önlemek
    için sık yağ değişimi gerekir.
  inspection_advice: Ask for proof of transmission oil changes at recommended intervals;
    test drive for jerky or delayed shifts; scan for mechatronics fault codes (e.g.,
    P17xx).
  inspection_advice_tr: Önerilen aralıklarla şanzıman yağı değişimi yapıldığına dair
    kanıt isteyin; sarsıntılı veya gecikmeli vites geçişleri için test sürüşü yapın;
    mekatronik hata kodlarını (örn. P17xx) tarayın.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://gearboxlist.com/volkswagen/dq381/
    source_domain: gearboxlist.com
    site_or_channel: gearboxlist.com
    quote: '"Since this transmission has a single oil circuit, clutch wear debris
      easily enters the mechatronics, leading to very rapid wear of its valves. Change
      the lubricant as often as possible, as repairs will be expensive."'
    independent: true
