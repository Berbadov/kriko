- id: dw5_fuel_system_edc7_c32_injector_short__v1
  claim_key: dw5_fuel_system_edc7_c32_injector_short_
  version: 1
  is_current: true
  title: EDC7 C32 injector short disables entire bank
  title_tr: EDC7 C32 enjektör kısa devresi tüm grubu devre dışı bırakıyor
  kind: known_issue
  domain: fuel system
  severity: high
  confidence: 0.6
  rationale: In this diesel injection system, a short circuit in one injector wire
    can cut power to all injectors on that cylinder block, so the engine suddenly
    runs on half its cylinders. This is a known design flaw, not something a routine
    inspection would find, and it can lead to expensive repairs.
  rationale_tr: Bu dizel enjeksiyon sisteminde, bir enjektör kablosundaki kısa devre,
    o silindir bloğundaki tüm enjektörlerin gücünü kesebilir ve motor aniden silindirlerin
    yarısıyla çalışır. Bu bilinen bir tasarım hatasıdır, rutin bir muayenede bulunmaz
    ve pahalı onarımlara yol açabilir.
  inspection_advice: Perform an OBD scan for injector circuit codes (e.g., P0261,
    P0262), check injector wiring harness for chafing or damage, and test-drive to
    feel for misfires under load.
  inspection_advice_tr: Enjektör devresi hataları için OBD taraması yapın (örn. P0261,
    P0262), enjektör kablo demetini sürtünme veya hasar açısından kontrol edin ve
    yük altında teklemeleri hissetmek için test sürüşü yapın.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://procarmanuals.com/man-edc7-fault-codes-81-to-3736/
    source_domain: procarmanuals.com
    site_or_channel: procarmanuals.com
    quote: Short circuit current circuit in one injector disables all injectors affected
      block, IE. stops all injection cylinders block 2.
    independent: true
