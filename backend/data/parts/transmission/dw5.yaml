  kind: known_issue
  domain: transmission
  severity: medium
  confidence: 0.6
  rationale: The DW5 transmission's plastic oil pan often develops seepage, letting
    oil escape slowly without leaving puddles. Over time this can drop oil level and
    risk gearbox damage. You may not see a leak on the ground, so it's easy to miss.
  rationale_tr: DW5 şanzımanın plastik yağ karterinde zamanla sızıntı oluşabilir;
    bu, yerde su birikintisi bırakmadan yavaşça yağ kaybına neden olur. Yağ seviyesi
    düşerek şanzıman hasarı riski oluşturabilir. Yerde sızıntı görünmediği için gözden
    kaçması kolaydır.
  inspection_advice: Check underneath for oil residue or weeping around the transmission
    oil pan. Look for signs of oil smell or low ATF level on the dipstick. If there
    is any seepage, budget for replacing the pan gasket or the pan.
