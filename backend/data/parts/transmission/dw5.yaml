    mechanism corrode and seize due to galvanic corrosion and water ingress. This
    can cause the handbrake to stick, leading to brake drag, uneven wear, and reduced
    braking performance. It is a well-known defect that can be expensive to repair
    and poses a safety risk.
  rationale_tr: Mégane II'de arka fren kaliperi el freni kolu ve iç mekanizması, galvanik
    korozyon ve su girişi nedeniyle korozyona uğrar ve sıkışır. Bu, el freninin yapışmasına,
    fren sürtünmesine, düzensiz aşınmaya ve fren performansının düşmesine neden olabilir.
    Pahalı onarım gerektirebilen ve güvenlik riski oluşturan bilinen bir arızadır.
  inspection_advice: At the viewing, apply and release the handbrake several times
    to check for smooth operation and full release. After a short test drive, carefully
    feel the rear wheels for excessive heat, which indicates brake drag. Have the
    rear calipers inspected, particularly the handbrake lever and cables, for corrosion
    or seizure.
  inspection_advice_tr: Araç incelerken el frenini birkaç kez çekip bırakarak düzgün
    çalıştığını ve tam serbest kaldığını kontrol edin. Kısa bir test sürüşünden sonra
    arka tekerlekleri elle yoklayarak aşırı ısınıp ısınmadığını kontrol edin; bu fren
    sürtünmesini gösterir. Arka kaliperleri, özellikle el freni kolunu ve kablolarını
    korozyon veya sıkışma açısından inceletin.
