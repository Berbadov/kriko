- id: dq200_transmission_mechatronic_pressure_tub_v1
  claim_key: dq200_transmission_mechatronic_pressure_tub
  version: 1
  is_current: true
  title: Mechatronic pressure tube fatigue causes DQ200 transmission failures
  title_tr: Mekatronik basınç tüpü yorgunluğu DQ200 şanzıman arızalarına neden olur
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.6
  rationale: The original mechatronic pressure tube in DQ200 transmissions develops
    microscopic cracks from repeated high-pressure cycles. Over time, these cracks
    prevent the tube from holding hydraulic pressure, causing fault codes P17BF and
    P189C. This is a chronic design weakness that OEM replacement parts only temporarily
    fix.
  rationale_tr: DQ200 şanzımanlardaki orijinal mekatronik basınç tüpü, tekrarlanan
    yüksek basınç döngülerinden dolayı mikroskobik çatlaklar geliştirir. Zamanla bu
    çatlaklar tüpün hidrolik basıncı tutmasını engeller ve P17BF ile P189C arıza kodlarına
    neden olur. Bu kronik bir tasarım zayıflığıdır ve OEM yedek parçalar sorunu yalnızca
    geçici olarak çözer.
  inspection_advice: Check for DTC codes P17BF and P189C using a diagnostic scanner.
    Listen for unusual transmission noises or delayed engagement during a test drive,
    as these may indicate early pressure tube failure. This issue is not visible during
    a standard visual inspection.
  inspection_advice_tr: Diyagnostik tarayıcı ile P17BF ve P189C arıza kodlarını kontrol
    edin. Test sürüşü sırasında olağandışı şanzıman seslerini veya gecikmiş vites
    geçişlerini dinleyin; bunlar erken basınç tüpü arızasını gösterebilir. Bu sorun
    standart görsel muayene sırasında görünmez.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://fdyotomotiv.com/blog/p17bf-ve-p189c-ariza-kodu-nedir-dq200-sanzimanlar-icin-anlam-ve-cozum-rehberi
    source_domain: fdyotomotiv.com
    site_or_channel: fdyotomotiv.com
    quote: '"DQ200 şanzımanlardaki orijinal basınç tüpü, çalışma prensibi gereği sürekli
      olarak 40-60 bar arasındaki yüksek basınca maruz kalır. Zamanla, bu sürekli
      basınç döngüsü metal yorgunluğuna neden olur. Tüpün yapısında oluşan mikroskobik
      çatlaklar, hidrolik sıvının basıncını tutamamasına yol açar."'
    independent: true
