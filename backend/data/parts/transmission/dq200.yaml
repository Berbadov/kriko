- claim_key: dq200_transmission_dq200_mechatronics_u
  title: DQ200 Mechatronics Unit Accumulator Housing Plate Cracks
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The aluminium housing plate of the DQ200 mechatronics unit is prone to
    micro-cracks due to high pressure (60-70 bar) from the accumulator, leading to
    jerky shifts, hydraulic pump/motor failure, solenoid failure, and eventual clutch
    damage. This is a chronic design flaw causing widespread failures in this transmission
    variant.
  inspection_advice: Check for DTCs **P17BF** and **P189C**, which indicate housing
    cracks. Inspect the mechatronics unit for signs of micro-cracks on the accumulator
    housing plate and listen for jerky or hard shifts during gear changes. Look for
    burnt or damaged clutch components if the issue has been neglected.
  sources:
  - source_url: https://www.team-bhp.com/news/understanding-vw-skoda-dsg-dq200-failures-detail
    source_domain: team-bhp.com
    site_or_channel: team-bhp.com
    quote: '**The fragile design of the mech unit sets it up for easy failure. Even
      in the mech unit, it is mainly the accumulator housing plate (its even called
      the valve body plate or accumulator body) that is causing the issue. The housing
      plate is made from aluminium and the walls of this housing (where the accumulator
      screws in) are quite slim and are unable to withstand the 60-70 bar pressure
      the accumulator generates. Over a period of time micro cracks occur and the
      accumulator fails to build enough pressure. This initially results in jerky
      or hard shifts. From there it just goes downhill.**


      **The dreaded - P17BF & P189C DTCs point to a clear case of crack in housing.
      The issue starts with micro cracks like this. But this whole area is now compromised,
      as time passes the crack only spreads.**


      **In the initial stages it is just the accumulator and housing which will need
      replacing but as the issue aggravates the hydraulic pump and motor will fail
      due to overheating. And even before they fail sometimes some of the solenoids
      might give up etc. Overtime a bad mechatronic will affect clutch life too as
      inconsistent hydraulic pressure doesn’t allow the smooth and accurate engagement
      of the clutch. In extreme cases even the gear cogs get affected.**


      **When you don''t address it on time - aluminium will break off like a biscuit.**'
    independent: true
- claim_key: dq200_transmission_dq200_tcu_heat_and_c
  title: DQ200 TCU Heat and Corrosion Failures
  kind: known_issue
  domain: transmission
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The Transmission Control Unit (TCU) in the DQ200 is prone to failure
    due to excessive heat and corrosion, leading to unpredictable gear shifts, delayed
    engagement, or premature shifting. This is a chronic issue tied to the TCU's design
    and environmental exposure.
  inspection_advice: Look for signs of TCU failure such as erratic gear shifts, delayed
    engagement, or failure to engage certain gears. Inspect TCU connectors for corrosion
    or damage, and check for overheating symptoms (e.g., burnt wiring harnesses).
  sources:
  - source_url: https://www.team-bhp.com/news/understanding-vw-skoda-dsg-dq200-failures-detail
    source_domain: team-bhp.com
    site_or_channel: team-bhp.com
    quote: '**There are two main causes for TCU issues – heat and corrosion. Excessive
      heat is the enemy for any circuit board. The TCU is no different. Overtime this
      results in malfunctions or complete failure. Unpredictable gearbox behaviour
      (failure to engage certain gears, delayed or premature shifting) is a clear
      sign of a bad TCU.**


      **The TCU connectors are another weak link, they corrode or fail due to overheat.**'
    independent: true
