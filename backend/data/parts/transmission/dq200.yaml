- id: dq200_transmission_chronic_hydraulic_pump_f_v1
  claim_key: dq200_transmission_chronic_hydraulic_pump_f
  version: 1
  is_current: true
  title: Chronic hydraulic pump failure in DQ200 DSG
  title_tr: DQ200 DSG'de kronik hidrolik pompa arızası
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.6
  rationale: The DQ200 is a 7-speed dual-clutch transmission used in many VW, Škoda,
    and SEAT cars. Its hydraulic pump is known to fail repeatedly, causing erratic
    shifting and transmission malfunction. Replacing this part is expensive and can
    happen again, so it is a key risk to check before buying.
  rationale_tr: DQ200, birçok VW, Škoda ve SEAT aracında kullanılan 7 ileri çift kavramalı
    şanzımandır. Hidrolik pompası tekrar tekrar arızalanabilir; bu da düzensiz vites
    geçişlerine ve şanzıman arızasına yol açar. Bu parçanın değişimi pahalıdır ve
    tekrarlayabilir, bu yüzden satın almadan önce kontrol edilmesi gereken önemli
    bir risktir.
  inspection_advice: During a test drive, feel for jerky or delayed shifts, especially
    from standstill. Ask for service records showing mechatronics or hydraulic pump
    replacement. Have an OBD scan done to check for transmission-related fault codes
    (e.g., pressure or pump errors). Confirm the car actually has the DQ200 gearbox,
    not DQ250 or DQ381.
  inspection_advice_tr: Test sürüşünde özellikle duruştan kalkışta sarsıntılı veya
    gecikmeli vites geçişlerini hissedin. Mekatronik veya hidrolik pompa değişimi
    gösteren servis kayıtlarını isteyin. Şanzımanla ilgili hata kodları (basınç veya
    pompa hataları gibi) için OBD taraması yaptırın. Aracın gerçekten DQ200 şanzımana
    sahip olduğunu doğrulayın, DQ250 veya DQ381 ile karıştırmayın.
