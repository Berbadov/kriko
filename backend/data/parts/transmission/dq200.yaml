  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: The aluminium housing plate of the DQ200 mechatronics unit is prone to
    micro-cracks due to high pressure (60-70 bar) from the accumulator, leading to
