- claim_key: dq200_transmission_valve_body_cracking_
  title: Valve body cracking in DQ200 0AM mechatronic unit
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The locating canister wall in the valve body is too thin, leading to
    splitting and high-pressure leaks. This causes loss of hydraulic pressure, rough
    gear changes, jerking motions, and potential loss of drivability.
  inspection_advice: Check for cracks in the valve body of the DQ200 0AM mechatronic
    unit, especially around the locating canister wall. Look for signs of rough gear
    changes, jerks, or dashboard fault warnings related to pressure issues.
  sources:
  - source_url: https://www.asrgearboxrepairs.co.uk/dsg-7-speed-gearbox-problems/
    source_domain: asrgearboxrepairs.co.uk
    site_or_channel: asrgearboxrepairs.co.uk
    quote: '"The valve body on the DQ200 0AM mechatronic unit has a design flaw where
      the thickness of the locating canister wall is too thin. This can cause it to
      split, leading to a loss of high pressure and issues with the clutch and gear
      operating system. When the damage reaches a severe stage, the vehicle may not
      drive, or it may exhibit very rough gear changes, jerking motions, and fault
      warnings on the dashboard."'
    independent: true
- claim_key: dq200_transmission_high-pressure_pump_a
  title: High-pressure pump and IC motor failure due to pressure leaks
  kind: known_issue
  domain: transmission
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: Pressure leaks in the mechatronic unit cause the high-pressure pump to
    overwork, leading to burnout. This is often misdiagnosed as the primary issue
    rather than a secondary symptom of deeper hydraulic failures.
  inspection_advice: Listen for unusual noises from the mechatronic unit, check for
    hydraulic leaks, and monitor for rough gear shifts or warning lights. Ensure the
    high-pressure pump and IC motor are functioning correctly during diagnostics.
