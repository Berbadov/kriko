  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: The Transmission Control Unit (TCU) activates a pump protection protocol
    (anti-play protection) when the accumulator struggles to build pressure due to
    housing cracks, leading to limp mode where the car becomes stuck and unable to
    change gears. Owners often continue driving in this state, exacerbating the issue
    and causing further damage to the mechatronics unit.
  inspection_advice: Test for limp mode (car unable to shift gears) and check for
    DTCs related to transmission control or pump protection. Look for repeated occurrences
    of the car getting stuck after restarting, which indicates ongoing mechatronics
    unit failure.
