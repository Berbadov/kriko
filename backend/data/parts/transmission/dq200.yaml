- id: dq200_transmission_early_dq200_synthetic_oi_v1
  claim_key: dq200_transmission_early_dq200_synthetic_oi
  version: 1
  is_current: true
  title: Early DQ200 synthetic oil causes corrosion and shorts
  title_tr: İlk DQ200 sentetik yağı korozyon ve kısa devre yapar
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.6
  rationale: Early DQ200 transmissions were filled with synthetic oil that corroded
    the gearbox lead frame, causing electrical shorts. This is a known defect specific
    to DQ200, later fixed by switching to mineral oil. Buyers should check if the
    gearbox oil was updated to the mineral type.
  rationale_tr: İlk DQ200 şanzımanlar, şanzıman lider çerçevesini aşındıran ve elektrik
    kısa devrelerine neden olan sentetik yağ ile doldurulmuştu. Bu, DQ200'e özgü bilinen
    bir kusurdur ve daha sonra mineral yağa geçilerek giderilmiştir. Alıcılar, şanzıman
    yağının mineral tipe güncellenip güncellenmediğini kontrol etmelidir.
  inspection_advice: Check DQ200 gearbox for fault codes related to lead frame or
    electrical faults (e.g., P189C, P0562). Ask for service history proving the oil
    was changed to mineral-based non-corrosive oil. If early model without update,
    high risk of transmission failure.
  inspection_advice_tr: DQ200 şanzımanda lider çerçeve veya elektrik arızalarıyla
    ilgili hata kodlarını kontrol edin (örn. P189C, P0562). Yağın mineral bazlı aşındırıcı
    olmayan yağa değiştirildiğini gösteren servis geçmişini isteyin. Erken model ve
    güncelleme yapılmadıysa, yüksek şanzıman arızası riski vardır.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://www.asrgearboxrepairs.co.uk/common-problems-with-the-dsg-7-speed-dsg-transmission/
    source_domain: asrgearboxrepairs.co.uk
    site_or_channel: asrgearboxrepairs.co.uk
    quote: Early models of the DQ200 were filled with synthetic oil, which caused
      corrosion and electrical shorts in the gearbox lead frame.
    independent: true
- id: dq200_transmission_improper_k1_k2_clutch_ad_v1
