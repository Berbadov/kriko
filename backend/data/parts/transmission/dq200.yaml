    source_domain: asrgearboxrepairs.co.uk
    site_or_channel: asrgearboxrepairs.co.uk
    quote: '"The IC motor and high-pressure pump are common components for failing
      on the DCT DSG mechatronic unit. Pressure leaks can cause the high-pressure
      pump to overwork and burn out. However, the failure of these two components
