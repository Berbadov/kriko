- claim_key: dq200_transmission_mekatronik_basınç_tü
  title: Mekatronic Pressure Tube Metal Fatigue and Fracturing
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The original mekatronic pressure tube used in DQ200 transmissions develops
    microscopic cracks due to metal fatigue when subjected to continuous 40-60 bar
    pressure cycles. These cracks cause the tube to fail in retaining hydraulic fluid
    pressure, resulting in the fault codes **P17BF (hydraulic pump protection)** and
    **P189C (low pressure condition)**. This is a chronic design flaw, and replacing
    standard OEM parts only provides a temporary solution.
  inspection_advice: Inspect the mekatronic unit of the transmission by physically
    opening it and examining the pressure tube for cracks, perforations, or wear signs
    using a light source and magnifying tool. Additionally, if **P17BF** and **P189C**
    fault codes recur frequently or reappear after tube replacement, pay close attention
    to the inherent weakness in the tube’s metal structure. Review service records
    and failure history to identify chronically problematic models where this tube
    is prone to recurring issues.
  sources:
  - source_url: https://fdyotomotiv.com/blog/p17bf-ve-p189c-ariza-kodu-nedir-dq200-sanzimanlar-icin-anlam-ve-cozum-rehberi
    source_domain: fdyotomotiv.com
    site_or_channel: fdyotomotiv.com
    quote: '"DQ200 şanzımanlardaki orijinal basınç tüpü, çalışma prensibi gereği sürekli
      olarak 40-60 bar arasındaki yüksek basınca maruz kalır. Zamanla, bu sürekli
      basınç döngüsü metal yorgunluğuna neden olur. Tüpün yapısında oluşan mikroskobik
      çatlaklar, hidrolik sıvının basıncını tutamamasına yol açar."'
    independent: true
