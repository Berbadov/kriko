  title: Improper K1/K2 clutch adjustment causes recurring DQ200 shuddering
  title_tr: DQ200 K1/K2 debriyaj ayarı hatası tekrarlayan titremeye neden olur
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.6
  rationale: The DQ200 uses a dry clutch that requires extremely precise clearance
    settings. If a mechanic sets these clearances even slightly wrong, the clutch
    will start shuddering again, even with brand-new parts. This means any DQ200 can
    suffer from recurring shuddering unless the adjustment procedure is done perfectly.
  rationale_tr: DQ200, çok hassas boşluk ayarı gerektiren kuru bir debriyaj kullanır.
    Mekanik bu boşlukları azıcık yanlış ayarlarsa, yeni parçalarla bile debriyaj tekrar
    titremeye başlar. Bu, ayar prosedürü kusursuz yapılmadıkça her DQ200'ün tekrarlayan
    titreme yaşayabileceği anlamına gelir.
  inspection_advice: On a test drive, check for shuddering during low-speed takeoff
    and gear changes. Ask for maintenance records showing clutch replacement and whether
    the K1/K2 clearances were set with the required special tool. Scan for fault codes
    related to clutch position or torque (e.g., P177B, P177C).
  inspection_advice_tr: Test sürüşünde düşük hızda kalkış ve vites geçişlerinde titreme
    olup olmadığını kontrol edin. Bakım kayıtlarında debriyaj değişimi ve K1/K2 boşluklarının
    özel aletle ayarlanıp ayarlanmadığını sorun. Debriyaj konumu veya torkuyla ilgili
    hata kodlarını tarayın (örn. P177B, P177C).
  status: review
  promoted_by: ledger
  sources:
