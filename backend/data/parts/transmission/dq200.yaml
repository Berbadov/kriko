- id: dq200_transmission_dq200_clutch_pack_and_fl_v1
  claim_key: dq200_transmission_dq200_clutch_pack_and_fl
  version: 1
  is_current: true
  title: DQ200 clutch pack and flywheel premature wear
  title_tr: DQ200 kuru debriyaj ve volan erken aşınması
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.6
  rationale: City driving, towing, and frequent stop-start conditions can cause premature
    wear of the DQ200's clutch packs and dual-mass flywheel. This leads to jerky gear
    shifts, slipping, or failure to engage gears. Replacement is expensive and not
    covered by routine inspection.
  rationale_tr: Şehir içi sürüş, çekme ve sık dur-kalk koşulları DQ200'ün debriyaj
    setlerinde ve çift kütleli volanında erken aşınmaya neden olabilir. Bu, sarsıntılı
    vites geçişlerine, kaymaya veya vitese geçememeye yol açar. Değişim pahalıdır
    ve rutin muayene kapsamında değildir.
  inspection_advice: During test drive, accelerate and decelerate in stop-and-go traffic
    to feel for jerky shifts or clutch slip. Listen for rattling from the gearbox
    area. Ask for service records showing clutch or flywheel replacement. A diagnostic
    scan may show clutch-related fault codes.
  inspection_advice_tr: Test sürüşünde dur-kalk trafikte hızlanıp yavaşlayarak sarsıntılı
    geçiş veya debriyaj kayması hissedin. Şanzıman bölgesinden gelen tıkırtıyı dinleyin.
    Debriyaj veya volan değişimini gösteren servis kayıtlarını isteyin. Teşhis taraması
    debriyajla ilgili hata kodları gösterebilir.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://www.asrgearboxrepairs.co.uk/common-problems-with-the-dsg-7-speed-dsg-transmission/
    source_domain: asrgearboxrepairs.co.uk
    site_or_channel: asrgearboxrepairs.co.uk
