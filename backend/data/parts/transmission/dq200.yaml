- claim_key: dq200_transmission_premature_clutch_pac
  title: Premature clutch pack wear in urban driving
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The dry clutch packs in the DQ200 wear out prematurely, particularly
    in vehicles used frequently in urban traffic with frequent low-speed, high-slip
    engagement. This leads to costly clutch replacements between **100,000 and 200,000
    km**, far sooner than expected for a transmission.
  inspection_advice: Check for delayed engagement, slipping clutches, or unusual noises
    during gear shifts. Look for OBD codes **P17BF** (Clutch 1 slip) or **P17C0**
    (Clutch 2 slip). Inspect the transmission for excessive wear or damage to clutch
    discs if the vehicle has high urban mileage.
  sources:
  - source_url: https://aboutthecars.com/vw/transmission-volkswagen-dsg7-dq200/
    source_domain: aboutthecars.com
    site_or_channel: aboutthecars.com
    quote: '"Clutch pack wear: Premature wear of dry clutch discs, especially in vehicles
      used frequently in urban traffic. Clutch replacement is typically needed between
      100,000 and 200,000 km depending on use."'
    independent: true
- claim_key: dq200_transmission_mechatronics_unit_fa
  title: Mechatronics unit failure due to oil contamination/solenoid wear
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The integrated electrohydraulic control unit (mechatronics) in the DQ200
    is prone to failure due to oil contamination, solenoid wear, or electronic faults.
    This can cause the transmission to enter limp mode or refuse to engage gears,
    requiring costly mechatronics replacement.
  inspection_advice: Listen for unusual noises from the mechatronics unit, check for
    oil leaks around the hydraulic circuit, and monitor for limp mode activation.
    Look for OBD codes like **P17BE** (Gear engagement fault) or **U010000** (Lost
    communication with TCM). Verify if the transmission fluid has been changed regularly
    (despite VW's lifetime fill claim).
  sources:
  - source_url: https://aboutthecars.com/vw/transmission-volkswagen-dsg7-dq200/
    source_domain: aboutthecars.com
    site_or_channel: aboutthecars.com
    quote: '"Mechatronics unit failure: The integrated electrohydraulic control unit
