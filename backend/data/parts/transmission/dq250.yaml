- id: dq250_transmission_dq250_dsg_solenoid_valve_v1
  claim_key: dq250_transmission_dq250_dsg_solenoid_valve
  version: 1
  is_current: true
  title: DQ250 DSG solenoid valves clogged by wear debris
  title_tr: DQ250 DSG solenoid valfleri aşınma artıklarıyla tıkanır
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.6
  rationale: Inside the gearbox, tiny metal shavings from clutch or gear wear can
    clog the solenoid valves in the mechatronic unit. This impairs hydraulic control
    and can force premature replacement of the solenoid valves or the entire mechatronic
    unit, a costly repair.
  rationale_tr: Şanzıman içinde debriyaj veya dişli aşınmasından kopan küçük metal
    parçacıkları mekatronik ünitedeki solenoid valfleri tıkayabilir. Bu, hidrolik
    kontrolü bozar ve solenoid valflerin veya tüm mekatronik ünitenin erken değiştirilmesini
    gerektirebilir; bu da pahalı bir onarımdır.
  inspection_advice: Ask for transmission service history; if fluid is dark or has
    metallic particles, it indicates wear. A test drive may reveal shift hesitation
    or jerking. Diagnostic scan may show solenoid valve fault codes.
  inspection_advice_tr: Şanzıman bakım geçmişini sorun; yağ koyu veya metal parçacıklar
    içeriyorsa aşınma belirtisidir. Test sürüşü vites geçişlerinde duraksama veya
    sarsıntı gösterebilir. Diagnostik taramada solenoid valf hata kodları görülebilir.
  status: review
