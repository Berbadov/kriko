- claim_key: dq250_transmission_chronic_hesitation_a
  title: Chronic hesitation across all DSG generations (DQ250, DQ381, DQ500)
  kind: known_issue
  domain: transmission
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: Even after refinements, all DSG transmissions (DQ250, DQ381, and DQ500)
    exhibit hesitation in traffic, often due to calibration drift, weak hydraulic
    pumps, worn clutches, or failing mechatronic solenoids. This issue persists across
    multiple generations and models, including the Golf.
  inspection_advice: Test the transmission by accelerating from a stop in traffic
    and observing for hesitation or delays. Check for warning lights related to transmission
    control modules or clutch wear. Listen for unusual noises during gear shifts.
  sources:
  - source_url: https://www.brisbanetuning.com.au/golf-dsg-transmission
    source_domain: brisbanetuning.com.au
    site_or_channel: brisbanetuning.com.au
    quote: '"This hesitation is not random, nor is it unique to a handful of unlucky
      cars. It is one of the most common real-world symptoms across Volkswagen’s DSG
      family... Other times it signals deeper mechanical trouble — a weak hydraulic
      pump, worn clutches, or failing mechatronic solenoids."'
    independent: true
