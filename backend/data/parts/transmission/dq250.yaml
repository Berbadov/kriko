- claim_key: dq250_transmission_neglected_dsg_fluid_
  title: Neglected DSG fluid degradation causing judder/hesitation
  kind: maintenance
  domain: transmission
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The DQ250 transmission relies on fluid that degrades over time, leading
    to judder, hesitation, and rough shifts if not serviced. VW claims it's a 'lifetime
    fill,' but this is not true—fluid must be changed every 40,000–60,000 km to prevent
    failure.
  inspection_advice: Check for signs of fluid neglect (burnt smell, dark/burnt fluid)
    and confirm if the last DSG fluid service was performed within the recommended
    interval (every 40,000–60,000 km).
