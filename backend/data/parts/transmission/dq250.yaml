    gerekir. Standart bir ekspertiz, servis geçmişinde yağ değişimi görünmediği sürece
    bunu ortaya çıkarmaz.
  inspection_advice: Check the service history for DSG fluid changes every 40,000–60,000
    km. If missing, budget €150–300 for a fluid service and test drive for juddering
