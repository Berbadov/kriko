- claim_key: clio5_body_electrical_bagaj_açma_sinyal_mo
  title: Trunk Release Signal Module Malfunctions
  kind: known_issue
  domain: electrical
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: In Renault Clio V (2019–2024) models, the trunk release signal module
    frequently exhibits issues such as deformation or rupture of the internal spring-loaded
    button rubber diaphragm, unresponsive buttons, or lack of tactile feedback. Malfunction
    of this module prevents the transmission of the trunk release command.
  inspection_advice: Check for tactile feedback or response when pressing the button.
