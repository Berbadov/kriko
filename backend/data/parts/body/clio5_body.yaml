- claim_key: clio5_body_engine_soğutma_devresi_(coo
  title: Risk of incorrect refill after cooling system drainage
  kind: known_issue
  domain: engine
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: After draining the cooling system, using the wrong coolant (plain water)
    can cause the engine to overheat or suffer damage. This is not a chronic issue
    to watch for in the Renault Clio 5, but it is a risk that can arise from incorrect
    procedures. Using unauthorized or non-OEM-approved products may also lead to problems.
  inspection_advice: If the cooling system has been drained, verify that the service
    technician refilled it with the correct proportion and approved coolant. Check
    the coolant level and condition.
  sources:
  - source_url: https://www.user-manual.renault.com/tr/b%C3%B6l%C3%BCm-5-pratik-tavsiyeler/calisma-arizalari
    source_domain: user-manual.renault.com
    site_or_channel: user-manual.renault.com
    quote: '"Belirgin miktarda soğutma sıvısı eksikliği halinde, motor çok sıcakken
      kesinlikle soğuk soğutma sıvısıyla dolum yapmamanız gerektiğini unutmayınız.
      Aracın soğutma devresinin kısmen dahi olsa, boşaltılmasını gerektiren bir müdahaleden
      sonra devre, miktarı iyi ayarlanmış yeni bir karışımla doldurulmalıdır. Hatırlatma:
      sadece Teknik Departmanımız tarafından onaylanan ürünler bu amaçla kullanılabilir."'
    independent: true
