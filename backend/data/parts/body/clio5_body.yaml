- claim_key: clio5_body_engine_chronic_crankshaft_p
  title: Sensor failures cause slow starts, weak throttle (1.3 TCe)
  kind: known_issue
  domain: engine
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: This issue describes a persistent problem where the Renault Clio 5 (1.3
    TCe) engine struggles with slow starts and weak acceleration, directly caused
    by failures in the crankshaft position sensor (krank sensörü) or camshaft position
    sensor (eksantrik mili sensörü). These sensors are essential for accurate engine
    timing and fuel injection control. When they fail, the engine may experience misfires,
    rough idling, and delayed ignition—particularly after multiple prior repairs,
    such as replacements of the fuel pressure regulator, injectors, spark plugs, or
    battery
  inspection_advice: Verify the presence of diagnostic trouble codes (DTCs) related
    to crankshaft (P0335) or camshaft (P0340) position sensors. Inspect the wiring
    harnesses for corrosion, fraying, or physical damage. Use a diagnostic tool to
    confirm sensor signal integrity. Listen for abnormal engine noises, such as rattling
    or ticking during startup, which may indicate sensor-related misfires
  sources:
  - source_url: https://yoldakiusta.com/motor-arizalari/renault-clio-5-enjeksiyonu-kontrol-ettirin-arizasi-286.html
    source_domain: yoldakiusta.com
    site_or_channel: yoldakiusta.com
    quote: '"Krank sensörü veya eksantrik mili sensörleri düzgün çalışıyor mu? (Bozulursa
      düzensiz yanmaya ve marşta gecikmeye neden olabilir.)"'
    independent: true
- claim_key: clio5_body_emissions_chronic_catalytic_co
  title: Chronic catalytic converter clogging causing loss of power and poor throttle
    response
  kind: known_issue
  domain: emissions
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The text describes a scenario where the Renault Clio 5 exhibits a loss
    of power and poor throttle response, which is attributed to potential catalytic
    converter clogging. This is a known chronic issue in turbocharged engines where
    exhaust backpressure builds up, restricting exhaust flow and reducing engine performance.
    The mention of 'katalitik konvertör tıkalı olabilir' (catalytic converter may
    be clogged) supports this defect.
  inspection_advice: Check for excessive backpressure in the exhaust system using
    a manifold vacuum gauge or exhaust flow tester. Inspect the catalytic converter
    for physical damage or excessive heat buildup. Listen for unusual exhaust noises
    (e.g., rattling or hissing) that may indicate a clogged converter.
  sources:
