- claim_key: clio5_body_general_chronic_water_ingres
  title: Chronic water ingress via bulkhead drain hole
  kind: known_issue
  domain: general
  severity: medium
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: The Renault Clio Mk2 has a persistent design flaw where a hidden drain
    hole in the bulkhead/scuttle area fails to properly channel rainwater away, leading
    to water pooling inside the cabin during heavy rain. This can cause long-term
    issues like electrical faults, rust, and discomfort for occupants.
  inspection_advice: Check the scuttle area (behind the windshield) for water pooling
    or dampness after a rain shower. Look for signs of rust or corrosion near the
    drain hole, and ensure the wiper mechanism and heater blower area are dry. Lift
    the wiper arms and inspect the area beneath them for water accumulation.
  sources: []
