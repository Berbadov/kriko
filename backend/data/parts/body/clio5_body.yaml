- claim_key: clio5_body_engine_chronic_crankshaft_p
  title: Chronic crankshaft position sensor (krank sensörü) or camshaft position sensor
    (eksantrik mili sensörü) failure causing delayed starts and poor throttle response
  kind: known_issue
  domain: engine
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The text describes a chronic issue where the Renault Clio 5 (1.3 TCe)
    exhibits delayed starts and poor throttle response, which is linked to sensor
    failures (krank sensörü/eksantrik mili sensörleri). These sensors are critical
    for proper engine timing and fuel delivery, and their failure can cause misfires,
    rough idling, and delayed ignition—especially after multiple repairs (e.g., fuel
    pressure regulator, injectors, spark plugs, and battery replacement).
  inspection_advice: Check for error codes related to crankshaft or camshaft position
    sensors (e.g., P0335, P0340). Inspect wiring harnesses for corrosion or damage,
    and verify sensor signal integrity with a diagnostic tool. Listen for unusual
    engine noises (e.g., rattling or ticking) during startup, which may indicate sensor-related
    misfires.
