- claim_key: golf7_body_engine_premature_timing_cha
  title: Premature timing chain failure (petrol engines)
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: Timing chains on certain petrol engines in the Volkswagen Golf Mk7 have
    been reported to snap prematurely, leading to severe engine damage if not addressed
    promptly. This is a critical failure mode that can occur outside of standard maintenance
    intervals.
  inspection_advice: Verify the full service history to ensure timing chain inspection/replacement
    was performed at recommended intervals. Listen for unusual noises (e.g., rattling
    or clanking) from the timing chain area during an engine check.
  sources:
