- id: golf7_body_engine_premature_timing_chain_f_v1
  claim_key: golf7_body_engine_premature_timing_chain_f
  version: 1
  is_current: true
  title: Premature timing chain failure in golf7_body petrol engine
  title_tr: golf7_body benzinli motorda erken triger zinciri kopması
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  rationale: The timing chain in certain Golf Mk7 petrol engines can snap earlier
    than expected, causing severe engine damage. Regular servicing may reduce the
    risk, but it is a costly repair that can occur without warning. This is a specific
    engine issue that a standard inspection cannot easily predict.
  rationale_tr: Bazı Golf Mk7 benzinli motorlarında triger zinciri beklenenden erken
    kopabilir ve ciddi motor hasarına yol açabilir. Düzenli bakım riski azaltabilir,
    ancak uyarı olmadan gerçekleşebilecek pahalı bir onarımdır. Bu, standart bir ekspertizin
    kolayca öngöremeyeceği motora özgü bir sorundur.
  inspection_advice: Check the service history, especially for regular oil changes.
    Listen for a rattling noise from the engine on cold start, which may indicate
    chain stretch. Request a diagnostic scan for timing-related fault codes such as
    P0011 or P0016.
  inspection_advice_tr: Bakım geçmişini kontrol edin, özellikle düzenli yağ değişimlerine
    bakın. Soğuk çalıştırmada motordan gelen tıkırtı sesini dinleyin, bu zincir gevşemesine
    işaret edebilir. P0011 veya P0016 gibi zamanlama ile ilgili hata kodları için
    diagnostik tarama isteyin.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://www.whatcar.com/volkswagen/golf/hatchback/used-review/n776/reliability
    source_domain: whatcar.com
    site_or_channel: whatcar.com
    quote: '"Timing chains fitted to petrol engines have been known to snap prematurely;
      this can cause significant engine damage but can be mitigated by having the
      car serviced on time."'
    independent: true
