- claim_key: golf7_body_engine_timing_chain_tension
  title: Timing Chain Tensioner Failures (EA888 Gen 3)
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.9
  status: review
  promoted_by: pending_human
  rationale: The 1.8L and 2.0L TSI engines (EA888 Gen 3) in the Mk7 Golf (2013-2016)
    suffer from chronic timing chain tensioner failures, causing rattling noises on
    cold start-up and potential timing-related faults. This was addressed in a VW
    Technical Service Bulletin, but many early models remain unserviced.
  inspection_advice: Check for evidence of a timing chain tensioner replacement or
    service under a VW Technical Service Bulletin. Listen for rattling noises during
    cold starts, especially in 2013-2016 models with EA888 engines.
  sources:
  - source_url: https://vwownersclub.co.uk/vw-golf-mk7-common-problems-the-issues-owners-actually-report/
    source_domain: vwownersclub.co.uk
    site_or_channel: vwownersclub.co.uk
    quote: '"The 1.8 and 2.0 TSI engines (EA888 Gen 3) can suffer from timing chain
      tensioner problems, particularly on earlier production models from 2013-2016.
      Symptoms include a rattling noise on cold start-up that disappears after a few
      seconds, or in severe cases, a check engine light with timing-related fault
      codes."'
    independent: true
  - source_url: https://smartcarcheck.co.uk/guides/volkswagen/golf-mk7
    source_domain: smartcarcheck.co.uk
    site_or_channel: smartcarcheck.co.uk
    quote: '"The 1.8 and 2.0 TSI engines (EA888 Gen 3) can suffer from timing chain
      tensioner problems, particularly on earlier production models from 2013-2016.
      Symptoms include a rattling noise on cold start-up that disappears after a few
      seconds, or in severe cases, a check engine light with timing-related fault
      codes."'
    independent: true
- claim_key: golf7_body_engine_plastic_water_pump_h
  title: Plastic Water Pump Housing Cracking (TSI Engines)
  kind: known_issue
  domain: engine
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The plastic water pump housing in TSI engines is prone to cracking and
    leaking internally between 60,000 and 100,000 miles, leading to coolant loss,
    temperature fluctuations, and potential overheating.
  inspection_advice: Inspect the water pump housing for cracks or coolant leaks. Check
    for sweet smells in the engine bay or temperature gauge fluctuations, especially
    in TSI models with high mileage.
  sources:
  - source_url: https://vwownersclub.co.uk/vw-golf-mk7-common-problems-the-issues-owners-actually-report/
    source_domain: vwownersclub.co.uk
    site_or_channel: vwownersclub.co.uk
    quote: '"The plastic water pump housing on TSI engines has a reputation for cracking
      and leaking, typically between 60,000 and 100,000 miles. You might notice coolant
      loss without visible leaks (it often seeps internally), a sweet smell from the
      engine bay, or temperature gauge fluctuations."'
    independent: true
- claim_key: golf7_body_engine_carbon_build-up_on_d
  title: Carbon Build-Up on Direct Injection Engines (TSI)
  kind: known_issue
  domain: engine
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: All TSI engines in the Mk7 Golf suffer from carbon deposits on intake
    valves due to direct injection, causing rough idling, reduced power, and poor
    fuel economy—typically noticeable between 60,000 and 80,000 miles.
  inspection_advice: Check for rough idling, loss of power, or poor fuel economy.
    Confirm if the car has undergone walnut blasting or carbon cleaning. Ask about
    maintenance history for fuel additives or high-RPM driving.
  sources:
  - source_url: https://vwownersclub.co.uk/vw-golf-mk7-common-problems-the-issues-owners-actually-report/
    source_domain: vwownersclub.co.uk
    site_or_channel: vwownersclub.co.uk
    quote: '"All Mk7 TSI engines use direct injection, which means fuel doesn’t wash
      over the intake valves. Over time, carbon deposits build up, causing rough idling,
      reduced power, and poor fuel economy. This typically becomes noticeable around
      60,000-80,000 miles."'
    independent: true
