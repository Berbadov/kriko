  version: 1
  is_current: true
  title: DPF blockage on TDI Golf Mk7 (golf7_body)
  title_tr: TDI Golf Mk7'de DPF tıkanması (golf7_body)
  kind: known_issue
  domain: fuel system
  severity: high
  confidence: 0.6
  rationale: TDI diesel Golf Mk7 cars used mainly for short urban trips are prone
    to Diesel Particulate Filter (DPF) blockages because the filter cannot burn off
    soot properly. This leads to reduced performance and costly replacement. A DPF
    diagnostic before purchase is recommended.
  rationale_tr: Kısa şehir içi yolculuklarda kullanılan TDI dizel Golf Mk7 araçlarda,
    filtre kurumunu düzgün yakamadığı için Dizel Partikül Filtresi (DPF) tıkanması
    sık görülür. Bu durum performans düşüşüne ve pahalı değişime yol açar. Satın almadan
    önce DPF teşhisi önerilir.
  inspection_advice: Check MOT history for DPF advisories and request an independent
    DPF diagnostic (e.g., pressure test or regeneration check). Look for warning lights
    and take a long motorway drive to see if the car performs well and regenerates
    properly.
  inspection_advice_tr: MOT geçmişinde DPF tavsiyelerini kontrol edin ve bağımsız
    bir DPF teşhisi (örn. basınç testi veya rejenerasyon kontrolü) isteyin. Uyarı
    ışıklarını izleyin ve aracın iyi performans gösterip gösterdiğini ve düzgün rejenere
    olup olmadığını görmek için uzun bir otoyol sürüşü yapın.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://smartcarcheck.co.uk/guides/volkswagen/golf-mk7
    source_domain: smartcarcheck.co.uk
    site_or_channel: smartcarcheck.co.uk
    quote: '"DPF condition (TDI): check MOT history for DPF advisories. A diesel used
      for short urban trips will have a blocked DPF. Request an independent DPF diagnostic
      before committing."'
    independent: true
