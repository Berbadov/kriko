- id: golf7_body_engine_golf7_body_gti_high_oil__v1
  claim_key: golf7_body_engine_golf7_body_gti_high_oil_
  version: 1
  is_current: true
  title: golf7_body GTI high oil consumption
  title_tr: golf7_body GTI yüksek yağ tüketimi
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  rationale: The Golf Mk7 GTI is known for consuming engine oil at a high rate, especially
    under hard driving. If you don't check and top up the oil regularly, the engine
    can suffer serious damage, including to the timing chain. This is a chronic issue
    specific to the performance-tuned GTI engine.
  rationale_tr: Golf Mk7 GTI, özellikle sert sürüşte yüksek oranda motor yağı tüketmesiyle
    bilinir. Yağı düzenli olarak kontrol edip tamamlamazsanız, motor ciddi hasar görebilir,
    buna zamanlama zinciri de dahildir. Bu, performans odaklı GTI motoruna özgü kronik
    bir sorundur.
  inspection_advice: At the viewing, check the oil level with a cold engine and look
    for evidence of frequent top-ups (e.g., oil bottles in the boot, service receipts).
    Ask the owner if they've had to add oil between services. A one-off inspection
    cannot predict the rate of consumption, but low oil or a history of top-ups is
    a red flag.
  inspection_advice_tr: Araç görüşmesinde, soğuk motorda yağ seviyesini kontrol edin
    ve sık yağ ekleme belirtileri arayın (örn. bagajda yağ şişeleri, servis fişleri).
    Sahibine servis aralarında yağ eklemek zorunda kalıp kalmadığını sorun. Tek seferlik
    bir inceleme tüketim hızını öngöremez, ancak düşük yağ seviyesi veya yağ ekleme
    geçmişi kırmızı bayraktır.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://www.whatcar.com/volkswagen/golf/hatchback/used-review/n776/reliability
    source_domain: whatcar.com
    site_or_channel: whatcar.com
    quote: '"GTI models can suffer from high oil consumption, so it’s important to
      keep checking the oil level on these, even between services. If the level gets
      too low, it can cause damage to the engine or timing chain."'
    independent: true
