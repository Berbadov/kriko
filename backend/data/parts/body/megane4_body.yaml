  kind: known_issue
  domain: general
  severity: medium
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: The scuttle drains (located near the cold air inlet in the bulkhead)
    are prone to clogging, allowing water to enter the cabin and fill floor pockets.
    This is a recurring issue across Renault Mégane models.
  inspection_advice: Check the scuttle drains (near the footwell) for blockages or
