- claim_key: megane4_body_general_door_drain_holes_pro
  title: Door drain holes prone to blockage causing water ingress
  kind: known_issue
  domain: general
  severity: medium
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: The door drain holes are a common weak point in Renault Mégane II (and
    III) models, often clogging and allowing water to accumulate in door pockets,
    leading to damp carpets, electrical issues (e.g., speaker/speaker module failure),
    and potential corrosion.
  inspection_advice: Check if the drain holes underneath the rubber seals in the door
    pockets are clear of debris. Look for dampness or water pooling in the door panels,
    especially near the speaker area. Verify if the door card trim is properly sealed
    along its joints—remove the trim to inspect for gaps or improper gluing.
  sources: []
