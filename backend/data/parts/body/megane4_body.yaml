    source_domain: mycarly.com
    site_or_channel: mycarly.com
    quote: '"Motordan ''dalı'' (egzoz borusu) takip edin. Kablo demeti, sensörün egzoz
      borusuna vidalandığı yere yakın olmalıdır. Arabanızı güvenilir bir tamirhaneye
      götürmenizi şiddetle tavsiye ederim. Doğru aletlere sahipler ve muhtemelen arabanın
      altında sizden veya benden daha iyi bir görüşe sahipler. Ayrıca, gerekirse sensörü
      doğru bir şekilde teşhis edip değiştirebilirler, her şeyin sıkıca kapatılmasını
      sağlarlar."'
    independent: true
