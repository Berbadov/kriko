- claim_key: megane4_body_engine_premature_timing_cha
  title: Premature timing chain stretch on 1.2 TCe (H5Ft) petrol engines
  kind: known_issue
  domain: engine
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The 1.2 TCe (H5Ft) petrol engine, used until 2018, has been reported
    to suffer from premature timing chain stretch, which can lead to engine misfires
    or failure if not addressed.
  inspection_advice: Check for timing chain stretch by inspecting the timing marks
    and chain tensioner during a thorough engine inspection. Listen for rattling noises
    from the timing chain area during startup and idle.
  sources:
  - source_url: https://automotive24.center/article/renault-megane-iv-mk4-bfbbfk-2016-2023-common-problems-weak-points-what-to-look-for-when-buying-used
