- claim_key: megane4_body_fuel system_chronic_injector_wea
  title: Chronic injector wear in 1.5 dCi engines
  kind: known_issue
  domain: fuel system
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: The 1.5 dCi engines in the Renault Megane 3 (2008–2015) suffer from premature
    injector wear, exacerbated by poor fuel quality and irregular maintenance. This
    leads to hard starting, misfiring, and power loss—often requiring costly injector
    replacements or leak-back tests.
  inspection_advice: Check for signs of misfiring (rough idle, black/white exhaust
    smoke) and verify fuel system health. Inspect injectors for wear or leaks during
    a diagnostic scan or service.
  sources:
