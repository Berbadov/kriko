  kind: known_issue
  domain: electrical
  severity: high
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: Renault issued a technical note (or recall) addressing water seeping
    through the door speaker area, causing electrical failures in the speaker modules.
    This is a chronic issue linked to poor sealing design in the door structure.
  inspection_advice: Inspect the speaker covers and surrounding area for water stains,
    dampness, or corrosion. Check if the speaker module has been replaced before—this
    is a known failure point. Look for signs of past repairs (e.g., silicone application)
    around the speaker or window seal junction.
  sources: []
- claim_key: megane4_body_general_door_card_trim_joint
  title: Door card trim joint sealing failure
  kind: known_issue
  domain: general
  severity: medium
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: The door card trim is often improperly sealed at its joints, allowing
    water to seep through and accumulate in the door pockets. Renault failed to include
    a proper waterproofing layer (e.g., wetliner) in the door design, requiring DIY
    fixes.
  inspection_advice: Remove the door card trim to inspect the back for gaps or improper
    gluing. Look for water stains or dampness along the trim joints. Check if a bead
    of silicone has been applied to seal the gaps—this is a common DIY solution.
  sources: []
- claim_key: megane4_body_general_scuttle_drain_blocka
