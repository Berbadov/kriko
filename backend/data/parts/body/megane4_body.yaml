- claim_key: megane4_body_electrical_o2_sensör_kablo_deme
  title: O2 Sensör Kablo Demeti Korozyon ve Hasar (Renault Mégane)
  kind: known_issue
  domain: electrical
  severity: medium
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: Kronik bir sorun olarak, Renault Mégane modellerinde oksijen sensörünün
    kablo demetinde korozyon ve hasar oluşması, motor arıza ışığının yanmasına ve
    yakıt tüketiminde artışa neden olabilmektedir. Bu, elektrik bağlantısının bozulması
    sonucu ortaya çıkan bir sorundur.
  inspection_advice: Egzoz sistemini takip ederek, oksijen sensörünün vidalandığı
