- claim_key: clio5_elec_engine_ateşleme_sisteminde_
  title: 'Ignition system failures: spark plug/bobbin issues (TCe engines)'
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: In turbocharged petrol engines such as the 1.0 TCe and 1.3 TCe, worn-out
    spark plugs or end-of-life ignition coils cause misfires (combustion errors).
    This is detected by the Engine Control Unit (ECU), triggering the 'Check Injection'
    warning and activating 'Limp Mode'. As a result, engine performance drops significantly
    and permanent damage may occur due to cascading effects.
  inspection_advice: Inspect the spark plugs and ignition coils. Replace them if there
    are signs of wear on the plugs (e.g., electrode gap widening) or if resistance
    measurements on the coils deviate from specifications. Additionally, check for
    oxidation and looseness in the wiring connections.
  sources:
  - source_url: https://kshaber.com.tr/renault-clio-5-modelinde-ekranda-beliren-enjeksiyonu-kontrol-ettirin-uyarisi-nasil-giderilir
    source_domain: kshaber.com.tr
    site_or_channel: kshaber.com.tr
    quote: '"Özellikle TCe motorlu benzinli Clio 5 modellerinde, ateşleme sistemindeki
      en ufak bir zayıflık doğrudan bu hatayı tetikler. Aşınmış bujiler veya ömrünü
      tamamlamış ateşleme bobinleri, silindir içindeki hava-yakıt karışımını olması
      gerektiği gibi ateşleyemez. Bu durum silindirde tekleme (misfire) meydana getirir.
      Krank mili konum sensöründen gelen verileri inceleyen ECU, hangi silindirde
      yanma gerçekleşmediğini anında tespit eder ve motoru korumak için enjeksiyon
      uyarısını aktif hale getirir."'
    independent: true
- claim_key: clio5_elec_fuel system_yakıt_basınç_pompası
  title: Fuel pressure pump/fuel rail pressure sensor failures (direct injection engines)
  kind: known_issue
  domain: fuel system
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: In high-pressure direct injection systems, failure of the fuel pump or
    pressure sensor reduces the pressure in the fuel rail. This causes the engine
    to run on a lean mixture and is detected by the ECU as an 'injection error'. If
    the issue remains unresolved, it can cause permanent damage to the fuel injectors
    and internal engine components.
  inspection_advice: Verify the operation of the fuel pressure pump and measure the
    pressure in the fuel rail (typically within the range of 300-600 bar) using a
    diagnostic device. Also, inspect for clogging in the fuel filter and check for
    any damage to sensor connections.
  sources:
  - source_url: https://kshaber.com.tr/renault-clio-5-modelinde-ekranda-beliren-enjeksiyonu-kontrol-ettirin-uyarisi-nasil-giderilir
    source_domain: kshaber.com.tr
    site_or_channel: kshaber.com.tr
    quote: '"Doğrudan enjeksiyonlu yeni nesil Clio motorlarında, yakıtın silindirlere
      yüksek bir basınçla püskürtülmesi gerekir. Yakıt deposundaki alçak basınç pompası
      veya motordaki yüksek basınç pompası görevini tam yapamadığında, yakıt rayı
