  title: Ignition Coil Failures (Clio 5)
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: The Renault Clio 5 has a chronic issue with ignition coils failing individually
    or in clusters, leading to random misfires (P0300 code). This is not a standard
    wear-and-tear issue but a design or manufacturing flaw causing premature coil
    failure due to internal short circuits, cracks, or degradation from moisture,
