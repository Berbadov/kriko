- claim_key: clio5_elec_electrical_ecu_wiring_loom_chaf
  title: ECU wiring loom chafing and electrical interference
  kind: known_issue
  domain: electrical
  severity: high
  confidence: 0.0
  status: held
  promoted_by: pending_human
  rationale: The wiring loom in the engine bay, specifically the top left section
    near the ECU, is prone to chafing through due to the hard rubber silicone cover
    rubbing against the ECU cover. This causes electrical interference, leading to
    widespread electrical faults and potential ECU damage. Renault dealers acknowledge
    this as a design fault and provide updated looms without the problematic silicone
    cover.
  inspection_advice: Check the wiring loom near the ECU (top left side of the engine
    bay) for signs of chafing, exposed wires, or the presence of hard rubber silicone
    covering the loom. Ensure the loom is not frayed or damaged. If the loom has the
    hard rubber silicone cover, it is likely affected by this defect.
