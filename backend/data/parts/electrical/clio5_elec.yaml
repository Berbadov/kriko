- claim_key: clio5_elec_engine_ateşleme_sisteminde_
  title: Ateşleme sisteminde buji/bobin arızaları (TCe motorlar)
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: Özellikle 1.0 TCe, 1.3 TCe gibi turbocharged petrol motorlarda, aşınmış
    bujiler veya ömrünü tamamlamış ateşleme bobinleri, yanma hataları (misfire) oluşturur.
    Bu, ECU tarafından algılanarak 'Enjeksiyonu Kontrol Ettirin' uyarısı ve 'Limp
    Mode' devreye girmesiyle sonuçlanır. Zincirleme reaksiyonla motor performansı
    ciddi şekilde düşer ve kalıcı hasara yol açabilir.
  inspection_advice: Bujileri ve ateşleme bobinlerini kontrol edin. Bujilerin aşınma
    izleri, elektrot aralığının genişlemesi veya bobinlerin direnç ölçümlerinde sapmalar
    varsa değiştirilmelidir. Ayrıca, kablo bağlantılarının oksidasyonunu ve gevşemelerini
    kontrol edin.
  sources:
  - source_url: https://kshaber.com.tr/renault-clio-5-modelinde-ekranda-beliren-enjeksiyonu-kontrol-ettirin-uyarisi-nasil-giderilir
    source_domain: kshaber.com.tr
    site_or_channel: kshaber.com.tr
    quote: '"Özellikle TCe motorlu benzinli Clio 5 modellerinde, ateşleme sistemindeki
      en ufak bir zayıflık doğrudan bu hatayı tetikler. Aşınmış bujiler veya ömrünü
      tamamlamış ateşleme bobinleri, silindir içindeki hava-yakıt karışımını olması
      gerektiği gibi ateşleyemez. Bu durum silindirde tekleme (misfire) meydana getirir.
      Krank mili konum sensöründen gelen verileri inceleyen ECU, hangi silindirde
      yanma gerçekleşmediğini anında tespit eder ve motoru korumak için enjeksiyon
      uyarısını aktif hale getirir."'
    independent: true
