- claim_key: clio5_elec_electrical_can-bus_iletişim_kab
  title: Corrosion of CAN-bus wiring and increased resistance
  kind: known_issue
  domain: electrical
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: In Renault Clio 5 models, CAN-bus line corrosion causes signal reflections
    and communication interruptions. This can completely sever critical communication
    between the Engine Control Unit (ECU) and other electronic modules, triggering
    the U0100 fault code. Corrosion, particularly in the humid engine bay environment,
    increases resistance at the pins where CAN-bus wiring passes, weakening or cutting
    off the signal.
  inspection_advice: Inspect the CAN-bus wiring and socket connections in the engine
    bay. Look for signs of corrosion or oxidation, especially around the engine fuse
    box (UPC) and ECU socket areas. Verify the CAN-bus line resistance using a multimeter
    to confirm compliance with the 60-ohm specification. Also, check for loose or
    corroded chassis mounting points.
  sources:
  - source_url: https://mrthaber.com.tr/renault-clio-5-dtc-u0100-iletisim-hatasi-cozumu-nedir
    source_domain: mrthaber.com.tr
    site_or_channel: mrthaber.com.tr
    quote: '"Clio 5''in motor bölmesinde, sol farın hemen arkasında bulunan motor
      sigorta kutusu (UPC) ve ECU soketleri çevresel etkilere oldukça açıktır. Özellikle
      motor yıkama işlemleri, yoğun yağmurlar veya ön cam tahliye kanallarının tıkanması
      sonucu bu bölgeye su sızabilir. Soketlerin içine sızan nem, zamanla mikroskobik
      düzeyde yeşil renkli bakır korozyonuna (oksitlenme) yol açar. Bu korozyon, CAN-bus
      hatlarının geçtiği pinlerde direnci artırarak sinyalin zayıflamasına veya tamamen
      kesilmesine sebep olur."'
    independent: true
- claim_key: clio5_elec_electrical_can-bus_hattının_dir
  title: CAN-bus line resistance deviations and incorrect termination resistor connections
  kind: known_issue
  domain: electrical
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: In the Renault Clio 5, if the 120-ohm termination resistors located at
    both ends of the CAN-bus line are incorrectly connected or connected in parallel,
    causing the total resistance to deviate from 60 ohms, signal reflections occur,
    triggering the U0100 fault code. This disrupts communication between electronic
    control modules, forcing the vehicle into a fail-safe or protection mode.
  inspection_advice: Verify the CAN-bus line resistance using a multimeter to confirm
    compliance with the 60-ohm specification. Check that the termination resistors
    are correctly connected. If the resistance values fall outside the expected range,
    this may be the cause of the issue.
  sources:
  - source_url: https://mrthaber.com.tr/renault-clio-5-dtc-u0100-iletisim-hatasi-cozumu-nedir
    source_domain: mrthaber.com.tr
    site_or_channel: mrthaber.com.tr
    quote: '"CAN-Bus hattı ve Sinyal Kesintilerinin Fiziği: Controller Area Network
      (CAN-bus), araçtaki modüllerin birbirleriyle çift bükümlü iki kablo (CAN-High
      ve CAN-Low) üzerinden haberleşmesini sağlayan protokoldür. Bu iki kablo arasındaki
      voltaj farkı (diferansiyel voltaj) veriyi oluşturur. Clio 5''in CAN-bus hattının
      iki ucunda 120 ohm değerinde sonlandırma dirençleri bulunur. Bu dirençlerin
      paralel bağlanmasıyla hat üzerindeki toplam direnç 60 ohm olmalıdır. Bu direnç
      değerindeki sapmalar doğrudan sinyal yansımasına ve dolayısıyla U0100 iletişim
      hatasına neden olur."'
    independent: true
