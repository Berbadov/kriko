- id: clio5_elec_electrical_can_bus_wiring_corrosion_v1
  claim_key: clio5_elec_electrical_can_bus_wiring_corrosion
  version: 1
  is_current: true
  title: CAN-bus wiring corrosion causes communication loss in Clio 5
  title_tr: Clio 5 CAN-bus korozyonu iletişim kaybına neden olur
  kind: known_issue
  domain: electrical
  severity: medium
  confidence: 0.6
  rationale: Moisture can enter the engine fuse box area and cause corrosion on CAN-bus
    pins. This increases resistance and disrupts communication between the ECU and
    other modules, leading to warning lights and possible starting or driveability
    issues.
  rationale_tr: Motor sigorta kutusuna su sızması CAN-bus pinlerinde korozyona yol
    açabilir. Bu, direnci artırır ve ECU ile diğer modüller arasındaki iletişimi keser;
    uyarı ışıklarına ve çalıştırma/sürüş sorunlarına neden olabilir.
  inspection_advice: Inspect the engine fuse box and ECU connectors for moisture,
    green corrosion, or damaged pins. Ask about any history of communication error
    codes (ue.g., U0100) and consider having the CAN-bus resistance checked.
  inspection_advice_tr: Motor sigorta kutusunu ve ECU soketlerini nem, yeşil korozyon
    veya hasarlı pinler açısından inceleyin. İletişim hata kodları (ör. U0100) geçmişi
    sorun ve CAN-bus direnci kontrol ettirmeyi düşünün.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://mrthaber.com.tr/renault-clio-5-dtc-u0100-iletisim-hatasi-cozumu-nedir
    source_domain: mrthaber.com.tr
    site_or_channel: mrthaber.com.tr
    quote: '"Clio 5''in motor bölmesinde, sol farın hemen arkasında bulunan motor
      sigorta kutusu (UPC) ve ECU soketleri çevresel etkilere oldukça açıktır. Özellikle
      motor yıkama işlemleri, yoğun yağmurlar veya ön cam tahliye kanallarının tıkanması
      sonucu bu bölgeye su sızabilir. Soketlerin içine sızan nem, zamanla mikroskobik
      düzeyde yeşil renkli bakır korozyonuna (oksitlenme) yol açar. Bu korozyon, CAN-bus
      hatlarının geçtiği pinlerde direnci artırarak sinyalin zayıflamasına veya tamamen
      kesilmesine sebep olur."'
    independent: true
- id: clio5_elec_electrical_clio_5_ecu_wiring_loom_c_v1
  claim_key: clio5_elec_electrical_clio_5_ecu_wiring_loom_c
  version: 1
  is_current: true
  title: Clio 5 ECU wiring loom chafing electrical faults
  title_tr: Clio 5 ECU kablo demeti sürtünme elektrik arızaları
  kind: known_issue
  domain: electrical
  severity: high
  confidence: 0.6
  rationale: The engine bay wiring loom near the ECU can chafe through due to a hard
    rubber cover, causing electrical interference and potential ECU damage. This is
    a known design fault that can lead to widespread electrical problems and expensive
    repairs.
  rationale_tr: Motor bölmesindeki ECU yakınındaki kablo demeti, sert kauçuk bir kapak
    nedeniyle sürtünerek aşınabilir ve elektrik parazitine, hatta ECU hasarına yol
    açabilir. Bu bilinen bir tasarım hatasıdır; yaygın elektrik sorunlarına ve pahalı
    onarımlara neden olabilir.
  inspection_advice: Ask for service records showing if the updated wiring loom was
    installed. Visually inspect the top left engine bay wiring near the ECU for chafing
    or exposed wires if accessible. Test for intermittent electrical faults during
    a test drive.
  inspection_advice_tr: Güncellenmiş kablo demetinin takılıp takılmadığını gösteren
    servis kayıtlarını sorun. Erişilebilirse, ECU yakınındaki motor bölmesinin sol
    üst kısmındaki kablo demetini sürtünme veya açıkta kalan teller açısından görsel
    olarak inceleyin. Test sürüşü sırasında aralıklı elektrik arızalarını kontrol
    edin.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://www.cartechelectronics.com/pages/renault-clio-wiring-loom-problems
    source_domain: cartechelectronics.com
    site_or_channel: cartechelectronics.com
    quote: '"The main cause of failure for these types of ECUs is the top left side
      (looking into the engine) of the wiring engine loom... This section of wiring
      is prone to chafing through by the ECU cover, and the hard rubber silicone that
      covers the wiring causes electrical interference causing all sorts of electrical
      faults, and ultimately damages the ECU."'
    independent: true
