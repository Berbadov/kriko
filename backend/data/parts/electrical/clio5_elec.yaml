- id: clio5_elec_electrical_loose_ground_connections_v1
  claim_key: clio5_elec_electrical_loose_ground_connections
  version: 1
  is_current: true
  title: Loose ground connections cause electrical communication failure
  title_tr: Gevşek şase bağlantıları elektrik iletişim arızasına yol açar
  kind: known_issue
  domain: electrical
  severity: medium
  confidence: 0.6
  rationale: Clio 5 can develop loose or corroded ground connections over time. This
    increases electrical resistance and disrupts signals between control modules,
    triggering warning lights and drivability problems. A buyer wouldn't know about
    this from a standard inspection.
  rationale_tr: Clio 5'te zamanla şase bağlantıları gevşeyebilir veya korozyona uğrayabilir.
    Bu durum elektrik direncini artırır ve kontrol modülleri arasındaki sinyalleri
    bozarak uyarı lambaları ve sürüş sorunlarına yol açar. Alıcı bunu standart bir
    ekspertizden bilemez.
  inspection_advice: Inspect battery terminals and ground cables (negative to body,
    body to engine) for tightness and corrosion. Ask the dealer to run a CAN-bus diagnostic
    check; U0100 may indicate this issue.
  inspection_advice_tr: Akü kutup başlarını ve şase kablolarını (eksi kutuptan gövdeye,
    gövdeden motora) gevşeklik ve korozyon açısından kontrol edin. Satıcıdan CAN-bus
    teşhis kontrolü yapmasını isteyin; U0100 bu sorunu gösterebilir.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://mrthaber.com.tr/renault-clio-5-dtc-u0100-iletisim-hatasi-cozumu-nedir
    source_domain: mrthaber.com.tr
    site_or_channel: mrthaber.com.tr
