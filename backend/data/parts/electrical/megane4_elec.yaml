- claim_key: megane4_elec_emissions_dpf_clogging_in_1.5_
  title: DPF clogging in 1.5 dCi/1.9 dCi engines
  kind: known_issue
  domain: emissions
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: Short urban trips prevent the DPF from reaching regeneration temperature,
    causing soot buildup, restricted exhaust flow, and limp-mode entry, leading to
    permanent performance degradation if unaddressed.
  inspection_advice: Check for DPF warning light activation, increased fuel consumption,
    and power loss during city driving. Inspect exhaust backpressure if limp mode
    is triggered.
  sources:
  - source_url: https://autoguide.top/renault-megane-common-problems-in-depth-analysis-symptoms-and-proven-solutions/
    source_domain: autoguide.top
    site_or_channel: autoguide.top
    quote: '"Diesel-powered Renault Megane models—particularly 1.5 dCi and 1.9 dCi
      engines—are prone to reduced engine performance during short, low-speed journeys.
      [...] The diesel particulate filter (DPF) fails to reach regeneration temperature
      during short trips. This leads to soot accumulation, restricted exhaust flow,
      and degraded combustion efficiency."'
    independent: true
- claim_key: megane4_elec_engine_oil_pressure_solenoi
  title: Oil pressure solenoid valve failure (petrol/diesel)
  kind: known_issue
  domain: engine
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: A failing oil pressure solenoid valve causes erratic oil pressure regulation,
    leading to dangerous pressure spikes that damage seals, gaskets, and internal
    engine components, especially under heat.
  inspection_advice: Look for illuminated check engine light, rough engine operation
    when hot, or oil pressure warnings. Verify oil pressure consistency under load.
  sources:
  - source_url: https://autoguide.top/renault-megane-common-problems-in-depth-analysis-symptoms-and-proven-solutions/
    source_domain: autoguide.top
    site_or_channel: autoguide.top
    quote: '"Oil pressure irregularities in petrol and diesel Megane engines frequently
      stem from a malfunctioning oil pressure control solenoid. [...] As engine oil
      temperature rises, viscosity decreases. A failing solenoid valve restricts oil
      flow, causing dangerous pressure spikes that threaten seals, gaskets, and internal
      engine components."'
    independent: true
