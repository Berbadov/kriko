- id: golf7_elec_transmission_dsg_gearbox_software_iss_v1
  claim_key: golf7_elec_transmission_dsg_gearbox_software_iss
  version: 1
  is_current: true
  title: DSG gearbox software issues cause erratic shifting (golf7_elec)
  title_tr: DSG şanzıman yazılım sorunları düzensiz vites değişimine neden olur (golf7_elec)
  kind: known_issue
  domain: transmission
  severity: medium
  confidence: 0.6
  rationale: The DSG automatic gearbox in the Golf 7.5 can have software glitches
    that cause rough or unexpected gear changes. A software update might fix it temporarily,
    but the problem can come back, affecting drivability and potentially leading to
    costly repairs.
  rationale_tr: Golf 7.5'teki DSG otomatik şanzıman, vites değişimlerinde sert veya
    beklenmedik davranışlara neden olan yazılım hataları yaşayabilir. Yazılım güncellemesi
    geçici olarak çözebilir, ancak sorun tekrarlayabilir, sürüş konforunu etkiler
    ve pahalı onarımlara yol açabilir.
  inspection_advice: During a test drive, pay attention to hesitation, jerky shifts,
    or unexpected gear changes, especially in stop-and-go traffic. Ask if the DSG
    software has been updated recently, and consider having a dealer scan for transmission
    fault codes (e.g., related to the mechatronic unit).
  inspection_advice_tr: Test sürüşü sırasında, özellikle dur-kalk trafikte tereddüt,
    sert vites geçişleri veya beklenmedik vites değişimlerine dikkat edin. DSG yazılımının
    son zamanlarda güncellenip güncellenmediğini sorun ve bir bayide şanzıman arıza
    kodlarını (ör. mekatronik üniteyle ilgili) taratmayı düşünün.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://www.bumper.co/blog/vw-golf-common-problems
    source_domain: bumper.co
    site_or_channel: bumper.co
    quote: '"DSG gearbox software issues"'
    independent: true
- id: golf7_elec_transmission_golf7_dsg_hesitation_and_v1
  claim_key: golf7_elec_transmission_golf7_dsg_hesitation_and
  version: 1
  is_current: true
  title: Golf7 DSG hesitation and rough shifting
  title_tr: Golf7 DSG tereddüt ve sert vites geçişi
  kind: known_issue
  domain: transmission
  severity: high
  confidence: 0.6
  rationale: The DSG is a dual-clutch automatic gearbox. Hesitation or jerky shifts
    can indicate problems with the mechatronic control unit or degraded transmission
    fluid. Without proper servicing, this may lead to expensive repairs or complete
    transmission failure.
  rationale_tr: DSG, çift kavramalı otomatik şanzımandır. Tereddüt veya sert vites
    geçişleri, mekatronik kontrol ünitesinde veya şanzıman yağının bozulmasında sorun
    olduğunu gösterebilir. Doğru bakım yapılmazsa pahalı onarımlara veya şanzımanın
    tamamen arızalanmasına yol açabilir.
  inspection_advice: During a test drive, accelerate smoothly from a standstill and
    note any hesitation or jerky shifts. Check the service history for DSG oil changes
    (VW recommends every 60,000 km). If possible, scan fault codes; look for mechatronic-related
    codes such as P17B4.
  inspection_advice_tr: Test sürüşünde düzgün hızlanırken tereddüt veya sert vites
    geçişlerine dikkat edin. Servis geçmişinde DSG yağı değişimlerini kontrol edin
    (VW her 60.000 km'de önerir). Mümkünse hata kodlarını taratın; P17B4 gibi mekatronik
    ile ilgili kodlara bakın.
  status: review
  promoted_by: ledger
  sources:
  - source_url: https://www.bumper.co/blog/vw-golf-common-problems
    source_domain: bumper.co
    site_or_channel: bumper.co
    quote: '"DSG gearbox hesitation or rough shifting"'
    independent: true
