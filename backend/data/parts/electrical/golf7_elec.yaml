- claim_key: golf7_elec_fuel system_continental_injector
  title: Continental Injector Failure (Dieselgate-Related)
  kind: known_issue
  domain: fuel system
  severity: high
  confidence: 0.6
  status: review
  promoted_by: pending_human
  rationale: Continental injectors in 105 hp EA288 1.6 TDI (CRKB) variants fail prematurely
    (50,000–100,000 km), exacerbated by Dieselgate software updates. Failures often
    occur shortly after reprogramming, causing severe engine misfires and cold-start
    issues.
  inspection_advice: Listen for heavy juddering at idle, check for fault codes (e.g.,
    individual cylinder misfires), and verify service history for Dieselgate-related
    reprogramming. Test for uneven power delivery or 'running on three cylinders'
    symptoms.
  sources:
  - source_url: https://what-breaks.com/vw/golf-7
    source_domain: what-breaks.com
    site_or_channel: what-breaks.com
    quote: '"Injector Failure (Continental Type) from 80,000 km The Continental injectors
      in the 105 hp variant (and related CRKB variants) fail between 50,000 and 100,000
      km. After the Dieselgate software update failures cluster shortly after reprogramming;
      VW only offers goodwill with a complete service history. Symptoms: Heavy juddering
      at idle, engine running on three cylinders, difficult cold start, fault codes
      for individual cylinders"'
    independent: true
