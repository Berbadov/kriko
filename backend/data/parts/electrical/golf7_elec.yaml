  is_current: true
  title: E-call failure in online control unit (golf7_elec)
  title_tr: Çevrimiçi kontrol ünitesinde e-call arızası (golf7_elec)
  kind: known_issue
  domain: electrical
  severity: high
  confidence: 0.6
  rationale: The e-call system may fail to contact emergency services after a crash
    due to a software fault in the Online Control Unit. This is a known recall issue,
    but if not fixed, it leaves occupants without automatic emergency assistance.
  rationale_tr: E-call sistemi, Online Kontrol Ünitesindeki bir yazılım hatası nedeniyle
    kaza sonrası acil servisleri arayamayabilir. Bu bilinen bir geri çağırma sorunudur,
    ancak giderilmezse yolcular otomatik acil yardımdan yoksun kalır.
  inspection_advice: Check if the dealership has completed the recall for the e-call
    system. If possible, test the e-call button (with permission) and verify the system
    status via diagnostic scan.
  inspection_advice_tr: Bayinin e-call sistemi için geri çağırmayı tamamlayıp tamamlamadığını
    kontrol edin. Mümkünse e-call düğmesini (izin alarak) test edin ve teşhis taraması
    ile sistem durumunu doğrulayın.
  status: review
  promoted_by: ledger
