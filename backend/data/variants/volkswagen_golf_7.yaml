# Volkswagen Golf VII (2013–2020) — Turkish market variant catalog
# Hand-curated from VW TR spec sheets and press releases.
#
# ID format: golf7_{engine_family}_{power_hp}[_{tx_suffix}]
# engine_family: lowercase engineering code used as the part-research key.
# transmission_code: revision-level gearbox code.
#   DQ200 — 7-speed dry dual-clutch (low/medium petrol torque, ≤250Nm)
#   DQ250 — 6-speed wet dual-clutch (higher diesel torque, ≥250Nm)
#   manual — standard manual gearbox (no known DSG issues)
#
# EA211: VAG 3/4-cylinder petrol family (1.0/1.2/1.4 TSI), same basic architecture
# EA288: VAG 4-cylinder TDI family (1.6/2.0 TDI), replaced EA189 post-dieselgate
#
# electrical_code: model-wide part key for claims not tied to a specific engine
# (e.g., 12V battery drain, MIB2 infotainment faults, CCM water ingress).
# Cooling is engine-specific and covered by the engine part YAMLs.

