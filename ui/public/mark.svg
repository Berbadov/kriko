<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-label="Kriko">
  <!-- The mark is the extension's toolbar icon, redrawn on the 16x16 grid
       packaging/render_icon.py rasterises. Same three colours, same shape:
       one K, so the tile in a browser toolbar and the tile in a taskbar are
       recognisably the same product. Ground first, then the letter over it —
       the renderer paints in document order. -->
  <rect x="0" y="0" width="16" height="16" fill="#15171C"></rect>
  <rect x="3" y="2" width="2" height="1" fill="#E7E9ED"></rect>
  <rect x="12" y="2" width="2" height="1" fill="#E7E9ED"></rect>
  <rect x="3" y="3" width="2" height="1" fill="#E7E9ED"></rect>
  <rect x="10" y="3" width="3" height="1" fill="#E7E9ED"></rect>
  <rect x="3" y="4" width="2" height="1" fill="#E7E9ED"></rect>
  <rect x="8" y="4" width="4" height="1" fill="#E7E9ED"></rect>
  <rect x="3" y="5" width="2" height="1" fill="#E7E9ED"></rect>
  <rect x="7" y="5" width="3" height="1" fill="#E7E9ED"></rect>
  <rect x="3" y="6" width="6" height="1" fill="#E7E9ED"></rect>
  <rect x="3" y="7" width="1" height="1" fill="#E7E9ED"></rect>
  <rect x="4" y="7" width="2" height="1" fill="#E8C04B"></rect>
  <rect x="6" y="7" width="1" height="1" fill="#E7E9ED"></rect>
  <rect x="3" y="8" width="1" height="1" fill="#E7E9ED"></rect>
  <rect x="4" y="8" width="2" height="1" fill="#E8C04B"></rect>
  <rect x="6" y="8" width="1" height="1" fill="#E7E9ED"></rect>
  <rect x="3" y="9" width="6" height="1" fill="#E7E9ED"></rect>
  <rect x="3" y="10" width="2" height="1" fill="#E7E9ED"></rect>
  <rect x="7" y="10" width="3" height="1" fill="#E7E9ED"></rect>
  <rect x="3" y="11" width="2" height="1" fill="#E7E9ED"></rect>
  <rect x="8" y="11" width="4" height="1" fill="#E7E9ED"></rect>
  <rect x="3" y="12" width="2" height="1" fill="#E7E9ED"></rect>
  <rect x="10" y="12" width="3" height="1" fill="#E7E9ED"></rect>
  <rect x="3" y="13" width="2" height="1" fill="#E7E9ED"></rect>
  <rect x="12" y="13" width="2" height="1" fill="#E7E9ED"></rect>
</svg>
