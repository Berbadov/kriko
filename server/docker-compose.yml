services:
  relay:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      KRIKO_CLOUD_SECRET: ${KRIKO_CLOUD_SECRET:?set it in .env}
      KRIKO_CLOUD_SETUP: ${KRIKO_CLOUD_SETUP:?set it in .env}
      KRIKO_CLOUD_NTFY: ${KRIKO_CLOUD_NTFY:-https://ntfy.sh}
    volumes:
      - relay-data:/data
    expose:
      - "8080"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [relay]
    ports:
      - "80:80"
      - "443:443"
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set it in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
volumes:
  relay-data:
  caddy-data:
