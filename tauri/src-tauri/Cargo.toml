[package]
name = "kriko"
version = "0.1.0"
description = "Kriko — local product knowledge"
authors = ["Kriko contributors"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Kept because `tauri dev` sets it; nothing in this crate reads it.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
