# Source tier registry — Phase 1 of the v3 overhaul.
#
# Not all sources are equal. This registry gives every source domain a tier
# with a trust weight; verdicts/coverage use it for decomposed confidence
# (source_trust x corroboration x specificity) instead of a hand-set 0.6.
#
# Tier semantics (docs/overhaul_plan.md Phase 1):
#   authoritative — official/recall/manufacturer data; near-undeniable facts
#   specialist    — repairers/engineers who fix this hardware daily; named
#                   part prices and failure patterns; commercial bias exists
#                   (they sell the repair) but the failure itself is real
#   enthusiast    — model clubs, owner communities, editorial car press
#   forum_ugc     — forum threads: real owner reports, unverified, anonymous
#   seo_blog      — content farms / AI-SEO / aggregator lead-gen; lowest trust
#
# Domains below are seeded from the actual source_domain census of
# backend/data/parts/** (top contributors classified by hand). Anything not
# listed falls through `rules`, and anything the rules miss lands on the
# `default` tier. A domain listed here always wins over a rule.

tiers:
  authoritative: {trust: 1.00}
  specialist:    {trust: 0.75}
  enthusiast:    {trust: 0.55}
  forum_ugc:     {trust: 0.40}
  seo_blog:      {trust: 0.20}

default: seo_blog

domains:
