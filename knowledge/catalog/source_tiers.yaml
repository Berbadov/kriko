# ── fallback rules (first match wins; explicit domains above win) ─────
# Applied to the registrable domain of the source URL when the domain isn't
# listed above. When nothing matches, `default` applies. Conservative: rules
# classify obvious low-signal shapes; anything ambiguous stays on default.
rules:
  - tier: forum_ugc
    domain_contains: ["forum.", "forums.", "kulubu", "club"]
