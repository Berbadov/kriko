# Component registry — the spine of the v3 overhaul.
#
# The atomic unit of Kriko knowledge is a COMPONENT (a real, nameable part of a
# car), not a part file (a search context). Claims attach to components; the
# registry gives every component a stable id, bilingual display names, aliases,
# and how a buyer typically detects its failure — which drives serving-rank
# suppression (the product principle: what the ekspertiz catches anyway is low
# value, enforced here mechanically, not in prompts).
#
# Alias tiers (design_flaws.md Flaw 3 fix):
#   attribution_safe — safe to use for attribution: unique to this component.
#   search_only      — use for searching only; NEVER for attribution (an alias
#                      shared by siblings, e.g. "7-speed DSG" for DQ200 & DQ381).
#
# Sibling code families live in code_families below: a claim whose text names a
# sibling code must not be attributed to this family's parts (promote.py veto).
#
# Schema: see docs/overhaul_plan.md Phase 0. Validated by
# knowledge/parts/validate_part_yaml.py (component refs must resolve here).

