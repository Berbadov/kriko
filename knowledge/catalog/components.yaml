# ── code families ──────────────────────────────────────────────────────
# Sibling engineering codes that the old power-tune splits confused. A claim's
# text naming a sibling code (other than the target) is a veto/reroute signal
# in promote.py (design_flaws.md Flaw 1 fix). Keys are the part_ids used in
# backend/data/parts/**; engineering identity, NOT power tune.
code_families:
  - family: vw_ea211
    parts: [ea211]                     # 1.0/1.2/1.4 TSI MPI — belt-driven
    siblings: [ea288, ea888]
  - family: vw_ea288
    parts: [ea288]                     # 1.6/2.0 TDI common-rail, EA288 gen
    siblings: [ea211, ea888]
  - family: vw_ea888
    parts: [ea888]                     # 1.8/2.0 TSI/TFSI — chain-driven
    siblings: [ea211, ea288]
  - family: renault_k9k
    parts: [k9k]                       # 1.5 dCi
    siblings: [r9m, h4d, h5d, h5f, h5h]
  - family: renault_r9m
    parts: [r9m]                       # 1.6 dCi
    siblings: [k9k, h4d, h5d, h5f, h5h]
  - family: renault_h4d
    parts: [h4d]                       # 0.9 TCe
    siblings: [k9k, r9m, h5d, h5f, h5h]
  - family: renault_h5d
    parts: [h5d]                       # 1.2 TCe
    siblings: [k9k, r9m, h4d, h5f, h5h]
  - family: renault_h5f
    parts: [h5f]                       # 1.6 TCe
    siblings: [k9k, r9m, h4d, h5d, h5h]
  - family: renault_h5h
    parts: [h5h]                       # 1.3 TCe (with Mercedes)
    siblings: [k9k, r9m, h4d, h5d, h5f]
  - family: vw_dq200
    parts: [dq200]                     # 7-speed dry DSG
    siblings: [dq250, dq381, dc4, dw5, dw6]
  - family: vw_dq250
    parts: [dq250]                     # 6-speed wet DSG
    siblings: [dq200, dq381, dc4, dw5, dw6]
  - family: vw_dq381
    parts: [dq381]                     # 7-speed wet DSG
    siblings: [dq200, dq250, dc4, dw5, dw6]
