[pytest]
# Every test directory, named explicitly. Without this a bare `pytest` collects
# by walking the rootdir, and any partial invocation silently skips whole
# packages — `pytest backend knowledge` ran 576 of 761 tests after ops/ was
# created, missing every test in ops/tests without failing.
#
# Adding a new top-level package? Add its test directory here in the same commit.
testpaths = backend knowledge ops kriko packs

# Show the slowest tests; the suite is ~3 minutes and it is worth knowing why.
addopts = -q --durations=5
