[pytest]
# Every test directory, named explicitly. Without this a bare `pytest` collects
# by walking the rootdir, and any partial invocation silently skips whole
# packages — `pytest backend knowledge` ran 576 of 761 tests after app/pipeline/ was
# created, missing every test in app/pipeline/tests without failing.
#
# Adding a new top-level package? Add its test directory here in the same commit.
testpaths = src/kriko src/app packs

# Show the slowest tests; the whole suite is worth knowing the shape of.
#
# Measured on the Windows host the app ships from (18 October 2026, `.venv`,
# sequential): 3,035 tests in **18 min 44 s**. The comment here used to say "~3
# minutes", which is a Linux/CI figure and made a 19-minute wait read as a hang.
# `pytest-xdist` is installed; `-n auto` is the obvious lever if a full run ever
# needs to be faster, and it is not the default because parallel SQLite tests
# are the ones most likely to fail for reasons that are not the code.
addopts = -q --durations=5
