<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kriko share card</title>
<style>
  /* The picture a link to kriko.cc unfurls into (X, Bluesky, Slack, a chat): 1200x630.
     It reuses the site's own tokens, fonts and pictures, so it cannot drift from the page. */
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url("../assets/fonts/inter-latin-wght-normal.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-weight: 300 700; src: url("../assets/fonts/space-grotesk-latin-wght-normal.woff2") format("woff2"); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #090c17; }
  .card { position: relative; width: 1200px; height: 630px; color: #f2f2ef; font-family: "Inter", "Segoe UI", sans-serif; }
  .copy { position: absolute; left: 64px; top: 56px; width: 520px; }
  .mark { height: 40px; width: auto; display: block; }
  .label { margin: 40px 0 18px; font: 500 18px/1 "Inter", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #a6a6ae; }
  h1 { margin: 0; text-wrap: balance; font: 400 74px/.96 "Space Grotesk", sans-serif; letter-spacing: -.045em; }
  h1 span { display: block; color: #7f9bff; }
  .lead { margin: 26px 0 0; font-size: 22px; line-height: 1.45; color: #c9cddc; }
  .foot { position: absolute; left: 64px; bottom: 48px; margin: 0; font: 500 17px/1 "Inter", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #a6a6ae; }
  .foot b { color: #f2f2ef; font-weight: 600; }
  .shot { position: absolute; right: 0; top: 0; width: 598px; height: 630px; overflow: hidden; }
  .shot img { display: block; width: 598px; height: 630px; object-fit: cover; object-position: left top; }
  /* The six-block band, the site's own signature, along the foot of the card. */
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 16px; background: linear-gradient(90deg, #dfe7ff 0 16.67%, #a9bcff 16.67% 33.33%, #7f9bff 33.33% 50%, #5a7bff 50% 66.67%, #2447e6 66.67% 83.33%, #16277e 83.33% 100%); }
</style>
</head>
<body>
<div class="card">
  <div class="copy">
    <img class="mark" src="../assets/kriko-wordmark-white.svg" alt="Kriko">
    <p class="label">Known problems, with sources</p>
    <h1>Know what can go wrong <span>before you buy.</span></h1>
    <p class="lead">What is known to go wrong with this exact product, with the source beside every finding.</p>
  </div>
  <p class="foot"><b>kriko.cc</b> &nbsp;·&nbsp; Free &nbsp;·&nbsp; Open source</p>
  <div class="shot"><img src="../assets/examples/hero-dark.webp" alt=""></div>
  <div class="band"></div>
</div>
</body>
</html>
