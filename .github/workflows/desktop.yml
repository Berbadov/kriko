name: desktop

# Hand-run only, since 2026-09-13. It used to fire on `v*` tags and on pull
# requests touching the desktop app, packaging/ or sidecar.py as well, and it
# should again the day this account has Actions minutes: put the `push` and
# `pull_request` blocks back, nothing else here depends on them.
#
# What changed is the environment, not the value. With no minutes, each of
# those triggers produced jobs that were never allocated a runner: failed in
# under fifteen seconds, `runner_id: 0`, no steps, no logs, and a red tick on a
# commit nothing had tested. `ci.yml` was deleted the same day for the same
# reason (its checks are `tools/gate.sh` now). Keeping a trigger that can only
# ever report a false failure trains everyone to ignore a red desktop build,
# which is the state you least want to be in on the day one is real.
#
# The Windows bundle job and `kriko-gpui/package.ps1` are the same recipe, step
# for step: one is run by a runner, the other by hand on Windows, and
# `test_the_installer_can_be_built_by_hand.py` holds them to it. The separate
# macOS jobs call `kriko-gpui/package-macos.sh`, the native per-architecture
# recipe used by hand as well. The smoke steps are the checks that would have
# caught v0.2.4: CLAUDE.md's app-first rule 3.
on:
    workflow_dispatch:

concurrency:
    group: desktop-${{ github.ref }}
    cancel-in-progress: true

# Read-only by default; the release job asks for `contents: write` itself, so a
# bundle job that is compromised by a dependency cannot publish anything.
permissions:
    contents: read

jobs:
    # Windows only: the desktop app and its installer are Windows, and
    # PyInstaller cannot cross-compile the sidecar anyway.
    bundle:
        name: windows
        runs-on: windows-latest
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  # 3.13, lowered from 3.14 with the floor on 2026-09-14 (B110),
                  # and this one is not cosmetic: `"3.14"` resolves to whatever
                  # setup-python has newest in that line, the pinned pydantic
                  # raises on import under 3.14.0rc2, and PyInstaller would
                  # happily freeze that, shipping a sidecar that dies on its
                  # first request. The interpreter the binary carries should be
                  # the one the suite actually ran on.
                  python-version: "3.13"

            - uses: dtolnay/rust-toolchain@stable

            # The lock is the pin, and this is what makes it one. Cargo already
            # *uses* a committed Cargo.lock; what it will also do, quietly, is
            # rewrite it when Cargo.toml has moved, and then the release that
            # got tagged is not the one anybody resolved. `--locked` turns that
            # into a red job instead. Cheap: metadata resolves, it does not
            # build. See B53 and `test_shell_is_locked.py`.
            - name: The app's crate graph is the one that was committed
              shell: bash
              run: cargo metadata --locked --format-version 1 > /dev/null
              working-directory: kriko-gpui

            # The three committed version strings agree, and the tag (when
            # there is one) is the tree. The installer's name and contents both
            # come from the tree, so a tag that is not the tree is a lie.
            - name: The version is the tree's
              run: |
                  python tools/bump.py --show
                  tree=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
                  if [ "${{ github.ref_type }}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$tree" ]; then
                      echo "tag ${GITHUB_REF_NAME} is not the tree ($tree)"
                      exit 1
                  fi
                  echo "VERSION=$tree" >> "$GITHUB_ENV"

            - name: Install Python side
              run: |
                  python -m pip install --upgrade pip
                  # -r first: the lock is what a reader's sidecar contains, and
                  # a floating resolve here is how two builds of one tag stop
                  # being the same binary (B57). PyInstaller is a build tool
                  # rather than part of the closure, so it is not locked.
                  pip install -r requirements.lock -e "." pyinstaller

            - name: Fetch the pinned OpenSERP release
              shell: pwsh
              run: |
                  ./packaging/fetch_openserp.ps1 -Destination kriko-gpui/target/release/OpenSERP.exe
                  Copy-Item kriko-gpui/third-party/OpenSERP-LICENSE.txt kriko-gpui/target/release/OpenSERP-LICENSE.txt -Force

            - name: Freeze the sidecar
              run: pyinstaller --noconfirm packaging/kriko-sidecar.spec

            # A frozen binary that cannot print its port is a blank window, so
            # the handshake is checked here, before it is bundled into anything.
            - name: The frozen sidecar answers
              run: python packaging/smoke_sidecar.py "dist/kriko-sidecar.exe"

            - name: Build the app
              run: cargo build --release --locked
              working-directory: kriko-gpui

            # Beside kriko.exe: where the app looks for its engine, and where
            # main.wxs picks both programs up.
            - name: Place the sidecar
              run: cp dist/kriko-sidecar.exe kriko-gpui/target/release/kriko-sidecar.exe

            # The per-user MSI. WiX 3 is on the runner image (the WIX
            # environment variable points at it); cargo-wix drives it.
            - name: The MSI
              working-directory: kriko-gpui
              run: |
                  cargo install cargo-wix --locked
                  mkdir -p builds
                  out="$(pwd -W)/builds/kriko-$VERSION-x86_64.msi"
                  cargo wix --no-build --nocapture --bin-path "$WIX/bin" --output "$out"
                  ls -l builds

            # The installer building is not the app starting. v0.2.4 built
            # green and then panicked before its first window, a failure with
            # nowhere to be seen but a stderr no double-click has. So the app
            # is launched here, held, and asked whether it is still up.
            - name: The app opens
              run: python packaging/smoke_app.py kriko-gpui/target/release/kriko.exe

            # What a reader on Windows gets: the MSI installed without a
            # prompt, every screen of the installed app drawn by real DirectX
            # and photographed at the default size and at the 940x640
            # minimum, then the MSI removed again.
            - name: The installed app, looked at
              run: python packaging/windows_look.py "kriko-gpui/builds/kriko-$VERSION-x86_64.msi" windows-look

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: kriko-windows-look
                  path: windows-look/
                  if-no-files-found: warn

            - name: The portable zip
              shell: pwsh
              run: |
                  $bin = "kriko-gpui/target/release"
                  Compress-Archive -Path "$bin/kriko.exe", "$bin/kriko-sidecar.exe", `
                      "$bin/OpenSERP.exe", "$bin/OpenSERP-LICENSE.txt" `
                      -DestinationPath "kriko-gpui/builds/kriko-$env:VERSION-win64-portable.zip" -Force
                  $files = @("kriko-gpui/builds/kriko-$env:VERSION-x86_64.msi", "kriko-gpui/builds/kriko-$env:VERSION-win64-portable.zip")
                  $lines = foreach ($file in $files) {
                      $item = Get-Item -LiteralPath $file
                      $digest = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
                      "$digest  $($item.Name)"
                  }
                  $lines | Set-Content -LiteralPath "kriko-gpui/builds/SHA256SUMS.txt" -Encoding Ascii

            - uses: actions/upload-artifact@v4
              with:
                  name: kriko-windows
                  path: |
                      kriko-gpui/builds/*.msi
                      kriko-gpui/builds/*.zip
                      kriko-gpui/builds/SHA256SUMS.txt
                  if-no-files-found: error

    # The knowledge, built once and published beside the installers. Packs are
    # what the app is *for*, and they change far more often than the binary,
    # so they ship as their own assets with an index an installed Kriko can
    # poll, rather than being frozen into a release nobody can update without
    # reinstalling.
    packs:
        name: packs
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  # 3.13: see the note on the bundle job.
                  python-version: "3.13"
            - name: Install
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.lock -e "."
            - name: Build every pack
              run: |
                  mkdir -p release
                  for root in packs/*/; do
                      [ -f "$root/pack.toml" ] || continue
                      name=$(basename "$root")
                      python -m app.cli build "$root" --out "release/$name.kpack"
                  done
                  ls -lh release
            # The index names the tag's own asset URLs, not `latest`: a version
            # is immutable, so the file it points at must be too. The app finds
            # this file through `releases/latest/download/packs.json`, which
            # GitHub redirects to the newest release's copy.
            - name: Write the index
              run: |
                  python packaging/publish_index.py \
                      --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" \
                      --out release/packs.json release/*.kpack
                  cat release/packs.json
            - uses: actions/upload-artifact@v4
              with:
                  name: kriko-packs
                  path: release/*
                  if-no-files-found: error

    # GPUI, PyInstaller and OpenSERP are each built for the runner's native
    # architecture. Keeping these jobs separate prevents a Rosetta process or
    # a stale sidecar from producing a mixed-architecture application bundle.
    # The package script is also the documented hand-build recipe.
    macos:
        name: macos-${{ matrix.arch }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-15
                      arch: arm64
                    - runner: macos-15-intel
                      arch: x86_64
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - uses: dtolnay/rust-toolchain@stable

            - name: Build and smoke-check the native app bundle
              run: kriko-gpui/package-macos.sh "${{ matrix.arch }}"

            - uses: actions/upload-artifact@v4
              with:
                  name: kriko-macos-${{ matrix.arch }}
                  path: |
                      kriko-gpui/builds/*.dmg
                      kriko-gpui/builds/*-macos-${{ matrix.arch }}-portable.zip
                      kriko-gpui/builds/SHA256SUMS-${{ matrix.arch }}.txt
                  if-no-files-found: error

    # A run's artifacts expire and need a GitHub login to fetch. A release is a
    # permanent URL anyone with the repo can click, which is the difference
    # between "CI produced a binary" and "the app is downloadable". Tags only:
    # a release per pull request would be noise.
    release:
        name: release
        needs: [bundle, packs, macos]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: The release tag is the source version
              shell: bash
              run: |
                  python tools/bump.py --show --strict
                  VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
                  if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
                      echo "tag $GITHUB_REF_NAME is not the tree's version v$VERSION" >&2
                      exit 1
                  fi
                  echo "VERSION=$VERSION" >> "$GITHUB_ENV"

            - uses: actions/download-artifact@v4
              with:
                  path: artifacts

            # Keep the Windows checksum file at the release root: the in-app
            # updater uses it to verify the MSI. Per-architecture manifests
            # cover the Mac artifacts, and a separate aggregate covers every
            # asset without shadowing the updater's manifest.
            - name: Collect and verify every release artifact
              run: |
                  mkdir -p release
                  cp "artifacts/kriko-windows/kriko-$VERSION-x86_64.msi" release/
                  cp "artifacts/kriko-windows/kriko-$VERSION-win64-portable.zip" release/
                  cp artifacts/kriko-windows/SHA256SUMS.txt release/
                  for arch in arm64 x86_64; do
                      cp "artifacts/kriko-macos-$arch/kriko-$VERSION-macos-$arch.dmg" release/
                      cp "artifacts/kriko-macos-$arch/kriko-$VERSION-macos-$arch-portable.zip" release/
                      cp "artifacts/kriko-macos-$arch/SHA256SUMS-$arch.txt" release/
                  done
                  cp artifacts/kriko-packs/packs.json release/
                  find artifacts/kriko-packs -maxdepth 1 -type f -name '*.kpack' -exec cp {} release/ \;

                  test -s "release/kriko-$VERSION-x86_64.msi"
                  test -s "release/kriko-$VERSION-win64-portable.zip"
                  test -s release/packs.json
                  test -n "$(find release -maxdepth 1 -type f -name '*.kpack' -print -quit)"
                  (
                      cd release
                      sha256sum --check SHA256SUMS.txt
                      for arch in arm64 x86_64; do
                          shasum --check "SHA256SUMS-$arch.txt"
                      done
                  )
                  python - "$VERSION" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" <<'PY'
                  import json
                  import pathlib
                  import sys

                  version, repository, tag = sys.argv[1:]
                  release = pathlib.Path("release")
                  packs = sorted(p.name for p in release.glob("*.kpack"))
                  index = json.loads((release / "packs.json").read_text(encoding="utf-8"))
                  rows = index.get("packs", [])
                  indexed = sorted(row.get("url", "").rsplit("/", 1)[-1] for row in rows)
                  base = f"https://github.com/{repository}/releases/download/{tag}/"
                  if not rows or indexed != packs:
                      raise SystemExit("packs.json does not name exactly the collected .kpack files")
                  for row in rows:
                      if not row.get("url", "").startswith(base):
                          raise SystemExit(f"pack URL is not pinned to {tag}: {row.get('url')}")
                  print(f"Verified {len(packs)} packs for Kriko {version} ({tag})")
                  PY
                  # This aggregate supplements (and must not replace) the
                  # root SHA256SUMS.txt used by the Windows MSI updater.
                  (
                      cd release
                      find . -maxdepth 1 -type f ! -name 'SHA256SUMS-ALL.txt' -printf '%f\0' \
                          | sort -z | xargs -0 sha256sum > SHA256SUMS-ALL.txt
                      sha256sum --check SHA256SUMS-ALL.txt
                  )
                  ls -lh release

            - name: Ensure the tag has no existing release
              uses: actions/github-script@v7
              with:
                  script: |
                      const tag = context.ref.replace(/^refs\/tags\//, "");
                      try {
                        await github.rest.repos.getReleaseByTag({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          tag,
                        });
                        core.setFailed(`Release ${tag} already exists; published tags are immutable.`);
                      } catch (error) {
                        if (error.status === 404) {
                          core.info(`No release exists yet for ${tag}.`);
                        } else {
                          throw error;
                        }
                      }

            - uses: softprops/action-gh-release@v2
              with:
                  files: release/*
                  tag_name: ${{ github.ref_name }}
                  draft: true
                  fail_on_unmatched_files: true
                  generate_release_notes: true
                  body: |
                      Built from source commit `${{ github.sha }}`.

                      These desktop builds are unsigned and not notarized.
                      Windows SmartScreen may warn before running the MSI. On
                      macOS, Control-click Kriko.app and choose Open if Gatekeeper
                      blocks the first launch.

                      macOS disk images and portable app bundles are built for
                      both Apple Silicon (arm64) and Intel (x86_64). The two
                      architectures are built natively and carry separate
                      SHA256SUMS files.

                      The MSI installs for the current user under
                      %LOCALAPPDATA%\Programs\Kriko and needs no administrator
                      prompt. Kriko's in-app desktop updater currently installs
                      Windows MSI releases; on macOS, download the new DMG and
                      replace Kriko.app in Applications. Installed packs still
                      update themselves weekly.

                      Kriko keeps everything in `~/.kriko`: `knowledge.sqlite`
                      for installed packs, `app.sqlite` for your own history.
