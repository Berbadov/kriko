name: CI

# Un-paused 2026-09-08, for 1.0.0. It was hand-run only from 2026-09-01, and
# the reasoning was sound at the time: the suite is ~3 minutes and it was not
# what was failing — v0.2.4 built green and then would not open, so the loop
# that mattered was `desktop.yml` and pytest locally.
#
# What changed is not that the shell is fixed; it is that a release needs the
# gate *back on the branch*. The 1.0.0 audit found four reported defects that
# every automated gate passed, and the fix for that is more gates running more
# often, not fewer. "Ship to the reader, not to the branch" still stands — see
# CLAUDE.md — and pytest still runs locally before every push. This is a
# second net, not a replacement for either.
on:
    push:
    pull_request:

# A newer push to the same branch cancels the older run — this suite is ~3
# minutes and there is no value in finishing a superseded one.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    python:
        name: pytest (engine + catalog + pipeline)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.14"
                  cache: pip

            - name: Install
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev,pipeline]"

            # No arguments: pytest.ini pins testpaths. Naming directories by hand is
            # how the suite silently shrank to 576 of 761 tests once app/pipeline/ existed.
            # src/app/pipeline/tests/test_repo_invariants.py enforces the layering rules and
            # the testpaths coverage, so the architecture is checked here too.
            #
            # Deliberately no secrets: the suite must pass with no API keys. If a new
            # test needs one, it is reaching the network and belongs behind a marker.
            - name: Test
              run: python -m pytest

    extension:
        name: node (scraper + extension panel)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"

            # `npm install`, not `npm ci`: package-lock.json is gitignored, so there
            # is no lockfile to install from. Commit the lockfile and switch this to
            # `npm ci` if reproducible installs matter more than a tidy tree.
            - run: npm install --no-audit --no-fund
            - run: npm test

    ui:
        name: vitest + stale-bundle check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - run: npm --prefix ui ci --no-audit --no-fund
            - run: npm --prefix ui test

            # Types, on the branch. This was a local-only gate, which means it
            # was a gate that ran when someone remembered — and the 1.0.0
            # audit's whole finding was that the defects nobody caught were
            # the ones no gate was asking about. `--threshold error` because
            # the two standing warnings are accessibility notes on markup that
            # is deliberate, and a warning that fails a build is a warning
            # somebody silences.
            - name: Types
              run: npm --prefix ui run check -- --threshold error

            # src/app/web/static/ is committed build output: the wheel ships it,
            # so a stale bundle means `pip install kriko` serves a UI nobody can
            # reproduce from source. Rebuild and require a clean diff.
            - name: Bundle is not stale
              run: |
                  npm --prefix ui run build
                  git diff --exit-code -- src/app/web/static \
                    || { echo "::error::src/app/web/static is stale — run 'npm --prefix ui run build' and commit"; exit 1; }

# No docker-build job, by design rather than by omission: Kriko ships as a
# desktop app, so there is no image and no stack. test_the_app_stays_standalone
# in src/app/pipeline/tests/test_repo_invariants.py fails if a Dockerfile,
# compose file, deploy/ directory, or Postgres driver comes back, which is the
# guard this comment used to ask someone to remember. The artifact that does
# get built lives in .github/workflows/desktop.yml.
